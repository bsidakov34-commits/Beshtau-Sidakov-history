нты эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Правонарушение — виновное, противоправное, общественно вредное (опасное) деяние в форме действия или бездействия, за которое предусмотрена юридическая ответственность.\nПравонарушения подразделяются на преступления и проступки.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j03","subject":"soc","topic":"Юридическая ответственность","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о юридической ответственности и правонарушениях и запишите цифры, под которыми они указаны.","options":["Юридическая ответственность — применение к правонарушителю предусмотренных законом мер государственного принуждения.","Правонарушения подразделяются на преступления и проступки.","Правонарушение может быть совершено только в форме действия.","Правонарушение — виновное противоправное деяние.","Юридическая ответственность может наступить и без правонарушения."],"answer":"124","hint":"В какой форме может быть совершено правонарушение? Что является основанием ответственности?","explain":"Верны 1, 2, 4. Правонарушение совершается в форме действия или бездействия (3). Основание ответственности — правонарушение (5)."},{"id":"law_j04","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Назовите основные виды юридической ответственности, их особенности и меры.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Уголовная ответственность\n— Наступает за совершение преступления.\n— Предусматривает наиболее строгие меры государственного принуждения.\n— Признать человека виновным в преступлении и назначить уголовное наказание может только суд.\n— Осуждение, как правило, влечёт судимость.\nПримеры наказаний: штраф, обязательные работы, исправительные работы, принудительные работы, ограничение свободы, лишение свободы.\n2) Административная ответственность\n— Наступает за совершение административного правонарушения.\n— Применяется судьями, уполномоченными органами и должностными лицами.\n— Не влечёт судимости.\nПримеры наказаний: предупреждение, административный штраф, лишение специального права, административный арест, обязательные работы.\n3) Дисциплинарная ответственность\n— В трудовых отношениях наступает за дисциплинарный проступок — виновное неисполнение или ненадлежащее исполнение работником своих трудовых обязанностей.\n— Применяется работодателем.\nОсновные дисциплинарные взыскания: замечание, выговор, увольнение по соответствующим основаниям.\nДля отдельных категорий работников законом предусмотрены и другие дисциплинарные взыскания.\n4) Гражданско-правовая ответственность\n— Наступает за нарушение гражданско-правовых обязательств, причинение вреда и другие гражданские правонарушения.\n— Имеет преимущественно имущественный характер.\n— Может реализовываться добровольно или принудительно, в том числе через суд.\nОсновные меры: возмещение убытков, уплата неустойки, компенсация морального вреда в предусмотренных законом случаях.\nНе все способы защиты гражданских прав являются мерами ответственности. Например, признание права собственности само по себе не является такой мерой.\n5) Материальная ответственность\n— Предусматривает обязанность работника или работодателя возместить ущерб, причинённый другой стороне трудовых отношений.\n— Работник возмещает прямой действительный ущерб. Неполученные работодателем доходы с работника не взыскиваются.\n— По общему правилу ответственность работника ограничена его средним месячным заработком. Полная материальная ответственность наступает в установленных законом случаях.\nНапример, работник по своей вине повредил оборудование. Он обязан возместить причинённый ущерб с учётом установленных законом ограничений.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j05","subject":"soc","topic":"Юридическая ответственность","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и видами юридической ответственности: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["гражданину назначено наказание в виде исправительных работ","водителю назначен административный штраф","продавец выплатил покупателю неустойку за просрочку доставки","организации назначено административное приостановление деятельности","виновник ДТП возместил владельцу автомобиля убытки"],"right":["уголовная","административная","гражданско-правовая"],"answer":"12323","hint":"Неустойка и возмещение убытков — меры гражданско-правовой ответственности.","explain":"Уголовная: А. Административная: Б, Г. Гражданско-правовая: В, Д."},{"id":"law_j06","subject":"soc","topic":"Юридическая ответственность","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и видами ответственности в трудовых отношениях: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["работнику объявлен выговор","работник возместил стоимость оборудования, повреждённого по его вине","работнику сделано замечание за опоздание","взыскание ущерба с работника ограничено его средним месячным заработком","работник уволен за появление на работе в состоянии опьянения"],"right":["дисциплинарная","материальная"],"answer":"12121","hint":"Дисциплинарная — взыскание за проступок, материальная — возмещение ущерба.","explain":"Дисциплинарная: выговор (А), замечание (В), увольнение (Д). Материальная: возмещение ущерба (Б), ограничение средним заработком (Г)."},{"id":"law_j07","subject":"soc","topic":"Юридическая ответственность","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о видах юридической ответственности и запишите цифры, под которыми они указаны.","options":["Назначить уголовное наказание может только суд.","Административная ответственность не влечёт судимости.","Дисциплинарную ответственность применяет работодатель.","Работник возмещает работодателю и неполученные доходы.","Гражданско-правовая ответственность имеет преимущественно неимущественный характер."],"answer":"123","hint":"Какой ущерб возмещает работник? Каков характер гражданско-правовой ответственности?","explain":"Верны 1, 2, 3. Работник возмещает только прямой действительный ущерб, неполученные доходы не взыскиваются (4). Гражданско-правовая ответственность преимущественно имущественная (5)."},{"id":"law_j08","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Что такое состав правонарушения? Какие элементы он включает?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Состав правонарушения — совокупность установленных правом признаков, позволяющих квалифицировать деяние как определённое правонарушение.\nВыделяют четыре элемента:\n1) Субъект — лицо, совершившее правонарушение и способное нести юридическую ответственность. В предусмотренных законом случаях субъектом может быть юридическое лицо.\n2) Субъективная сторона — внутреннее отношение лица к своему деянию и его последствиям: вина в форме умысла или неосторожности, а также мотив и цель, если они имеют правовое значение.\n3) Объект — охраняемые правом общественные отношения, на которые посягает правонарушение.\n4) Объективная сторона — внешние признаки правонарушения: деяние, а в предусмотренных законом случаях — вредные последствия, причинная связь, место, время, способ совершения и другие обстоятельства.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j09","subject":"soc","topic":"Юридическая ответственность","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о составе правонарушения и запишите цифры, под которыми они указаны.","options":["Субъектом правонарушения в предусмотренных законом случаях может быть юридическое лицо.","Субъективная сторона включает вину, а также мотив и цель, если они имеют правовое значение.","Объект правонарушения — охраняемые правом общественные отношения.","Время и способ совершения правонарушения относятся к субъективной стороне.","Состав правонарушения включает три элемента."],"answer":"123","hint":"Внешние признаки правонарушения относятся к одному элементу, внутреннее отношение — к другому.","explain":"Верны 1, 2, 3. Время, место и способ — признаки объективной стороны (4). Элементов состава четыре (5)."},{"id":"law_j10","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Каковы принципы юридической ответственности?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Законность. Ответственность наступает только по предусмотренным законом основаниям и с соблюдением установленного порядка.\n2) Гуманизм. Меры ответственности не должны иметь целью причинение физических страданий или унижение человеческого достоинства.\n3) Неотвратимость ответственности. Каждое правонарушение должно получать правовую оценку и предусмотренную законом реакцию государства. Освобождение от ответственности допускается только на законных основаниях.\n4) Справедливость. Меры ответственности должны соответствовать характеру и тяжести правонарушения.\n5) Индивидуализация ответственности. При выборе меры учитываются обстоятельства правонарушения, степень вины и личность нарушителя.\n6) Ответственность за вину. По общему правилу ответственность наступает при наличии умысла или неосторожности. В гражданском праве допускаются исключения, например ответственность за вред, причинённый источником повышенной опасности.\n7) Недопустимость обратной силы закона, устанавливающего или отягчающего ответственность. Такой закон не применяется к деяниям, совершённым до его вступления в силу.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j11","subject":"soc","topic":"Юридическая ответственность","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и принципами юридической ответственности: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["закон, вступивший в силу в 2026 г. и увеличивший штраф, не применяется к нарушению, совершённому в 2025 г.","суд учёл степень вины и личность нарушителя при выборе меры ответственности","ответственность наступает только по основаниям, предусмотренным законом","меры ответственности не должны унижать человеческое достоинство","наказание назначено с соблюдением установленного законом порядка"],"right":["законность","недопустимость обратной силы закона, отягчающего ответственность","индивидуализация ответственности","гуманизм"],"answer":"23141","hint":"Обратная сила закона — частая ошибка на ЕГЭ: ухудшающий положение закон не применяется к прошлым деяниям.","explain":"Обратная сила: А. Индивидуализация: Б. Законность: В, Д. Гуманизм: Г."},{"id":"law_j12","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Какие функции выполняет юридическая ответственность?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Карательная — применение к правонарушителю предусмотренных законом лишений и ограничений.\n2) Воспитательная — формирование уважения к праву и привычки соблюдать закон.\n3) Превентивная — предупреждение новых правонарушений как со стороны самого нарушителя, так и со стороны других лиц.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j13","subject":"soc","topic":"Юридическая ответственность","ege":15,"type":"match","max":2,"text":"Установите соответствие между характеристиками и функциями юридической ответственности: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["восстановление нарушенных прав","предупреждение новых правонарушений","формирование уважения к праву","применение к правонарушителю лишений и ограничений","возмещение вреда потерпевшему"],"right":["карательная","воспитательная","превентивная","правовосстановительная"],"answer":"43214","hint":"Превентивная — от слова «предупреждать».","explain":"Правовосстановительная: А, Д. Превентивная: Б. Воспитательная: В. Карательная: Г."},{"id":"law_j14","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Какие обстоятельства отягчают и какие смягчают уголовное наказание?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Обстоятельства, влияющие на уголовное наказание, и обстоятельства, исключающие преступность деяния\nНекоторые обстоятельства, отягчающие наказание:\n— Рецидив преступлений — совершение умышленного преступления лицом, имеющим учитываемую законом судимость за ранее совершённое умышленное преступление.\n— Наступление тяжких последствий в результате преступления.\n— Совершение преступления группой лиц, группой по предварительному сговору, организованной группой или преступным сообществом.\n— Совершение преступления по мотивам политической, идеологической, расовой, национальной или религиозной ненависти либо вражды, а также ненависти или вражды в отношении социальной группы.\n— Совершение преступления с особой жестокостью.\n— Совершение преступления с использованием оружия, боеприпасов или взрывчатых веществ.\nНекоторые обстоятельства, смягчающие наказание:\n— Совершение впервые преступления небольшой или средней тяжести вследствие случайного стечения обстоятельств.\n— Несовершеннолетие виновного.\n— Беременность.\n— Наличие малолетних детей у виновного.\n— Совершение преступления вследствие тяжёлых жизненных обстоятельств или по мотиву сострадания.\n— Совершение преступления при нарушении условий правомерности необходимой обороны.\n— Явка с повинной.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j15","subject":"soc","topic":"Юридическая ответственность","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к обстоятельствам, смягчающим уголовное наказание? Запишите цифры, под которыми они указаны.","options":["явка с повинной","рецидив преступлений","несовершеннолетие виновного","совершение преступления с особой жестокостью","наличие малолетних детей у виновного","совершение преступления группой лиц"],"answer":"135","hint":"Рецидив, жестокость и групповой характер делают преступление опаснее.","explain":"Смягчающие: 1, 3, 5. Рецидив (2), особая жестокость (4), совершение группой (6) — отягчающие обстоятельства."},{"id":"law_j16","subject":"soc","topic":"Юридическая ответственность","ege":15,"type":"match","max":2,"text":"Установите соответствие между обстоятельствами и их влиянием на уголовное наказание: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["совершение преступления с использованием оружия","беременность","совершение преступления по мотиву сострадания","наступление тяжких последствий","совершение преступления организованной группой"],"right":["отягчающее","смягчающее"],"answer":"12211","hint":"Смягчают обстоятельства, связанные с личностью и тяжёлой жизненной ситуацией виновного.","explain":"Отягчающие: оружие (А), тяжкие последствия (Г), организованная группа (Д). Смягчающие: беременность (Б), сострадание (В)."},{"id":"law_j17","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Какие обстоятельства исключают преступность деяния?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Обстоятельства, исключающие преступность деяния:\n1) Необходимая оборона. Защита от общественно опасного посягательства путём причинения вреда посягающему при соблюдении установленных законом пределов.\nНапример, человек причиняет вред нападающему, защищаясь от опасного для жизни нападения с ножом.\n2) Причинение вреда при задержании лица, совершившего преступление. Допускается для передачи преступника органам власти, если иначе задержать его невозможно и не превышены необходимые меры.\nНапример, прохожий удерживает убегающего грабителя до прибытия полиции, причинив ему ссадины.\n3) Крайняя необходимость. Причинение меньшего вреда для устранения непосредственно угрожающей опасности, которую невозможно устранить другими средствами.\nНапример, человек разбивает стекло чужого горящего автомобиля, чтобы спасти находящегося внутри ребёнка.\n4) Физическое или психическое принуждение.\nЕсли физическое принуждение лишило человека возможности руководить своими действиями, деяние не признаётся преступлением. При сохранении такой возможности, в том числе при угрозах, применяются условия крайней необходимости.\nНапример, связанный преступниками охранник не может воспрепятствовать хищению имущества.\n5) Обоснованный риск. Причинение вреда при достижении общественно полезной цели, которую нельзя достичь без риска, если приняты достаточные меры для предотвращения вреда. Риск не должен заведомо угрожать жизни многих людей, экологической катастрофой или общественным бедствием.\nНапример, при необходимом испытании новой спасательной техники, несмотря на принятые меры безопасности, повреждено оборудование.\n6) Исполнение приказа или распоряжения. Причинение вреда при исполнении обязательного приказа, незаконность которого не была заведомо известна исполнителю. Исполнение заведомо незаконного приказа не освобождает от ответственности за умышленное преступление.\nНапример, пожарный по законному приказу руководителя тушения пожара ломает дверь для спасения людей.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j18","subject":"soc","topic":"Юридическая ответственность","ege":15,"type":"match","max":2,"text":"Установите соответствие между ситуациями и обстоятельствами, исключающими преступность деяния: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["прохожий удержал убегающего грабителя до приезда полиции, причинив ему ссадины","человек разбил стекло чужого горящего автомобиля, чтобы спасти ребёнка внутри","человек причинил вред нападавшему, защищаясь от нападения с ножом","водитель, уклоняясь от столкновения с внезапно выбежавшим ребёнком, повредил чужой забор","охранник, защищая кассира от вооружённого грабителя, причинил грабителю вред"],"right":["необходимая оборона","крайняя необходимость","причинение вреда при задержании лица, совершившего преступление"],"answer":"32121","hint":"Оборона — защита от посягательства; крайняя необходимость — меньший вред ради устранения опасности; задержание — чтобы передать преступника властям.","explain":"Задержание: А. Крайняя необходимость: Б, Г (меньший вред для устранения опасности). Необходимая оборона: В, Д (защита от посягательства, в том числе другого человека)."},{"id":"law_j19","subject":"soc","topic":"Юридическая ответственность","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к обстоятельствам, исключающим преступность деяния? Запишите цифры, под которыми они указаны.","options":["обоснованный риск","явка с повинной","исполнение приказа, незаконность которого не была заведомо известна исполнителю","физическое принуждение, лишившее человека возможности руководить своими действиями","несовершеннолетие виновного","крайняя необходимость"],"answer":"1346","hint":"Явка с повинной и несовершеннолетие смягчают наказание, но не исключают преступность.","explain":"Исключают преступность: 1, 3, 4, 6. Явка с повинной (2) и несовершеннолетие (5) — смягчающие обстоятельства."},{"id":"law_po01","subject":"soc","topic":"Правоохранительные органы и суды","type":"open","card":true,"max":2,"text":"Что такое правоохранительные органы? Каковы их признаки?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Правоохранительные органы — государственные органы, уполномоченные осуществлять деятельность по защите прав и свобод человека, обеспечению законности и правопорядка.\nПризнаки правоохранительных органов:\n1) Наличие специальной компетенции в сфере правоохранительной деятельности;\n2) Осуществление деятельности на основании закона и с соблюдением установленных им процедур;\n3) Применение предусмотренных законом мер юридического воздействия в пределах своих полномочий.\nНотариат и адвокатура также участвуют в защите прав, однако их не следует отождествлять с государственными правоохранительными органами.","hint":"Определение и три признака. Отдельно вспомните, как соотносятся с ними нотариат и адвокатура."},{"id":"law_po02","subject":"soc","topic":"Правоохранительные органы и суды","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о правоохранительных органах и запишите цифры, под которыми они указаны.","options":["Правоохранительные органы действуют на основании закона и с соблюдением установленных им процедур.","Правоохранительные органы применяют меры юридического воздействия только в пределах своих полномочий.","Нотариат и адвокатура относятся к государственным правоохранительным органам.","Признак правоохранительных органов — наличие специальной компетенции в сфере правоохранительной деятельности.","Поддержание государственного обвинения в суде — функция адвокатуры."],"answer":"124","hint":"Нотариат и адвокатура участвуют в защите прав, но государственными органами не являются. Кто в суде выступает от имени государства?","explain":"Верны 1, 2 и 4. Нотариат и адвокатура не являются государственными правоохранительными органами (3). Государственное обвинение поддерживает прокурор, а адвокат выступает защитником (5)."},{"id":"law_po03","subject":"soc","topic":"Правоохранительные органы и суды","type":"open","card":true,"max":2,"text":"Каковы полномочия судов?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Суды:\n1) Осуществление конституционного, гражданского, арбитражного, административного и уголовного судопроизводства;\n2) Применение предусмотренных законом мер государственного принуждения: мер пресечения, принудительных мер медицинского характера и др.;\n3) Осуществление конституционного контроля Конституционным Судом РФ.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_po04","subject":"soc","topic":"Правоохранительные органы и суды","type":"open","card":true,"max":2,"text":"Каковы полномочия прокуратуры РФ?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Прокуратура РФ:\n1) Надзор за соблюдением прав и свобод человека и гражданина;\n2) Надзор за исполнением законов поднадзорными органами, в том числе органами исполнительной власти, органами, осуществляющими оперативно-розыскную деятельность, судебными приставами и органами, исполняющими наказания;\n3) Поддержание государственного обвинения в суде по уголовным делам;\n4) Координация деятельности правоохранительных органов по борьбе с преступностью.","hint":"Четыре направления: два вида надзора, обвинение в суде, координация."},{"id":"law_po05","subject":"soc","topic":"Правоохранительные органы и суды","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к полномочиям прокуратуры РФ? Запишите цифры, под которыми они указаны.","options":["вынесение приговора по уголовному делу","надзор за исполнением законов органами исполнительной власти","поддержание государственного обвинения в суде","удостоверение завещаний","координация деятельности правоохранительных органов по борьбе с преступностью","надзор за соблюдением прав и свобод человека и гражданина"],"answer":"2356","hint":"Прокуратура надзирает и обвиняет, но не судит. Удостоверение документов — работа другого института.","explain":"Полномочия прокуратуры — 2, 3, 5 и 6. Приговор выносит суд (1), завещания удостоверяет нотариус (4)."},{"id":"law_po06","subject":"soc","topic":"Правоохранительные органы и суды","type":"open","card":true,"max":2,"text":"Каковы полномочия органов внутренних дел, в том числе полиции?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Органы внутренних дел, в том числе полиция:\n1) Осуществление оперативно-розыскной деятельности;\n2) Расследование уголовных дел в пределах своей компетенции;\n3) Противодействие экстремизму в пределах своих полномочий;\n4) Осуществление го
