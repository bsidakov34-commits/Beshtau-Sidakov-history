дным сделкам.","Реальный договор требует не только согласования условий, но и передачи имущества.","Консенсуальный договор считается заключённым только после передачи вещи."],"answer":"124","hint":"Консенсуальный договор заключается согласованием условий, реальный — передачей имущества.","explain":"Верны 1, 2, 4. Дарение — безвозмездная сделка (3). Консенсуальный договор заключён с момента согласования существенных условий в требуемой форме (5)."},{"id":"law_g46","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Назовите способы обеспечения обязательств.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Правовые механизмы, дающие кредитору дополнительные гарантии исполнения обязательства.\n1) Залог.\nИмущество обеспечивает обязательство и может оставаться у залогодателя. При неисполнении кредитор может получить удовлетворение за счёт его стоимости в установленном порядке.\nПримеры: квартира при ипотеке, драгоценности при займе в ломбарде.\n2) Поручительство.\nПоручитель обязуется отвечать перед кредитором за исполнение обязательства должником. По общему правилу отвечает наряду с должником.\nПример: поручитель при банковском кредите.\n3) Задаток.\nПо письменному соглашению одна сторона передаёт другой деньги в счёт платежей по договору и в обеспечение исполнения.\nЕсли за неисполнение отвечает давшая задаток сторона, он остаётся у другой. Если получившая — возвращает вдвойне. При исполнении задаток засчитывается в платёж.\nНиколай снимает дом за 20 тысяч рублей и вносит 5 тысяч задатка. При исполнении доплачивает 15 тысяч. Если за срыв отвечает Николай, теряет 5 тысяч; если владелец — возвращает Николаю 10 тысяч.\n4) Неустойка — штраф, пеня.\nУстановленная законом или договором сумма, которую должник платит за неисполнение или ненадлежащее исполнение, включая просрочку.\nРемонт квартиры должен завершиться 1 сентября 2024 года. Со 2 сентября за просрочку начисляется предусмотренная договором неустойка, например 1000 рублей в день.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g47","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и способами обеспечения обязательств: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["квартира, купленная в ипотеку, обеспечивает возврат кредита","друг заёмщика обязался отвечать перед банком за возврат кредита","наниматель передал владельцу дома 5 тыс. руб. в счёт будущей оплаты и в обеспечение договора","подрядчик платит 1000 руб. за каждый день просрочки ремонта","золотое кольцо сдано в ломбард в обеспечение займа"],"right":["залог","поручительство","задаток","неустойка"],"answer":"12341","hint":"Залог — имущество, поручительство — другое лицо, задаток — деньги наперёд, неустойка — плата за нарушение.","explain":"Залог: ипотека (А), ломбард (Д). Поручительство: Б. Задаток: В. Неустойка (пеня): Г."},{"id":"law_g48","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о задатке и неустойке и запишите цифры, под которыми они указаны.","options":["Если за неисполнение договора отвечает сторона, давшая задаток, он остаётся у другой стороны.","Если за неисполнение договора отвечает сторона, получившая задаток, она возвращает его в двойном размере.","Соглашение о задатке заключается в письменной форме.","При исполнении договора задаток возвращается в двойном размере.","Неустойка может быть установлена только законом."],"answer":"123","hint":"Что происходит с задатком, если договор исполнен?","explain":"Верны 1, 2, 3. При исполнении договора задаток засчитывается в платёж (4). Неустойка устанавливается законом или договором (5)."},{"id":"law_g49","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое интеллектуальные права и каковы их особенности?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Права на охраняемые результаты интеллектуальной деятельности и приравненные к ним средства индивидуализации: произведения искусства, изобретения, товарные знаки, промышленные образцы.\nВключают имущественное исключительное право: использование объекта, получение дохода, распоряжение правом в пределах закона. В предусмотренных законом случаях включают и личные неимущественные права, например право авторства, связанное с личностью создателя.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g50","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о интеллектуальных правах и запишите цифры, под которыми они указаны.","options":["Произведения искусства и изобретения относятся к охраняемым результатам интеллектуальной деятельности.","Исключительное право позволяет использовать объект, получать доход и распоряжаться правом в пределах закона.","Право авторства — личное неимущественное право, связанное с личностью создателя.","Товарный знак не охраняется законом.","Интеллектуальные права относятся к вещным правам."],"answer":"123","hint":"Товарные знаки — средства индивидуализации, приравненные к результатам интеллектуальной деятельности.","explain":"Верны 1, 2, 3. Товарный знак охраняется как средство индивидуализации (4). Интеллектуальные права — самостоятельная группа прав, а не вещные (5)."},{"id":"law_g51","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Назовите способы защиты гражданских прав.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Предусмотренные законом меры защиты и восстановления нарушенных прав: например, при нарушении договора, повреждении имущества или незаконном использовании произведения.\nОсновные способы (ст. 12 ГК РФ):\n1) Возмещение убытков. Например, виновник ДТП возмещает ущерб владельцу повреждённого автомобиля.\n2) Присуждение к исполнению обязанности в натуре. Суд обязывает должника исполнить обязательство: например, ремонтную организацию — выполнить согласованный ремонт автомобиля.\n3) Взыскание неустойки — см. п. 21.\n4) Компенсация морального вреда — денежная компенсация физических или нравственных страданий, добровольно либо по решению суда.\n5) Самозащита права — самостоятельные законные действия по защите прав без обращения в государственные органы.\n6) Признание права — подтверждение его существования уполномоченным органом.\n7) Признание сделки недействительной.\n8) Иные способы, перечисленные в ст. 12 ГК РФ.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g52","subject":"soc","topic":"Гражданское право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к способам защиты гражданских прав по ст. 12 ГК РФ? Запишите цифры, под которыми они указаны.","options":["возмещение убытков","выговор","компенсация морального вреда","признание сделки недействительной","административный штраф","самозащита права"],"answer":"1346","hint":"Выговор — дисциплинарное взыскание, штраф по КоАП — административное наказание. По данным ФИПИ, их часто путают.","explain":"Способы защиты гражданских прав: 1, 3, 4, 6. Выговор (2) — дисциплинарное взыскание, административный штраф (5) — административное наказание."},{"id":"law_g53","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между ситуациями и способами защиты гражданских прав: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["виновник ДТП оплатил ремонт повреждённого автомобиля","суд обязал ремонтную организацию выполнить согласованный ремонт","газета выплатила гражданину деньги за нравственные страдания, причинённые публикацией","сосед возместил стоимость испорченной им мебели","суд обязал продавца передать покупателю оплаченный товар"],"right":["возмещение убытков","присуждение к исполнению обязанности в натуре","компенсация морального вреда"],"answer":"12312","hint":"Исполнение в натуре — суд заставляет сделать то, что было обещано.","explain":"Возмещение убытков: А, Г. Исполнение обязанности в натуре: Б, Д. Компенсация морального вреда: В."},{"id":"law_g54","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Назовите основные начала (принципы) гражданского права.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные начала (ст. 1 ГК РФ):\n1) Равенство участников: одна сторона не находится во властном подчинении у другой.\n2) Неприкосновенность собственности. Изъятие имущества допускается в установленных законом случаях, например при обращении взыскания для погашения долгов, взысканных судом.\n3) Свобода договора:\nА) участники приобретают и осуществляют гражданские права своей волей и в своём интересе;\nБ) свободны в установлении договорных прав, обязанностей и условий, не противоречащих законодательству.\n4) Свободное перемещение товаров, услуг и финансовых средств на всей территории РФ.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g55","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о принципах гражданского права и запишите цифры, под которыми они указаны.","options":["Равенство участников — один из принципов гражданского права.","Свобода договора позволяет сторонам устанавливать любые условия, в том числе противоречащие закону.","Изъятие имущества допускается только в установленных законом случаях.","Свободное перемещение товаров, услуг и финансовых средств по всей территории РФ — основное начало гражданского права.","Неприкосновенность собственности означает, что имущество ни при каких условиях не может быть изъято."],"answer":"134","hint":"Свобода договора имеет границы, а неприкосновенность собственности допускает исключения.","explain":"Верны 1, 3, 4. Условия договора не должны противоречить законодательству (2). Изъятие имущества возможно в установленных законом случаях (5)."},{"id":"law_g56","subject":"soc","topic":"Гражданское право","ege":22,"type":"open","max":4,"text":"Шестнадцатилетняя Катя работает по трудовому договору курьером и хочет стать полностью дееспособной. Её родители согласны.\n1) Какой объём дееспособности у Кати сейчас?\n2) Может ли Катя сейчас самостоятельно распоряжаться своей зарплатой?\n3) Как называется объявление несовершеннолетнего полностью дееспособным?\n4) Какой орган примет решение, если родители согласны?","criteria":[{"id":"K1","max":4,"text":"Правильно даны ответы на четыре вопроса — 4 балла; на 3 — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) Частичная (неполная) дееспособность несовершеннолетнего от 14 до 18 лет.\n2) Да: с 14 лет несовершеннолетний вправе самостоятельно распоряжаться заработком, стипендией и иными доходами.\n3) Эмансипация.\n4) Орган опеки и попечительства (без согласия родителей — суд).","hint":"Катя работает по трудовому договору и ей уже 16 — это условие эмансипации."},{"id":"law_zp01","subject":"soc","topic":"Защита прав потребителей","type":"open","card":true,"max":2,"text":"Кто такой потребитель?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Потребитель — гражданин, намеревающийся заказать или приобрести либо заказывающий, приобретающий или использующий товары, работы, услуги исключительно для личных, семейных, домашних и иных нужд, не связанных с предпринимательской деятельностью.","hint":"Главное в определении — цель: личные, семейные, домашние нужды, не связанные с предпринимательством."},{"id":"law_zp02","subject":"soc","topic":"Защита прав потребителей","ege":16,"type":"choice","max":2,"text":"Кто из перечисленных является потребителем по закону «О защите прав потребителей»? Запишите цифры, под которыми они указаны.","options":["гражданин, купивший холодильник для своей квартиры","индивидуальный предприниматель, купивший партию телефонов для перепродажи","пенсионерка, заказавшая ремонт своей обуви","организация, закупившая компьютеры для офиса","студент, купивший билет на концерт","гражданин, намеревающийся заказать пошив костюма для себя"],"answer":"1356","hint":"Потребитель — гражданин, а покупка для личных нужд. Обратите внимание: потребителем считается и тот, кто только намеревается купить или заказать.","explain":"Потребители — 1, 3, 5 и 6. Предприниматель покупает товар для предпринимательской деятельности (2), организация — не гражданин (4)."},{"id":"law_zp03","subject":"soc","topic":"Защита прав потребителей","type":"text","max":1,"text":"Запишите термин: гражданин, приобретающий или использующий товары, работы, услуги исключительно для личных, семейных, домашних и иных нужд, не связанных с предпринимательской деятельностью.","answer":["потребитель"],"hint":"Его права защищает специальный федеральный закон.","explain":"Потребитель."},{"id":"law_zp04","subject":"soc","topic":"Защита прав потребителей","type":"open","card":true,"max":2,"text":"Назовите основные права потребителя по закону «О защите прав потребителей».","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные права потребителя:\n— Право на необходимую и достоверную информацию о товарах, работах, услугах и об их изготовителе, продавце или исполнителе.\n— Право на надлежащее качество товаров, работ и услуг. Они должны соответствовать условиям договора и обязательным требованиям законодательства.\n— Право на безопасность товаров, работ и услуг. При обычных условиях использования, хранения, перевозки и утилизации они должны быть безопасны для жизни, здоровья, имущества потребителя и окружающей среды.","hint":"Три права: на информацию, на качество, на безопасность."},{"id":"law_zp05","subject":"soc","topic":"Защита прав потребителей","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о правах потребителей и запишите цифры, под которыми они указаны.","options":["Закон «О защите прав потребителей» распространяется на сделки между двумя индивидуальными предпринимателями.","Потребитель имеет право на необходимую и достоверную информацию о товаре и его изготовителе.","Товар при обычных условиях использования должен быть безопасен для жизни и здоровья потребителя.","Продавец может включить в договор условие о том, что потребитель не вправе требовать устранения недостатков товара.","Потребитель имеет право на товары надлежащего качества."],"answer":"235","hint":"Закон защищает гражданина, который покупает для личных нужд. Условия договора, ущемляющие права потребителя по сравнению с законом, не действуют.","explain":"Верны 2, 3 и 5. Сделки предпринимателей для бизнеса этот закон не регулирует (1). Условия, ущемляющие установленные законом права потребителя, недействительны (4)."},{"id":"law_zp06","subject":"soc","topic":"Защита прав потребителей","type":"open","card":true,"max":2,"text":"Что может потребовать потребитель при покупке товара ненадлежащего качества (ст. 18 Закона «О защите прав потребителей»)?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Права потребителя при покупке товара ненадлежащего качества.\nЕсли недостатки не были оговорены продавцом, потребитель по своему выбору вправе:\n— потребовать замены на товар этой же марки, модели или артикула;\n— потребовать замены на аналогичный товар другой марки, модели или артикула с перерасчётом покупной цены;\n— потребовать соразмерного уменьшения покупной цены;\n— потребовать незамедлительного бесплатного устранения недостатков либо возмещения расходов на их исправление самостоятельно или третьим лицом;\n— отказаться от договора купли-продажи и потребовать возврата уплаченной суммы.\nПо требованию продавца и за его счёт потребитель должен вернуть товар с недостатками.\nДля технически сложных товаров требование о возврате денег или замене при любом недостатке можно предъявить в течение 15 дней со дня передачи товара; позднее — в предусмотренных законом случаях.","hint":"Пять требований на выбор потребителя. Отдельно — правило 15 дней для технически сложных товаров."},{"id":"law_zp07","subject":"soc","topic":"Защита прав потребителей","ege":16,"type":"choice","max":2,"text":"Что из перечисленного вправе по своему выбору потребовать покупатель товара ненадлежащего качества, если недостатки не были оговорены продавцом? Запишите цифры, под которыми они указаны.","options":["замены на товар этой же марки","соразмерного уменьшения покупной цены","незамедлительного безвозмездного устранения недостатков","штрафа в размере десятикратной стоимости товара","возврата уплаченной суммы при отказе от договора","бесплатного предоставления второго такого же товара"],"answer":"1235","hint":"Закон даёт потребителю пять вариантов на выбор: замена (два варианта), уменьшение цены, ремонт, возврат денег.","explain":"Потребитель вправе требовать 1, 2, 3 и 5. Десятикратного штрафа (4) и второго товара в подарок (6) закон не предусматривает."},{"id":"law_zp08","subject":"soc","topic":"Защита прав потребителей","type":"open","card":true,"max":2,"text":"Как действовать, если товар надлежащего качества не подошёл по форме, габаритам, фасону, расцветке, размеру или комплектации (ст. 25 Закона «О защите прав потребителей»)?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Права потребителя при покупке товара надлежащего качества, который не подошёл.\nПотребитель вправе обменять непродовольственный товар на аналогичный у того же продавца, если товар не подошёл по форме, габаритам, фасону, расцветке, размеру или комплектации.\nСрок обмена — 14 дней, не считая дня покупки.\nТовар не должен быть в употреблении. Необходимо сохранить его товарный вид, потребительские свойства, пломбы и фабричные ярлыки. Покупку подтверждают чеком или другим документом. При их отсутствии можно ссылаться на свидетельские показания.\nЕсли аналогичного товара нет в продаже в день обращения, потребитель вправе вернуть товар и потребовать возврата денег. Их должны вернуть в течение трёх дней со дня возврата товара.\nПравительство РФ устанавливает перечень товаров надлежащего качества, не подлежащих такому обмену. Например: товары бытовой химии, ювелирные изделия из драгоценных металлов, автомобили, книги и др.","hint":"Запомните цифры: 14 дней на обмен, 3 дня на возврат денег."},{"id":"law_zp09","subject":"soc","topic":"Защита прав потребителей","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о обмене товара надлежащего качества и запишите цифры, под которыми они указаны.","options":["Потребитель вправе обменять непродовольственный товар надлежащего качества, не подошедший по размеру, в течение 14 дней, не считая дня покупки.","Обмен возможен, если товар не был в употреблении, сохранены его товарный вид, потребительские свойства и фабричные ярлыки.","При отсутствии кассового чека потребитель не вправе ссылаться на свидетельские показания.","Если аналогичного товара нет в продаже в день обращения, потребитель вправе вернуть товар и потребовать возврата денег.","Ювелирные изделия из драгоценных металлов надлежащего качества подлежат обмену в течение 14 дней."],"answer":"124","hint":"Закон разрешает подтвердить покупку не только чеком. Вспомните перечень товаров, которые не подлежат обмену.","explain":"Верны 1, 2 и 4. При отсутствии чека можно сослаться на свидетельские показания (3). Ювелирные изделия входят в перечень товаров, не подлежащих обмену (5)."},{"id":"law_zp10","subject":"soc","topic":"Защита прав потребителей","ege":15,"type":"match","max":2,"text":"Установите соответствие между ситуациями и правилами, которые к ним применяются: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["купленная куртка оказалась мала по размеру","у нового пылесоса через неделю сломался мотор","на купленном платье обнаружился скрытый дефект шва","покупателю не подошёл цвет новых штор","у купленного телефона не работает камера"],"right":["права при покупке товара ненадлежащего качества","обмен товара надлежащего качества"],"answer":"21121","hint":"Сначала определите, есть ли у товара недостаток. Если товар исправен, но не подошёл — это обмен товара надлежащего качества.","explain":"Товар с недостатками (ст. 18): сломанный мотор (Б), дефект шва (В), неработающая камера (Д). Исправный товар не подошёл (ст. 25): размер куртки (А), цвет штор (Г)."},{"id":"law_zp11","subject":"soc","topic":"Защита прав потребителей","ege":22,"type":"open","max":4,"text":"Ольга купила в магазине ноутбук для учёбы. Через десять дней у него перестала работать клавиатура. Продавец заявил, что вернёт деньги только после ремонта.\n1) Является ли Ольга потребителем? Объясните почему.\n2) Назовите любые два требования, которые она вправе предъявить продавцу.\n3) Вправе ли Ольга сразу отказаться от договора и потребовать вернуть деньги, если ноутбук относится к технически сложным товарам? Объясните.\n4) Что Ольга должна сделать с неисправным ноутбуком по требованию продавца?","criteria":[{"id":"K1","max":4,"text":"Правильно даны ответы на четыре вопроса — 4 балла; на 3 — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) Да: она приобрела товар для личных нужд, не связанных с предпринимательской деятельностью.\n2) Замена на товар этой же марки; замена на аналогичный товар другой марки с перерасчётом цены; соразмерное уменьшение цены; безвозмездное устранение недостатков; возврат уплаченной суммы.\n3) Да: недостаток обнаружен в течение 15 дней со дня передачи технически сложного товара, поэтому она вправе потребовать возврата денег или замены при любом недостатке.\n4) Вернуть товар с недостатками продавцу (за его счёт).","hint":"Для технически сложных товаров важен срок с момента передачи товара: сравните его с десятью днями из условия."},{"id":"law_l01","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Что такое трудовое право?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Трудовое право — отрасль права, регулирующая трудовые и непосредственно связанные с ними отношения.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l02","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Кто такой работодатель? Кто может быть работодателем?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Работодатель — физическое лицо либо юридическое лицо (организация), вступившее в трудовые отношения с работником.\nРаботодателями могут быть:\n— Юридические лица.\n— Индивидуальные предприниматели, частные нотариусы, адвокаты, учредившие адвокатские кабинеты, и другие предусмотренные законом лица.\n— Физические лица, нанимающие работников для личного обслуживания и помощи по хозяйству: садовников, поваров и т. д.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l03","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Кто такой работник? Кто может быть работником?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Работник — физическое лицо, вступившее в трудовые отношения с работодателем.\nРаботниками могут быть граждане РФ, иностранные граждане и лица без гражданства при соблюдении возрастных и иных требований закона.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l04","subject":"soc","topic":"Трудовое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о субъектах трудового права и запишите цифры, под которыми они указаны.","options":["Трудовое право регулирует трудовые и непосредственно связанные с ними отношения.","Работодателем может быть физическое лицо, нанимающее работников для личного обслуживания и помощи по хозяйству.","Работником может быть только гражданин РФ.","Индивидуальный предприниматель может быть работодателем.","Работником может быть юридическое лицо."],"answer":"124","hint":"Работник — всегда физическое лицо. Может ли им быть иностранец?","explain":"Верны 1, 2, 4. Работниками могут быть и иностранные граждане, и лица без гражданства (3). Работник — физическое лицо (5)."},{"id":"law_l05","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"С какого возраста по общему правилу заключается трудовой договор? При каких условиях его можно заключить с лицами, достигшими 15 лет, 14 лет и не достигшими 14 лет?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"По общему правилу трудовой договор заключается с 16 лет.\nС 15 лет самостоятельно, если:\n1) Труд лёгкий и не причиняет вреда здоровью.\n2) Общее образование получено либо подросток законно оставил школу или был отчислен и продолжает получать общее образование в иной форме без ущерба для освоения программы.\nС 14 лет, если:\n1) Труд лёгкий и не причиняет вреда здоровью.\n2) Общее образование получено либо работа выполняется в свободное от учёбы время без ущерба для освоения программы.\n3) Есть письменное согласие одного из родителей или попечителя.\nДля детей-сирот и детей, оставшихся без попечения родителей, требуется письменное согласие органа опеки и попечительства или иного законного представителя.\nДо 14 лет — в кино, театрах, театральных и концертных организациях, цирках для участия в создании или исполнении произведений:\n— Без ущерба здоровью и нравственному развитию.\n— С согласия одного из родителей или опекуна и разрешения органа опеки и попечительства.\n— Договор от имени ребёнка подписывает родитель или опекун.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l06","subject":"soc","topic":"Трудовое право","ege":15,"type":"match","max":2,"text":"Установите соответствие между условиями заключения трудового договора и возрастом работника: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["лёгкий труд в свободное от учёбы время с письменного согласия одного из родителей","участие в создании или исполнении произведения в театре с разрешения органа опеки и попечительства","лёгкий труд после получения общего образования, согласие родителей не требуется","договор от имени работника подписывает родитель или опекун","лёгкий труд; подросток законно оставил школу и продолжает обучение в иной форме, договор заключает сам"],"right":["с 14 лет","с 15 лет","до 14 лет"],"answer":"13232","hint":"С 15 лет договор заключают самостоятельно, с 14 — с согласия родителя, до 14 — только в сфере искусства.","explain":"С 14 лет: А. С 15 лет: В, Д (самостоятельно). До 14 лет: Б, Г (театр, кино, цирк; договор подписывает родитель или опекун)."},{"id":"law_l07","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Каковы особенности трудового статуса несовершеннолетних работников?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Запрещены вредные, опасные и подземные работы, а также работа, способная повредить здоровью или нравственному развитию.\n2) Сокращённая рабочая неделя: до 16 лет — не более 24 часов, с 16 до 18 лет — не более 35 часов. При совмещении работы с общим или средним профессиональным образованием в учебном году — не более половины этих норм.\n3) По общему правилу запрещены сверхурочная и ночная работа, командировки, работа в выходные и праздники. Закон предусматривает отдельные исключения.\n4) Не устанавливается испытательный срок. 5) Ежегодный основной оплачиваемый отпуск — 31 календарный день в удобное для работника время.\n6) Обязательны предварительный и ежегодные медицинские осмотры до достижения 18 лет за счёт работодателя.\n7) Запрещена работа по совместительству.\n8) Увольнение по инициативе работодателя требует согласия государственной инспекции труда и комиссии по делам несовершеннолетних, кроме ликвидации организации или прекращения деятельности ИП.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l08","subject":"soc","topic":"Трудовое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о труде несовершеннолетних и запишите цифры, под которыми они указаны.","options":["Для работников младше 16 лет рабочее время — не более 24 часов в неделю.","Для работников от 16 до 18 лет рабочее время — не более 35 часов в неделю.","Несовершеннолетним устанавливается испытательный срок до трёх месяцев.","Ежегодный оплачиваемый отпуск несовершеннолетних — 31 календарный день в удобное для них время.","Несовершеннолетний вправе работать по совместительству."],"answer":"124","hint":"Вспомните перечень особенностей: часы, отпуск, испытание, совместительство.","explain":"Верны 1, 2, 4. Несовершеннолетним испытание не устанавливается (3), работа по совместительству им запрещена (5)."},{"id":"law_l09","subject":"soc","topic":"Трудовое право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного по общему правилу запрещено для работников младше 18 лет? Запишите цифры, под которыми они указаны.","options":["ночная работа","работа в выходные и праздничные дни","ежегодные медицинские осмотры","подземные работы","ежегодный отпуск 31 календарный день","направление в командировку"],"answer":"1246","hint":"Медосмотры и отпуск — это гарантии, а не запреты.","explain":"Запрещены: 1, 2, 4, 6. Медосмотры (3) обязательны за счёт работодателя, отпуск 31 день (5) — гарантия для несовершеннолетних."},{"id":"law_l10","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Что такое трудовой договор? Перечислите любые четыре сведения и четыре условия, включаемые в него.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Трудовой договор — соглашение, по которому работник обязуется лично выполнять трудовую функцию и соблюдать правила внутреннего трудового распорядка, а работодатель — предоставить работу, обеспечить надлежащие условия труда и своевременно выплачивать заработную плату в полном объёме.\nЧетыре сведения:\n— Дата заключения договора.\n— Место заключения договора.\n— Фамилия, имя, отчество работника и наименование работодателя либо его ФИО, если это физическое лицо.\n— Сведения о документах, удостоверяющих личность работника и работодателя — физического лица.\nЧетыре обязательных условия:\n— Место работы.\n— Трудовая функция.\n— Условия оплаты труда.\n— Условия труда на рабочем месте.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l11","subject":"soc","topic":"Трудовое право","ege":15,"type":"match","max":2,"text":"Установите соответствие между элементами трудового договора и их видами: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["место работы","дата заключения договора","трудовая функция","сведения о документах, удостоверяющих личность работника","условия оплаты труда"],"right":["сведения","обязательные условия"],"answer":"21212","hint":"Сведения — кто, где и когда заключил договор. Условия — что, где и за какую оплату делает работник.","explain":"Сведения: дата (Б), документы, удостоверяющие личность (Г). Обязательные условия: место работы (А), трудовая функция (В), условия оплаты (Д)."},{"id":"law_l12","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Каков общий порядок заключения трудового договора и оформления приёма на работу?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Работник предъявляет необходимые документы. До подписания договора работодатель знакомит его под подпись с правилами внутреннего трудового распорядка, связанными с работой локальными актами и коллективным договором при его наличии.\n2) Договор заключается в письменной форме. При бумажном оформлении стороны подписывают два экземпляра: один получает работник, другой остаётся у работодателя. Получение своего экземпляра работник подтверждает подписью.\n3) Работодатель вправе издать приказ о приёме на работу на основании договора.\n4) Работодатель оформляет сведения о трудовой деятельности и вносит запись в бумажную трудовую книжку, если она ведётся.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l13","subject":"soc","topic":"Трудовое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о трудовом договоре и запишите цифры, под которыми они указаны.","options":["По трудовому договору работник обязуется лично выполнять определённую трудовую функцию.","Трудовой договор заключается в письменной форме.","До подписания договора работодатель знакомит работника с правилами внутреннего трудового распорядка.","С несовершеннолетним трудовой договор заключается в устной форме.","При бумажном оформлении договор составляется в одном экземпляре, который хранится у работодателя."],"answer":"123","hint":"Сколько экземпляров договора подписывают стороны?","explain":"Верны 1, 2, 3. Трудовой договор всегда заключается письменно (4). При бумажном оформлении подписывают два экземпляра: один у работника, другой у работодателя (5)."},{"id":"law_l14","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Перечислите семь документов, которые предъявляются при приёме на работу в предусмотренных законом случаях.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Паспорт или иной документ, удостоверяющий личность.\n2) Трудовая книжка и (или) сведения о трудовой деятельности, кроме первого трудоустройства.\n3) Документ, подтверждающий регистрацию в системе индивидуального персонифицированного учёта, в том числе электронный.\n4) Документы воинского учёта — для военнообязанных и лиц, подлежащих призыву.\n5) Документ об образовании, квалификации или специальных знаниях — если работа требует соответствующей подготовки.\n6) Справка о наличии или отсутствии судимости и факта уголовного преследования либо о его прекращении по реабилитирующим основаниям.\n7) Справка о наличии или отсутствии административного наказания за незаконное потребление наркотических, психотропных или новых потенциально опасных психоактивных веществ.\nСправки из пунктов 6 и 7 требуются только для предусмотренных законом видов деятельности.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l15","subject":"soc","topic":"Трудовое право","ege":16,"type":"choice","max":2,"text":"Какие из перечисленных документов предъявляются при приёме на работу в предусмотренных законом случаях? Запишите цифры, под которыми они указаны.","options":["паспорт или иной документ, удостоверяющий личность","документы воинского учёта — для военнообязанных","свидетельство о браке","документ об образовании, если работа требует специальной подготовки","справка о доходах супруга","трудовая книжка и (или) сведения о трудовой деятельности"],"answer":"1246","hint":"Свидетельство о браке и сведения о доходах родственников работодатель требовать не вправе.","explain":"Предъявляются: 1, 2, 4, 6. Свидетельства о браке (3) и справки о доходах супруга (5) в перечне нет."},{"id":"law_l16","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Какие виды трудовых договоров выделяют по сроку действия? Каково общее правило изменения трудового договора?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) На неопределённый срок — срок окончания трудовых отношений не устанавливается. Такой договор заключается по общему правилу.\n2) Срочный — заключается на определённый срок, обычно не более пяти лет, если законом не предусмотрено иное. Для его заключения необходимы законные основания.\nЕсли срок истёк, работник продолжает работать и ни одна сторона не потребовала прекращения договора, он становится бессрочным.\n10. Изменение трудового договора\nПо общему правилу изменение согласованных сторонами условий допускается только по их взаимному соглашению, оформленному письменно. Исключения устанавливаются законом.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l17","subject":"soc","topic":"Трудовое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о сроке и изменении трудового договора и запишите цифры, под которыми они указаны.","options":["По общему правилу трудовой договор заключается на неопределённый срок.","Срочный трудовой договор по общему правилу заключается не более чем на пять лет.","Если срок договора истёк, работник продолжает работать и никто не потребовал прекращения договора, он становится бессрочным.","Работодатель вправе в любое время изменить условия трудового договора в одностороннем порядке.","Срочный договор заключается по желанию работодателя без каких-либо законных оснований."],"answer":"123","hint":"Как по общему правилу меняются согласованные условия договора?","explain":"Верны 1, 2, 3. Изменение условий по общему правилу — только по соглашению сторон в письменной форме (4). Для срочного договора нужны законные основания (5)."},{"id":"law_l18","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Что такое испытательный срок? Какова его максимальная продолжительность? Кому испытание не устанавливается?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Испытательный срок — установленный соглашением сторон период проверки соответствия работника поручаемой работе.\nПо общему правилу — не более трёх месяцев. Для отдельных руководящих должностей, например руководителей организаций и главных бухгалтеров, — до шести месяцев.\nУсловие об испытании должно быть согласовано до начала работы.\nИспытание не устанавливается:\n— Лицам младше 18 лет.\n— Беременным женщинам и женщинам, имеющим детей до трёх лет.\n— Лицам, избранным на выборную должность на оплачиваемую работу.\n— Лицам, заключающим трудовой договор на срок до двух месяцев.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l19","subject":"soc","topic":"Трудовое право","ege":16,"type":"choice","max":2,"text":"Кому испытательный срок при приёме на работу не устанавливается? Запишите цифры, под которыми они указаны.","options":["лицам младше 18 лет","беременным женщинам","главным бухгалтерам","лицам, заключающим трудовой договор на срок до двух месяцев","женщинам, имеющим детей в возрасте до трёх лет","работникам старше 50 лет"],"answer":"1245","hint":"Главным бухгалтерам испытание, наоборот, может быть установлено на более долгий срок.","explain":"Испытание не устанавливается: 1, 2, 4, 5. Главным бухгалтерам оно может длиться до шести месяцев (3); для работников старше 50 лет исключения нет (6). С 1 сентября 2026 г. запрет распространяется на женщин с детьми до трёх лет (раньше — до полутора)."},{"id":"law_l20","subject":"soc","topic":"Трудовое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о испытательном сроке и запишите цифры, под которыми они указаны.","options":["По общему правилу испытательный срок не может превышать трёх месяцев.","Для руководителей организаций и главных бухгалтеров испытание может длиться до шести месяцев.","Условие об испытании можно установить через месяц после начала работы.","Испытание устанавливается по соглашению сторон.","Лицам, избранным на выборную должность на оплачиваемую работу, испытание устанавливается обязательно."],"answer":"124","hint":"Когда должно быть согласовано условие об испытании?","explain":"Верны 1, 2, 4. Условие об испытании согласуется до начала работы (3). Избранным на выборную оплачиваемую должность испытание не устанавливается (5)."},{"id":"law_l21","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Каковы основания прекращения трудового договора по инициативе работника, по соглашению сторон и в связи с истечением срока?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Прекращение трудового договора А) По инициативе работника\nПо общему правилу работник письменно предупреждает работодателя не менее чем за две недели. Срок отсчитывается со следующего дня после получения заявления работодателем.\nДо истечения срока заявление можно отозвать, если на место работника письменно не приглашён другой работник, которому по закону нельзя отказать в приёме.\nУволиться раньше можно по соглашению сторон. При невозможности продолжать работу, например в связи с зачислением в образовательную организацию или выходом на пенсию, работодатель обязан уволить в срок, указанный в заявлении.\nБ) По соглашению сторон\nДоговор может быть расторгнут в любое время по взаимному соглашению работника и работодателя.\nВ) Истечение срока\nПо общему правилу работодатель письменно предупреждает работника не менее чем за три календарных дня. Исключение — договор на время исполнения обязанностей отсутствующего работника: он прекращается с выходом этого работника на работу.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l22","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Каковы основания прекращения трудового договора по инициативе работодателя и по обстоятельствам, не зависящим от воли сторон?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Некоторые основания:\n1) Прогул — отсутствие на рабочем месте без уважительных причин весь рабочий день или смену независимо от продолжительности либо более четырёх часов подряд.\n2) Появление на работе в состоянии алкогольного, наркотического или иного токсического опьянения.\n3) Неоднократное неисполнение трудовых обязанностей без уважительных причин при наличии действующего дисциплинарного взыскания.\n4) Несоответствие должности вследствие недостаточной квалификации, подтверждённой аттестацией.\n5) Сокращение численности или штата работников.\n6) Ликвидация организации или прекращение деятельности ИП.\nПри сокращении или недостаточной квалификации увольнение допускается, если невозможно перевести работника с его согласия на другую подходящую работу.\nД) По обстоятельствам, не зависящим от воли сторон\nНекоторые основания:\n1) Призыв на срочную военную службу или направление на альтернативную гражданскую службу.\n2) Восстановление прежнего работника по решению суда или государственной инспекции труда.\n3) Признание работника полностью неспособным к трудовой деятельности по медицинскому заключению.\n4) Чрезвычайные обстоятельства, препятствующие продолжению трудовых отношений, признанные решением Правительства РФ или органа государственной власти региона.\n5) Прекращение допуска к государственной тайне, если работа требует такого допуска.\n6) Наказание, исключающее продолжение работы: по вступившему в силу приговору суда либо в виде дисквалификации или иного административного наказания.\n7) Неизбрание на должность.\nВ предусмотренных законом случаях увольнение возможно только при невозможности перевода на другую работу.\nВ день прекращения договора работодатель производит окончательный расчёт и выдаёт трудовую книжку или сведения о трудовой деятельности.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l23","subject":"soc","topic":"Трудовое право","ege":15,"type":"match","max":2,"text":"Установите соответствие между ситуациями и основаниями прекращения трудового договора: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["прогул","призыв работника на военную службу","работник подал заявление об увольнении за две недели","сокращение штата","восстановление на работе прежнего работника по решению суда"],"right":["по инициативе работника","по инициативе работодателя","по обстоятельствам, не зависящим от воли сторон"],"answer":"23123","hint":"Призыв и восстановление прежнего работника не зависят ни от работника, ни от работодателя.","explain":"Работник: В. Работодатель: прогул (А), сокращение штата (Г). Не зависят от воли сторон: призыв (Б), восстановление прежнего работника (Д)."},{"id":"law_l24","subject":"soc","topic":"Трудовое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о прекращении трудового договора и запишите цифры, под которыми они указаны.","options":["По общему правилу работник предупреждает работодателя об увольнении не менее чем за две недели.","Работник вправе отозвать заявление до истечения срока предупреждения, если на его место письменно не приглашён работник, которому нельзя отказать в приёме.","О прекращении срочного договора работодатель по общему правилу предупреждает работника не менее чем за три календарных дня.","Прогулом считается только отсутствие на работе более трёх дней подряд.","Трудовой договор нельзя расторгнуть по соглашению сторон раньше чем через две недели."],"answer":"123","hint":"Что такое прогул по закону? Когда можно расторгнуть договор по соглашению сторон?","explain":"Верны 1, 2, 3. Прогул — отсутствие без уважительных причин весь рабочий день или более четырёх часов подряд (4). По соглашению сторон договор расторгается в любое время (5)."},{"id":"law_l25","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Перечислите по четыре права и четыре обязанности работника и работодателя.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Работник\nПрава:\n— На заключение, изменение и расторжение трудового договора.\n— На предоставление работы, обусловленной трудовым договором.\n— На отдых.\n— На своевременную и полную выплату заработной платы.\nОбязанности:\n— Добросовестно исполнять трудовые обязанности.\n— Бережно относиться к имуществу работодателя.\n— Соблюдать трудовую дисциплину.\n— Выполнять установленные нормы труда.\nРаботодатель\nПрава:\n— Заключать, изменять и расторгать трудовые договоры в установленном законом порядке.\n— Поощрять работников за добросовестный и эффективный труд.\n— Привлекать работников к дисциплинарной и материальной ответственности в установленном порядке.\n— Требовать исполнения трудовых обязанностей и бережного отношения к имуществу.\nОбязанности:\n— Соблюдать трудовое законодательство.\n— Предоставлять работу, обусловленную трудовым договором.\n— Обеспечивать безопасность и надлежащие условия труда.\n— Обеспечивать равную оплату за труд равной ценности.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l26","subject":"soc","topic":"Трудовое право","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и элементами правового статуса работника: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["на отдых","бережно относиться к имуществу работодателя","на своевременную и полную выплату заработной платы","соблюдать трудовую дисциплину","выполнять установленные нормы труда"],"right":["права","обязанности"],"answer":"12122","hint":"Права — то, что работник может требовать; обязанности — то, что он должен делать.","explain":"Права: отдых (А), зарплата (В). Обязанности: беречь имущество (Б), дисциплина (Г), нормы труда (Д)."},{"id":"law_l27","subject":"soc","topic":"Трудовое право","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и элементами правового статуса работодателя: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["обеспечивать безопасность и надлежащие условия труда","поощрять работников за добросовестный труд","обеспечивать равную оплату за труд равной ценности","привлекать работников к дисциплинарной ответственности","предоставлять работу, обусловленную трудовым договором"],"right":["права","обязанности"],"answer":"21212","hint":"Поощрять и наказывать — право работодателя; условия труда и оплата — его обязанности.","explain":"Права: поощрять (Б), привлекать к дисциплинарной ответственности (Г). Обязанности: безопасность (А), равная оплата (В), предоставление работы (Д)."},{"id":"law_l28","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Какие три основных дисциплинарных взыскания могут применяться к работнику?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные дисциплинарные взыскания:\n— Замечание.\n— Выговор.\n— Увольнение по соответствующим основаниям.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l29","subject":"soc","topic":"Трудовое право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к дисциплинарным взысканиям по Трудовому кодексу РФ? Запишите цифры, под которыми они указаны.","options":["замечание","штраф","выговор","предупреждение","увольнение по соответствующим основаниям","обязательные работы"],"answer":"135","hint":"Штраф и предупреждение есть в КоАП, обязательные работы — и в КоАП, и в УК.","explain":"Дисциплинарные взыскания: 1, 3, 5. Штраф (2), предупреждение (4) и обязательные работы (6) — меры административной или уголовной ответственности."},{"id":"law_l30","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Назовите любые три принципа трудового права. Что такое коллективный договор?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"— Запрет принудительного труда.\n— Запрет дискриминации в сфере труда.\n— Защита от безработицы и содействие в трудоустройстве.\n16. Коллективный договор\nКоллективный договор — правовой акт, регулирующий социально-трудовые отношения в организации или у индивидуального предпринимателя и заключаемый работниками и работодателем в лице их представителей.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l31","subject":"soc","topic":"Трудовое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о принципах трудового права и коллективном договоре и запишите цифры, под которыми они указаны.","options":["Запрет принудительного труда — принцип трудового права.","Запрет дискриминации в сфере труда — принцип трудового права.","Коллективный договор заключают работники и работодатель в лице их представителей.","Коллективный договор регулирует имущественные отношения супругов.","Защита от безработицы не относится к принципам трудового права."],"answer":"123","hint":"Коллективный договор регулирует социально-трудовые отношения в организации.","explain":"Верны 1, 2, 3. Отношения супругов регулирует брачный договор (4). Защита от безработицы и содействие в трудоустройстве — принцип трудового права (5)."},{"id":"law_l32","subject":"soc","topic":"Трудовое право","ege":22,"type":"open","max":4,"text":"Работник Сидоров без уважительных причин отсутствовал на рабочем месте пять часов подряд.\n1) Как называется такое нарушение?\n2) Какой вид юридической ответственности может применить к нему работодатель?\n3) Назовите любые два дисциплинарных взыскания.\n4) Может ли работодатель уволить Сидорова за это нарушение? Объясните.","criteria":[{"id":"K1","max":4,"text":"Правильно даны ответы на четыре вопроса — 4 балла; на 3 — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) Прогул: отсутствие на рабочем месте без уважительных причин более четырёх часов подряд.\n2) Дисциплинарную ответственность.\n3) Замечание, выговор, увольнение по соответствующим основаниям (любые два).\n4) Да: прогул — основание для расторжения трудового договора по инициативе работодателя.","hint":"Сравните продолжительность отсутствия с определением прогула."},{"id":"s12","subject":"soc","topic":"Трудовое право","type":"open","max":3,"text":"Шестнадцатилетний Антон устроился курьером по трудовому договору. Работодатель установил ему испытательный срок три месяца и 40-часовую рабочую неделю, а также предложил выходить в ночные смены с повышенной оплатой.\n\n1) Какие условия, предложенные работодателем, противоречат Трудовому кодексу РФ? Поясните каждое.\n2) Какую особенность ежегодного отпуска Трудовой кодекс устанавливает для работников младше 18 лет?","criteria":[{"id":"K1","max":2,"text":"Названы нарушения с пояснением: работникам младше 18 лет не устанавливается испытательный срок; для работников 16–18 лет рабочее время — не более 35 часов в неделю; работников младше 18 лет нельзя привлекать к работе в ночное время. Три нарушения — 2 балла, два — 1 балл."},{"id":"K2","max":1,"text":"Указано, что работникам младше 18 лет ежегодный отпуск предоставляется продолжительностью 31 календарный день в удобное для них время."}],"model":"1) Испытательный срок лицам младше 18 лет не устанавливается (ст. 70 ТК РФ). Для работников от 16 до 18 лет рабочее время сокращено — не более 35 часов в неделю (ст. 92). Работники младше 18 лет не допускаются к работе в ночное время (ст. 96); исключение сделано только для творческих работников, а Антон — курьер.\n2) Работникам младше 18 лет ежегодный оплачиваемый отпуск предоставляется продолжительностью 31 календарный день в удобное для них время (ст. 267).","hint":"Найдите в условии три детали: «три месяца», «40 часов», «ночные смены». Для несовершеннолетних по каждой есть особое правило."},{"id":"law_p01","subject":"soc","topic":"Гражданский процесс","type":"open","card":true,"max":2,"text":"Что такое гражданское процессуальное право и гражданский процесс?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Гражданское процессуальное право — отрасль российского права, регулирующая порядок рассмотрения и разрешения гражданских дел в суде.\nГражданский процесс (гражданское судопроизводство) — урегулированная законом деятельность суда и других участников процесса по рассмотрению и разрешению гражданских дел.\nК гражданским делам относятся:\nспоры из гражданских правоотношений: о возмещении вреда, взыскании долга, расторжении договоров;\nсемейные споры: о расторжении брака, взыскании алиментов, установлении отцовства;\nтрудовые споры: о восстановлении на работе, взыскании невыплаченной заработной платы.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p02","subject":"soc","topic":"Гражданский процесс","type":"open","card":true,"max":2,"text":"Каковы основные отличия гражданского процесса от уголовного?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные отличия гражданского процесса от уголовного:\nВ гражданском процессе отсутствует предварительное расследование. Дело возбуждается судом на основании заявления. При этом для некоторых споров предусмотрен обязательный досудебный порядок урегулирования.\nВ гражданском процессе не решается вопрос о виновности в совершении преступления и не выносится приговор. В исковом производстве спор разрешается решением суда. При этом вина может иметь значение, например, при решении вопроса о возмещении вреда.\nДля гражданского процесса характерен принцип диспозитивности: стороны самостоятельно распоряжаются своими правами в пределах закона. Суд не возбуждает дело по собственной инициативе; истец вправе отказаться от иска, ответчик — признать иск, стороны — заключить мировое соглашение. В уголовном процессе возможности участников распоряжаться ходом дела значительно ограничены публичными интересами.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p03","subject":"soc","topic":"Гражданский процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о гражданском процессе и запишите цифры, под которыми они указаны.","options":["Гражданский процесс — деятельность суда и других участников по рассмотрению и разрешению гражданских дел.","В гражданском процессе нет предварительного расследования.","По гражданскому делу суд выносит приговор.","Споры о взыскании алиментов рассматриваются в порядке гражданского судопроизводства.","Суд возбуждает гражданское дело по собственной инициативе."],"answer":"124","hint":"Принцип диспозитивности: кто начинает гражданское дело?","explain":"Верны 1, 2, 4. Приговор — акт уголовного процесса, по иску суд выносит решение (3). Дело возбуждается на основании заявления, а не по инициативе суда (5)."},{"id":"law_p04","subject":"soc","topic":"Гражданский процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между характеристиками и видами судопроизводства: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["дело возбуждается судом на основании искового заявления","проводится предварительное расследование","итоговый акт по существу дела — приговор","истец вправе отказаться от иска","стороны могут заключить мировое соглашение"],"right":["гражданский процесс","уголовный процесс"],"answer":"12211","hint":"Диспозитивность — стороны сами распоряжаются своими правами — характерна для гражданского процесса.","explain":"Гражданский процесс: А, Г, Д. Уголовный процесс: Б, В."},{"id":"law_p05","subject":"soc","topic":"Гражданский процесс","type":"open","card":true,"max":2,"text":"Назовите участников гражданского процесса.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Участники гражданского процесса:\nСуд — рассматривает и разрешает дело, руководит процессом, обеспечивает порядок судебного заседания. Дела рассматриваются судьёй единолично или судом коллегиально в зависимости от инстанции и требований закона.\nПри разрешении иска по существу суд выносит решение: удовлетворяет исковые требования полностью или частично либо отказывает в их удовлетворении.\nСтороны:\n1) Истец — лицо, в защиту прав и законных интересов которого возбуждено гражданское дело.\n2) Ответчик — лицо, к которому предъявлен иск.\nИстцами и ответчиками могут быть граждане и организации.\nТретьи лица — лица, участвующие в деле для защиты своих прав и законных интересов. Они могут заявлять самостоятельные требования относительно предмета спора или не заявлять их.\nНапример, два соседа спорят о границе земельных участков. Если её изменение может затронуть участок третьего соседа, он может участвовать в деле в качестве третьего лица.\nПрокурор — в предусмотренных законом случаях обращается в суд в защиту граждан, неопределённого круга лиц или публичных интересов либо вступает в дело для дачи заключения. Он вправе обжаловать судебные постановления. Обвинителем в гражданском процессе прокурор не является.\nГосударственные органы и органы местного самоуправления — участвуют в предусмотренных законом случаях. Например, органы опеки и попечительства дают заключение в спорах о воспитании детей.\nЛица, содействующие осуществлению правосудия:\n1) Свидетель — лицо, которому могут быть известны сведения, имеющие значение для дела.\n2) Переводчик — осуществляет необходимый участникам процесса перевод.\n3) Специалист — обладает специальными знаниями, даёт консультации и оказывает техническую помощь при совершении процессуальных действий.\n4) Эксперт — обладает специальными знаниями, проводит экспертизу и даёт заключение.\n5) Помощник судьи — помогает судье в подготовке и организации процесса, но не осуществляет правосудие.\n6) Секретарь судебного заседания — ведёт протокол и выполняет другие обязанности по обеспечению заседания.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p06","subject":"soc","topic":"Гражданский процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между участниками гражданского процесса и их группами: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["истец","эксперт","секретарь судебного заседания","сосед, чей участок может затронуть решение спора о границе соседних участков","ответчик"],"right":["стороны","третьи лица","лица, содействующие осуществлению правосудия"],"answer":"13321","hint":"Третьи лица участвуют в деле для защиты своих прав, хотя спор не между ними.","explain":"Стороны: истец (А), ответчик (Д). Третье лицо: сосед (Г). Содействуют правосудию: эксперт (Б), секретарь (В)."},{"id":"law_p07","subject":"soc","topic":"Гражданский процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о участниках гражданского процесса и запишите цифры, под которыми они указаны.","options":["Прокурор в гражданском процессе выступает обвинителем.","Прокурор в предусмотренных законом случаях может обратиться в суд в защиту граждан.","Органы опеки и попечительства дают заключение в спорах о воспитании детей.","Помощник судьи осуществляет правосудие наравне с судьёй.","Истцами и ответчиками могут быть как граждане, так и организации."],"answer":"235","hint":"Обвинителя в гражданском процессе нет. Кто осуществляет правосудие?","explain":"Верны 2, 3, 5. Обвинителем в гражданском процессе прокурор не является (1). Помощник судьи помогает судье, но правосудие не осуществляет (4)."},{"id":"law_p08","subject":"soc","topic":"Гражданский процесс","type":"open","card":true,"max":2,"text":"Каковы права и обязанности истца и ответчика?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Права истца и ответчика:\n1) Знакомиться с материалами дела, делать выписки и снимать копии.\n2) Заявлять отводы.\n3) Представлять доказательства, участвовать в их исследовании, задавать вопросы другим участникам процесса.\n4) Заявлять ходатайства, в том числе об истребовании доказательств.\n5) Давать устные и письменные объяснения, приводить доводы и возражать против доводов и ходатайств других лиц.\n6) Обжаловать судебные постановления.\nОбязанности истца и ответчика:\n1) Добросовестно пользоваться процессуальными правами, не злоупотреблять ими.\n2) Доказывать обстоятельства, на которых основаны их требования и возражения, если законом не предусмотрено иное.\n3) Соблюдать порядок в судебном заседании и выполнять законные распоряжения суда.\n4) Нести судебные расходы в случаях и порядке, установленных законом.\n5) Сообщать суду о перемене своего адреса во время производства по делу.\n6) Выполнять обязательные для них судебные постановления.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p09","subject":"soc","topic":"Гражданский процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и элементами процессуального статуса сторон: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["нести судебные расходы в установленных законом случаях","заявлять отводы","доказывать обстоятельства, на которых основаны требования","обжаловать судебные постановления","сообщать суду о перемене адреса"],"right":["права","обязанности"],"answer":"21212","hint":"Права расширяют возможности стороны, обязанности требуют от неё определённого поведения.","explain":"Права: заявлять отводы (Б), обжаловать (Г). Обязанности: расходы (А), доказывание (В), сообщать об адресе (Д)."},{"id":"law_p10","subject":"soc","topic":"Гражданский процесс","type":"open","card":true,"max":2,"text":"Назовите стадии гражданского процесса.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Стадии гражданского процесса на примере искового производства:\nВозбуждение гражданского дела. В суд подаётся исковое заявление. По общему правилу иск предъявляется по месту жительства ответчика или по адресу организации-ответчика. Есть исключения: например, потребитель может предъявить иск также по своему месту жительства.\nСудья в течение пяти дней со дня поступления заявления решает вопрос о его принятии. Принятие заявления к производству означает возбуждение дела.\nПодготовка дела к судебному разбирательству. Судья уточняет требования и возражения сторон, определяет необходимые доказательства и состав участников. Может проводиться предварительное судебное заседание. Подготовленное дело назначается к разбирательству, участников извещают о месте и времени заседания.\nСудебное разбирательство. Суд проверяет явку участников, разъясняет права и обязанности. Затем рассматривает дело по существу: заслушивает объяснения, исследует доказательства, допрашивает свидетелей. После этого проходят судебные прения, в которых участники обосновывают свои позиции.\nДля принятия решения суд удаляется в совещательную комнату, затем объявляет решение или его резолютивную часть — итог разрешения спора.\nПо общему правилу дело рассматривается в течение двух месяцев со дня поступления заявления в суд, а мировым судьёй — одного месяца со дня принятия заявления. Дела о восстановлении на работе и взыскании алиментов рассматриваются в течение месяца. Предусмотрены исключения и возможность продления сроков.\nАпелляционное производство. Не вступившее в законную силу решение может быть обжаловано. По общему правилу апелляционная жалоба подаётся через суд, принявший решение, в течение одного месяца со дня принятия решения в окончательной форме.\nАпелляционный суд вправе оставить решение без изменения, изменить или отменить его.\nЕсли жалоба не подана, решение вступает в законную силу после истечения срока обжалования. Если подана — после рассмотрения жалобы, когда решение не отменено. Новое решение апелляционного суда вступает в силу немедленно.\nКассационное и надзорное производство. Вступившие в законную силу судебные постановления могут пересматриваться вышестоящими судами в установленном порядке. При наличии оснований постановление может быть изменено или отменено, в том числе с направлением дела на новое рассмотрение.\nПересмотр по вновь открывшимся или новым обстоятельствам. При наличии предусмотренных законом обстоятельств вступившее в силу постановление пересматривает суд, который его принял.\nИсполнение решения. Решение исполняется добровольно или принудительно, как правило, после вступления в законную силу. Принудительным исполнением обычно занимаются судебные приставы-исполнители. Некоторые решения подлежат немедленному исполнению.\nНе каждое дело проходит все перечисленные стадии.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p11","subject":"soc","topic":"Гражданский процесс","type":"order","max":1,"text":"Расположите стадии гражданского процесса (искового производства) в правильной последовательности.","options":["судебное разбирательство","возбуждение гражданского дела","апелляционное производство","подготовка дела к судебному разбирательству"],"answer":"2413","hint":"Дело возбуждается принятием искового заявления, обжалуется — уже вынесенное решение.","explain":"Возбуждение дела → подготовка → судебное разбирательство → апелляционное производство."},{"id":"law_p12","subject":"soc","topic":"Гражданский процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о стадиях гражданского процесса и запишите цифры, под которыми они указаны.","options":["Судья решает вопрос о принятии искового заявления в течение пяти дней со дня его поступления.","По общему правилу дело рассматривается в течение двух месяцев со дня поступления заявления в суд.","Апелляционная жалоба по общему правилу подаётся в течение месяца со дня принятия решения в окончательной форме.","Иск по общему правилу предъявляется по месту жительства истца.","Решение суда исполняется только принудительно."],"answer":"123","hint":"Где по общему правилу подаётся иск? Может ли решение исполняться добровольно?","explain":"Верны 1, 2, 3. Иск по общему правилу предъявляется по месту жительства ответчика (4). Решение исполняется добровольно или принудительно (5)."},{"id":"law_p13","subject":"soc","topic":"Гражданский процесс","type":"open","card":true,"max":2,"text":"Назовите основные принципы гражданского процесса.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные принципы гражданского процесса:\n1) Законность. Суд и другие участники процесса должны соблюдать требования законодательства.\n2) Диспозитивность. Стороны самостоятельно распоряжаются своими правами в пределах закона: определяют требования, могут отказаться от иска, признать иск или заключить мировое соглашение.\n3) Состязательность и равноправие сторон.\nСтороны обосновывают свои требования и возражения, представляют доказательства и обладают равными процессуальными возможностями для защиты своей позиции.\n4) Единоличное и коллегиальное рассмотрение дел. Дела рассматриваются одним судьёй или коллегией судей в соответствии с законом.\n5) Разумный срок судопроизводства. Рассмотрение дела и исполнение судебного постановления должны происходить без неоправданных задержек, с учётом сложности дела и других обстоятельств.\n6) Гласность судебного разбирательства. Судебные заседания открыты. Закрытое рассмотрение допускается в предусмотренных законом случаях, например по делам об усыновлении.\n7) Независимость судей. Судьи независимы и подчиняются только Конституции РФ и федеральному закону.\n8) Язык гражданского судопроизводства. Процесс ведётся на русском языке либо в предусмотренных законом случаях на государственном языке соответствующей республики в составе РФ. Лицам, не владеющим языком судопроизводства, обеспечивается право пользоваться услугами переводчика.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p14","subject":"soc","topic":"Гражданский процесс","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к принципам гражданского процесса? Запишите цифры, под которыми они указаны.","options":["диспозитивность","презумпция невиновности","состязательность и равноправие сторон","гласность судебного разбирательства","приоритет семейного воспитания детей","независимость судей"],"answer":"1346","hint":"Презумпция невиновности — принцип уголовного процесса, приоритет семейного воспитания — принцип семейного права.","explain":"Принципы гражданского процесса: 1, 3, 4, 6. Презумпция невиновности (2) — уголовный процесс, приоритет семейного воспитания (5) — семейное право."},{"id":"law_p15","subject":"soc","topic":"Гражданский процесс","type":"open","card":true,"max":2,"text":"Что такое арбитражный процесс?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Ответ:\nАрбитражный процесс — это рассмотрение дел в арбитражных судах с целью разрешить экономические споры, возникающие между организациями или гражданами-предпринимателями. Арбитражный процесс проходит в Арбитражных судах РФ и регулируется нормами Арбитражного процессуального кодекса РФ (АПК РФ). ⏺Пример: Фирма «ЕвроОбувь» арендовала помещение у фирмы «Вега». После того, как арендная плата не производилась в течение 6 месяцев, фирма «Вега» обратилась в суд.\nАрбитражный процесс в целом схож с гражданским (наличие истца и ответчика, те же основные принципы и тд), хоть и имеет некоторые отличия.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p16","subject":"soc","topic":"Гражданский процесс","type":"open","card":true,"max":2,"text":"В каком порядке обжалуются решения органов государственной власти и каким законом это регулируется?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"В каком порядке производится обжалование решений органов государственной власти и каким законом регулируется?\nОтвет:\nОбжалование решений органов государственной власти производится в порядке, регулируемом Кодексом административного судопроизводства РФ (КАС РФ). Порядок имеет много общих черт с гражданским процессом. ⏺ Пример: Гражданка Смирнова подала заявление в органы социальной защиты для получения субсидии на оплату коммунальных услуг, так как её доходы соответствуют установленным критериям. Однако ей было отказано на основании того, что в документах якобы отсутствует подтверждение низкого дохода. Смирнова считает отказ незаконным, так как все необходимые документы были предоставлены. Смирнова подает в суд на государственный орган (в данном случае орган социальной защиты). Смирнова будет иметь статус административного истца, государственный орган-административного ответчика. Суд будет разбирать дело в порядке КАС РФ.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p17","subject":"soc","topic":"Гражданский процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между спорами и законами, по которым они рассматриваются в суде: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["фирма требует с другой фирмы долг по арендной плате","гражданка оспаривает отказ органа социальной защиты в субсидии","гражданин требует восстановления на работе","супруги делят имущество при разводе","индивидуальный предприниматель и организация спорят об оплате поставки"],"right":["Гражданский процессуальный кодекс РФ","Арбитражный процессуальный кодекс РФ","Кодекс административного судопроизводства РФ"],"answer":"23112","hint":"Экономические споры организаций и предпринимателей — в арбитражных судах; споры с органами власти — по КАС РФ.","explain":"АПК РФ: А, Д (экономические споры). КАС РФ: Б (обжалование решения органа власти). ГПК РФ: В (трудовой спор), Г (семейный спор)."},{"id":"law_p18","subject":"soc","topic":"Гражданский процесс","type":"text","max":1,"text":"По какому кодексу рассматриваются в суде споры граждан с органами государственной власти? Запишите сокращённое название.","answer":["КАС","КАС РФ","Кодекс административного судопроизводства","Кодекс административного судопроизводства РФ"],"hint":"Гражданин в таком споре — административный истец.","explain":"Кодекс административного судопроизводства РФ (КАС РФ)."},{"id":"law_j01","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Что такое юридическая ответственность?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Юридическая ответственность — применение к правонарушителю предусмотренных законом мер государственного принуждения, выражающихся в лишениях личного, имущественного или организационного характера.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j02","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Что такое правонарушение?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элеме
