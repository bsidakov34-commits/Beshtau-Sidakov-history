купность норм, регулирующих определённую сферу общественных отношений. Например, гражданское или уголовное право.\nИнститут права — совокупность норм, регулирующих определённую группу взаимосвязанных общественных отношений.\nНапример, институт наследования или брака.\nНорма права — общеобязательное, формально определённое правило поведения, установленное или признанное государством и обеспечиваемое его защитой.","hint":"Идите от целого к части: система → отрасль → институт → норма."},{"id":"law_tp13","subject":"soc","topic":"Теория права","type":"order","max":1,"text":"Расположите элементы системы права от наименьшего к наибольшему.","options":["отрасль права","норма права","институт права"],"answer":"231","hint":"Первичный элемент системы права — отдельное правило поведения.","explain":"Норма права → институт права (совокупность норм о группе отношений) → отрасль права (совокупность норм о сфере отношений)."},{"id":"law_tp14","subject":"soc","topic":"Теория права","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о системе права и запишите цифры, под которыми они указаны.","options":["Норма права — первичный элемент системы права.","Институт права — совокупность норм, регулирующих определённую группу взаимосвязанных общественных отношений.","Институт наследования относится к гражданскому праву.","Отрасль права — совокупность нормативных актов, принятых одним органом власти.","Нормы о заключении и прекращении брака образуют институт семейного права."],"answer":"1235","hint":"Отрасль права выделяют по сфере регулируемых отношений, а не по органу, который принял акт.","explain":"Верны 1, 2, 3 и 5. Отрасль права — совокупность норм, регулирующих определённую сферу общественных отношений, а не набор актов одного органа (4)."},{"id":"law_tp15","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Каковы элементы структуры правовой нормы?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Элементы структуры правовой нормы:\n1) Гипотеза — условия, при которых действует норма: «если».\n2) Диспозиция — само правило поведения: «то».\n3) Санкция — предусмотренные нормой неблагоприятные последствия её нарушения: «иначе».\nПример: если водитель управляет автомобилем, оборудованным ремнями безопасности → он должен быть пристёгнут → за нарушение предусмотрен штраф.\nЭлементы одной правовой нормы могут содержаться в разных статьях и нормативных актах.","hint":"Три элемента: «если», «то», «иначе»."},{"id":"law_tp16","subject":"soc","topic":"Теория права","ege":15,"type":"match","max":2,"text":"Установите соответствие между фрагментами правовой нормы и элементами её структуры: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["если водитель управляет автомобилем, оборудованным ремнями безопасности","водитель обязан быть пристёгнут ремнём безопасности","за нарушение этого правила налагается административный штраф","при достижении гражданином восемнадцати лет","гражданин вправе участвовать в выборах"],"right":["гипотеза","диспозиция","санкция"],"answer":"12312","hint":"Гипотеза отвечает на вопрос «при каких условиях?», диспозиция — «как себя вести?», санкция — «что будет за нарушение?».","explain":"Гипотеза: условия действия нормы (А, Г). Диспозиция: само правило поведения (Б, Д). Санкция: неблагоприятные последствия нарушения (В)."},{"id":"law_tp17","subject":"soc","topic":"Теория права","type":"text","max":1,"text":"Запишите термин: элемент правовой нормы, указывающий на условия, при которых она действует.","answer":["гипотеза"],"hint":"Этот элемент начинается со слова «если».","explain":"Гипотеза."},{"id":"law_tp18","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Какие существуют виды правовых норм?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Виды правовых норм:\nПо характеру предписания:\n— Управомочивающие — предоставляют право на определённые действия. Например, право на образование.\n— Обязывающие — предписывают совершение определённых действий. Например, обязанность платить законно установленные налоги и сборы.\n— Запрещающие — устанавливают запрет на определённые действия. Например, запрет принудительного труда.\nПо юридической силе закрепляющих их актов: нормы законов и подзаконных актов.\nПо сфере действия: общие и специальные — для отдельных отношений или категорий лиц.\nПо времени действия: постоянные и временные.","hint":"Главное деление — по характеру предписания: управомочивающие, обязывающие, запрещающие."},{"id":"law_tp19","subject":"soc","topic":"Теория права","ege":15,"type":"match","max":2,"text":"Установите соответствие между положениями нормативных актов и видами правовых норм по характеру предписания: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["Никто не должен подвергаться пыткам, насилию, другому жестокому или унижающему человеческое достоинство обращению.","Каждый имеет право на образование.","Каждый обязан сохранять природу и окружающую среду.","Граждане РФ имеют право собираться мирно, без оружия.","Каждый обязан платить законно установленные налоги и сборы."],"right":["управомочивающая","обязывающая","запрещающая"],"answer":"31212","hint":"Обращайте внимание на ключевые слова: «имеет право», «обязан», «никто не должен».","explain":"Управомочивающие: право на образование (Б), право на мирные собрания (Г). Обязывающие: сохранять природу (В), платить налоги (Д). Запрещающая: запрет пыток (А)."},{"id":"law_tp20","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Что такое предмет правового регулирования?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Предмет правового регулирования — общественные отношения, регулируемые нормами права.\nНапример, имущественные отношения входят в предмет гражданского права, трудовые отношения — трудового права.","hint":"Предмет отвечает на вопрос «что регулирует отрасль?»."},{"id":"law_tp21","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Что такое метод правового регулирования? Какие методы вы знаете?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Метод правового регулирования — совокупность способов и приёмов воздействия права на общественные отношения.\n1) Императивный — властные предписания, не допускающие изменения установленных правил по соглашению участников. Характерен для уголовного и административного права.\n2) Диспозитивный — возможность юридически равноправных участников самостоятельно определять свои права и обязанности в установленных законом пределах. Характерен для гражданского права.","hint":"Метод отвечает на вопрос «как регулирует?». Два метода: императивный и диспозитивный."},{"id":"law_tp22","subject":"soc","topic":"Теория права","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и методами правового регулирования: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["стороны договора купли-продажи сами договариваются о цене товара","за совершение преступления суд назначает наказание, предусмотренное уголовным законом","наследодатель по своему усмотрению завещает имущество любым лицам","инспектор выносит обязательное для исполнения предписание об устранении нарушения","участники отношений не могут по соглашению изменить установленное законом правило"],"right":["императивный","диспозитивный"],"answer":"21211","hint":"Императивный метод — властное предписание, которое нельзя изменить по договорённости. Диспозитивный — свобода равноправных участников в рамках закона.","explain":"Диспозитивный: свободный выбор цены (А) и наследников (В). Императивный: наказание за преступление (Б), предписание инспектора (Г), правило, которое нельзя изменить соглашением (Д)."},{"id":"law_tp23","subject":"soc","topic":"Теория права","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о предмете и методах правового регулирования и запишите цифры, под которыми они указаны.","options":["Предмет правового регулирования — совокупность способов и приёмов воздействия права на общественные отношения.","Диспозитивный метод позволяет участникам самостоятельно определять свои права и обязанности в установленных законом пределах.","В трудовом праве сочетаются императивный и диспозитивный методы.","В гражданском праве императивные нормы не применяются.","Императивный метод характерен для уголовного и административного права."],"answer":"235","hint":"Не путайте предмет («что регулирует») и метод («как регулирует»). Вспомните, используются ли в гражданском праве обязательные правила.","explain":"Верны 2, 3 и 5. Способы и приёмы воздействия — это метод, а предмет — сами общественные отношения (1). В гражданском праве преобладает диспозитивный метод, но императивные нормы тоже есть (4)."},{"id":"law_tp24","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Что такое публичное право? Какие отрасли к нему относятся? Какой метод регулирования преобладает?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Публичное право — совокупность отраслей права, регулирующих отношения, связанные с осуществлением публичной власти и обеспечением общих интересов общества и государства.\nКонституционное, административное, уголовное, финансовое право, включая налоговое.\nПреобладает императивный метод.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_tp25","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Что такое частное право? Какие отрасли к нему относятся? Какой метод регулирования преобладает?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Частное право — совокупность отраслей права, регулирующих отношения юридически равноправных участников и обеспечивающих их частные интересы.\nВ учебной классификации к нему относят гражданское, семейное и трудовое право.\nХарактерен диспозитивный метод, но используются и императивные нормы. В трудовом праве особенно заметно сочетание обоих методов.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_tp26","subject":"soc","topic":"Теория права","ege":15,"type":"match","max":2,"text":"Установите соответствие между отраслями права и группами отраслей: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["конституционное право","семейное право","финансовое право","уголовное право","гражданское право"],"right":["публичное право","частное право"],"answer":"12112","hint":"Публичное право связано с осуществлением публичной власти и общими интересами, частное — с отношениями равноправных участников.","explain":"Публичное право: конституционное (А), финансовое (В), уголовное (Г). Частное право: семейное (Б), гражданское (Д)."},{"id":"law_tp27","subject":"soc","topic":"Теория права","ege":16,"type":"choice","max":2,"text":"Что из перечисленного характеризует частное право? Запишите цифры, под которыми они указаны.","options":["регулирует отношения юридически равноправных участников","обеспечивает прежде всего частные интересы","в нём преобладает императивный метод регулирования","к нему относится гражданское право","регулирует отношения, связанные с осуществлением публичной власти","к нему относится уголовное право"],"answer":"124","hint":"Сравните частное и публичное право по участникам отношений, интересам и методу.","explain":"Частное право характеризуют 1, 2 и 4. Императивный метод (3), отношения публичной власти (5) и уголовное право (6) относятся к публичному праву."},{"id":"law_tp28","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Чем материальное право отличается от процессуального?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Материальное право закрепляет права и обязанности участников общественных отношений, устанавливает запреты и основания юридической ответственности.\nГражданское, уголовное, трудовое право.\nПроцессуальное право определяет порядок применения норм материального права, рассмотрения и разрешения юридических дел.\nГражданское процессуальное, уголовно-процессуальное, арбитражное процессуальное право.","hint":"Материальное право отвечает на вопрос «какие права и обязанности?», процессуальное — «в каком порядке их защищать?»."},{"id":"law_tp29","subject":"soc","topic":"Теория права","ege":15,"type":"match","max":2,"text":"Установите соответствие между отраслями права и их видами: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["трудовое право","уголовно-процессуальное право","гражданское право","гражданское процессуальное право","уголовное право"],"right":["материальное право","процессуальное право"],"answer":"12121","hint":"Процессуальные отрасли определяют порядок рассмотрения и разрешения юридических дел.","explain":"Материальное право: трудовое (А), гражданское (В), уголовное (Д). Процессуальное: уголовно-процессуальное (Б), гражданское процессуальное (Г)."},{"id":"law_tp30","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Каковы функции права?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Функции права:\n1) Регулятивная — упорядочивает общественные отношения, устанавливает права и обязанности участников.\n2) Охранительная — защищает общественные отношения и предусматривает меры ответственности за правонарушения.\n3) Воспитательная — формирует уважение к праву и привычку к правомерному поведению.\n4) Оценочная — позволяет оценивать поведение как правомерное или противоправное.","hint":"Четыре функции: регулятивная, охранительная, воспитательная, оценочная."},{"id":"law_tp31","subject":"soc","topic":"Теория права","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и функциями права: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["установление уголовной ответственности за кражу","формирование у граждан уважения к закону и привычки к правомерному поведению","закрепление порядка заключения брака","защита права собственности мерами юридической ответственности","установление прав и обязанностей сторон трудового договора"],"right":["регулятивная","охранительная","воспитательная"],"answer":"23121","hint":"Регулятивная функция упорядочивает отношения, охранительная защищает их от нарушений, воспитательная формирует уважение к праву.","explain":"Регулятивная: порядок заключения брака (В), права и обязанности сторон трудового договора (Д). Охранительная: ответственность за кражу (А), защита собственности (Г). Воспитательная: уважение к закону (Б)."},{"id":"law_tp32","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Каковы основные принципы права?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные принципы права:\n1) Равноправие — равенство всех перед законом и судом, недопустимость дискриминации.\n2) Гуманизм — признание ценности человека, защита его прав и достоинства.\n3) Законность — соблюдение Конституции и законов всеми участниками общественных отношений.\n4) Справедливость — равная защита законных интересов, соразмерность юридической ответственности правонарушению.\n5) Единство прав и обязанностей — субъективным правам одних участников соответствуют юридические обязанности других.","hint":"Пять принципов: равноправие, гуманизм, законность, справедливость, единство прав и обязанностей."},{"id":"law_tp33","subject":"soc","topic":"Теория права","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к общим принципам права? Запишите цифры, под которыми они указаны.","options":["законность","гуманизм","справедливость","презумпция виновности","единство прав и обязанностей","обратная сила закона, ухудшающего положение лица"],"answer":"1235","hint":"Принципы права защищают человека. Вспомните, как в праве сформулированы презумпция и правило об обратной силе закона.","explain":"Принципы права — 1, 2, 3 и 5. В праве действует презумпция невиновности, а не виновности (4). Закон, ухудшающий положение лица, обратной силы не имеет (6)."},{"id":"law_tp34","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Что такое правоотношения?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Правоотношения — урегулированные нормами права общественные отношения, участники которых обладают субъективными правами и юридическими обязанностями.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_tp35","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Каков состав правоотношений?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Состав правоотношений:\n— Субъекты — участники правоотношений: физические лица, организации, государство и другие.\n— Объект — то, по поводу чего возникают правоотношения: имущество, результаты деятельности, нематериальные блага и другое.\n— Содержание — субъективные права и юридические обязанности участников.","hint":"Три элемента: субъекты, объект, содержание."},{"id":"law_tp36","subject":"soc","topic":"Теория права","ege":15,"type":"match","max":2,"text":"Установите соответствие между элементами правоотношения и их видами (гражданин Петров заключил с ООО «Ремстрой» договор подряда на ремонт своей квартиры): к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["гражданин Петров","ООО «Ремстрой»","результат работ по ремонту квартиры","право Петрова требовать выполнения работ в срок","обязанность Петрова оплатить выполненные работы"],"right":["субъект","объект","содержание"],"answer":"11233","hint":"Субъекты — участники отношения; объект — то, по поводу чего оно возникло; содержание — права и обязанности участников.","explain":"Субъекты: Петров (А) и ООО «Ремстрой» (Б). Объект: результат работ (В). Содержание: право требовать выполнения работ (Г) и обязанность оплатить их (Д)."},{"id":"law_tp37","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Что составляет содержание правоотношений?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Содержание правоотношений:\nСубъективное право — обеспеченная законом мера возможного поведения участника правоотношения.\nЮридическая обязанность — установленная законом мера должного поведения участника правоотношения.\nПример: Ирина покупает хлеб.\n— Субъекты — Ирина и организация-продавец.\n— Объект — хлеб.\n— Содержание — Ирина обязана оплатить товар и вправе получить его надлежащего качества; продавец обязан передать такой товар и вправе получить оплату.","hint":"Субъективное право — мера возможного поведения, юридическая обязанность — мера должного."},{"id":"law_tp38","subject":"soc","topic":"Теория права","type":"text","max":1,"text":"Запишите термин: установленная законом мера должного поведения участника правоотношения.","answer":["юридическая обязанность","обязанность"],"hint":"Ей противопоставляется субъективное право — мера возможного поведения.","explain":"Юридическая обязанность."},{"id":"law_tp39","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Что такое юридические факты? Каковы их виды и подвиды?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Юридические факты — жизненные обстоятельства, с которыми нормы права связывают возникновение, изменение или прекращение правоотношений.\nПо волевому признаку:\n1) Действия и бездействие — зависят от воли людей.\n— Правомерные: юридические акты — направлены на достижение юридических последствий, например заключение договора; юридические поступки — вызывают юридические последствия независимо от намерения их вызвать, например создание литературного произведения.\n— Неправомерные: преступления и проступки.\n2) События — происходят независимо от воли участников правоотношения. Например, достижение совершеннолетия или стихийное бедствие.\nПо юридическим последствиям: правообразующие, правоизменяющие и правопрекращающие.","hint":"По волевому признаку: действия (правомерные и неправомерные) и события."},{"id":"law_tp40","subject":"soc","topic":"Теория права","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и видами юридических фактов: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["наводнение уничтожило застрахованный дом","гражданин заключил договор аренды квартиры","гражданину исполнилось восемнадцать лет","сотрудник подал заявление об увольнении","водитель превысил установленную скорость"],"right":["событие","действие"],"answer":"12122","hint":"Событие происходит независимо от воли людей. Действие зависит от воли человека и может быть как правомерным, так и неправомерным.","explain":"События: наводнение (А), достижение совершеннолетия (В). Действия: заключение договора (Б), подача заявления (Г), превышение скорости (Д) — неправомерное действие."},{"id":"law_tp41","subject":"soc","topic":"Теория права","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и видами юридических фактов-действий: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["кража велосипеда","заключение договора купли-продажи","создание литературного произведения","находка потерянной вещи","составление завещания"],"right":["юридический акт","юридический поступок","правонарушение"],"answer":"31221","hint":"Юридический акт совершают, чтобы добиться юридических последствий. Юридический поступок влечёт их независимо от намерения.","explain":"Юридические акты: договор (Б), завещание (Д). Юридические поступки: создание произведения (В), находка вещи (Г). Правонарушение: кража (А)."},{"id":"law_tp42","subject":"soc","topic":"Теория права","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о правоотношениях и юридических фактах и запишите цифры, под которыми они указаны.","options":["Юридические факты — жизненные обстоятельства, с которыми нормы права связывают возникновение, изменение или прекращение правоотношений.","События происходят независимо от воли участников правоотношения.","Юридические поступки всегда совершаются с целью достичь юридических последствий.","Субъективное право — обеспеченная законом мера возможного поведения участника правоотношения.","Объектом правоотношения могут быть только вещи."],"answer":"124","hint":"Сравните юридический акт и юридический поступок. Вспомните, что ещё бывает объектом правоотношения, кроме имущества.","explain":"Верны 1, 2 и 4. Цель достичь юридических последствий отличает юридический акт, а поступок влечёт их независимо от намерения (3). Объектом могут быть также результаты деятельности и нематериальные блага (5)."},{"id":"law_tp43","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Что такое правовая культура личности? Каковы её основные элементы?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Правовая культура личности — совокупность правовых знаний, уважительного отношения к праву и навыков правомерного поведения.\nОсновные элементы:\n1) Знание и понимание права.\n2) Уважение к праву, признание его ценности.\n3) Правомерное поведение.","hint":"Четыре элемента: знание, уважение, правомерное поведение, умение защищать свои права."},{"id":"law_tp44","subject":"soc","topic":"Теория права","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к элементам правовой культуры личности? Запишите цифры, под которыми они указаны.","options":["знание и понимание права","правовой нигилизм","уважение к праву, признание его ценности","умение защищать свои права законными способами","безразличное отношение к соблюдению законов","самостоятельное наказание правонарушителя без обращения в суд"],"answer":"134","hint":"Правовая культура — противоположность правовому нигилизму, то есть отрицанию ценности права.","explain":"Элементы правовой культуры — 1, 3 и 4. Правовой нигилизм (2), безразличие к законам (5) и самосуд (6) говорят о низкой правовой культуре."},{"id":"law_tp45","subject":"soc","topic":"Теория права","type":"text","max":1,"text":"Запишите термин: совокупность правовых знаний, уважительного отношения к праву и навыков правомерного поведения.","answer":["правовая культура","правовая культура личности"],"hint":"Противоположное явление — правовой нигилизм.","explain":"Правовая культура (личности)."},{"id":"law_tp46","subject":"soc","topic":"Теория права","ege":22,"type":"open","max":4,"text":"Гражданин К. заключил с туристическим агентством договор об организации поездки на море. За день до вылета из-за урагана аэропорт закрыли, и рейс отменили.\n1) Назовите субъектов правоотношения, возникшего из договора.\n2) Что является объектом этого правоотношения?\n3) К какому виду юридических фактов относится заключение договора?\n4) К какому виду юридических фактов относится ураган?","criteria":[{"id":"K1","max":4,"text":"Правильно даны ответы на четыре вопроса — 4 балла; на 3 — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) Гражданин К. и туристическое агентство.\n2) Услуга по организации путешествия (туристская услуга).\n3) Правомерное действие — юридический акт (сделка): договор заключают, чтобы вызвать юридические последствия.\n4) Событие: ураган произошёл независимо от воли участников правоотношения.","hint":"Вспомните состав правоотношения и деление юридических фактов на действия и события."},{"id":"law_f01","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Что такое семейное право?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Семейное право — это отрасль российского права, регулирующая личные неимущественные и имущественные отношения, возникающие из брака, родства и усыновления (удочерения).","hint":"Назовите вид отрасли и три основания отношений, которые она регулирует."},{"id":"law_f02","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Что такое брак? Каков порядок заключения брака в РФ?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Брак — это 1) добровольный 2) равноправный 3) союз мужчины и женщины, 4) направленный на создание семьи, 5) зарегистрированный в установленном законом порядке и 6) порождающий взаимные права и обязанности супругов.\nПорядок заключения брака в РФ:\nЛица, вступающие в брак, подают в орган ЗАГС совместное заявление, в котором указывают желаемую дату регистрации. Эта дата не может быть назначена ранее чем через месяц и позднее чем через год со дня подачи заявления.\nОднако при наличии уважительных причин срок может быть сокращён, а при особых обстоятельствах (беременности, рождении ребёнка, непосредственной угрозе жизни одной из сторон и т. д.) брак может быть зарегистрирован в день подачи заявления\nОрган ЗАГС регистрирует брак в личном присутствии лиц, вступающих в брак, и выдаёт свидетельство о браке.\nВ РФ признаётся только брак, зарегистрированный в установленном законом порядке. Супруги могут проживать вместе и без регистрации, однако это не порождает прав и обязанностей супругов.","hint":"В определении брака шесть признаков. Порядок: заявление → срок → регистрация."},{"id":"law_f03","subject":"soc","topic":"Семейное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о заключении брака в РФ и запишите цифры, под которыми они указаны.","options":["Дата регистрации брака по общему правилу назначается не ранее чем через месяц и не позднее чем через год со дня подачи заявления.","Брак регистрируется органом ЗАГС в личном присутствии лиц, вступающих в брак.","Совместное проживание без регистрации брака порождает права и обязанности супругов.","По общему правилу брачный возраст в РФ — 18 лет.","Разрешение на вступление в брак с 16 лет при наличии уважительных причин даёт суд."],"answer":"124","hint":"Обратите внимание, кто именно разрешает снизить брачный возраст, и признаётся ли в РФ незарегистрированный союз.","explain":"Верны 1, 2 и 4. Совместное проживание без регистрации прав и обязанностей супругов не порождает (3). Разрешение на брак с 16 лет даёт орган местного самоуправления, а не суд (5)."},{"id":"law_f04","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Каковы условия заключения брака?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Условия заключения брака:\n1) Взаимное добровольное согласие лиц, вступающих в брак;\n2) Достижение брачного возраста — по общему правилу 18 лет. Однако при наличии уважительных причин орган местного самоуправления может разрешить вступление в брак с 16 лет.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_f05","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Какие обстоятельства препятствуют заключению брака?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Обстоятельства, препятствующие заключению брака:\n— Хотя бы одно из лиц уже состоит в другом зарегистрированном браке;\n— Наличие родства по прямой восходящей или нисходящей линии (родители и дети, дедушки, бабушки и внуки), а также отношений между полнородными или неполнородными братом и сестрой;\n— Наличие отношений между усыновителем и усыновлённым;\n— Хотя бы одно из лиц признано судом недееспособным вследствие психического расстройства.","hint":"Их четыре: другой брак, близкое родство, усыновление, недееспособность."},{"id":"law_f06","subject":"soc","topic":"Семейное право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного препятствует заключению брака по семейному законодательству РФ? Запишите цифры, под которыми они указаны.","options":["одно из лиц уже состоит в другом зарегистрированном браке","лица являются двоюродными братом и сестрой","лица являются усыновителем и усыновлённым","одно из лиц признано судом недееспособным вследствие психического расстройства","у одного из лиц нет постоянного места работы","лица являются неполнородными братом и сестрой"],"answer":"1346","hint":"Запрет касается родства по прямой линии и братьев-сестёр (полнородных и неполнородных). Двоюродное родство в этот перечень не входит.","explain":"Препятствуют браку 1, 3, 4 и 6. Двоюродное родство (2) и отсутствие работы (5) не входят в перечень обстоятельств, препятствующих браку."},{"id":"law_f07","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Какие личные неимущественные и какие имущественные права и обязанности приобретают супруги при вступлении в брак?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Вступление в брак порождает личные и имущественные права и обязанности.\nЛичные права и обязанности супругов:\n— Каждый супруг свободен в выборе рода занятий, профессии, места пребывания и жительства;\n— Супруги обязаны строить отношения в семье на основе взаимоуважения и взаимопомощи, содействовать благополучию и укреплению семьи, заботиться о благосостоянии и развитии своих детей;\n— Супруги по своему желанию выбирают при заключении брака фамилию одного из них в качестве общей, сохраняют свои добрачные фамилии либо присоединяют к своей фамилии фамилию другого супруга.\nИмущественные права и обязанности супругов связаны с общим и личным имуществом супругов, владением, пользованием и распоряжением им, а также с взаимным материальным содержанием супругов.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_f08","subject":"soc","topic":"Семейное право","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и видами прав и обязанностей супругов: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["выбор при заключении брака фамилии одного из супругов в качестве общей","распоряжение общим имуществом по взаимному согласию","свобода выбора места пребывания и жительства","взаимное материальное содержание супругов","свобода выбора рода занятий и профессии"],"right":["личные неимущественные","имущественные"],"answer":"12121","hint":"Имущественные связаны с имуществом и деньгами, личные — с самой личностью: фамилией, профессией, местом жительства.","explain":"Личные: фамилия (А), место пребывания и жительства (В), род занятий и профессия (Д). Имущественные: распоряжение общим имуществом (Б), взаимное содержание (Г)."},{"id":"law_f09","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"В чём суть законного и договорного режимов имущества супругов? Что такое брачный договор, что он может и не может регулировать, каков порядок его заключения?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Существуют два вида правовых режимов имущества супругов:\n1) Законный (основан на семейном законодательстве). Согласно данному режиму имущество, нажитое супругами во время брака, является их совместной собственностью независимо от того, на чьё имя оно оформлено. Супруги владеют, пользуются и распоряжаются им по взаимному согласию. При разделе такого имущества доли супругов, как правило, признаются равными\nОднако закон выделяет несколько видов имущества, относящихся к личной собственности супругов и не подлежащих разделу:\n— Имущество, принадлежавшее одному из супругов до вступления в брак. Однако оно может быть признано совместным, если во время брака были произведены вложения, значительно увеличившие его стоимость, например капитальный ремонт;\n— Имущество, полученное в дар, по наследству или по иной безвозмездной сделке;\n— Вещи индивидуального пользования (обувь, одежда и т. д.), за исключением драгоценностей и предметов роскоши;\n— Награды, единовременные денежные призы и ценные подарки, полученные одним из супругов за личные достижения в области спорта, науки, культуры или искусства;\n— Исключительное право на результат интеллектуальной деятельности, созданный одним из супругов.\n2) Договорный режим. Основан на брачном договоре.\nБрачный договор — это письменный, нотариально удостоверенный договор, регулирующий имущественные права и обязанности супругов.\nБрачный договор:\nзаключается по желанию супругов;\nможет регулировать только имущественные права и обязанности.\nБрачный договор регулирует:\n— режим совместной, долевой или раздельной собственности супругов;\n— способы участия в доходах друг друга и порядок несения семейных расходов;\n— порядок раздела имущества в случае развода.\nБрачный договор не может:\n— ограничивать правоспособность и дееспособность супругов;\n— ограничивать право супругов обращаться в суд за защитой своих прав;\n— ограничивать право нетрудоспособного нуждающегося супруга на получение алиментов;\n— регулировать права и обязанности родителей в отношении детей;\n— включать условия, которые ставят одного из супругов в крайне неблагоприятное положение или противоречат основам семейного законодательства.\nПорядок заключения и форма брачного договора:\n— Брачный договор заключается исключительно в письменной форме;\n— Брачный договор подлежит обязательному нотариальному удостоверению;\n— Брачный договор может быть заключён как после регистрации брака, так и до неё. В последнем случае он вступает в силу только после регистрации брака.","hint":"Два режима. Пять видов личного имущества. Брачный договор: форма, что может и чего не может."},{"id":"law_f10","subject":"soc","topic":"Семейное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о законном режиме имущества супругов и запишите цифры, под которыми они указаны.","options":["Имущество, нажитое во время брака, является совместной собственностью супругов независимо от того, на чьё имя оно оформлено.","При разделе общего имущества доли супругов, как правило, признаются равными.","Имущество, полученное одним из супругов во время брака по наследству, становится совместной собственностью.","Драгоценности относятся к вещам индивидуального пользования и разделу не подлежат.","Добрачное имущество может быть признано совместным, если во время брака в него были сделаны вложения, значительно увеличившие его стоимость."],"answer":"125","hint":"Вспомните пять видов личного имущества супругов и исключение для вещей индивидуального пользования.","explain":"Верны 1, 2 и 5. Наследство — личное имущество супруга (3). Драгоценности и предметы роскоши — исключение из вещей индивидуального пользования: они делятся (4)."},{"id":"law_f11","subject":"soc","topic":"Семейное право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного по общему правилу является личной собственностью одного из супругов и при разводе не делится? Запишите цифры, под которыми они указаны.","options":["квартира, купленная одним из супругов до вступления в брак","автомобиль, купленный во время брака на заработную плату мужа","дача, полученная женой по наследству во время брака","одежда и обувь мужа","ювелирные украшения, купленные во время брака","исключительное право на роман, написанный женой"],"answer":"1346","hint":"Личное имущество: добрачное, полученное безвозмездно, вещи индивидуального пользования (кроме драгоценностей), исключительное право на результат интеллектуальной деятельности, награды за личные достижения.","explain":"Личная собственность — 1, 3, 4, 6. Автомобиль, купленный в браке на зарплату (2), — совместное имущество. Драгоценности (5) не относятся к личным вещам индивидуального пользования."},{"id":"law_f12","subject":"soc","topic":"Семейное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о брачном договоре и запишите цифры, под которыми они указаны.","options":["Брачный договор заключается в письменной форме и подлежит нотариальному удостоверению.","Брачный договор может определять, с кем из родителей будут жить дети после развода.","Брачный договор, заключённый до регистрации брака, вступает в силу со дня регистрации брака.","Брачный договор может устанавливать режим раздельной собственности супругов.","Брачный договор может ограничивать право супруга обращаться в суд."],"answer":"134","hint":"Брачный договор регулирует только имущественные отношения и не может ограничивать права супругов.","explain":"Верны 1, 3 и 4. Права и обязанности родителей в отношении детей брачный договор регулировать не может (2), ограничивать право обращаться в суд — тоже (5)."},{"id":"law_f13","subject":"soc","topic":"Семейное право","ege":15,"type":"match","max":2,"text":"Установите соответствие между условиями и возможностью включить их в брачный договор: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["порядок раздела имущества в случае развода","отказ нетрудоспособного нуждающегося супруга от права на алименты","порядок несения семейных расходов","обязанность одного из супругов не обращаться в суд за защитой своих прав","порядок воспитания детей"],"right":["может быть включено в брачный договор","не может быть включено в брачный договор"],"answer":"12122","hint":"Договор может регулировать только имущественные права и обязанности и не может ущемлять права супругов или касаться детей.","explain":"Можно: раздел имущества (А), семейные расходы (В). Нельзя: ограничивать право нетрудоспособного нуждающегося супруга на алименты (Б), право на суд (Г), регулировать отношения родителей и детей (Д)."},{"id":"law_f14","subject":"soc","topic":"Семейное право","type":"text","max":1,"text":"Запишите термин: письменный нотариально удостоверенный договор, регулирующий имущественные права и обязанности супругов.","answer":["брачный договор","брачным договором"],"hint":"Он определяет договорный режим имущества супругов.","explain":"Брачный договор. Он основа договорного режима имущества супругов."},{"id":"law_f15","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"В каком порядке расторгается брак: а) через ЗАГС; б) через суд?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Расторжение брака производится:\nв ЗАГСе:\n— если оба супруга согласны и у них нет общих несовершеннолетних детей;\n— независимо от наличия общих несовершеннолетних детей, если один из супругов: признан судом недееспособным; признан судом безвестно отсутствующим; осуждён к лишению свободы на срок свыше трёх лет.\nв суде:\n— если у супругов есть общие несовершеннолетние дети. При отсутствии соглашения между родителями суд определяет, с кем будет жить ребёнок после развода, учитывая следующие обстоятельства: привязанность ребёнка к каждому из родителей; возраст ребёнка; личные качества родителей и их отношения с ребёнком; материальные и жилищные условия родителей; мнение ребёнка (с 10 лет его учёт обязателен, если это не противоречит его интересам);\n— если один из супругов не согласен с расторжением брака. В таком случае другой супруг подаёт в суд исковое заявление. Суд вправе принять меры к примирению сторон, предоставив им срок до трёх месяцев. Если это не дало результата, суд, установив, что дальнейшая совместная жизнь супругов и сохранение семьи невозможны, расторгает брак.\nФактическое прекращение брачных отношений не влечёт юридического прекращения брака. Муж не имеет права без согласия жены инициировать расторжение брака во время её беременности, а также в течение года со дня рождения ребёнка.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_f16","subject":"soc","topic":"Семейное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о расторжении брака и запишите цифры, под которыми они указаны.","options":["При взаимном согласии супругов, не имеющих общих несовершеннолетних детей, брак расторгается в органе ЗАГС.","Если у супругов есть общие несовершеннолетние дети, брак по общему правилу расторгается в суде.","Муж вправе без согласия жены инициировать расторжение брака во время её беременности.","Суд вправе дать супругам срок для примирения до трёх месяцев.","Фактическое прекращение брачных отношений означает юридическое прекращение брака."],"answer":"124","hint":"Вспомните ограничение для мужа во время беременности жены и после рождения ребёнка.","explain":"Верны 1, 2 и 4. Без согласия жены муж не может инициировать развод во время её беременности и в течение года после рождения ребёнка (3). Фактическое прекращение отношений не прекращает брак юридически (5)."},{"id":"law_f17","subject":"soc","topic":"Семейное право","ege":15,"type":"match","max":2,"text":"Установите соответствие между ситуациями и органами, в которых расторгается брак: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["супруги согласны на развод, общих несовершеннолетних детей у них нет","жена не согласна на расторжение брака","муж осуждён к лишению свободы на шесть лет, у супругов есть пятилетний сын","супруги согласны развестись, но у них двое несовершеннолетних детей","жена признана судом безвестно отсутствующей"],"right":["орган ЗАГС","суд"],"answer":"12121","hint":"В ЗАГСе — при согласии обоих и отсутствии общих детей, а также независимо от детей, если второй супруг недееспособен, безвестно отсутствует или осуждён больше чем на три года.","explain":"ЗАГС: А, В (осуждение на срок свыше трёх лет — независимо от детей), Д (безвестное отсутствие). Суд: Б (несогласие супруга), Г (есть общие несовершеннолетние дети)."},{"id":"law_f18","subject":"soc","topic":"Семейное право","type":"open","max":3,"text":"Супруги К. расторгают брак в суде и не могут договориться, с кем будет жить их одиннадцатилетняя дочь.\n1) Назовите любые три обстоятельства, которые учтёт суд, решая этот вопрос.\n2) Обязан ли суд учесть мнение девочки? Объясните почему.\n3) Назовите любые две обязанности, которые сохранятся у родителя, который будет жить отдельно.","criteria":[{"id":"K1","max":3,"text":"Правильно даны ответы на три вопроса — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) Привязанность ребёнка к каждому из родителей; возраст ребёнка; личные качества родителей и их отношения с ребёнком; материальные и жилищные условия родителей; мнение ребёнка (любые три).\n2) Да: девочке больше 10 лет, а с 10 лет учёт мнения ребёнка обязателен, если это не противоречит его интересам.\n3) Содержать ребёнка; воспитывать его, заботиться о его здоровье и нравственном развитии; обеспечить получение общего образования (любые две). Кроме того, он вправе общаться с ребёнком и участвовать в его воспитании.","hint":"Обстоятельства перечислены в ответе о расторжении брака через суд; возраст девочки важен для второго вопроса."},{"id":"law_f19","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Назовите основные права и обязанности родителей.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Права и обязанности родителей:\n— права:\n— воспитывать и обучать ребёнка;\n— выбирать образовательную организацию и форму получения ребёнком образования;\n— защищать права и интересы ребёнка и выступать его законными представителями;\n— общаться с ребёнком и участвовать в его воспитании при раздельном проживании.\nобязанности:\n— воспитывать ребёнка и заботиться о его физическом и психическом здоровье, нравственном развитии;\n— обеспечить получение ребёнком общего образования;\n— содержать ребёнка;\n— не осуществлять родительские права в ущерб интересам ребёнка.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_f20","subject":"soc","topic":"Семейное право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к обязанностям родителей? Запишите цифры, под которыми они указаны.","options":["содержать ребёнка","обеспечить получение ребёнком общего образования","выбирать образовательную организацию для ребёнка","заботиться о физическом и психическом здоровье ребёнка","распоряжаться заработком ребёнка-подростка","общаться с ребёнком при раздельном проживании"],"answer":"124","hint":"Часть пунктов — права родителей. Сравните: «обязан обеспечить» и «вправе выбрать».","explain":"Обязанности: 1, 2, 4. Выбор образовательной организации (3) и общение при раздельном проживании (6) — права родителей. Распоряжаться заработком подросток с 14 лет вправе сам (5)."},{"id":"law_f21","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Назовите основные права детей.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Права детей:\n— жить и воспитываться в семье;\n— общаться с родителями и другими родственниками;\n— защищать свои права и законные интересы;\n— выражать своё мнение;\n— иметь имя, отчество и фамилию.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_f22","subject":"soc","topic":"Семейное право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к правам ребёнка по семейному законодательству РФ? Запишите цифры, под которыми они указаны.","options":["жить и воспитываться в семье","выражать своё мнение","самостоятельно выбирать школу с 10 лет","иметь имя, отчество и фамилию","общаться с родителями и другими родственниками","распоряжаться имуществом родителей"],"answer":"1245","hint":"Права ребёнка — жить в семье, общаться с родными, защищать свои права, выражать мнение, иметь имя.","explain":"Права ребёнка: 1, 2, 4, 5. Выбор образовательной организации — право родителей (3), распоряжаться имуществом родителей ребёнок не вправе (6)."},{"id":"law_f23","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Назовите основные начала (принципы) семейного права.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные начала (принципы) семейного права:\n— добровольность брачного союза мужчины и женщины;\n— равенство прав супругов в семье;\n— разрешение внутрисемейных вопросов по взаимному согласию;\n— приоритет семейного воспитания детей, забота об их благосостоянии и развитии, приоритетная защита их прав и интересов;\n— приоритетная защита прав и интересов нетрудоспособных членов семьи\nи др.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_f24","subject":"soc","topic":"Семейное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о принципах семейного права и запишите цифры, под которыми они указаны.","options":["Брачный союз мужчины и женщины является добровольным.","Внутрисемейные вопросы разрешаются по взаимному согласию.","Права мужа в семье имеют приоритет перед правами жены.","Приоритет семейного воспитания детей — один из принципов семейного права.","Защита прав нетрудоспособных членов семьи не относится к принципам семейного права."],"answer":"124","hint":"Среди принципов — равенство прав супругов и приоритетная защита детей и нетрудоспособных.","explain":"Верны 1, 2, 4. Принцип — равенство прав супругов (3 неверно). Приоритетная защита прав нетрудоспособных членов семьи — тоже принцип (5 неверно)."},{"id":"law_u01","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Что такое уголовное право?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Уголовное право — это отрасль права, регулирующая общественные отношения, возникающие в связи с совершением преступления и назначением за него наказания. Уголовное законодательство основывается на Конституции РФ и общепризнанных принципах и нормах международного права, а его основным источником является Уголовный кодекс РФ (УК РФ).","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_u02","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Что такое преступление? Что является основанием уголовной ответственности?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основанием уголовной ответственности является совершение деяния, содержащего все признаки состава преступления, предусмотренного УК РФ.\nПреступлением признается 1) виновно совершенное 2) общественно опасное 3) деяние, 4) запрещенное Уголовным кодексом под угрозой наказания.\nИными словами, исчерпывающий перечень преступлений и наказаний за них содержится в УК РФ.","hint":"В определении преступления четыре признака."},{"id":"law_u03","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о уголовном праве и запишите цифры, под которыми они указаны.","options":["Основным источником уголовного права является Уголовный кодекс РФ.","Преступлением признаётся виновно совершённое общественно опасное деяние, запрещённое Уголовным кодексом под угрозой наказания.","Новые преступления могут устанавливаться указами Президента РФ.","Основанием уголовной ответственности является совершение деяния, содержащего все признаки состава преступления.","Уголовно-процессуальный кодекс РФ определяет, какие деяния признаются преступлениями."],"answer":"124","hint":"Исчерпывающий перечень преступлений содержится в одном законе. Не путайте УК и УПК.","explain":"Верны 1, 2, 4. Перечень преступлений исчерпывающе установлен УК РФ, а не указами (3). УПК устанавливает порядок судопроизводства, а не перечень преступлений (5)."},{"id":"law_u04","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Что такое состав преступления и из каких элементов он состоит?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Состав преступления — это совокупность элементов и признаков, необходимых для квалификации данного деяния как преступления. Выделяют 4 элемента состава преступления:\n1) Субъект. Это лицо, которое совершило преступление. Согласно УК РФ, это вменяемое физическое лицо, достигшее возраста уголовной ответственности — 16 лет. По некоторым преступлениям (например, убийство, разбой, грабеж и т. д.) возраст уголовной ответственности снижен до 14 лет. Иными словами, если лицо, совершившее преступление, не достигло указанного возраста, уголовная ответственность не наступает в связи с отсутствием одного из элементов состава преступления — субъекта.\n2) Субъективная сторона. Это внутреннее психическое отношение лица к совершаемому деянию и его последствиям. Центральной категорией субъективной стороны является вина. Вина бывает в двух формах — умысел и неосторожность. При умысле лицо осознает общественную опасность деяния, предвидит его последствия и желает их наступления либо сознательно допускает их. При неосторожности лицо предвидит возможность наступления последствий, но без достаточных оснований рассчитывает их предотвратить, либо не предвидит их, хотя должно и могло предвидеть. При отсутствии вины уголовная ответственность не наступает — это невиновное причинение вреда.\n3) Объект. Это те общественные отношения, на которые посягает преступник и которым он причиняет вред. Например, жизнь и здоровье человека, собственность, общественный порядок и т. д.\n4) Объективная сторона. Характеризует совокупность внешних проявлений преступления: общественно опасное деяние, а для преступлений с материальным составом — также общественно опасные последствия и причинно-следственную связь между ними. Например, один человек бьет другого (деяние)тот умирает (последствия)однако экспертиза установила, что умер он не от удара, а, например, из-за приступа диабета, поскольку вовремя не принял лекарство. В данном случае отсутствует причинно-следственная связь между ударом и смертью, поэтому деяние не будет квалифицировано как оконченное убийство.","hint":"Четыре элемента: субъект, субъективная сторона, объект, объективная сторона."},{"id":"law_u05","subject":"soc","topic":"Уголовное право и процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между характеристиками и элементами состава преступления: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["вина в форме умысла или неосторожности","вменяемое физическое лицо, достигшее возраста уголовной ответственности","общественные отношения, которым причиняется вред, например собственность","причинно-следственная связь между деянием и последствиями","общественно опасное деяние"],"right":["субъект","субъективная сторона","объект","объективная сторона"],"answer":"21344","hint":"Субъективная сторона — внутреннее отношение к деянию; объективная — внешние проявления преступления.","explain":"Вина — субъективная сторона (А); лицо — субъект (Б); охраняемые отношения — объект (В); причинная связь (Г) и само деяние (Д) — объективная сторона."},{"id":"law_u06","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о вине в уголовном праве и запишите цифры, под которыми они указаны.","options":["Вина бывает в двух формах — умысел и неосторожность.","При умысле лицо осознаёт общественную опасность деяния, предвидит его последствия и желает их наступления либо сознательно допускает их.","Если лицо не предвидело последствий, хотя должно было и могло их предвидеть, это неосторожность.","Невиновное причинение вреда влечёт уголовную ответственность.","Вина относится к объективной стороне состава преступления."],"answer":"123","hint":"Вина — центральная категория одного из элементов состава. Какого?","explain":"Верны 1, 2, 3. При отсутствии вины ответственность не наступает (4). Вина относится к субъективной стороне (5)."},{"id":"law_u07","subject":"soc","topic":"Уголовное право и процесс","type":"text","max":1,"text":"С какого возраста по общему правилу наступает уголовная ответственность? Запишите число.","answer":["16","шестнадцати","шестнадцать"],"hint":"По отдельным преступлениям возраст снижен, но спрашивается общее правило.","explain":"По общему правилу — с 16 лет; за отдельные преступления (убийство, разбой, грабёж и др.) — с 14 лет."},{"id":"law_u08","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Какие существуют категории преступлений в УК РФ?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Уголовный кодекс РФ признает преступлениями множество деяний. Так, выделяют преступления против личности, против военной службы, против общественной безопасности и общественного порядка, в сфере экономики, против государственной власти, против мира и безопасности человечества. Преступления, перечисленные в УК РФ, разделяются на 4 категории:\nНебольшой тяжести. Максимальное наказание не превышает 3 лет лишения свободы (например, «Коммерческий подкуп» — ч. 1 ст. 204 УК РФ; «Вандализм» — ст. 214 УК РФ);\nСредней тяжести.\nМаксимальное наказание не превышает 5 лет лишения свободы за умышленные деяния, а за неосторожные деяния составляет более 3, но не более 10 лет лишения свободы (например, «Возбуждение ненависти либо вражды, а равно унижение человеческого достоинства» — ч. 1 ст. 282 УК РФ; «Подмена ребенка» — ст. 153 УК РФ);\nТяжкие. Максимальное наказание составляет более 5, но не превышает 10 лет лишения свободы за умышленные деяния, а за неосторожные деяния — более 10, но не более 15 лет лишения свободы (например, «Мародерство» — ч. 1 ст. 356.1 УК РФ; «Незаконное изготовление оружия» — ч. 1 ст. 223 УК РФ);\nОсобо тяжкие. Это умышленные преступления, за которые предусмотрено наказание свыше 10 лет лишения свободы или более строгое наказание (например, «Убийство» — ст. 105 УК РФ; «Террористический акт» — ст. 205 УК РФ).","hint":"Четыре категории; границы для умышленных деяний — 3, 5 и 10 лет."},{"id":"law_u09","subject":"soc","topic":"Уголовное право и процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между максимальным наказанием за умышленное преступление и категорией преступления: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["лишение свободы на срок до 3 лет","лишение свободы на срок до 8 лет","лишение свободы на срок до 5 лет","лишение свободы на срок до 20 лет","пожизненное лишение свободы"],"right":["небольшой тяжести","средней тяжести","тяжкое","особо тяжкое"],"answer":"13244","hint":"Для умышленных деяний: не более 3 лет, не более 5, не более 10, свыше 10 лет или более строгое наказание.","explain":"До 3 лет — небольшой тяжести (А); до 5 — средней тяжести (В); до 8 — тяжкое, так как больше 5, но не больше 10 (Б); свыше 10 лет (Г) и пожизненное (Д) — особо тяжкие."},{"id":"law_u10","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о категориях преступлений и запишите цифры, под которыми они указаны.","options":["Особо тяжкими могут быть только умышленные преступления.","Неосторожное деяние с максимальным наказанием 12 лет лишения свободы относится к тяжким преступлениям.","Умышленное деяние с максимальным наказанием 4 года лишения свободы относится к преступлениям небольшой тяжести.","Вандализм (ст. 214 УК РФ) — пример преступления небольшой тяжести.","Убийство относится к тяжким преступлениям."],"answer":"124","hint":"Для неосторожных деяний границы другие: средней тяжести — до 10 лет, тяжкие — до 15 лет.","explain":"Верны 1, 2, 4. Умышленное деяние с максимумом 4 года — средней тяжести (3). Убийство — особо тяжкое преступление (5)."},{"id":"law_u11","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Что такое судимость? В чём отличие погашения судимости от снятия?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Судимость — это особое правовое состояние лица, которое действует со дня вступления обвинительного приговора суда в законную силу до момента погашения или снятия судимости.\nВ период судимости:\n1) совершение нового умышленного преступления лицом, имеющим судимость за ранее совершенное умышленное преступление, может быть признано рецидивом и повлечь более строгое наказание;\n2) существуют ограничения на работу по определенным профессиям и специальностям;\n3) действуют некоторые другие установленные законом ограничения.\nСудимость, как правило, не погашается одновременно с отбытием наказания, а продолжается в течение установленного законом срока. Этот срок зависит от вида наказания и категории преступления. Например, в отношении лиц, отбывших лишение свободы за преступления небольшой или средней тяжести, судимость погашается по истечении 3 лет после отбытия наказания, а за тяжкие преступления — по истечении 8 лет.\nЕсли осужденный после отбытия наказания вел себя безупречно и возместил вред, причиненный преступлением, то по его ходатайству суд может снять с него судимость до истечения срока ее погашения.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_u12","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о судимости и запишите цифры, под которыми они указаны.","options":["Судимость действует со дня вступления обвинительного приговора в законную силу до её погашения или снятия.","Судимость погашается одновременно с отбытием наказания.","За тяжкие преступления судимость погашается по истечении 8 лет после отбытия лишения свободы.","Суд может снять судимость до истечения срока её погашения по ходатайству осуждённого.","Административное наказание влечёт судимость."],"answer":"134","hint":"Судимость продолжается и после отбытия наказания. Какая ответственность её не влечёт?","explain":"Верны 1, 3, 4. Судимость, как правило, не погашается одновременно с отбытием наказания (2). Административная ответственность судимости не влечёт (5)."},{"id":"law_u13","subject":"soc","topic":"Уголовное право и процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между характеристиками и способами прекращения судимости: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["наступает по истечении установленного законом срока","происходит по решению суда по ходатайству осуждённого","возможно до истечения срока погашения","для преступлений средней тяжести наступает через 3 года после отбытия лишения свободы","требует безупречного поведения после отбытия наказания и возмещения вреда"],"right":["погашение судимости","снятие судимости"],"answer":"12212","hint":"Погашение связано со сроком, снятие — с решением суда раньше срока.","explain":"Погашение: А, Г (истечение установленного срока). Снятие: Б, В, Д — суд снимает судимость досрочно при безупречном поведении и возмещении вреда."},{"id":"law_u14","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Какие существуют виды уголовных наказаний? Назовите любые семь.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Виды уголовных наказаний:\n— штраф;\n— арест;\n— обязательные работы;\n— исправительные работы;\n— принудительные работы;\n— ограничение свободы;\n— содержание в дисциплинарной воинской части;\n— ограничение по военной службе;\n— лишение права занимать определенные должности или заниматься определенной деятельностью;\n— лишение специального, воинского или почетного звания, классного чина и государственных наград;\n— лишение свободы на определенный срок;\n— пожизненное лишение свободы;\n— смертная казнь (в УК РФ сохранилась, однако в настоящее время не назначается и не исполняется в силу решений Конституционного Суда РФ).","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_u15","subject":"soc","topic":"Уголовное право и процесс","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к видам уголовных наказаний? Запишите цифры, под которыми они указаны.","options":["исправительные работы","предупреждение","лишение специального, воинского или почётного звания","выговор","принудительные работы","дисквалификация"],"answer":"135","hint":"Предупреждение и дисквалификация — административные наказания, выговор — дисциплинарное взыскание.","explain":"Уголовные наказания: 1, 3, 5. Предупреждение (2) и дисквалификация (6) — административные наказания, выговор (4) — дисциплинарное взыскание."},{"id":"law_u16","subject":"soc","topic":"Уголовное право и процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между мерами и видами наказаний: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["содержание в дисциплинарной воинской части","административное выдворение за пределы РФ","исправительные работы","дисквалификация","ограничение свободы"],"right":["уголовное наказание","административное наказание"],"answer":"12121","hint":"Сравните перечни наказаний из УК РФ и КоАП РФ.","explain":"Уголовные: А, В, Д. Административные: Б (выдворение иностранного гражданина), Г (дисквалификация)."},{"id":"law_u17","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Что такое уголовный процесс? Чем УК РФ отличается от УПК РФ?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Уголовный процесс — это урегулированная нормами уголовно-процессуального права деятельность уполномоченных лиц и органов по расследованию преступлений и рассмотрению уголовных дел в суде. Уголовный процесс осуществляется на основе Уголовно-процессуального кодекса Российской Федерации (УПК РФ).\nНе стоит путать УК РФ и УПК РФ, хотя эти два закона тесно связаны. Первый устанавливает, какие деяния признаются преступлениями и какие наказания предусмотрены за них. УПК РФ устанавливает порядок уголовного судопроизводства: возбуждение уголовного дела, расследование, права участников процесса, порядок проведения следственных и судебных действий и т. д.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_u18","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о уголовном процессе и запишите цифры, под которыми они указаны.","options":["Уголовный процесс осуществляется на основе Уголовно-процессуального кодекса РФ.","УПК РФ устанавливает, какие деяния признаются преступлениями.","УПК РФ устанавливает порядок возбуждения уголовного дела и расследования.","Уголовный процесс — деятельность уполномоченных лиц и органов по расследованию преступлений и рассмотрению уголовных дел в суде.","Уголовный процесс регулируется Кодексом административного судопроизводства РФ."],"answer":"134","hint":"УК отвечает на вопрос «что наказуемо», УПК — «как расследуют и судят».","explain":"Верны 1, 3, 4. Перечень преступлений устанавливает УК РФ (2). КАС РФ регулирует обжалование решений органов власти (5)."},{"id":"law_u19","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Назовите участников уголовного процесса.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Участники уголовного процесса:\nСуд. Уголовное дело может рассматриваться судьей единолично, коллегией из трех судей, а в предусмотренных законом случаях — судьей с участием коллегии присяжных заседателей. Суд занимает центральное место в уголовном процессе, поскольку на него возложены важнейшие задачи:\nведет общий ход судебного процесса (предоставляет слово, следит за порядком судебного заседания и т. д.);\nпо окончании судебного разбирательства выносит приговор — судебный акт, которым подсудимый признается виновным или невиновным в совершении преступления.\n— Участники уголовного процесса со стороны обвинения:\n1) Прокурор (поддерживает государственное обвинение в суде; осуществляет надзор за процессуальной деятельностью органов дознания и предварительного следствия);\n2) Следователь (производит предварительное следствие по уголовным делам, отнесенным к его подследственности);\n3) Дознаватель (производит дознание и другие процессуальные действия в пределах своих полномочий);\n4) Потерпевший (лицо, которому преступлением причинен физический, имущественный или моральный вред);\n5) Частный обвинитель (лицо, подавшее заявление в суд по уголовному делу частного обвинения и поддерживающее обвинение в суде, например по делам об умышленном причинении легкого вреда здоровью или клевете без квалифицирующих признаков);\n6) Гражданский истец — физическое или юридическое лицо, предъявившее требование о возмещении имущественного вреда или компенсации морального вреда, причиненного преступлением.\n— Участники уголовного процесса со стороны защиты:\n1) Подозреваемый/обвиняемый/подсудимый — зачастую это одно лицо, статус которого меняется на разных стадиях уголовного процесса;\n2) Защитник. Как правило, защитником является адвокат. По решению суда наряду с адвокатом в качестве защитника может быть допущен близкий родственник обвиняемого или другое лицо, о допуске которого ходатайствует обвиняемый. Если обвиняемый является несовершеннолетним, в уголовном деле также участвует его законный представитель;\n3) Гражданский ответчик — физическое или юридическое лицо, которое в соответствии с гражданским законодательством несет ответственность за вред, причиненный преступлением.\n— Иные участники (лица, способствующие проведению разбирательства):\n1) Свидетель. Лицо, которому могут быть известны какие-либо сведения, имеющие значение для расследования и разрешения уголовного дела, и которое вызвано для дачи показаний;\n2) Переводчик. Лицо, свободно владеющее языком, знание которого необходимо для перевода в ходе уголовного судопроизводства;\n3) Понятой. Лицо, не заинтересованное в исходе уголовного дела и привлекаемое для удостоверения факта производства следственного действия, а также его хода и результатов;\n4) Специалист. Лицо, обладающее специальными знаниями и привлекаемое к участию в процессуальных действиях;\n5) Эксперт. Лицо, обладающее специальными знаниями и привлекаемое для проведения судебной экспертизы и дачи заключения.","hint":"Суд; сторона обвинения; сторона защиты; иные участники."},{"id":"law_u20","subject":"soc","topic":"Уголовное право и процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между участниками уголовного процесса и группами участников: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["следователь","гражданский ответчик","понятой","потерпевший","эксперт"],"right":["сторона обвинения","сторона защиты","иные участники"],"answer":"12313","hint":"Потерпевший — на стороне обвинения. Гражданский ответчик отвечает за вред и стоит на стороне защиты.","explain":"Обвинение: следователь (А), потерпевший (Г). Защита: гражданский ответчик (Б). Иные участники: понятой (В), эксперт (Д)."},{"id":"law_u21","subject":"soc","topic":"Уголовное право и процесс","ege":16,"type":"choice","max":2,"text":"Кто из перечисленных относится к участникам уголовного процесса со стороны защиты? Запишите цифры, под которыми они указаны.","options":["защитник","дознаватель","обвиняемый","частный обвинитель","гражданский ответчик","свидетель"],"answer":"135","hint":"Дознаватель и частный обвинитель — сторона обвинения, свидетель — иной участник.","explain":"Сторона защиты: защитник (1), обвиняемый (3), гражданский ответчик (5). Дознаватель (2) и частный обвинитель (4) — сторона обвинения; свидетель (6) — иной участник."},{"id":"law_u22","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Назовите стадии уголовного процесса.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные стадии уголовного процесса. Уголовный процесс состоит из двух основных частей:\n1) Досудебное производство;\n2) Судебное производство.\nЭти части внутри себя подразделяются на определенные стадии.\nДосудебное производство:\n1) Возбуждение уголовного дела. Уполномоченное лицо при наличии достаточных данных, указывающих на признаки преступления, принимает решение о возбуждении уголовного дела. Поводами могут послужить заявление о преступлении, явка с повинной, сообщение о совершенном или готовящемся преступлении, полученное из других источников, и т. д. Какой конкретно орган расследует дело (МВД, ФСБ и т. д.), определяется правилами подследственности;\n2) Предварительное расследование в форме предварительного следствия или дознания, в рамках которого собираются и проверяются доказательства. Форма расследования определяется не сложностью дела, а установленными законом правилами. В ходе расследования следователь или дознаватель проводит различные следственные действия: обыск, выемку, следственный эксперимент, эксгумацию и др.\nТакже в ходе процесса принимаются меры по установлению лиц, причастных к совершению преступления. Лицу или нескольким лицам может быть предъявлено обвинение, после чего они приобретают статус обвиняемых.\n\n3) По окончании предварительного расследования следователь составляет обвинительное заключение, а дознаватель — обвинительный акт или обвинительное постановление. Итоговый документ вместе с материалами дела передается прокурору. Если прокурор утвердит его, уголовное дело направляется в суд и начинается судебное производство.\nСудебное производство. В рамках судебного производства решается вопрос о виновности или невиновности лица. Судебное производство проходит следующие стадии:\n1) Подготовка к судебному заседанию. Судья изучает материалы дела, разрешает предусмотренные законом вопросы и принимает решение о назначении судебного заседания либо другое предусмотренное законом решение.\n2) Предварительное слушание. Проводится при наличии установленных законом оснований. На этом этапе решаются вопросы об исключении недопустимых доказательств, возвращении уголовного дела прокурору, приостановлении или прекращении дела и другие процессуальные вопросы.\n3) Непосредственно судебное разбирательство, состоящее из:\n— Подготовительной части судебного заседания. Судья объявляет дело к рассмотрению, устанавливает личности участников, разъясняет их права и обязанности.\n— Судебного следствия. Прокурор оглашает пр
