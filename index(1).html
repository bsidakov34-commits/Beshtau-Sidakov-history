едъявленное подсудимому обвинение. Стороны представляют свои доказательства и допрашивают свидетелей.\n— Прений сторон. Представители обвинения и защиты подводят итоги и высказывают свои аргументы относительно виновности или невиновности подсудимого.\n— Последнего слова подсудимого. Подсудимый имеет право высказать свое мнение по делу перед вынесением приговора.\n— Вынесения приговора. Суд удаляется в совещательную комнату и на основе исследованных доказательств выносит обвинительный или оправдательный приговор.\n— Обжалования в суде апелляционной инстанции. Сторона защиты или обвинения либо обе стороны могут обжаловать не вступивший в законную силу приговор в вышестоящий суд. Срок апелляционного обжалования составляет 15 суток со дня постановления приговора, а для осужденного, содержащегося под стражей, — со дня вручения ему копии приговора. Вышестоящий суд вправе оставить приговор без изменения, отменить или изменить его либо принять другое предусмотренное законом решение. Если приговор не был обжалован, он вступает в законную силу после истечения срока обжалования, а если был обжалован — в день вынесения решения судом апелляционной инстанции, если приговор не отменен.\n— Исполнения приговора. Исполнением наказаний и других предписаний приговора в пределах своей компетенции занимаются суд, ФСИН России, ФССП России и другие государственные органы.\n— После вступления приговора в законную силу он может быть пересмотрен в кассационном или надзорном порядке, а также ввиду новых или вновь открывшихся обстоятельств. Если вышестоящий суд установит существенные нарушения закона, судебное решение может быть изменено или отменено, а дело — направлено на новое рассмотрение.","hint":"Две части: досудебное и судебное производство, внутри — стадии."},{"id":"law_u23","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о стадиях уголовного процесса и запишите цифры, под которыми они указаны.","options":["Уголовный процесс включает досудебное и судебное производство.","Предварительное расследование проводится в форме предварительного следствия или дознания.","По окончании предварительного следствия следователь составляет обвинительное заключение.","Приговор по уголовному делу выносит прокурор.","Срок апелляционного обжалования приговора составляет один месяц."],"answer":"123","hint":"Кто выносит приговор? Каков срок апелляционного обжалования в уголовном процессе?","explain":"Верны 1, 2, 3. Приговор выносит суд (4). Срок апелляционного обжалования приговора — 15 суток (5); один месяц — срок в гражданском процессе."},{"id":"law_u24","subject":"soc","topic":"Уголовное право и процесс","type":"order","max":1,"text":"Расположите этапы судебного разбирательства по уголовному делу в правильной последовательности.","options":["прения сторон","вынесение приговора","судебное следствие","последнее слово подсудимого"],"answer":"3142","hint":"Сначала исследуют доказательства, затем стороны подводят итоги, затем говорит подсудимый.","explain":"Судебное следствие → прения сторон → последнее слово подсудимого → вынесение приговора."},{"id":"law_u25","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Что такое меры пресечения и какие они бывают? Что такое иные меры процессуального принуждения и какие они бывают?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"К подозреваемому или обвиняемому могут быть применены меры пресечения — меры процессуального принуждения, применяемые, чтобы лицо не скрылось от дознания, следствия или суда, не продолжило преступную деятельность, не угрожало участникам процесса, не уничтожило доказательства и не воспрепятствовало производству по делу иным способом.\nВыделяют следующие меры пресечения:\n— подписка о невыезде;\n— личное поручительство;\n— наблюдение командования воинской части;\n— присмотр за несовершеннолетним обвиняемым;\n— запрет определенных действий;\n— залог;\n— домашний арест;\n— заключение под стражу.\nТакже в ходе производства могут быть применены иные меры процессуального принуждения. Они применяются для обеспечения установленного порядка уголовного судопроизводства и надлежащего исполнения приговора. В зависимости от вида меры они могут применяться к подозреваемому, обвиняемому, потерпевшему, свидетелю, гражданскому истцу, гражданскому ответчику, эксперту, специалисту, переводчику или понятому:\n— обязательство о явке;\n— привод;\n— временное отстранение от должности;\n— наложение ареста на имущество;\n— приостановление операций с денежными средствами, электронными денежными средствами и денежными средствами, внесенными в качестве аванса за услуги связи;\n— денежное взыскание.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_u26","subject":"soc","topic":"Уголовное право и процесс","ege":16,"type":"choice","max":2,"text":"Что из перечисленного является мерой пресечения? Запишите цифры, под которыми они указаны.","options":["подписка о невыезде","привод","домашний арест","залог","обязательство о явке","административный арест"],"answer":"134","hint":"Привод и обязательство о явке — иные меры процессуального принуждения; административный арест — наказание по КоАП.","explain":"Меры пресечения: 1, 3, 4. Привод (2) и обязательство о явке (5) — иные меры процессуального принуждения, административный арест (6) — административное наказание."},{"id":"law_u27","subject":"soc","topic":"Уголовное право и процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и мерами процессуального принуждения: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["личное поручительство","временное отстранение от должности","заключение под стражу","наложение ареста на имущество","денежное взыскание"],"right":["мера пресечения","иная мера процессуального принуждения"],"answer":"12122","hint":"Меры пресечения применяются к подозреваемому или обвиняемому, чтобы он не скрылся и не мешал делу. Их восемь.","explain":"Меры пресечения: личное поручительство (А), заключение под стражу (В). Иные меры: отстранение от должности (Б), арест имущества (Г), денежное взыскание (Д)."},{"id":"law_u28","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Назовите основные принципы уголовного процесса.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные принципы уголовного процесса:\n— Принцип законности. Действия суда и других участников процесса должны осуществляться на всех стадиях процесса в строгом соответствии с законом. Данный принцип необходим для предотвращения произвола, а также обеспечения прав и свобод человека;\n— Презумпция невиновности. Данный принцип является одним из базовых и закреплен в законодательстве. Его положения:\nОбвиняемый считается невиновным, пока его виновность в совершении преступления не будет доказана в предусмотренном законом порядке и установлена вступившим в законную силу приговором суда;\nПодозреваемый или обвиняемый не обязан доказывать свою невиновность. Бремя доказывания обвинения и опровержения доводов, приводимых в защиту подозреваемого или обвиняемого, лежит на стороне обвинения;\nВсе сомнения в виновности обвиняемого, которые не могут быть устранены в установленном законом порядке, толкуются в его пользу. Обвинительный приговор не может быть основан на предположениях;\n— Состязательность сторон. Уголовный процесс строится на разграничении функций обвинения, защиты и разрешения уголовного дела. Стороны обвинения и защиты равноправны перед судом;\n— Принцип осуществления правосудия только судом. Признать лицо виновным в совершении преступления и назначить ему уголовное наказание может только суд;\n— Принцип обеспечения права на защиту. Подозреваемый и обвиняемый имеют право защищаться лично и пользоваться помощью защитника. В предусмотренных законом случаях участие защитника обеспечивается государством;\n— Принцип гласности. Судебное разбирательство является открытым для посторонних лиц, за исключением случаев, предусмотренных законом, например при рассмотрении дел, связанных с государственной тайной;\n— Принцип свободы оценки доказательств. Никакие доказательства не имеют заранее установленной силы. Суд, прокурор, следователь и дознаватель оценивают их по своему внутреннему убеждению, основанному на совокупности доказательств, руководствуясь законом и совестью;\n— Принцип неприкосновенности личности. Никто не может быть задержан по подозрению в совершении преступления или заключен под стражу без предусмотренных законом оснований.\nДоказательства также должны отвечать требованиям относимости и допустимости: иметь отношение к уголовному делу и быть получены с соблюдением требований закона.","hint":"Законность, презумпция невиновности, состязательность, правосудие только судом, право на защиту, гласность, свобода оценки доказательств, неприкосновенность личности."},{"id":"law_u29","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о презумпции невиновности и запишите цифры, под которыми они указаны.","options":["Обвиняемый считается невиновным, пока его виновность не доказана в установленном порядке и не установлена вступившим в силу приговором суда.","Обвиняемый обязан доказать свою невиновность.","Неустранимые сомнения в виновности обвиняемого толкуются в его пользу.","Обвинительный приговор может быть основан на предположениях, если они правдоподобны.","Бремя доказывания обвинения лежит на стороне обвинения."],"answer":"135","hint":"Кто должен доказывать вину? Можно ли осудить на основании предположений?","explain":"Верны 1, 3, 5. Обвиняемый не обязан доказывать невиновность (2), обвинительный приговор не может основываться на предположениях (4). По данным ФИПИ, этот принцип — частая ошибка выпускников."},{"id":"law_u30","subject":"soc","topic":"Уголовное право и процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между положениями и принципами уголовного процесса: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["признать лицо виновным и назначить наказание может только суд","судебное разбирательство открыто для посторонних лиц, кроме случаев, предусмотренных законом","функции обвинения, защиты и разрешения дела разграничены","стороны обвинения и защиты равноправны перед судом","дела, связанные с государственной тайной, рассматриваются в закрытом заседании как исключение"],"right":["состязательность сторон","гласность","осуществление правосудия только судом"],"answer":"32112","hint":"Состязательность — про стороны и их равенство, гласность — про открытость заседаний.","explain":"Только суд: А. Гласность: Б и Д (исключение из правила открытости). Состязательность: В, Г."},{"id":"law_u31","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Каковы особенности уголовной ответственности несовершеннолетних?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Уголовная ответственность несовершеннолетних применяется к лицам, которым во время совершения преступления исполнилось 14, но не исполнилось 18 лет, при этом по общему правилу ответственность наступает с 16 лет, а за отдельные преступления — с 14 лет. При назначении наказания суд учитывает условия жизни и воспитания несовершеннолетнего, уровень его психического развития, особенности личности и влияние старших. Несовершеннолетний, совершивший преступление небольшой или средней тяжести, может быть освобожден от уголовной ответственности с применением принудительных мер воспитательного воздействия. К несовершеннолетним не применяются пожизненное лишение свободы и смертная казнь, максимальный срок лишения свободы составляет 10 лет, а наказание отбывается в воспитательной колонии.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_u32","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о уголовной ответственности несовершеннолетних и запишите цифры, под которыми они указаны.","options":["Несовершеннолетними признаются лица, которым на момент преступления исполнилось 14, но не исполнилось 18 лет.","К несовершеннолетнему может быть применено пожизненное лишение свободы.","Максимальный срок лишения свободы для несовершеннолетних — 10 лет.","Несовершеннолетние отбывают лишение свободы в воспитательной колонии.","Несовершеннолетний, совершивший тяжкое преступление, может быть освобождён от уголовной ответственности с применением принудительных мер воспитательного воздействия."],"answer":"134","hint":"Освобождение с мерами воспитательного воздействия возможно не по всем категориям преступлений.","explain":"Верны 1, 3, 4. Пожизненное лишение свободы к несовершеннолетним не применяется (2). Освобождение с принудительными мерами воспитательного воздействия возможно за преступления небольшой или средней тяжести, а не за тяжкие (5)."},{"id":"law_u33","subject":"soc","topic":"Уголовное право и процесс","ege":22,"type":"open","max":4,"text":"Пятнадцатилетний Кирилл совершил грабёж.\n1) Может ли Кирилл быть привлечён к уголовной ответственности? Объясните почему.\n2) Назовите любые два обстоятельства, которые суд учтёт при назначении ему наказания.\n3) Где Кирилл будет отбывать наказание, если суд назначит лишение свободы?\n4) Назовите любой вид наказания, который к нему не может быть применён.","criteria":[{"id":"K1","max":4,"text":"Правильно даны ответы на четыре вопроса — 4 балла; на 3 — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) Да: за грабёж уголовная ответственность наступает с 14 лет.\n2) Условия жизни и воспитания, уровень психического развития, особенности личности, влияние старших (любые два).\n3) В воспитательной колонии.\n4) Пожизненное лишение свободы или смертная казнь.","hint":"Вспомните, по каким преступлениям возраст ответственности снижен до 14 лет, и особенности ответственности несовершеннолетних."},{"id":"law_a01","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Что такое административное право? Назовите некоторые вопросы, которые оно регулирует.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Административное право — это отрасль российского права, регулирующая общественные отношения в сфере государственного управления.\nИными словами, административное право регулирует деятельность органов государственной власти в процессе реализации ими своих полномочий, а также порядок предоставления ими различных государственных услуг населению. В связи с тем, что государственных органов как и вопросов которыми они занимаются очень много (на федеральном, региональном и местном уровне), административное право состоит из большого количества законов, постановлений, приказов, распоряжений и тд. И эти акты и образуют административное право.\nВот лишь некоторые вопросы, регулируемые административным правом:\n— Полномочия и компетенция министерств, ведомств, агентств, служб и тд. (Министерства здравоохранения, торговли, культуры, сельского хозяйства и других министерств, ГИБДД, Федральной налоговой службы, Росреестра и многих других);\n— Проведение проверок и инспекций. Государственные органы осуществляют проверки на предмет соблюдения закона организациями и индивидуальными предпринимателями;\n— Регистрация актов гражданского состояния. Рождение, брак, смерть, и другие акты гражданского состояния регистрируются государственными органами;\n— Оформление и выдача документов. Паспорта, заграничные паспорта, водительские удостоверения и другие документы.\n— Регулирование миграционных процессов. Вопросы, связанные с выдачей виз, видов на жительство, разрешений на работу и др;\n— Рассмотрение жалоб на действия государственных органов. Граждане могут подавать жалобы на действия или бездействие государственных органов в рамках процедуры, также регулируемых административным правом;\n— Организация и проведение выборов. Процедуры проведения выборов и референдумов на всех уровнях.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a02","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Как соотносятся государство и другие участники административных правоотношений?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Так как одной из сторон административно-правовых отношений является государство, в таких отношениях воля одной стороны (наделенной властными полномочиями) главенствует над волей другой стороны. Однако, все стороны административных отношений выполняют свои действия в строгом соответствии с законом и равны перед законом.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a03","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Что такое административная юрисдикция?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Органы государственной власти, в процессе реализации своих полномочий также осуществляют административную юрисдикцию.\nАдминистративная юрисдикция — это деятельность органов государственной власти по выявлению административных правонарушений, административному расследованию, а также привлечению к административной ответственности в установленном законом порядке.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a04","subject":"soc","topic":"Административное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о административном праве и запишите цифры, под которыми они указаны.","options":["Административное право регулирует общественные отношения в сфере государственного управления.","Административное право регулирует выдачу паспортов и водительских удостоверений.","В административных правоотношениях стороны равноправны, ни одна не обладает властными полномочиями.","Административная юрисдикция — деятельность органов власти по выявлению административных правонарушений, административному расследованию и привлечению к ответственности.","Административное право состоит из одного кодекса."],"answer":"124","hint":"В административных отношениях одна сторона — государство с властными полномочиями.","explain":"Верны 1, 2, 4. В административных отношениях воля стороны, наделённой властными полномочиями, главенствует (3). Административное право состоит из большого количества законов и других актов (5)."},{"id":"law_a05","subject":"soc","topic":"Административное право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного регулируется административным правом? Запишите цифры, под которыми они указаны.","options":["регистрация актов гражданского состояния","выдача разрешений на работу иностранным гражданам","заключение брачного договора","проведение государственными органами проверок организаций","наследование по завещанию","назначение уголовного наказания"],"answer":"124","hint":"Административное право — это деятельность органов власти и услуги, которые они оказывают населению.","explain":"Административное право: 1, 2, 4. Брачный договор (3) — семейное право, наследование (5) — гражданское, уголовное наказание (6) — уголовное право."},{"id":"law_a06","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Что такое административное правонарушение (административный проступок)?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"К административной ответственности лицо привлекается за совершение административных правонарушений.\nАдминистративное правонарушение (административный проступок) — признаётся противоправное, виновное действие (бездействие) физического или юридического лица, за которое законодательством установлена административная ответственность.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a07","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Каким законом регулируется порядок привлечения к административной ответственности?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Перечень деяний, за которые лицо привлекается к административной ответственности, а также порядок привлечения к административной ответственности регулируется Кодексом Российской Федерации об административных правонарушениях (КоАП РФ).\nСубъекты Российской Федерации на своих территориях также могут дополнительно принимать законы, устанавливающие за определенные деяния административную ответственность.\nТаким образом, те деяния, которые несут большую общественную опасность включены в Уголовный кодекс РФ, несущие меньшую опасность-в КоАП РФ.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a08","subject":"soc","topic":"Административное право","type":"text","max":1,"text":"Каким кодексом установлены перечень административных правонарушений и порядок привлечения к административной ответственности? Запишите сокращённое название.","answer":["КоАП","КоАП РФ","Кодекс об административных правонарушениях","Кодекс Российской Федерации об административных правонарушениях"],"hint":"Кодекс Российской Федерации об административных правонарушениях.","explain":"КоАП РФ. Субъекты РФ также могут принимать законы об административной ответственности."},{"id":"law_a09","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Что такое административная ответственность?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Административная ответственность — вид юридической ответственности, наступающей за совершение административного правонарушения.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a10","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Каковы особенности административной ответственности?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Административная ответственность имеет много схожего с уголовной ответственностью, но имеет и большие отличия.\nОсобенности административной ответственности:\n1) Основанием для её возникновения является совершение административного правонарушения (в отличие от уголовной ответственности, наступающей за преступления);\n2) к субъектам, совершившим административные правонарушения, применяются менее суровые взыскания, чем к субъектам, совершившим преступления;\n3) административная ответственность, в отличие от уголовной, не влечет состояние судимости;\n4) в отличие от уголовной ответственности, к которой привлекает только суд, правом привлекать к административной ответственности наделен ряд государственных органов в рамках своей компетенции. Например:\n— судьи (например, ст.18.12 «Нарушение беженцем или вынужденным переселенцем правил пребывания (проживания) в Российской Федерации»)\n— комиссии по делам несовершеннолетних и защите их прав (например, ст. 5.35 «Неисполнение родителями или иными законными представителями несовершеннолетних обязанностей по содержанию и воспитанию несовершеннолетних»)\n— таможенные органы (например, 16.2 «Недекларирование либо недостоверное декларирование товаров»)\n— налоговые органы (например, ст. 15.1 «Нарушение порядка работы с денежной наличностью и порядка ведения кассовых операций, а также нарушение требований об использовании специальных банковских счетов»)\n— пограничные органы (например, ст. 18.2. «Нарушение пограничного режима в пограничной зоне»);\n— и многие другие государственные органы (наделенных таким правом более 70 на федеральном уровне).\n5) к административной ответственности могут привлекаться не только физические (граждане РФ, иностранцы) лица (с 16-летнего возраста), но и юридические лица (организации). К уголовной же ответственности привлекаются только физические лица.\nПример нормы КоАП: «ст. 14.1.2 «Осуществление предпринимательской деятельности в области транспорта без лицензии влечет наложение административного штрафа на граждан и должностных лиц в размере пятидесяти тысяч рублей; на индивидуальных предпринимателей - ста тысяч рублей; на юридических лиц - четырехсот тысяч рублей»;\n6) Порядок привлечения к административной ответственности схож с уголовным процессом-имеются стадии возбуждения дела, административного расследования, вынесения постановления и тд). Однако, все происходит более оперативно и экономично, чем в уголовном процессе. А в некоторых делах административное расследование и вовсе может не проводиться.","hint":"Сравните с уголовной: основание, суровость, судимость, кто привлекает, субъекты, порядок."},{"id":"law_a11","subject":"soc","topic":"Административное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о административной ответственности и запишите цифры, под которыми они указаны.","options":["Административная ответственность наступает за совершение административного правонарушения.","Административная ответственность влечёт состояние судимости.","К административной ответственности могут привлекаться юридические лица.","Привлекать к административной ответственности вправе только суд.","Порядок привлечения к административной ответственности установлен КоАП РФ."],"answer":"135","hint":"Сравните административную ответственность с уголовной: кто привлекает и есть ли судимость.","explain":"Верны 1, 3, 5. Административная ответственность не влечёт судимости (2). Привлекать к ней вправе не только суд, но и многие органы: налоговые, таможенные, комиссии по делам несовершеннолетних и др. (4)."},{"id":"law_a12","subject":"soc","topic":"Административное право","ege":15,"type":"match","max":2,"text":"Установите соответствие между признаками и видами юридической ответственности: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["наступает за проступок, предусмотренный КоАП РФ","к ней привлекаются только физические лица","влечёт состояние судимости","к ней вправе привлекать налоговые и таможенные органы","по общему правилу наступает с 16 лет, а за отдельные деяния — с 14 лет"],"right":["административная","уголовная"],"answer":"12212","hint":"Юридические лица несут только административную ответственность. Возраст 14 лет — особенность уголовной.","explain":"Административная: А, Г. Уголовная: Б (только физические лица), В (судимость), Д (снижение возраста до 14 лет по отдельным преступлениям)."},{"id":"law_a13","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Назовите стадии дела об административном правонарушении.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Стадии дела об административном правонарушении:\n1) Возбуждение дела об административном правонарушении. Начинается с составления протокола об административном правонарушении или принятия постановления о возбуждении дела. Протокол составляется уполномоченным должностным лицом или органом. В нем указываются обстоятельства нарушения, данные о правонарушителе и свидетелях;\n2) Рассмотрение дела об административном правонарушении. Дело рассматривается органом или должностным лицом, уполномоченным на это. В процессе рассмотрения дела выясняются все обстоятельства правонарушения, заслушиваются объяснения лица, в отношении которого ведется дело, а также свидетелей. Должностное лицо вправе запросить дополнительные доказательства, если это необходимо;\n3) Принятие постановления (решения) по делу. По итогам рассмотрения дела принимается постановление о назначении административного наказания или о прекращении производства по делу, если отсутствует состав правонарушения;\n4) Обжалование постановления. Лицо, в отношении которого вынесено постановление, а также потерпевший имеют право обжаловать его в вышестоящем органе или суде. Жалоба подается в течение 10 дней со дня вынесения постановления;\n5) Исполнение постановления. Постановление вступает в законную силу после истечения срока на обжалование или после рассмотрения жалобы.\nЕсли назначено наказание (например, штраф), оно подлежит исполнению в установленном порядке.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a14","subject":"soc","topic":"Административное право","type":"order","max":1,"text":"Расположите стадии производства по делу об административном правонарушении в правильной последовательности.","options":["рассмотрение дела","исполнение постановления","возбуждение дела","принятие постановления по делу","обжалование постановления"],"answer":"31452","hint":"Дело начинается с протокола, а исполняется постановление после вступления в силу.","explain":"Возбуждение дела → рассмотрение → принятие постановления → обжалование → исполнение."},{"id":"law_a15","subject":"soc","topic":"Административное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о производстве по делу об административном правонарушении и запишите цифры, под которыми они указаны.","options":["Дело может быть возбуждено составлением протокола об административном правонарушении.","Жалоба на постановление по общему правилу подаётся в течение 10 дней со дня его вынесения.","Постановление вступает в законную силу сразу после вынесения независимо от обжалования.","При отсутствии состава правонарушения производство по делу прекращается.","Обжаловать постановление может только прокурор."],"answer":"124","hint":"Когда вступает в силу постановление и кто вправе его обжаловать?","explain":"Верны 1, 2, 4. Постановление вступает в силу после истечения срока обжалования или рассмотрения жалобы (3). Обжаловать его вправе лицо, в отношении которого оно вынесено, и потерпевший (5)."},{"id":"law_a16","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Назовите виды административных наказаний.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Виды административных наказаний:\n— ︎ Предупреждение.\n— ︎ Административный штраф.\n— ︎ Конфискация орудия совершения или предмета административного правонарушения.\n— ︎ Лишение специального права, предоставленного физическому лицу.\n— ︎ Административный арест.\n— ︎ Административное выдворение за пределы Российской Федерации иностранного гражданина или лица без гражданства.\n— ︎ Дисквалификация.\n— ︎ Административное приостановление деятельности.\n— ︎ Обязательные работы.\n— ︎ Административный запрет на посещение мест проведения официальных спортивных соревнований в дни их проведения.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a17","subject":"soc","topic":"Административное право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к административным наказаниям? Запишите цифры, под которыми они указаны.","options":["предупреждение","замечание","дисквалификация","исправительные работы","административное приостановление деятельности","ограничение свободы"],"answer":"135","hint":"Замечание — дисциплинарное взыскание; исправительные работы и ограничение свободы — уголовные наказания.","explain":"Административные наказания: 1, 3, 5. Замечание (2) — дисциплинарное взыскание, исправительные работы (4) и ограничение свободы (6) — уголовные наказания."},{"id":"law_a18","subject":"soc","topic":"Административное право","ege":15,"type":"match","max":2,"text":"Установите соответствие между мерами и видами юридической ответственности: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["выговор","лишение специального права, предоставленного физическому лицу","пожизненное лишение свободы","административный запрет на посещение мест проведения официальных спортивных соревнований","замечание"],"right":["административное наказание","уголовное наказание","дисциплинарное взыскание"],"answer":"31213","hint":"Замечание и выговор — взыскания работодателя. Лишение специального права (например, водительских прав) есть в КоАП.","explain":"Дисциплинарные: выговор (А), замечание (Д). Административные: лишение специального права (Б), запрет на посещение соревнований (Г). Уголовное: пожизненное лишение свободы (В)."},{"id":"law_a19","subject":"soc","topic":"Административное право","ege":22,"type":"open","max":4,"text":"Инспектор ГИБДД остановил гражданина Н., превысившего скорость, составил протокол и вынес постановление о штрафе.\n1) Какой вид юридической ответственности применён к Н.?\n2) Каким кодексом регулируется привлечение к этой ответственности?\n3) В течение какого срока Н. может обжаловать постановление?\n4) Повлечёт ли это наказание судимость? Объясните почему.","criteria":[{"id":"K1","max":4,"text":"Правильно даны ответы на четыре вопроса — 4 балла; на 3 — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) Административная ответственность (административный штраф).\n2) Кодекс РФ об административных правонарушениях (КоАП РФ).\n3) В течение 10 дней со дня вынесения постановления.\n4) Нет: административная ответственность, в отличие от уголовной, не влечёт состояния судимости.","hint":"Штраф за нарушение правил дорожного движения назначает не суд, а уполномоченный орган. Вспомните особенности административной ответственности."},{"id":"law_g01","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое гражданское право?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Гражданское право — отрасль права, регулирующая личные неимущественные и имущественные отношения, основанные на равенстве, автономии воли и имущественной самостоятельности участников.\nПримеры: купля-продажа, оказание услуг, аренда, наследование, создание юридических лиц.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g02","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Назовите субъектов гражданского права.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Физические лица — люди.\n2) Юридические лица — организации.\n3) Публично-правовые образования — РФ, субъекты РФ и муниципальные образования.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g03","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о гражданском праве и запишите цифры, под которыми они указаны.","options":["Гражданское право регулирует имущественные и личные неимущественные отношения.","Отношения, регулируемые гражданским правом, основаны на равенстве, автономии воли и имущественной самостоятельности участников.","Субъектами гражданского права являются только физические лица.","Российская Федерация, её субъекты и муниципальные образования могут быть субъектами гражданского права.","В гражданских правоотношениях одна сторона находится во властном подчинении у другой."],"answer":"124","hint":"Субъектов гражданского права три вида. Подчинение характерно для административного права.","explain":"Верны 1, 2, 4. Субъекты — физические лица, юридические лица и публично-правовые образования (3). Властного подчинения в гражданском праве нет: принцип равенства участников (5)."},{"id":"law_g04","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое правоспособность и дееспособность?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Правосубъектность физического лица включает правоспособность и дееспособность.\nПРАВОСПОСОБНОСТЬ — способность ИМЕТЬ гражданские права и нести обязанности. Возникает с рождения и прекращается со смертью.\nГраждане могут иметь имущество в собственности, совершать законные сделки, участвовать в обязательствах, выбирать место жительства, иметь авторские и другие имущественные и личные неимущественные права.\nДо совершеннолетия часть сделок совершается самостоятельно, остальные — с участием законных представителей.\nПример: Николай дарит квартиру пятилетнему Петру. Собственником станет Пётр, но договор подпишет его родитель.\nДЕЕСПОСОБНОСТЬ — способность СВОИМИ ДЕЙСТВИЯМИ приобретать и осуществлять гражданские права, создавать для себя обязанности и исполнять их. По общему правилу полностью наступает в 18 лет.\nС 18 лет Пётр будет самостоятельно подписывать договоры.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g05","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между характеристиками и понятиями: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["возникает с рождения","по общему правилу в полном объёме наступает с 18 лет","способность своими действиями приобретать и осуществлять права, создавать для себя обязанности и исполнять их","способность иметь гражданские права и нести обязанности","прекращается со смертью"],"right":["правоспособность","дееспособность"],"answer":"12211","hint":"Правоспособность — «иметь права», дееспособность — «своими действиями».","explain":"Правоспособность: А, Г, Д. Дееспособность: Б, В."},{"id":"law_g06","subject":"soc","topic":"Гражданское право","type":"text","max":1,"text":"Запишите термин: способность гражданина иметь гражданские права и нести обязанности, возникающая с рождения.","answer":["правоспособность","гражданская правоспособность"],"hint":"Не путайте с дееспособностью — способностью действовать самостоятельно.","explain":"Правоспособность: возникает с рождения и прекращается со смертью."},{"id":"law_g07","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Какова дееспособность несовершеннолетних от 6 до 14 лет и от 14 до 18 лет?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Дееспособность формируется постепенно: с 6 лет появляется определённый объём, с 14 — расширяется, с 18 по общему правилу становится полной.\nОт 6 до 14 лет можно самостоятельно:\n1) Совершать мелкие бытовые сделки: например, покупать недорогие товары или оплачивать недорогую доставку еды.\n2) Безвозмездно получать выгоду по сделкам, не требующим нотариального удостоверения или государственной регистрации.\nШестилетний Пётр может сам принять в подарок компьютер. При дарении квартиры нотариально удостоверяемый договор подписывают родители, а собственником становится Пётр.\n3) Распоряжаться средствами, предоставленными законными представителями либо другими лицами с их согласия для определённой цели или свободного распоряжения. Например, карманными деньгами.\nОт 14 до 18 лет можно самостоятельно:\n1) Распоряжаться заработком, стипендией и другими доходами.\n2) Осуществлять права автора произведений науки, литературы, искусства и других охраняемых результатов интеллектуальной деятельности.\n3) Вносить вклады в кредитные организации и распоряжаться ими по закону. Для открытия банковского счёта нужно согласие законных представителей, если полная дееспособность ещё не приобретена.\n— Сохраняются возможности, предусмотренные для возраста 6–14 лет. Другие сделки по общему правилу совершаются с письменного согласия законных представителей.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g08","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между действиями несовершеннолетних и возрастом, с которого их можно совершать самостоятельно: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["совершать мелкие бытовые сделки","распоряжаться своим заработком и стипендией","вносить вклады в кредитные организации","распоряжаться карманными деньгами, предоставленными родителями","осуществлять права автора произведения"],"right":["с 6 лет","только с 14 лет"],"answer":"12212","hint":"С 6 лет — мелкие бытовые сделки, безвозмездная выгода и карманные деньги. С 14 — заработок, авторские права, вклады.","explain":"С 6 лет: А, Г. Только с 14 лет: Б, В, Д."},{"id":"law_g09","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о дееспособности несовершеннолетних и запишите цифры, под которыми они указаны.","options":["С 6 лет ребёнок вправе самостоятельно безвозмездно получать выгоду по сделкам, не требующим нотариального удостоверения или государственной регистрации.","Договор дарения квартиры шестилетнему ребёнку подписывают родители, а собственником становится ребёнок.","Четырнадцатилетний подросток может самостоятельно продать принадлежащую ему квартиру.","Несовершеннолетний от 14 до 18 лет совершает большинство других сделок с письменного согласия законных представителей.","Для открытия банковского счёта несовершеннолетнему 15 лет согласие законных представителей не нужно."],"answer":"124","hint":"Что можно сделать в 14–18 лет самостоятельно, а что — только с согласия родителей?","explain":"Верны 1, 2, 4. Продажа квартиры не входит в перечень самостоятельных сделок, нужно согласие законных представителей (3). Для открытия счёта до полной дееспособности нужно согласие законных представителей (5)."},{"id":"law_g10","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое эмансипация?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Эмансипация — объявление несовершеннолетнего от 16 до 18 лет полностью дееспособным (ст. 27 ГК РФ).\nРешение принимает орган опеки и попечительства с согласия обоих родителей, усыновителей или попечителя, а при отсутствии согласия — суд.\nПолная дееспособность до 18 лет может приобретаться:\n— При вступлении в брак в предусмотренных законом случаях — это самостоятельное основание.\n— Через эмансипацию при работе по трудовому договору.\n— Через эмансипацию при предпринимательской деятельности с согласия родителей, усыновителей или попечителя.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g11","subject":"soc","topic":"Гражданское право","ege":16,"type":"choice","max":2,"text":"В каких случаях несовершеннолетний может приобрести полную дееспособность до 18 лет? Запишите цифры, под которыми они указаны.","options":["при вступлении в брак в предусмотренных законом случаях","при эмансипации, если он работает по трудовому договору","при получении паспорта в 14 лет","при эмансипации, если он с согласия родителей занимается предпринимательской деятельностью","при поступлении в колледж","автоматически при достижении 16 лет"],"answer":"124","hint":"Эмансипация возможна только при работе по трудовому договору или занятии предпринимательством. Брак — отдельное основание.","explain":"Верно: 1, 2, 4. Паспорт (3), учёба (5) и сам по себе возраст 16 лет (6) полной дееспособности не дают."},{"id":"law_g12","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о эмансипации и запишите цифры, под которыми они указаны.","options":["Эмансипация — объявление несовершеннолетнего, достигшего 16 лет, полностью дееспособным.","При согласии обоих родителей решение об эмансипации принимает орган опеки и попечительства.","Без согласия родителей эмансипация невозможна.","Эмансипация возможна с 14 лет.","Вступление в брак до 18 лет — самостоятельное основание приобретения полной дееспособности."],"answer":"125","hint":"Кто решает вопрос об эмансипации, если родители не согласны?","explain":"Верны 1, 2, 5. При отсутствии согласия родителей решение принимает суд (3). Эмансипация возможна с 16 лет (4)."},{"id":"law_g13","subject":"soc","topic":"Гражданское право","type":"text","max":1,"text":"Запишите термин: объявление несовершеннолетнего, достигшего 16 лет, полностью дееспособным.","answer":["эмансипация"],"hint":"Решение принимает орган опеки и попечительства или суд.","explain":"Эмансипация (ст. 27 ГК РФ)."},{"id":"law_g14","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"В каком порядке и при каких условиях гражданина признают недееспособным, ограниченно дееспособным, безвестно отсутствующим, объявляют умершим?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"ПРИЗНАНИЕ НЕДЕЕСПОСОБНЫМ, ОГРАНИЧЕНИЕ ДЕЕСПОСОБНОСТИ, БЕЗВЕСТНОЕ ОТСУТСТВИЕ И ОБЪЯВЛЕНИЕ УМЕРШИМ\n1) Недееспособным суд может признать человека, который вследствие психического расстройства не может понимать значение своих действий или руководить ими.\nОбратиться могут указанные в законе лица и организации, в том числе члены семьи. Самостоятельно совершать сделки такой гражданин не может: от его имени действует назначенный опекун.\n2) Ограничить дееспособность суд может, если человек:\nИз-за пристрастия к азартным играм, злоупотребления алкоголем или наркотиками ставит семью в тяжёлое материальное положение.\nИз-за психического расстройства понимает значение своих действий или руководит ими только при помощи других лиц.\nЗаявление подают указанные в законе лица и организации. Назначается попечитель. Мелкие бытовые сделки гражданин совершает самостоятельно; возможность совершать другие сделки зависит от основания ограничения. Для остальных нужно согласие попечителя.\n3) Безвестно отсутствующим суд может признать гражданина, если в месте его жительства нет сведений о месте его пребывания не менее года.\nЗаявление подают заинтересованные лица. Суд проверяет обстоятельства и выясняет, кто может сообщить сведения об отсутствующем.\n4) Объявить умершим суд по общему правилу может гражданина, если в месте его жительства нет сведений о месте его пребывания 5 лет.\nЗаявление подают заинтересованные лица, часто родственники. Открывается наследство и наступают другие предусмотренные законом последствия смерти.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g15","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между ситуациями и правовыми последствиями: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["гражданин вследствие психического расстройства не может понимать значение своих действий","гражданин из-за пристрастия к азартным играм ставит семью в тяжёлое материальное положение","в месте жительства гражданина нет сведений о месте его пребывания в течение года","в месте жительства гражданина нет сведений о месте его пребывания пять лет","над гражданином устанавливается попечительство"],"right":["признание недееспособным","ограничение дееспособности","признание безвестно отсутствующим","объявление умершим"],"answer":"12342","hint":"Опекун — у недееспособного, попечитель — у ограниченно дееспособного. Сроки: год и пять лет.","explain":"Недееспособность: А. Ограничение дееспособности: Б и Д (назначается попечитель). Безвестное отсутствие — год (В). Объявление умершим — пять лет (Г)."},{"id":"law_g16","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о признании гражданина недееспособным, ограниченно дееспособным, безвестно отсутствующим и объявлении умершим и запишите цифры, под которыми они указаны.","options":["Признать гражданина недееспособным может только суд.","От имени недееспособного гражданина сделки совершает опекун.","Ограниченно дееспособный гражданин не может совершать даже мелкие бытовые сделки.","Объявление гражданина умершим влечёт открытие наследства.","Безвестно отсутствующим гражданина признаёт орган опеки и попечительства."],"answer":"124","hint":"Все эти решения принимает один и тот же орган.","explain":"Верны 1, 2, 4. Мелкие бытовые сделки ограниченно дееспособный совершает самостоятельно (3). Безвестно отсутствующим гражданина признаёт суд (5)."},{"id":"law_g17","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое юридическое лицо?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Юридическое лицо — организация, которая:\n1) Имеет обособленное имущество.\n2) Отвечает им по своим обязательствам.\n3) От своего имени приобретает и осуществляет гражданские права, несёт обязанности.\n4) Может быть истцом и ответчиком в суде.\nПравоспособность и дееспособность возникают одновременно с внесением в ЕГРЮЛ записи о создании юридического лица и прекращаются с внесением записи о его прекращении.\nОтдельные виды деятельности требуют лицензии: например, фармацевтическая деятельность аптеки.\nПо основной цели юридические лица делятся на:\nКоммерческие — основная цель: извлечение прибыли.\nНекоммерческие — создаются для иных основных целей.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g18","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о юридическом лице и запишите цифры, под которыми они указаны.","options":["Юридическое лицо имеет обособленное имущество и отвечает им по своим обязательствам.","Юридическое лицо может быть истцом и ответчиком в суде.","Правоспособность юридического лица возникает с момента внесения в ЕГРЮЛ записи о его создании.","Основная цель любого юридического лица — извлечение прибыли.","Юридическое лицо приобретает права только от имени своих учредителей."],"answer":"123","hint":"Юридические лица делятся на коммерческие и некоммерческие.","explain":"Верны 1, 2, 3. Извлечение прибыли — основная цель только коммерческих организаций (4). Юридическое лицо приобретает права от своего имени (5)."},{"id":"law_g19","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Перечислите шесть видов коммерческих юридических лиц.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Для бизнеса по общему правилу нужна регистрация: она обеспечивает учёт для налогообложения и контроль деятельности. Два основных варианта — зарегистрироваться как ИП, который также может нанимать работников, или создать коммерческую организацию.\nГК РФ предусматривает 6 видов коммерческих юридических лиц:\n1) Хозяйственные товарищества.\n2) Хозяйственные общества.\n3) Хозяйственные партнёрства.\n4) Крестьянские (фермерские) хозяйства.\n5) Производственные кооперативы.\n6) Государственные и муниципальные унитарные предприятия.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g20","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Раскройте особенности хозяйственных товариществ и хозяйственных обществ.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Корпоративные коммерческие организации со складочным капиталом, разделённым на вклады участников. Созданное и приобретённое имущество принадлежит товариществу.\n— Индивидуальные предприниматели или коммерческие организации объединяются для бизнеса от имени товарищества.\n— Полные товарищи дополнительно отвечают по его долгам своим имуществом, если имущества товарищества недостаточно.\nПолное товарищество: все участники ведут предпринимательскую деятельность от его имени и несут дополнительную имущественную ответственность.\nТоварищество на вере (коммандитное): полные товарищи управляют и дополнительно отвечают своим имуществом; вкладчики-коммандитисты не ведут дела товарищества и рискуют только вкладами.\nИз-за высокого риска товарищества создаются редко и требуют большого доверия между партнёрами.\nКорпоративные коммерческие организации с уставным капиталом, разделённым на доли участников. Имущество принадлежит обществу.\n— Участники объединяют вклады и по общему правилу не отвечают по долгам общества, рискуя стоимостью своих долей или акций.\nООО — общество с ограниченной ответственностью. Распространённая форма; можно создать одному человеку. Риск участников обычно ограничен стоимостью долей.\nАО — акционерное общество: капитал разделён на акции, участники называются акционерами. Публичные АО (ПАО) могут публично размещать акции и обеспечивать их публичное обращение. Непубличные АО не имеют установленных законом признаков публичности.\nУчастники обществ обычно рискуют меньше полных товарищей. Общества — распространённая форма бизнеса.\nИтого: товарищества и общества — корпоративные коммерческие организации с разделённым на вклады или доли складочным либо уставным капиталом.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g21","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Раскройте особенности хозяйственных партнёрств, крестьянских (фермерских) хозяйств, производственных кооперативов и унитарных предприятий.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Гибкая форма коммерческой организации, введённая в России с 2012 года и пока редкая.\n— Создаются 2–50 лицами. Имеют устав и соглашение об управлении партнёрством. В соглашении в пределах закона определяют голосование, распределение прибыли, права и обязанности участников.\n— Участники по общему правилу не отвечают по обязательствам партнёрства и рискуют стоимостью вкладов.\nОт полных товариществ отличаются меньшим риском для участников, от обществ — большей гибкостью правил управления.\nДобровольные объединения граждан на основе членства для сельскохозяйственной деятельности: выращивания культур, производства молока, мяса и т. д.\n— КФХ как юридическое лицо создаётся объединением граждан, например членами одной или нескольких семей. Один гражданин может создать КФХ без образования юридического лица.\n— Члены лично участвуют в деятельности, используя имущество хозяйства: землю, технику, животных.\n— Члены несут субсидиарную — дополнительную — ответственность по обязательствам хозяйства своим имуществом, как полные товарищи.\nДобровольное объединение граждан на основе членства для совместной производственной или иной хозяйственной деятельности. Члены объединяют паевые взносы и лично участвуют в деятельности.\n— Не менее 5 членов.\n— Каждый вносит паевой взнос: деньги, имущество, технику.\n— Основа — личное трудовое участие, хотя закон допускает членов, которые лично не трудятся.\n— Прибыль обычно распределяется по трудовому участию с учётом закона и устава.\nПримеры: объединения сапожников, парикмахеров.\nСоздаются государством или муниципалитетом, часто для общественных целей и предоставления коммунальных услуг. ГУПы и МУПы являются унитарными организациями; остальные пять видов — корпоративными.\n— Имущество закреплено на праве хозяйственного ведения или оперативного управления. Его собственником остаётся государство или муниципальное образование.\n— Руководителя назначает собственник.\n— Предприятие отвечает по обязательствам всем принадлежащим ему имуществом.\nПримеры: водоканалы, транспортные предприятия, коммунальные службы.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g22","subject":"soc","topic":"Гражданское право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного является организационно-правовой формой коммерческих организаций? Запишите цифры, под которыми они указаны.","options":["хозяйственное партнёрство","потребительский кооператив","крестьянское (фермерское) хозяйство","товарищество собственников недвижимости","производственный кооператив","политическая партия"],"answer":"135","hint":"Похожие названия — ловушка: производственный и потребительский кооператив, хозяйственное товарищество и товарищество собственников недвижимости.","explain":"Коммерческие: 1, 3, 5. Потребительский кооператив (2), товарищество собственников недвижимости (4) и политическая партия (6) — некоммерческие организации."},{"id":"law_g23","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между характеристиками и видами коммерческих организаций: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["участники дополнительно отвечают по долгам организации своим имуществом","капитал разделён на доли или акции, участники рискуют их стоимостью","не менее пяти членов, основа — личное трудовое участие","может быть создано одним человеком","прибыль обычно распределяется по трудовому участию"],"right":["полное товарищество","хозяйственное общество (ООО, АО)","производственный кооператив"],"answer":"12323","hint":"Полные товарищи рискуют всем имуществом, участники обществ — стоимостью долей, члены кооператива лично трудятся.","explain":"Полное товарищество: А. Хозяйственное общество: Б, Г (ООО можно создать одному). Производственный кооператив: В, Д."},{"id":"law_g24","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о коммерческих организациях и запишите цифры, под которыми они указаны.","options":["В товариществе на вере вкладчики-коммандитисты рискуют только своими вкладами.","Публичное акционерное общество может публично размещать акции.","Имущество государственного унитарного предприятия принадлежит ему на праве собственности.","Хозяйственное партнёрство создаётся двумя — пятьюдесятью лицами.","Члены крестьянского (фермерского) хозяйства не несут дополнительной ответственности по его обязательствам."],"answer":"124","hint":"Кто собственник имущества унитарного предприятия? Как отвечают члены КФХ?","explain":"Верны 1, 2, 4. Собственник имущества ГУП — государство, у предприятия оно на праве хозяйственного ведения или оперативного управления (3). Члены КФХ несут субсидиарную (дополнительную) ответственность (5)."},{"id":"law_g25","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое некоммерческая организация? Приведите примеры.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Для НКО извлечение прибыли не является основной целью. Их организационно-правовых форм больше, чем у коммерческих организаций.\nПримеры: общественные и благотворительные фонды, политические партии, государственные и муниципальные учреждения, в том числе большинство школ.\nНекоторые названия похожи, но обозначают разные организации:\n— Производственный кооператив — коммерческая организация. Потребительский кооператив — НКО, созданная для удовлетворения потребностей участников, например совместного приобретения товаров или услуг.\nЖилищный кооператив приобретает или строит жильё для членов и управляет домом.\n— Хозяйственное товарищество — коммерческая организация. Товарищество собственников недвижимости — НКО для совместного управления общим имуществом. Например, собственники вносят взносы на содержание крыши, лифта, подъезда и прилегающей территории.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g26","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Может ли некоммерческая организация извлекать прибыль?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Да, если приносящая доход деятельность предусмотрена уставом, соответствует целям организации и служит их достижению.\nПрибыль направляется на цели НКО: развитие деятельности, социальные программы, улучшение условий работы. По общему правилу она не распределяется между учредителями или участниками, кроме предусмотренных специальным законом исключений.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g27","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о некоммерческих организациях и запишите цифры, под которыми они указаны.","options":["Для некоммерческой организации извлечение прибыли не является основной целью.","НКО может вести приносящую доход деятельность, если она предусмотрена уставом и служит целям организации.","Прибыль НКО по общему правилу распределяется между её участниками.","Потребительский кооператив — некоммерческая организация.","Производственный кооператив — некоммерческая организация."],"answer":"124","hint":"Куда направляется прибыль НКО? Какой из кооперативов коммерческий?","explain":"Верны 1, 2, 4. Прибыль НКО направляется на её цели и по общему правилу не распределяется между участниками (3). Производственный кооператив — коммерческая организация (5)."},{"id":"law_g28","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между организациями и их видами: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["производственный кооператив","жилищный кооператив","муниципальное унитарное предприятие","благотворительный фонд","товарищество собственников недвижимости"],"right":["коммерческая организация","некоммерческая организация"],"answer":"12122","hint":"Жилищный кооператив строит жильё для членов, а не извлекает прибыль.","explain":"Коммерческие: производственный кооператив (А), МУП (В). Некоммерческие: жилищный кооператив (Б), благотворительный фонд (Г), ТСН (Д)."},{"id":"law_g29","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Какие отношения регулирует гражданское право? Что такое личные неимущественные и имущественные отношения?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Личные неимущественные.\n2) Имущественные.\nВозникают по поводу нематериальных благ: имени, жизни и здоровья, личной неприкосновенности, неприкосновенности жилища, чести, доброго имени, деловой репутации.\nНе имеют имущественного содержания и неразрывно связаны с личностью.\nВозникают по поводу принадлежности и передачи имущества, выполнения работ, оказания услуг и других имущественных интересов.\nОсновные рассматриваемые виды:\n1) Вещные.\n2) Обязательственные.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g30","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и видами отношений, регулируемых гражданским правом: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["защита деловой репутации организации","аренда квартиры","защита чести и доброго имени гражданина","наследование дома","оказание услуг по ремонту"],"right":["личные неимущественные","имущественные"],"answer":"12122","hint":"Личные неимущественные — нематериальные блага, неразрывно связанные с личностью.","explain":"Личные неимущественные: деловая репутация (А), честь и доброе имя (В). Имущественные: аренда (Б), наследование (Г), услуги (Д)."},{"id":"law_g31","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое вещные права? Назовите любые пять видов. Что такое право собственности и каковы три правомочия собственника?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Вещные права обеспечивают юридическое господство лица над вещью.\n1) Право собственности — юридически обеспеченная возможность владеть, пользоваться и распоряжаться имуществом, защищать своё право.\nТри правомочия собственника:\nВладение — фактически обладать вещью.\nПользование — извлекать её полезные свойства.\nРаспоряжение — определять юридическую судьбу вещи, например менять её принадлежность.\nДругие вещные права:\n2) Постоянное (бессрочное) пользование земельным участком.\n3) Пожизненное наследуемое владение земельным участком.\n4) Сервитут — ограниченное пользование чужим земельным участком.\n5) Хозяйственное ведение.\n6) Оперативное управление. Существуют и иные вещные права.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g32","subject":"soc","topic":"Гражданское право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к вещным правам? Запишите цифры, под которыми они указаны.","options":["сервитут","право требовать возврата долга","право хозяйственного ведения","право собственности","исключительное право на изобретение","право на получение неустойки"],"answer":"134","hint":"Вещные права — юридическое господство над вещью. Долг и неустойка — из обязательств, изобретение — интеллектуальное право.","explain":"Вещные права: 1, 3, 4. Требование долга (2) и неустойки (6) — обязательственные права, исключительное право (5) — интеллектуальное."},{"id":"law_g33","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и правомочиями собственника: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["Анна продала свою машину","Олег хранит у себя дома принадлежащий ему велосипед","Ирина живёт в своей квартире","Пётр подарил брату свой ноутбук","фермер собирает урожай со своего сада"],"right":["владение","пользование","распоряжение"],"answer":"31232","hint":"Владение — фактически обладать; пользование — извлекать полезные свойства; распоряжение — определять юридическую судьбу вещи.","explain":"Распоряжение: продажа (А), дарение (Г). Владение: хранит у себя (Б). Пользование: живёт в квартире (В), собирает урожай (Д)."},{"id":"law_g34","subject":"soc","topic":"Гражданское право","type":"text","max":1,"text":"Запишите термин: вещное право ограниченного пользования чужим земельным участком.","answer":["сервитут"],"hint":"Слово латинского происхождения, входит в перечень вещных прав.","explain":"Сервитут."},{"id":"law_g35","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Каковы основания возникновения права собственности?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Купля-продажа, мена и другие сделки об отчуждении имущества.\n2) Наследование по завещанию или закону.\n3) Законное изготовление или создание вещи.\n4) Приобретение бесхозяйных вещей в установленном законом порядке и другие основания.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g36","subject":"soc","topic":"Гражданское право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного является основанием возникновения права собственности? Запишите цифры, под которыми они указаны.","options":["договор купли-продажи","наследование по закону","договор аренды","законное изготовление новой вещи","хранение вещи по договору","приобретение бесхозяйной вещи в установленном законом порядке"],"answer":"1246","hint":"Аренда и хранение дают пользование или обязанность хранить, но не собственность.","explain":"Основания: 1, 2, 4, 6. Аренда (3) и хранение (5) права собственности не порождают."},{"id":"law_g37","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое вещь? Каковы её свойства и виды?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Вещь — материальный объект гражданских прав, который может быть объектом имущественных отношений.\nИмеет материальную сущность.\nУдовлетворяет материальные, культурные и другие потребности.\nИмеет ценность, не обязательно выраженную рыночной ценой.\n1) Недвижимые — прочно связаны с землёй и не могут перемещаться без несоразмерного ущерба назначению: земельные участки, здания, сооружения. Закон также относит к недвижимости подлежащие государственной регистрации воздушные и морские суда, суда внутреннего плавания и некоторые другие объекты.\n2) Движимые — остальные вещи, включая документарные ценные бумаги и наличные деньги.\n3) Неделимые — нельзя разделить в натуре без разрушения, повреждения или изменения назначения: телефон, стол.\n4) Сложные — несколько вещей, используемых по общему назначению: чайный сервиз, компьютерный комплект, кухонный гарнитур.\n5) Плоды, продукция и доходы — имущество, полученное от использования вещи; обычно принадлежит её собственнику.\n6) Животные.\n7) Наличные деньги.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g38","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между объектами и видами вещей: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["земельный участок","наличные деньги","морское судно, подлежащее государственной регистрации","документарная ценная бумага","здание"],"right":["недвижимые","движимые"],"answer":"12121","hint":"Закон относит к недвижимости не только то, что связано с землёй, но и некоторые суда.","explain":"Недвижимые: земельный участок (А), морское судно, подлежащее регистрации (В), здание (Д). Движимые: наличные деньги (Б), документарная ценная бумага (Г)."},{"id":"law_g39","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о вещах как объектах гражданских прав и запишите цифры, под которыми они указаны.","options":["Вещь — материальный объект гражданских прав.","Неделимую вещь нельзя разделить в натуре без разрушения, повреждения или изменения назначения.","Плоды, продукция и доходы от использования вещи обычно принадлежат её собственнику.","Кухонный гарнитур — пример неделимой вещи.","Ценность вещи всегда выражается в её рыночной цене."],"answer":"123","hint":"Несколько вещей с общим назначением — какой это вид вещей?","explain":"Верны 1, 2, 3. Кухонный гарнитур — сложная вещь (4). Ценность вещи не обязательно выражена рыночной ценой (5)."},{"id":"law_g40","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое обязательственные права и обязательства? Каковы основания их возникновения?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Возникают по поводу передачи имущества, выполнения работ, оказания услуг и связывают кредитора с должником.\nОБЯЗАТЕЛЬСТВО — правоотношение, в котором должник обязан совершить в пользу кредитора действие: передать имущество, выполнить работу, оказать услугу, внести вклад в совместную деятельность, уплатить деньги — либо воздержаться от действия. Кредитор вправе требовать исполнения.\nОснования возникновения:\n1) Сделки, включая договоры.\n2) Неправомерные действия, например причинение вреда.\n3) Акты государственных органов в предусмотренных законом случаях.\n4) Судебные решения и другие законные основания.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g41","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о обязательствах и запишите цифры, под которыми они указаны.","options":["В обязательстве должник обязан совершить в пользу кредитора определённое действие либо воздержаться от действия.","Кредитор вправе требовать от должника исполнения обязательства.","Обязательство может возникнуть из причинения вреда.","Обязательства возникают только из договоров.","Судебное решение не может быть основанием возникновения обязательства."],"answer":"123","hint":"Оснований возникновения обязательств четыре группы.","explain":"Верны 1, 2, 3. Обязательства возникают из сделок, неправомерных действий, актов государственных органов, судебных решений и других оснований (4, 5 неверны)."},{"id":"law_g42","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое сделка? Каковы формы и виды сделок?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Сделка — действие граждан или юридических лиц, направленное на установление, изменение или прекращение гражданских прав и обязанностей.\nФормы:\n1) Устная.\n2) Простая письменная.\n3) Письменная нотариальная.\nУстные сделки тоже обязательны, но:\n1) Их труднее доказывать.\n2) Закон может требовать письменную форму: например, по общему правилу для сделок юридических лиц между собой или с гражданами. Для завещания по общему правилу нужно нотариальное удостоверение.\nНарушение простой письменной формы обычно ограничивает использование свидетельских показаний, но не всегда делает сделку недействительной. Отсутствие обязательного нотариального удостоверения по общему правилу влечёт ничтожность.\n1) Односторонние — достаточно воли одной стороны, например завещание.\nДвусторонние и многосторонние — нужно согласие двух или более сторон; это договоры, например купля-продажа, бартер.\n2) Возмездные — есть встречное предоставление: купля-продажа, аренда.\nБезвозмездные — встречного предоставления нет: дарение.\n3) Консенсуальные договоры заключаются при согласовании существенных условий в требуемой форме.\nРеальные требуют также передачи имущества: например, дарение с непосредственной передачей вещи.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g43","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о сделках и запишите цифры, под которыми они указаны.","options":["Сделка — действие, направленное на установление, изменение или прекращение гражданских прав и обязанностей.","Устные сделки не имеют юридической силы.","Для завещания по общему правилу требуется нотариальное удостоверение.","Отсутствие обязательного нотариального удостоверения по общему правилу влечёт ничтожность сделки.","Нарушение простой письменной формы всегда делает сделку недействительной."],"answer":"134","hint":"Чем грозит нарушение простой письменной формы и чем — отсутствие нотариального удостоверения?","explain":"Верны 1, 3, 4. Устные сделки тоже обязательны (2). Нарушение простой письменной формы обычно лишь ограничивает использование свидетельских показаний (5)."},{"id":"law_g44","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между сделками и их видами: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["купля-продажа","дарение","аренда","мена (бартер)","передача квартиры в дар сыну"],"right":["возмездная","безвозмездная"],"answer":"12112","hint":"Возмездная сделка предполагает встречное предоставление.","explain":"Возмездные: купля-продажа (А), аренда (В), мена (Г). Безвозмездные: дарение (Б, Д)."},{"id":"law_g45","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о видах сделок и запишите цифры, под которыми они указаны.","options":["Завещание — пример односторонней сделки.","Для заключения договора необходимо согласие двух или более сторон.","Дарение относится к возмез
