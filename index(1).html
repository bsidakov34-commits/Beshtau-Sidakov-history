:"choice","max":2,"text":"Выберите верные суждения о правоохранительных органах РФ и запишите цифры, под которыми они указаны.","options":["Таможенный контроль осуществляет Федеральная налоговая служба.","Безопасность Президента РФ обеспечивает Федеральная служба охраны.","Следственный комитет расследует уголовные дела об убийствах и похищениях людей.","Удостоверение доверенностей — полномочие адвоката.","Защиту и охрану Государственной границы РФ осуществляют органы ФСБ России."],"answer":"235","hint":"Сопоставьте каждую функцию с названием органа. Доверенности удостоверяет тот же специалист, что и завещания.","explain":"Верны 2, 3 и 5. Таможенный контроль — функция ФТС, а не ФНС (1). Доверенности удостоверяет нотариус (4)."},{"id":"law_po18","subject":"soc","topic":"Правоохранительные органы и суды","type":"open","card":true,"max":2,"text":"Каковы полномочия нотариусов?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Нотариат — нотариусы:\n1) Удостоверение сделок;\n2) Удостоверение доверенностей;\n3) Удостоверение завещаний и выдача свидетельств о праве на наследство;\n4) Свидетельствование верности перевода документов с одного языка на другой;\n5) Свидетельствование верности копий документов;\n6) Удостоверение предусмотренных законом юридических фактов.","hint":"Шесть видов нотариальных действий: сделки, доверенности, завещания и наследство, переводы, копии, юридические факты."},{"id":"law_po19","subject":"soc","topic":"Правоохранительные органы и суды","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к нотариальным действиям? Запишите цифры, под которыми они указаны.","options":["удостоверение завещания","свидетельствование верности копий документов","поддержание государственного обвинения в суде","выдача свидетельства о праве на наследство","защита подсудимого в суде","свидетельствование верности перевода документов с одного языка на другой"],"answer":"1246","hint":"Нотариус удостоверяет и свидетельствует, но не участвует в суде как сторона.","explain":"Нотариальные действия — 1, 2, 4 и 6. Обвинение поддерживает прокурор (3), подсудимого защищает адвокат (5)."},{"id":"law_po20","subject":"soc","topic":"Правоохранительные органы и суды","type":"open","card":true,"max":2,"text":"Каковы полномочия адвокатов?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Адвокатура — адвокаты:\n1) Предоставление консультаций и справок по правовым вопросам в устной и письменной форме;\n2) Составление заявлений, жалоб и других документов правового характера;\n3) Представление интересов доверителей в судах и других государственных органах.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_po21","subject":"soc","topic":"Правоохранительные органы и суды","ege":15,"type":"match","max":2,"text":"Установите соответствие между действиями и субъектами, которые их совершают: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["удостоверение доверенности","представление интересов доверителя в суде","свидетельствование верности перевода документа","защита обвиняемого по уголовному делу","выдача свидетельства о праве на наследство"],"right":["нотариус","адвокат"],"answer":"12121","hint":"Нотариус удостоверяет и свидетельствует, адвокат защищает и представляет интересы доверителя.","explain":"Нотариус: доверенность (А), перевод (В), свидетельство о праве на наследство (Д). Адвокат: представительство в суде (Б), защита обвиняемого (Г)."},{"id":"law_po22","subject":"soc","topic":"Правоохранительные органы и суды","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о адвокатуре и нотариате и запишите цифры, под которыми они указаны.","options":["Адвокат вправе представлять интересы доверителя в суде.","Нотариус удостоверяет сделки и завещания.","Адвокат выносит решения по гражданским делам.","Адвокат даёт консультации и справки по правовым вопросам в устной и письменной форме.","Нотариус свидетельствует верность копий документов."],"answer":"1245","hint":"Решения по делам выносит только суд.","explain":"Верны 1, 2, 4 и 5. Решения по гражданским делам выносит суд, а не адвокат (3)."},{"id":"law_po23","subject":"soc","topic":"Правоохранительные органы и суды","ege":15,"type":"match","max":2,"text":"Установите соответствие между организациями и их видами: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["адвокатура","прокуратура","нотариат","ФСБ России","Следственный комитет РФ"],"right":["государственный правоохранительный орган","институт защиты прав, не являющийся государственным органом"],"answer":"21211","hint":"Нотариат и адвокатура помогают защищать права, но государственными правоохранительными органами не являются.","explain":"Государственные правоохранительные органы: прокуратура (Б), ФСБ (Г), Следственный комитет (Д). Не являются государственными органами: адвокатура (А) и нотариат (В)."},{"id":"law_po24","subject":"soc","topic":"Правоохранительные органы и суды","type":"open","card":true,"max":2,"text":"Какие дела рассматривают мировые судьи?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Мировые судьи рассматривают уголовные дела, за которые максимальное наказание не более трёх лет лишения свободы. И гражданские дела при цене иска не более 50 тысяч рублей. И некоторые другие категории дел. Остальные дела рассматривают вышестоящие суды.","hint":"Запомните два ориентира: до трёх лет лишения свободы и цена иска до 50 тысяч рублей."},{"id":"law_po25","subject":"soc","topic":"Правоохранительные органы и суды","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о судебной системе и мировых судьях и запишите цифры, под которыми они указаны.","options":["Мировой судья рассматривает уголовные дела о преступлениях, за которые максимальное наказание не превышает трёх лет лишения свободы.","Мировые судьи рассматривают все уголовные дела о преступлениях несовершеннолетних.","Мировой судья рассматривает имущественные споры при цене иска, не превышающей 50 тысяч рублей (за установленными законом исключениями).","Конституционный контроль в РФ осуществляет Конституционный Суд РФ.","Мировые судьи рассматривают дела о преступлениях, за которые может быть назначено пожизненное лишение свободы."],"answer":"134","hint":"Мировой судья рассматривает самые простые дела. Сравните сроки и суммы с ориентирами из конспекта.","explain":"Верны 1, 3 и 4. Подсудность мировому судье определяется тяжестью преступления, а не возрастом обвиняемого (2). Дела о преступлениях, за которые грозит пожизненное лишение свободы, рассматривают вышестоящие суды (5)."},{"id":"law_po26","subject":"soc","topic":"Правоохранительные органы и суды","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к полномочиям судов в РФ? Запишите цифры, под которыми они указаны.","options":["осуществление уголовного судопроизводства","избрание меры пресечения в виде заключения под стражу","конституционный контроль, осуществляемый Конституционным Судом РФ","поддержание государственного обвинения","охрана важных государственных объектов","удостоверение сделок"],"answer":"123","hint":"Суд осуществляет правосудие и применяет меры государственного принуждения. Обвинение, охрана и удостоверение — функции других органов.","explain":"Полномочия судов — 1, 2 и 3. Обвинение поддерживает прокурор (4), важные объекты охраняет Росгвардия (5), сделки удостоверяет нотариус (6)."},{"id":"law_po27","subject":"soc","topic":"Правоохранительные органы и суды","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о судах и прокуратуре и запишите цифры, под которыми они указаны.","options":["Суды осуществляют гражданское, арбитражное, административное и уголовное судопроизводство.","Прокуратура координирует деятельность правоохранительных органов по борьбе с преступностью.","Прокуратура осуществляет надзор за исполнением законов судебными приставами и органами, исполняющими наказания.","Прокуратура осуществляет правосудие по уголовным делам.","Конституционный Суд РФ рассматривает уголовные дела о тяжких преступлениях."],"answer":"123","hint":"Правосудие осуществляет только суд, а Конституционный Суд проверяет соответствие актов Конституции.","explain":"Верны 1, 2 и 3. Правосудие осуществляет суд, а не прокуратура (4). Конституционный Суд осуществляет конституционный контроль и уголовные дела не рассматривает (5)."},{"id":"law_po28","subject":"soc","topic":"Правоохранительные органы и суды","ege":15,"type":"match","max":2,"text":"Установите соответствие между действиями и органами, которые их совершают: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["расследование уголовного дела об убийстве","надзор за исполнением законов органами, исполняющими наказания","рассмотрение спора о разделе имущества супругов","поддержание государственного обвинения по уголовному делу","расследование уголовного дела о похищении человека"],"right":["суд","прокуратура","Следственный комитет РФ"],"answer":"32123","hint":"Следственный комитет расследует тяжкие преступления против личности, прокуратура надзирает и обвиняет, суд разрешает дела.","explain":"Суд: спор о разделе имущества (В). Прокуратура: надзор (Б), обвинение (Г). Следственный комитет: расследование убийства (А) и похищения человека (Д)."},{"id":"law_po29","subject":"soc","topic":"Правоохранительные органы и суды","ege":22,"type":"open","max":4,"text":"Гражданин Т. обнаружил, что из его квартиры похитили ноутбук. Преступника нашли, дело направили в суд. За совершённое преступление закон предусматривает максимальное наказание до двух лет лишения свободы.\n1) В какой правоохранительный орган Т. следовало обратиться с заявлением о краже?\n2) Кто будет поддерживать государственное обвинение в суде?\n3) Какой судья рассмотрит это уголовное дело? Объясните почему.\n4) К кому Т. может обратиться за квалифицированной юридической помощью и представлением его интересов как потерпевшего?","criteria":[{"id":"K1","max":4,"text":"Правильно даны ответы на четыре вопроса — 4 балла; на 3 — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) В органы внутренних дел (полицию).\n2) Прокурор.\n3) Мировой судья: он рассматривает уголовные дела о преступлениях, за которые максимальное наказание не превышает трёх лет лишения свободы.\n4) К адвокату.","hint":"Вспомните функции полиции, прокуратуры и адвокатуры, а также подсудность мировому судье."},{"id":"law_gs01","subject":"soc","topic":"Гражданство","type":"open","card":true,"max":2,"text":"Что такое гражданство? Чем оно отличается от подданства?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Гражданство — устойчивая правовая связь человека с государством, выражающаяся в совокупности их взаимных прав и обязанностей.\n\nПодданство исторически обозначает правовую связь человека с монархом. В современных монархиях по своему правовому содержанию оно во многом совпадает с гражданством.","hint":"Гражданство — связь с государством, подданство исторически — связь с монархом."},{"id":"law_gs02","subject":"soc","topic":"Гражданство","type":"open","card":true,"max":2,"text":"Какие документы удостоверяют гражданство РФ?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Документы, удостоверяющие гражданство РФ:\n— паспорт гражданина РФ, в том числе заграничный;\n— дипломатический или служебный паспорт;\n— свидетельство о рождении с отметкой, подтверждающей гражданство РФ, и другие установленные документы.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_gs03","subject":"soc","topic":"Гражданство","type":"open","card":true,"max":2,"text":"Каковы принципы российского гражданства?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Принципы российского гражданства:\n1) Гражданство РФ является единым и равным независимо от оснований его приобретения.\n2) Гражданин РФ не может быть лишён гражданства или права изменить его.\n3) Гражданин РФ не может быть выслан за пределы России или выдан иностранному государству.\n4) Проживание гражданина РФ за пределами России не прекращает его гражданства.\n5) Россия поощряет приобретение гражданства РФ лицами без гражданства, проживающими на её территории.\n6) Россия гарантирует защиту и покровительство своим гражданам за её пределами.","hint":"Шесть принципов: единство и равенство, нельзя лишить, нельзя выслать или выдать, проживание за рубежом не прекращает, поощрение апатридов, покровительство за рубежом."},{"id":"law_gs04","subject":"soc","topic":"Гражданство","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о принципах гражданства Российской Федерации и запишите цифры, под которыми они указаны.","options":["Гражданство РФ является единым и равным независимо от оснований его приобретения.","Гражданин РФ не может быть выслан за пределы России или выдан иностранному государству.","Проживание гражданина РФ за пределами России прекращает его гражданство.","Россия гарантирует своим гражданам защиту и покровительство за её пределами.","Гражданин РФ не вправе изменить своё гражданство."],"answer":"124","hint":"Принципы гражданства защищают связь человека с государством, где бы он ни жил, и сохраняют его право выбора.","explain":"Верны 1, 2 и 4. Проживание за пределами России гражданства не прекращает (3). Гражданин не может быть лишён права изменить гражданство (5)."},{"id":"law_gs05","subject":"soc","topic":"Гражданство","type":"open","card":true,"max":2,"text":"Каковы основания приобретения гражданства РФ? В каких случаях ребёнок приобретает гражданство РФ по рождению?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основания приобретения гражданства РФ:\n1) По рождению.\n2) В результате приёма в гражданство РФ.\n3) В результате признания гражданином РФ.\n4) В результате оптации — выбора гражданства при изменении государственной границы РФ.\n5) В соответствии с международным договором РФ.\n\nРебёнок приобретает гражданство РФ по рождению, если на день его рождения:\n— оба родителя или единственный родитель имеют гражданство РФ;\n— один родитель — гражданин РФ, другой — лицо без гражданства;\n— один родитель — гражданин РФ, другой — иностранец, а ребёнок родился в России;\n— один родитель — гражданин РФ, другой — иностранец, а ребёнок родился за пределами России и не приобрёл иностранного гражданства по рождению;\n— оба родителя или единственный родитель — иностранцы либо лица без гражданства, постоянно проживающие в РФ, а ребёнок родился в России и не приобрёл иностранного гражданства по рождению.","hint":"Пять оснований: рождение, приём, признание, оптация, международный договор. Для рождения важно гражданство родителей и место рождения."},{"id":"law_gs06","subject":"soc","topic":"Гражданство","ege":15,"type":"match","max":2,"text":"Установите соответствие между ситуациями и основаниями приобретения гражданства РФ: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["иностранный гражданин, заключивший контракт о службе в Вооружённых Силах РФ на срок не менее года, подал заявление и был принят в гражданство","ребёнок родился в семье, где оба родителя — граждане РФ","при изменении государственной границы жители территории выбрали гражданство РФ","совершеннолетний иностранец пять лет прожил в России по виду на жительство, подал заявление и принёс Присягу","ребёнок родился в России у матери — гражданки РФ и отца — иностранного гражданина"],"right":["по рождению","в результате приёма в гражданство","в результате оптации"],"answer":"21321","hint":"Оптация — выбор гражданства при изменении границы. Приём в гражданство всегда начинается с заявления.","explain":"По рождению: оба родителя граждане РФ (Б); один родитель — гражданин РФ, другой — иностранец, ребёнок родился в России (Д). Приём: по контракту о службе (А) и в общем порядке (Г). Оптация: выбор гражданства при изменении границы (В)."},{"id":"law_gs07","subject":"soc","topic":"Гражданство","type":"text","max":1,"text":"Запишите термин: выбор гражданства при изменении государственной границы.","answer":["оптация"],"hint":"Термин происходит от латинского слова «выбор».","explain":"Оптация."},{"id":"law_gs08","subject":"soc","topic":"Гражданство","type":"open","card":true,"max":2,"text":"Какие условия нужно соблюсти для приёма в гражданство РФ? Кто принимается в гражданство без соблюдения отдельных требований закона?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Условия приёма в гражданство РФ по общему правилу:\n1) Достижение 18 лет и наличие дееспособности.\n2) Обязательство соблюдать Конституцию РФ и принести Присягу гражданина РФ.\n3) Постоянное проживание в РФ в течение пяти лет со дня решения о выдаче вида на жительство до подачи заявления.\n4) Владение русским языком.\n5) Знание истории России и основ законодательства РФ.\n6) Отсутствие предусмотренных законом оснований для отклонения заявления.\n\nНекоторые категории лиц принимаются в гражданство без соблюдения отдельных требований, например пятилетнего срока проживания:\n— лица, заключившие контракт о прохождении службы в ВС РФ на срок не менее года;\n— беженцы и лица, получившие политическое убежище, постоянно проживающие в РФ не менее года;\n— постоянно проживающие в РФ лица, получившие в России высшее образование очно, с отличием, по программе с государственной аккредитацией;\n— постоянно проживающие в РФ лица, состоящие в браке с проживающим в России гражданином РФ и имеющие с ним общего ребёнка;\n— некоторые другие категории.","hint":"Шесть условий: возраст и дееспособность, Конституция и Присяга, пять лет проживания, русский язык, история и законодательство, отсутствие оснований для отклонения."},{"id":"law_gs09","subject":"soc","topic":"Гражданство","ege":16,"type":"choice","max":2,"text":"Что из перечисленного является условием приёма в гражданство РФ по общему правилу? Запишите цифры, под которыми они указаны.","options":["достижение 18 лет и наличие дееспособности","постоянное проживание в РФ в течение пяти лет со дня решения о выдаче вида на жительство","владение русским языком","наличие высшего образования","обязательство соблюдать Конституцию РФ и принесение Присяги гражданина РФ","наличие в собственности жилья в России"],"answer":"1235","hint":"Закон не требует определённого образования или имущества. Вспомните, что заявитель должен знать и что обязуется соблюдать.","explain":"Условия приёма — 1, 2, 3 и 5. Высшее образование (4) и жильё в собственности (6) законом не требуются."},{"id":"law_gs10","subject":"soc","topic":"Гражданство","type":"open","card":true,"max":2,"text":"Каковы основания прекращения гражданства РФ? По каким основаниям отклоняют заявление о приёме в гражданство?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Некоторые основания прекращения гражданства РФ:\n— Добровольный выход из гражданства.\n— Совершение предусмотренных законом преступлений лицом, принятым в гражданство РФ.\n— Совершение действий, создающих угрозу национальной безопасности РФ, в предусмотренных законом случаях.\n— Представление поддельных, подложных или недействительных документов либо заведомо ложных сведений, на основании которых лицо было принято в гражданство РФ или признано гражданином РФ.\nПринудительное прекращение по указанным основаниям не распространяется на гражданство, приобретённое по рождению.\n\nНекоторые основания отклонения заявления о приёме в гражданство РФ:\n— Лицо выступает за насильственное изменение основ конституционного строя РФ или создаёт угрозу безопасности России.\n— Состоит на военной службе, службе в органах безопасности или правоохранительных органах иностранного государства — за предусмотренными исключениями.\n— Участвовало в вооружённых действиях против Российской Федерации.\n— Имеет неснятую или непогашенную судимость за умышленное преступление, признаваемое преступлением по российскому законодательству.\n— Другие предусмотренные законом случаи.","hint":"Помните: принудительное прекращение не касается гражданства, приобретённого по рождению."},{"id":"law_gs11","subject":"soc","topic":"Гражданство","ege":15,"type":"match","max":2,"text":"Установите соответствие между обстоятельствами и их правовыми последствиями: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["гражданин РФ добровольно вышел из гражданства","заявитель проходит военную службу в вооружённых силах иностранного государства","выяснилось, что лицо было принято в гражданство на основании поддельных документов","у заявителя есть неснятая судимость за умышленное преступление","лицо, принятое в гражданство РФ, совершило предусмотренное законом преступление"],"right":["основание прекращения гражданства РФ","основание отклонения заявления о приёме в гражданство"],"answer":"12121","hint":"Прекратить можно только то гражданство, которое у человека уже есть. Отклоняют заявление того, кто только хочет стать гражданином.","explain":"Прекращение: добровольный выход (А), поддельные документы при приёме (В), преступление лица, принятого в гражданство (Д). Отклонение заявления: иностранная военная служба (Б), неснятая судимость (Г)."},{"id":"law_gs12","subject":"soc","topic":"Гражданство","type":"open","max":3,"text":"Гражданин государства Z, 25 лет, три года живёт в России по виду на жительство. Он состоит в браке с гражданкой РФ, проживающей в России, у супругов есть общий ребёнок. Мужчина решил получить гражданство РФ.\n1) Нужно ли ему ждать, пока срок проживания в России достигнет пяти лет? Объясните почему.\n2) Назовите любые два условия, которые ему всё равно необходимо соблюсти.\n3) Назовите любое обстоятельство, при котором его заявление будет отклонено.","criteria":[{"id":"K1","max":3,"text":"Правильно даны ответы на три вопроса — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) Нет: лица, состоящие в браке с проживающим в России гражданином РФ и имеющие с ним общего ребёнка, принимаются в гражданство без соблюдения пятилетнего срока проживания.\n2) Быть совершеннолетним и дееспособным; обязаться соблюдать Конституцию РФ и принести Присягу гражданина РФ; отсутствие оснований для отклонения заявления.\n3) Например: неснятая или непогашенная судимость за умышленное преступление; служба в вооружённых силах или органах безопасности иностранного государства; участие в вооружённых действиях против РФ; призывы к насильственному изменению основ конституционного строя.","hint":"Найдите в условии категорию лиц, для которых закон делает исключение из срока проживания."},{"id":"law_vo01","subject":"soc","topic":"Воинская обязанность и АГС","type":"open","card":true,"max":2,"text":"Что такое воинская обязанность? Какими законами она регулируется?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Воинская обязанность — установленная законом обязанность граждан РФ по подготовке к вооружённой защите и вооружённой защите Отечества.\n\nВоинская обязанность регулируется Конституцией РФ (ст. 59), федеральными законами «О воинской обязанности и военной службе», «Об обороне», «О статусе военнослужащих».","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_vo02","subject":"soc","topic":"Воинская обязанность и АГС","type":"open","card":true,"max":2,"text":"Что включает воинская обязанность?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Воинская обязанность включает:\n1) Воинский учёт. Военкомат собирает и учитывает сведения о гражданах. При первоначальной постановке предусмотрены медицинское освидетельствование и профессиональный психологический отбор. Постановка возможна без личной явки — тогда эти мероприятия проводятся при последующей явке.\n2) Обязательную подготовку к военной службе. Включает получение начальных знаний в области обороны, подготовку по основам военной службы, военно-патриотическое воспитание и другие мероприятия.\nДобровольная подготовка, например обучение в суворовских и нахимовских училищах, осуществляется дополнительно.\n3) Призыв на военную службу. Проводятся необходимые обследования, призывная комиссия принимает решение о призыве, гражданина направляют к месту службы.\n4) Прохождение военной службы по призыву. Срок службы составляет 12 месяцев. Службу проходят в Вооружённых Силах РФ и других предусмотренных законом войсках и воинских формированиях.\n5) Пребывание в запасе. После увольнения с военной службы гражданин, как правило, зачисляется в запас и продолжает состоять на воинском учёте.\n6) Призыв на военные сборы и их прохождение в период пребывания в запасе. Сборы проводятся для подготовки граждан к военной службе.\nВ период мобилизации, военного положения и в военное время предусматриваются также призыв и прохождение военной службы. В период военного положения и в военное время проводится военное обучение.","hint":"Шесть элементов: учёт, подготовка, призыв, служба, запас, военные сборы."},{"id":"law_vo03","subject":"soc","topic":"Воинская обязанность и АГС","type":"open","card":true,"max":2,"text":"В каком возрасте и каким органом осуществляется первоначальная постановка на воинский учёт?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Первоначальная постановка граждан мужского пола на воинский учёт осуществляется с 1 января по 31 марта в год достижения ими 17 лет. Её проводит комиссия по постановке граждан на воинский учёт, в состав которой входят представители военкомата, врачи и другие специалисты.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_vo04","subject":"soc","topic":"Воинская обязанность и АГС","type":"open","card":true,"max":2,"text":"Кто подлежит призыву на военную службу? Кто, каким актом и на какой период объявляет призыв?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Призыву на военную службу подлежат граждане РФ:\n— мужского пола;\n— в возрасте от 18 лет до достижения 30 лет;\n— состоящие на воинском учёте или обязанные состоять на нём;\n— не пребывающие в запасе.\nНе призываются граждане, освобождённые от воинской обязанности или призыва, получившие отсрочку, а также другие лица, не подлежащие призыву по закону.\n\nПризыв на военную службу осуществляется круглогодично, с 1 января по 31 декабря, на основании указа Президента РФ.","hint":"Четыре признака призывника: пол, возраст 18–30 лет, воинский учёт, не в запасе."},{"id":"law_vo05","subject":"soc","topic":"Воинская обязанность и АГС","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о воинской обязанности в РФ и запишите цифры, под которыми они указаны.","options":["Первоначальная постановка граждан мужского пола на воинский учёт проводится с 1 января по 31 марта в год достижения ими 17 лет.","Призыву на военную службу подлежат граждане мужского пола в возрасте от 18 до 30 лет, состоящие на воинском учёте и не пребывающие в запасе.","Срок военной службы по призыву составляет 24 месяца.","Призыв на военную службу осуществляется на основании указа Президента РФ.","Пребывание в запасе не входит в содержание воинской обязанности."],"answer":"124","hint":"Вспомните срок службы по призыву и шесть элементов воинской обязанности.","explain":"Верны 1, 2 и 4. Срок службы по призыву — 12 месяцев (3). Пребывание в запасе — один из элементов воинской обязанности (5)."},{"id":"law_vo06","subject":"soc","topic":"Воинская обязанность и АГС","type":"text","max":1,"text":"Каков срок военной службы по призыву? Запишите число месяцев.","answer":["12","двенадцать"],"hint":"Альтернативная гражданская служба длится в 1,75 раза дольше — 21 месяц.","explain":"12 месяцев."},{"id":"law_vo07","subject":"soc","topic":"Воинская обязанность и АГС","type":"open","card":true,"max":2,"text":"Какие лица освобождаются от призыва на военную службу?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"А) От призыва на военную службу освобождаются:\n— Признанные ограниченно годными или негодными по состоянию здоровья;\n— Прошедшие военную или альтернативную гражданскую службу;\n— Имеющие учёную степень;\n— Являющиеся сыновьями или братьями лиц, погибших при исполнении воинской обязанности;\n— Отбывающие уголовное наказание, имеющие судимость либо находящиеся под следствием;\n— Другие предусмотренные законом категории граждан.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_vo08","subject":"soc","topic":"Воинская обязанность и АГС","type":"open","card":true,"max":2,"text":"Кто может получить отсрочку от призыва на военную службу?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Б) Отсрочка предоставляется:\nПризнанным временно негодными к военной службе;\nЗанятым уходом за близкими родственниками при отсутствии других лиц, которые могут осуществлять такой уход;\nОпекунам или попечителям родного брата или сестры;\nИмеющим ребёнка, воспитываемого без матери, двух и более детей или ребёнка-инвалида;\nЛицам, поступившим на службу в правоохранительные органы;\nДепутатам и кандидатам в депутаты различных уровней;\nОбучающимся по очной форме обучения и другим предусмотренным законом категориям граждан.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_vo09","subject":"soc","topic":"Воинская обязанность и АГС","ege":15,"type":"match","max":2,"text":"Установите соответствие между обстоятельствами и их последствиями для призыва на военную службу: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["гражданин имеет учёную степень кандидата наук","гражданин обучается по очной форме обучения","гражданин признан временно не годным к военной службе по состоянию здоровья","гражданин — родной брат военнослужащего, погибшего при исполнении воинской обязанности","гражданин имеет двоих детей"],"right":["освобождение от призыва","отсрочка от призыва"],"answer":"12212","hint":"Отсрочка временная: она действует, пока сохраняется обстоятельство. Освобождение от призыва — окончательное.","explain":"Освобождение: учёная степень (А), брат погибшего военнослужащего (Г). Отсрочка: очное обучение (Б), временная негодность (В), двое детей (Д)."},{"id":"law_vo10","subject":"soc","topic":"Воинская обязанность и АГС","type":"open","card":true,"max":2,"text":"Что такое альтернативная гражданская служба (АГС)?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Альтернативная гражданская служба — особый вид трудовой деятельности в интересах общества и государства, осуществляемой гражданами взамен военной службы по призыву.\nАГС регулируется ст. 59 Конституции РФ и Федеральным законом «Об альтернативной гражданской службе». С гражданином заключается срочный трудовой договор. На него распространяется трудовое законодательство с особенностями, установленными законом об АГС.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_vo11","subject":"soc","topic":"Воинская обязанность и АГС","type":"open","card":true,"max":2,"text":"Какие категории граждан имеют право на замену военной службы альтернативной гражданской? Направляются ли на АГС лица, признанные не годными к военной службе?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Право на замену военной службы по призыву на АГС имеют:\n1) Граждане, убеждениям которых противоречит несение военной службы.\n2) Граждане, вероисповеданию которых противоречит несение военной службы.\n3) Граждане, относящиеся к коренным малочисленным народам РФ, ведущие традиционный образ жизни, осуществляющие традиционную хозяйственную деятельность и занимающиеся традиционными промыслами.\n\nНет. На АГС не направляются граждане, не подлежащие призыву, а также имеющие основания для освобождения от призыва или предоставления отсрочки. АГС заменяет военную службу по призыву.","hint":"Три основания: убеждения, вероисповедание, принадлежность к коренному малочисленному народу."},{"id":"law_vo12","subject":"soc","topic":"Воинская обязанность и АГС","ege":16,"type":"choice","max":2,"text":"Что из перечисленного даёт гражданину право на замену военной службы по призыву альтернативной гражданской службой? Запишите цифры, под которыми они указаны.","options":["несение военной службы противоречит его убеждениям","несение военной службы противоречит его вероисповеданию","гражданин признан не годным к военной службе по состоянию здоровья","гражданин относится к коренному малочисленному народу, ведёт традиционный образ жизни и занимается традиционными промыслами","гражданин не хочет проходить службу за пределами своего региона","гражданин имеет высшее образование"],"answer":"124","hint":"АГС заменяет военную службу у тех, кто подлежит призыву. Негодный к службе не призывается вовсе.","explain":"Основания — 1, 2 и 4. Негодный к военной службе освобождается от призыва и на АГС не направляется (3). Нежелание служить вдали от дома (5) и высшее образование (6) такого права не дают."},{"id":"law_vo13","subject":"soc","topic":"Воинская обязанность и АГС","type":"open","card":true,"max":2,"text":"Каков срок альтернативной гражданской службы?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Срок АГС:\n— 21 месяц — по общему правилу, то есть в 1,75 раза дольше военной службы по призыву;\n— 18 месяцев — при прохождении АГС в организациях Вооружённых Сил РФ, других войск, воинских формирований и органов в качестве гражданского персонала.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_vo14","subject":"soc","topic":"Воинская обязанность и АГС","type":"open","card":true,"max":2,"text":"Где и как проходят альтернативную гражданскую службу? Что учитывается при определении вида работы гражданина?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"АГС проходят:\n1) В организациях, подведомственных федеральным органам исполнительной власти.\n2) В организациях, подведомственных исполнительным органам субъектов РФ.\n3) В организациях Вооружённых Сил РФ, других войск, воинских формирований и органов в качестве гражданского персонала.\nОрганизации, профессии и должности для прохождения АГС определяются утверждёнными перечнями. Работа может требовать как специальной квалификации, так и не требовать её.\n\nГраждане проходят АГС, как правило, за пределами субъекта РФ, в котором постоянно проживают.\nЕсли направить гражданина в другой регион невозможно, по решению уполномоченного федерального органа он может проходить АГС в своём регионе.\n\nПри определении вида работы, профессии, должности и места прохождения АГС учитываются:\n— образование;\n— специальность;\n— квалификация;\n— опыт предыдущей работы;\n— состояние здоровья;\n— семейное положение;\n— потребность организаций в трудовых ресурсах.","hint":"В каких организациях, в каком регионе и что учитывают при выборе работы."},{"id":"law_vo15","subject":"soc","topic":"Воинская обязанность и АГС","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о альтернативной гражданской службе и запишите цифры, под которыми они указаны.","options":["Срок АГС по общему правилу составляет 21 месяц.","При прохождении АГС в организациях Вооружённых Сил РФ в качестве гражданского персонала её срок составляет 18 месяцев.","С гражданином, проходящим АГС, заключается срочный трудовой договор.","Граждане проходят АГС, как правило, в субъекте РФ, в котором постоянно проживают.","На АГС направляются граждане, признанные не годными к военной службе."],"answer":"123","hint":"АГС длиннее службы по призыву в 1,75 раза. Вспомните, где по общему правилу её проходят.","explain":"Верны 1, 2 и 3. По общему правилу АГС проходят за пределами субъекта, в котором гражданин постоянно проживает (4). Негодные к военной службе на АГС не направляются (5)."},{"id":"law_vo16","subject":"soc","topic":"Воинская обязанность и АГС","ege":22,"type":"open","max":4,"text":"Девятнадцатилетний Игорь состоит в религиозной организации, вероисповеданию которой противоречит несение военной службы. Он подлежит призыву и хочет пройти альтернативную гражданскую службу.\n1) Имеет ли Игорь право на замену военной службы АГС? Объясните почему.\n2) Каков срок АГС по общему правилу?\n3) Где по общему правилу Игорь будет проходить АГС — в своём регионе или за его пределами?\n4) Назовите любые два обстоятельства, которые учтут при определении вида работы и должности Игоря.","criteria":[{"id":"K1","max":4,"text":"Правильно даны ответы на четыре вопроса — 4 балла; на 3 — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) Да: несение военной службы противоречит его вероисповеданию.\n2) 21 месяц (18 месяцев — если он будет проходить АГС гражданским персоналом в организациях Вооружённых Сил).\n3) Как правило, за пределами субъекта РФ, в котором он постоянно проживает.\n4) Образование, специальность, квалификация, опыт предыдущей работы, состояние здоровья, семейное положение, потребность организаций в трудовых ресурсах.","hint":"Вспомните три основания для замены военной службы и правила прохождения АГС."},{"id":"law_nl01","subject":"soc","topic":"Налоговое право","type":"open","card":true,"max":2,"text":"Что такое налоговое право? Какие отношения оно регулирует? Какими нормативными актами регулируются налоговые отношения в РФ?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Налоговое право — подотрасль финансового права, регулирующая отношения по установлению, введению и взиманию налогов и сборов, осуществлению налогового контроля и привлечению к ответственности за налоговые правонарушения.\nОсновные источники:\n— Конституция РФ, прежде всего статья 57, закрепляющая обязанность платить законно установленные налоги и сборы;\n— Налоговый кодекс РФ и принятые в соответствии с ним федеральные законы;\n— Законы субъектов РФ о налогах;\n— Нормативные правовые акты представительных органов муниципальных образований о местных налогах и сборах.\nРегиональные и муниципальные акты должны соответствовать Налоговому кодексу РФ.","hint":"Налоговое право — подотрасль финансового. Главный источник — Налоговый кодекс РФ."},{"id":"law_nl02","subject":"soc","topic":"Налоговое право","type":"open","card":true,"max":2,"text":"Кто является участниками налоговых отношений? Кто такие налогоплательщик и налоговый агент? Может ли несовершеннолетний быть налогоплательщиком?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные участники налоговых отношений:\n— Налогоплательщики, плательщики сборов и страховых взносов;\n— Налоговые агенты;\n— Налоговые органы — ФНС России и её территориальные органы;\n— Таможенные органы.\nНалогоплательщик — организация или физическое лицо, обязанное уплачивать налоги в соответствии с Налоговым кодексом РФ.\nНалогоплательщиками могут быть граждане России, иностранные граждане и лица без гражданства.\nНесовершеннолетний также может быть налогоплательщиком. Например, если ему принадлежит квартира или доля в ней. Его законные представители обеспечивают исполнение налоговых обязанностей.\nНалоговый агент — лицо, которое обязано рассчитать налог, удержать его у налогоплательщика и перечислить в бюджет.\nНапример, организация-работодатель удерживает НДФЛ из заработной платы работника и перечисляет его государству. Работник здесь — налогоплательщик, организация — налоговый агент.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_nl03","subject":"soc","topic":"Налоговое право","ege":15,"type":"match","max":2,"text":"Установите соответствие между участниками налоговых отношений и их статусом: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["ООО «Вектор», удерживающее налог на доходы физических лиц из заработной платы работников и перечисляющее его в бюджет","работник ООО «Вектор», получающий заработную плату","инспекция ФНС, проводящая налоговую проверку","четырнадцатилетний собственник доли в квартире","индивидуальный предприниматель, уплачивающий налог со своего дохода"],"right":["налогоплательщик","налоговый агент","налоговый орган"],"answer":"21311","hint":"Налоговый агент сам налог не платит: он удерживает его у налогоплательщика и перечисляет в бюджет.","explain":"Налогоплательщики: работник (Б), несовершеннолетний собственник (Г), предприниматель (Д). Налоговый агент: работодатель (А). Налоговый орган: инспекция ФНС (В)."},{"id":"law_nl04","subject":"soc","topic":"Налоговое право","type":"text","max":1,"text":"Запишите термин: лицо, на которое возложена обязанность исчислить налог, удержать его у налогоплательщика и перечислить в бюджет.","answer":["налоговый агент"],"hint":"Пример — работодатель, удерживающий НДФЛ из зарплаты.","explain":"Налоговый агент."},{"id":"law_nl05","subject":"soc","topic":"Налоговое право","type":"open","card":true,"max":2,"text":"Каковы права и обязанности налогоплательщика? Назовите по пять прав и обязанностей.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Права налогоплательщика:\n1) Бесплатно получать от налоговых органов информацию о действующих налогах и сборах, порядке их исчисления и уплаты;\n2) Пользоваться налоговыми льготами при наличии предусмотренных законом оснований;\n3) Представлять свои интересы лично или через представителя;\n4) Требовать соблюдения налоговой тайны;\n5) Обжаловать решения налоговых органов, действия или бездействие их должностных лиц.\nОбязанности налогоплательщика:\n1) Уплачивать законно установленные налоги;\n2) Вставать на учёт в налоговых органах, если это предусмотрено законом;\n3) Вести учёт доходов, расходов и объектов налогообложения в предусмотренных законом случаях;\n4) Представлять налоговые декларации, если такая обязанность установлена законом;\n5) Выполнять законные требования налоговых органов об устранении нарушений и не препятствовать их деятельности.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_nl06","subject":"soc","topic":"Налоговое право","ege":15,"type":"match","max":2,"text":"Установите соответствие между элементами правового статуса налогоплательщика и их видами: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["бесплатно получать информацию о действующих налогах и сборах","представлять налоговые декларации в установленных законом случаях","требовать соблюдения налоговой тайны","вставать на учёт в налоговых органах, если это предусмотрено законом","обжаловать решения налоговых органов"],"right":["право налогоплательщика","обязанность налогоплательщика"],"answer":"12121","hint":"Права дают налогоплательщику возможность что-то получить или потребовать, обязанности требуют что-то сделать для государства.","explain":"Права: получать информацию (А), требовать соблюдения налоговой тайны (В), обжаловать решения (Д). Обязанности: представлять декларации (Б), вставать на учёт (Г)."},{"id":"law_nl07","subject":"soc","topic":"Налоговое право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к обязанностям налогоплательщика? Запишите цифры, под которыми они указаны.","options":["уплачивать законно установленные налоги","пользоваться налоговыми льготами","представлять налоговые декларации, если это предусмотрено законом","требовать соблюдения налоговой тайны","выполнять законные требования налогового органа об устранении нарушений","представлять свои интересы через представителя"],"answer":"135","hint":"Отделите то, что налогоплательщик должен делать, от того, что он вправе делать.","explain":"Обязанности — 1, 3 и 5. Пользоваться льготами (2), требовать соблюдения налоговой тайны (4) и действовать через представителя (6) — права налогоплательщика."},{"id":"law_nl08","subject":"soc","topic":"Налоговое право","type":"open","card":true,"max":2,"text":"Какие органы осуществляют налоговый контроль? Каковы их основные полномочия? Как налогоплательщик может защитить свои права?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Налоговый контроль осуществляют ФНС России и её территориальные органы. Таможенные органы контролируют уплату налогов при перемещении товаров через таможенную границу в пределах своих полномочий.\nОсновные полномочия налоговых органов:\n1) Проводить налоговые проверки;\n2) Требовать необходимые для проверки документы и объяснения;\n3) Требовать устранения выявленных нарушений;\n4) Взыскивать задолженность и применять предусмотренные законом меры ответственности.\nЗащита прав налогоплательщика:\n— Обращение с жалобой в вышестоящий налоговый орган;\n— Обращение в суд.\nПо общему правилу сначала необходимо обжаловать решение или действие в вышестоящий налоговый орган, а затем — в суд.\nНапример, гражданину неправильно начислили налог.\nОн вправе оспорить начисление, представив подтверждающие документы.","hint":"Помните порядок обжалования: сначала вышестоящий налоговый орган, потом суд."},{"id":"law_nl09","subject":"soc","topic":"Налоговое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о налоговом контроле и запишите цифры, под которыми они указаны.","options":["Налоговый контроль осуществляют ФНС России и её территориальные органы.","По общему правилу решение налогового органа сначала обжалуется в вышестоящий налоговый орган, а затем — в суд.","Налоговые органы вправе проводить налоговые проверки.","Налогоплательщик не вправе обжаловать решения налоговых органов в суде.","Налоговые органы вправе вводить новые федеральные налоги."],"answer":"123","hint":"Налоговые органы контролируют, а не устанавливают налоги: налоги устанавливаются законом.","explain":"Верны 1, 2 и 3. Обжаловать решения в суде можно — после жалобы в вышестоящий налоговый орган (4). Федеральные налоги устанавливает Налоговый кодекс, а не налоговые органы (5)."},{"id":"law_nl10","subject":"soc","topic":"Налоговое право","type":"open","card":true,"max":2,"text":"Что такое налоговое правонарушение? Приведите примеры.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Налоговое правонарушение — виновное действие или бездействие, нарушающее законодательство о налогах и сборах, за которое Налоговым кодексом РФ предусмотрена ответственность.\nНапример, организация намеренно занизила облагаемый доход и вследствие этого не полностью уплатила налог.\nДругой пример: организация без законных оснований отказалась представить документы, которые налоговый орган правомерно запросил для проверки.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_nl11","subject":"soc","topic":"Налоговое право","type":"open","card":true,"max":2,"text":"Какая ответственность предусмотрена за нарушения законодательства о налогах и сборах? С какого возраста физическое лицо может привлекаться к ответственности за налоговое правонарушение?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"За нарушения законодательства о налогах и сборах предусмотрены:\n1) Налоговая ответственность. Предусмотрена Налоговым кодексом РФ. Применяется к организациям и физическим лицам. Налоговые санкции устанавливаются в форме денежных штрафов.\n2) Административная ответственность. Предусмотрена КоАП РФ. Наступает за установленные им нарушения в сфере налогообложения.\nНапример, должностное лицо может быть оштрафовано за непредставление сведений, необходимых для налогового контроля.\n3) Уголовная ответственность. Предусмотрена УК РФ. Наступает за налоговые преступления, например за уклонение от уплаты налогов в крупном размере. Применяется только к физическим лицам; возможны штраф, принудительные работы, лишение свободы и другие предусмотренные законом наказания.\nФизическое лицо может привлекаться к ответственности за налоговое правонарушение по НК РФ с 16 лет. При этом налогоплательщиком оно может быть и до достижения этого возраста.","hint":"Три вида ответственности. Возраст — 16 лет."},{"id":"law_nl12","subject":"soc","topic":"Налоговое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о налоговом праве и налоговой ответственности и запишите цифры, под которыми они указаны.","options":["Физическое лицо может быть привлечено к ответственности за налоговое правонарушение по НК РФ с 16 лет.","Налоговые санкции устанавливаются в форме денежных штрафов.","Уголовная ответственность за налоговые преступления применяется к организациям.","Несовершеннолетний может быть налогоплательщиком.","Налоговое право — подотрасль финансового права."],"answer":"1245","hint":"Вспомните, к кому по российскому праву применяется уголовная ответственность.","explain":"Верны 1, 2, 4 и 5. Уголовной ответственности подлежат только физические лица, организации к ней не привлекаются (3)."},{"id":"law_nl13","subject":"soc","topic":"Налоговое право","ege":22,"type":"open","max":4,"text":"Четырнадцатилетняя Вера получила от бабушки в дар долю в квартире. Через год ей пришло налоговое уведомление об уплате налога на имущество.\n1) Является ли Вера налогоплательщиком? Объясните почему.\n2) Кто обеспечивает исполнение налоговых обязанностей Веры?\n3) С какого возраста физическое лицо может быть привлечено к ответственности за налоговое правонарушение по НК РФ?\n4) Какой орган осуществляет налоговый контроль за уплатой этого налога?","criteria":[{"id":"K1","max":4,"text":"Правильно даны ответы на четыре вопроса — 4 балла; на 3 — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) Да: она собственник доли в квартире, то есть объекта налогообложения; налогоплательщиком может быть и несовершеннолетний.\n2) Её законные представители (родители).\n3) С 16 лет.\n4) Федеральная налоговая служба (её территориальный орган — налоговая инспекция).","hint":"Налогоплательщиком человека делает наличие объекта налогообложения, а не возраст."},{"id":"law_ek01","subject":"soc","topic":"Экологическое право","type":"open","card":true,"max":2,"text":"Что такое экологическое право? Какие отношения оно регулирует? Какими нормативными актами регулируются экологические отношения в РФ?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Экологическое право — отрасль права, регулирующая отношения по охране окружающей среды, использованию природных ресурсов и обеспечению экологической безопасности.\nОсновные источники:\n— Конституция РФ: статья 42 закрепляет экологические права, статья 58 — обязанность сохранять природу;\n— ФЗ «Об охране окружающей среды»;\n— Земельный, Водный и Лесной кодексы РФ;\n— Другие федеральные законы: «Об охране атмосферного воздуха», «О животном мире», «Об отходах производства и потребления» и др.;\n— Нормативные правовые акты субъектов РФ и органов местного самоуправления, принятые в пределах их полномочий.","hint":"Три группы отношений: охрана среды, природопользование, экологическая безопасность. Источники — от Конституции до местных актов."},{"id":"law_ek02","subject":"soc","topic":"Экологическое право","type":"open","card":true,"max":2,"text":"Назовите и кратко раскройте пять основных принципов охраны окружающей среды.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные принципы охраны окружающей среды:\n— Соблюдение права на благоприятную окружающую среду. Хозяйственная деятельность должна осуществляться с учётом необходимости защиты здоровья людей и природы.\n— Сочетание экологических, экономических и социальных интересов. Развитие экономики должно учитывать необходимость сохранения природы для нынешнего и будущих поколений.\n— Платность природопользования и возмещение экологического вреда. В предусмотренных законом случаях использование природных ресурсов является платным. Причинённый окружающей среде вред подлежит возмещению.\n— Презумпция экологической опасности планируемой деятельности. При планировании хозяйственной деятельности необходимо исходить из возможности её отрицательного воздействия на природу и заранее оценивать последствия.\n— Сохранение природных экосистем и биологического разнообразия. Необходимо охранять естественную среду обитания, разнообразие растений и животных.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_ek03","subject":"soc","topic":"Экологическое право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к принципам охраны окружающей среды? Запишите цифры, под которыми они указаны.","options":["презумпция экологической опасности планируемой хозяйственной деятельности","платность природопользования и возмещение вреда окружающей среде","бесплатное и неограниченное использование природных ресурсов","сохранение природных экосистем и биологического разнообразия","приоритет экономической выгоды над охраной природы","сочетание экологических, экономических и социальных интересов"],"answer":"1246","hint":"Принципы охраны среды ограничивают хозяйственную деятельность и требуют учитывать интересы будущих поколений.","explain":"Принципы — 1, 2, 4 и 6. Природопользование в предусмотренных законом случаях платное (3), а экономические интересы сочетаются с экологическими, а не ставятся выше их (5)."},{"id":"law_ek04","subject":"soc","topic":"Экологическое право","type":"open","card":true,"max":2,"text":"Какие экологические права и обязанности имеют граждане РФ?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Экологические права граждан:\n— Право на благоприятную окружающую среду;\n— Право на достоверную информацию о её состоянии;\n— Право на возмещение ущерба, причинённого здоровью или имуществу экологическим правонарушением;\n— Право создавать общественные объединения, занимающиеся охраной окружающей среды.\nЭкологические обязанности граждан:\n— Сохранять природу и окружающую среду;\n— Бережно относиться к природным богатствам;\n— Соблюдать требования экологического законодательства.\nНапример, нельзя выбрасывать мусор в неположенных местах, незаконно вырубать деревья, нарушать правила пожарной безопасности в лесах.","hint":"Четыре права и три обязанности. Вспомните ст. 42 и 58 Конституции."},{"id":"law_ek05","subject":"soc","topic":"Экологическое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о экологическом праве и запишите цифры, под которыми они указаны.","options":["Конституция РФ закрепляет право каждого на благоприятную окружающую среду.","Сохранять природу и окружающую среду — обязанность каждого.","Платность природопользования — один из принципов охраны окружающей среды.","Экологическое правонарушение может повлечь только уголовную ответственность.","Граждане не вправе создавать общественные объединения, занимающиеся охраной окружающей среды."],"answer":"123","hint":"За экологические правонарушения предусмотрено четыре вида ответственности. Вспомните перечень экологических прав граждан.","explain":"Верны 1, 2 и 3. За экологические правонарушения возможна имущественная, дисциплинарная, административная и уголовная ответственность (4). Право создавать экологические общественные объединения у граждан есть (5)."},{"id":"law_ek06","subject":"soc","topic":"Экологическое право","type":"open","card":true,"max":2,"text":"Что такое экологическое правонарушение? Какие виды юридической ответственности предусмотрены за экологические правонарушения?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Экологическое правонарушение — виновное противоправное действие или бездействие, нарушающее экологические требования и влекущее юридическую ответственность.\nНапример, незаконная вырубка леса, незаконная охота, сброс загрязняющих веществ в водоём с нарушением установленных требований.\nВиды ответственности за экологические правонарушения:\n1) Имущественная. Заключается в возмещении причинённого вреда.\nНапример, предприятие возмещает вред, причинённый загрязнением реки.\n2) Дисциплинарная. Наступает за виновное неисполнение или ненадлежащее исполнение работником трудовых обязанностей, связанных с охраной окружающей среды. Возможны замечание, выговор, увольнение по соответствующим основаниям.\nНапример, работнику объявили выговор за нарушение возложенных на него обязанностей по эксплуатации очистного оборудования.\n3) Административная. Наступает за экологические проступки, предусмотренные КоАП РФ или законами субъектов РФ. Возможны штраф и другие установленные законом наказания.\nНапример, гражданина оштрафовали за нарушение правил пожарной безопасности в лесу.\n4) Уголовная. Наступает за экологические преступления, предусмотренные УК РФ. Возможны штраф, обязательные или исправительные работы, лишение свободы и другие наказания.\nНапример, незаконная рубка лесных насаждений, совершённая в значительном размере.","hint":"Четыре вида ответственности: имущественная, дисциплинарная, административная, уголовная. К каждому — пример."},{"id":"law_ek07","subject":"soc","topic":"Экологическое право","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и видами юридической ответственности за экологические правонарушения: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["работнику объявили выговор за нарушение обязанностей по эксплуатации очистного оборудования","гражданина осудили за незаконную рубку лесных насаждений в значительном размере","предприятие возместило вред, причинённый загрязнением реки","начальника цеха уволили за неоднократное неисполнение обязанностей по охране окружающей среды","завод компенсировал ущерб от выброса загрязняющих веществ в атмосферу"],"right":["имущественная","дисциплинарная","уголовная"],"answer":"23121","hint":"Дисциплинарная ответственность связана с трудовыми обязанностями, имущественная — с возмещением вреда, уголовная назначается судом за преступление.","explain":"Имущественная: возмещение вреда от загрязнения реки (В) и ущерба от выбросов (Д). Дисциплинарная: выговор (А), увольнение (Г). Уголовная: незаконная рубка в значительном размере (Б)."},{"id":"law_so01","subject":"soc","topic":"Право социального обеспечения","type":"open","card":true,"max":2,"text":"Что такое право социального обеспечения?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Право социального обеспечения — отрасль российского права, регулирующая отношения по предоставлению гражданам пенсий, пособий, социальных услуг и других видов обеспечения в предусмотренных законом случаях.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_so02","subject":"soc","topic":"Право социального обеспечения","type":"open","card":true,"max":2,"text":"Каковы основные принципы права социального обеспечения?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные принципы права социального обеспечения:\n— Всеобщность. Каждый имеет право на социальное обеспечение при наличии установленных законом оснований.\n— Государственная гарантированность. Государство обеспечивает предоставление предусмотренных законом выплат и услуг лицам, имеющим на них право.\n— Многообразие видов обеспечения. Поддержка предоставляется в различных формах: пенсии, пособия, льготы, социальные услуги и другие.\n— Дифференциация условий и размеров обеспечения. Учитываются возраст, состояние здоровья, стаж, семейное положение и другие значимые обстоятельства.\n— Финансирование за счёт общественных средств. Основными источниками выступают средства бюджетов и обязательного социального страхования.","hint":"Пять принципов: всеобщность, гарантированность, многообразие видов, дифференциация, финансирование из общественных средств."},{"id":"law_so03","subject":"soc","topic":"Право социального обеспечения","type":"open","card":true,"max":2,"text":"Назовите 10 конкретных видов социальной поддержки граждан, реализуемых в России.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные виды социальной поддержки граждан:\n1) Страховая пенсия по старости. Ежемесячная выплата гражданам, достигшим установленного пенсионного возраста и имеющим необходимый страховой стаж и количество пенсионных баллов.\n2) Пенсия по инвалидности. Ежемесячная выплата гражданам, признанным инвалидами. Вид пенсии и условия её назначения определяются законом.\n3) Пенсия по случаю потери кормильца. Выплата нетрудоспособным членам семьи умершего кормильца при соблюдении установленных условий. Например, его несовершеннолетним детям.\n4) Пособие по временной нетрудоспособности. Компенсирует утраченный заработок застрахованного лица, например, во время болезни или ухода за больным ребёнком.\n5) Пособие по безработице. Временная денежная поддержка граждан, официально признанных безработными, при соблюдении установленных законом условий.\n6) Единое пособие беременным женщинам и семьям с детьми до 17 лет. Ежемесячная выплата, назначаемая с учётом нуждаемости и других установленных законом условий.\n7) Материнский (семейный) капитал. Государственная поддержка семей при рождении или усыновлении детей. Средства можно направить, например, на улучшение жилищных условий или образование детей.\n8) Субсидия на оплату жилого помещения и коммунальных услуг. Помощь гражданам, у которых расходы на жильё и коммунальные услуги, рассчитанные по установленным правилам, превышают допустимую долю семейного дохода.\n9) Социальная помощь на основании социального контракта. Поддержка, предполагающая выполнение гражданином согласованной программы выхода из трудной жизненной ситуации. Например, малоимущему гражданину предоставляют средства на открытие своего дела.\n10) Социальное обслуживание на дому. Помощь гражданам, признанным нуждающимися в социальных услугах. Например, социальный работник помогает пожилому человеку покупать продукты и лекарства, решать бытовые вопросы.","hint":"Три пенсии, три пособия, материнский капитал, субсидия на ЖКУ, социальный контракт, социальное обслуживание на дому."},{"id":"law_so04","subject":"soc","topic":"Право социального обеспечения","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к видам социального обеспечения граждан в РФ? Запишите цифры, под которыми они указаны.","options":["страховая пенсия по старости","пособие по безработице","материнский (семейный) капитал","административный штраф","заработная плата по трудовому договору","пенсия по случаю потери кормильца"],"answer":"1236","hint":"Социальное обеспечение предоставляется за счёт бюджетов и средств социального страхования, а не работодателем как плата за труд.","explain":"Виды социального обеспечения — 1, 2, 3 и 6. Штраф (4) — мера ответственности, зарплата (5) — вознаграждение за труд по трудовому договору."},{"id":"law_so05","subject":"soc","topic":"Право социального обеспечения","ege":15,"type":"match","max":2,"text":"Установите соответствие между ситуациями и видами социальной поддержки: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["работник получает выплату за время болезни","малоимущему гражданину выделили средства на открытие своего дела при условии выполнения согласованной программы","гражданину, признанному инвалидом, назначили ежемесячную выплату","мать получает выплату за время ухода за больным ребёнком","семья получила помощь при условии, что взрослые пройдут обучение и устроятся на работу по согласованной программе"],"right":["пенсия по инвалидности","пособие по временной нетрудоспособности","социальная помощь на основании социального контракта"],"answer":"23123","hint":"Социальный контракт — это помощь в обмен на выполнение гражданином программы выхода из трудной жизненной ситуации.","explain":"Пенсия по инвалидности: выплата инвалиду (В). Пособие по временной нетрудоспособности: болезнь (А), уход за больным ребёнком (Г). Социальный контракт: средства на своё дело (Б), помощь с обучением и трудоустройством (Д)."}],"images":{"g_supply":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20360%20300%22%20width%3D%22720%22%20height%3D%22600%22%3E%3Crect%20width%3D%22360%22%20height%3D%22300%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Cdefs%3E%3Cmarker%20id%3D%22ar%22%20viewBox%3D%220%200%2010%2010%22%20refX%3D%229%22%20refY%3D%225%22%20markerWidth%3D%227%22%20markerHeight%3D%227%22%20orient%3D%22auto%22%3E%3Cpath%20d%3D%22M0%200L10%205L0%2010z%22%20fill%3D%22%231B1F2A%22%2F%3E%3C%2Fmarker%3E%3C%2Fdefs%3E%3Cg%20stroke%3D%22%231B1F2A%22%20fill%3D%22none%22%20stroke-width%3D%222%22%3E%3Cpath%20d%3D%22M50%20268V18%22%20marker-end%3D%22url(%23ar)%22%2F%3E%3Cpath%20d%3D%22M42%20260H344%22%20marker-end%3D%22url(%23ar)%22%2F%3E%3C%2Fg%3E%3Cg%20stroke%3D%22%231B1F2A%22%20stroke-width%3D%222.5%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M80%2050L310%20240%22%2F%3E%3Cpath%20d%3D%22M70%20240L250%2050%22%2F%3E%3Cpath%20d%3D%22M130%20240L310%2050%22%2F%3E%3C%2Fg%3E%3Cpath%20d%3D%22M102%20214H146%22%20stroke%3D%22%231B1F2A%22%20stroke-width%3D%221.8%22%20fill%3D%22none%22%20marker-end%3D%22url(%23ar)%22%2F%3E%3Cg%20font-family%3D%22'Times%20New%20Roman'%2CTimes%2Cserif%22%20font-style%3D%22italic%22%20font-size%3D%2220%22%20fill%3D%22%231B1F2A%22%3E%3Ctext%20x%3D%2228%22%20y%3D%2226%22%3EP%3C%2Ftext%3E%3Ctext%20x%3D%22334%22%20y%3D%22286%22%3EQ%3C%2Ftext%3E%3Ctext%20x%3D%2233%22%20y%3D%22281%22%20font-style%3D%22normal%22%20font-size%3D%2216%22%3E0%3C%2Ftext%3E%3Ctext%20x%3D%22315%22%20y%3D%22248%22%3ED%3C%2Ftext%3E%3Ctext%20x%3D%22236%22%20y%3D%2240%22%3ES%3C%2Ftext%3E%3Ctext%20x%3D%22298%22%20y%3D%2240%22%3ES%3Ctspan%20dy%3D%225%22%20font-size%3D%2214%22%3E1%3C%2Ftspan%3E%3C%2Ftext%3E%3C%2Fg%3E%3C%2Fsvg%3E"}}</script>

const TKEY = 'ege-trainer-teacher';
if (location.hash === '#teacher') { canEdit = true; lsSet(TKEY, true); ui.tab = 'teacher'; }
else if (lsGet(TKEY) === true) canEdit = true;
window.addEventListener('hashchange', () => { if (location.hash === '#teacher') { canEdit = true; lsSet(TKEY, true); ui.tab = 'teacher'; render(); } });
const canShare = typeof navigator.share === 'function';

/* ---------- bank helpers ---------- */
const tasksOf = (subj, src) => (src || bank).tasks.filter(t => t.subject === subj);
const topicsOf = (subj, src) => { const out = []; tasksOf(subj, src).forEach(t => { if (!out.includes(t.topic)) out.push(t.topic); }); return out; };
const numOf = t => tasksOf(t.subject).indexOf(t) + 1;
const visibleTasks = () => { const all = tasksOf(store.subject); return ui.topic === 'all' ? all : all.filter(t => t.topic === ui.topic); };
function recState(t) { const r = store.rec[t.id]; if (!r) return 'none'; if (r.last >= t.max) return 'ok'; if (r.last > 0) return 'part'; return 'bad'; }
const errorTasks = subj => tasksOf(subj).filter(t => { const r = store.rec[t.id]; return r && r.last < t.max; });
function currentTask() {
  const list = visibleTasks();
  let t = list.find(x => x.id === ui.current[store.subject]);
  if (!t) { t = list.find(x => !store.rec[x.id]) || list.find(x => recState(x) !== 'ok') || list[0]; if (t) ui.current[store.subject] = t.id; }
  return t || null;
}

/* ---------- per-task working state ---------- */
const slotted = t => t.type === 'match' || t.type === 'table';
function blanksOf(t) {
  const out = [];
  (t.rows || []).forEach((r, ri) => r.forEach((c, ci) => { if (c === '_') out.push({ ri, ci, col: (t.head || [])[ci] || '' }); }));
  return out;
}
const nSlots = t => t.type === 'table' ? blanksOf(t).length : (t.left || []).length;
function mistakes(t, ans) {
  if (slotted(t)) { let e = 0; for (let i = 0; i < t.answer.length; i++) if ((ans[i] || '') !== t.answer[i]) e++; return 'Неверных позиций: ' + e + '.'; }
  if (t.type === 'choice') {
    const a = new Set(ans), k = new Set(t.answer.split('')); let miss = 0, extra = 0;
    k.forEach(x => { if (!a.has(x)) miss++; }); a.forEach(x => { if (!k.has(x)) extra++; });
    return 'Не отмечено верных вариантов: ' + miss + ', отмечено лишних: ' + extra + '.';
  }
  return '';
}
function fresh(t) {
  let ans = '';
  if (slotted(t)) ans = Array.from({ length: nSlots(t) }, () => '');
  else if (t.type === 'choice' || t.type === 'order') ans = [];
  else if (t.type === 'open') ans = store.drafts[t.id] || '';
  return { ans, phase: 'idle', score: null, tries: 0, hint: false, expl: '', explBusy: false, explErr: '', ctl: null,
    aiBusy: false, aiErr: '', review: null, selfOpen: false, self: {}, selfSaved: false, selfChanged: false, modelShown: false };
}
const st = t => ui.st[t.id] || (ui.st[t.id] = fresh(t));

function ready(t, s) {
  if (t.type === 'order') return s.ans.length === t.options.length;
  if (slotted(t)) return s.ans.every(Boolean);
  if (t.type === 'choice') return s.ans.length > 0;
  if (t.type === 'text') return norm(s.ans).length > 0;
  return false;
}
function hasInput(t, s) {
  if (slotted(t)) return s.ans.some(Boolean);
  if (t.type === 'text') return String(s.ans).length > 0;
  return s.ans.length > 0;
}
const ansString = (t, a) => t.type === 'choice' ? a.slice().sort().join('') : slotted(t) ? a.map(x => x || '·').join('') : t.type === 'order' ? a.join('') : String(a);

/* Scoring follows the ФИПИ rules (ЕГЭ-2027 specification):
   соответствие (1, 3, 5, 7): одна неверная позиция — минус 1 балл;
   таблица (4): 3 балла; одна ошибка — 2; две-три ошибки — 1;
   выбор (история 6, 12; обществознание 2, 4, 5, 7, 8, 10, 11, 14, 16): 1 балл, если один символ
   неверен, один лишний наряду с верными или одного не хватает. */
function scoreTask(t, ans) {
  if (t.type === 'order') return ans.join('') === t.answer ? t.max : 0;
  if (slotted(t)) {
    let err = 0; for (let i = 0; i < t.answer.length; i++) if ((ans[i] || '') !== t.answer[i]) err++;
    if (err === 0) return t.max;
    if (t.max >= 3) return err === 1 ? t.max - 1 : err <= 3 ? t.max - 2 : 0;
    return err === 1 && t.max > 1 ? t.max - 1 : 0;
  }
  if (t.type === 'choice') {
    const a = new Set(ans), k = new Set(t.answer.split('')); let miss = 0, extra = 0;
    k.forEach(x => { if (!a.has(x)) miss++; }); a.forEach(x => { if (!k.has(x)) extra++; });
    if (!miss && !extra) return t.max;
    const near = Math.max(miss, extra) <= 1;
    return near && t.max > 1 ? t.max - 1 : 0;
  }
  if (t.type === 'text') { const n = norm(ans); return t.answer.some(v => norm(v) === n) ? t.max : 0; }
  return 0;
}

function record(t, score, flags) {
  const r = store.rec[t.id] || { tries: 0 };
  if (r.first == null) { r.first = score; r.at = Date.now(); }
  r.last = score; r.tries = (r.tries || 0) + 1;
  if (flags && flags.self) r.self = true;
  if (flags && flags.ai) r.ai = true;
  store.rec[t.id] = r; save();
}

/* ---------- views ---------- */

function viewTasks() {

    (t ? (t.type === 'open' ? openCard(t) : testCard(t)) : '');

function overview(subj) {
  const tasks = tasksOf(subj);

    '<ul class="topics">' + topicsOf(subj).map(tp => {

function cardHead(t) {

function cellsRow(arr, n, cls, letters) {

}
function sheetFor(t, a, cls) {

function hintBlock(t) { return t.hint ? '<div class="hint"><span class="label">Подсказка</span>' + paras(t.hint) + '</div>' : ''; }
function figures(t) {

function closeZoom() { const z = document.getElementById('zoom'); if (z) { z.remove(); document.body.style.overflow = ''; } }
function openZoom(src) {
  closeZoom();
  const z = document.createElement('div');
  z.className = 'zoom'; z.id = 'zoom';
  z.setAttribute('role', 'dialog'); z.setAttribute('aria-modal', 'true'); z.setAttribute('aria-label', 'Изображение к заданию');
  z.innerHTML = '<div class="zoom-bar"><span>Нажми на изображение, чтобы приблизить или отдалить</span><button class="zoom-x" type="button">Закрыть</button></div><div class="zoom-s"><img alt="Изображение к заданию"></div>';

  img.addEventListener('click', () => { z.classList.toggle('big'); if (z.classList.contains('big')) { sc.scrollLeft = (sc.scrollWidth - sc.clientWidth) / 2; sc.scrollTop = 0; } });

function testCard(t) {
  const s = st(t), locked = s.phase !== 'idle';
  let inp = '';
  if (t.type === 'choice' || t.type === 'order') {
    inp = '<p class="how">' + (t.type === 'order' ? 'Нажимайте варианты по порядку, от самого раннего к самому позднему. Повторное нажатие убирает вариант.' : 'Отметьте все верные варианты.') + '</p>' +
      '<ol class="opts">' + t.options.map((o, i) => {
