<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренажёр ЕГЭ по истории и обществознанию</title>
<meta name="description" content="Задания ЕГЭ по истории и обществознанию: автопроверка тестов, подсказки, самопроверка развёрнутых ответов и работа над ошибками.">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141D" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренажёр ЕГЭ">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22sky%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%0A%3Cstop%20offset%3D%220%22%20stop-color%3D%22%231F357F%22%2F%3E%3Cstop%20offset%3D%220.55%22%20stop-color%3D%22%235B70BE%22%2F%3E%3Cstop%20offset%3D%220.86%22%20stop-color%3D%22%23E8B97E%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%0A%3Crect%20width%3D%22512%22%20height%3D%22512%22%20fill%3D%22url(%23sky)%22%2F%3E%0A%3Ccircle%20cx%3D%22372%22%20cy%3D%22262%22%20r%3D%2240%22%20fill%3D%22%23FFE6B8%22%2F%3E%3Cpath%20d%3D%22M0%20318%20Q70%20286%20128%20300%20Q190%20268%20252%20292%20Q330%20262%20392%20288%20Q452%20270%20512%20290%20L512%20512%20L0%20512Z%22%20fill%3D%22%237C86BF%22%20opacity%3D%220.75%22%2F%3E%3Cpath%20d%3D%22M0%20352%20Q40%20336%2070%20318%20Q96%20300%20118%20304%20Q134%20292%20150%20296%20L186%20238%20Q206%20200%20222%20176%20Q232%20160%20242%20158%20Q252%20160%20262%20178%20L290%20232%20Q300%20244%20312%20236%20Q326%20214%20340%20212%20Q352%20214%20364%20238%20L384%20276%20Q404%20272%20422%20286%20Q446%20296%20470%20316%20Q492%20330%20512%20336%20L512%20512%20L0%20512Z%22%20fill%3D%22%2314203B%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Golos+Text:wght@400;500;600&family=PT+Mono&display=swap">
<style id="app-css">
/* Layout: one workbook column; the ЕГЭ answer-sheet cell row is the signature element */
:root{
  --paper:#EDF0F5; --sheet:#FFFFFF; --ink:#172036; --muted:#566077; --line:#D4DAE4; --line-strong:#9BA5B9; --rule:#DCE3EF;
  --accent:#2B47A3; --accent-soft:#E3E9F8; --on-strong:#FFFFFF;
  --fig-bg:#FFFFFF; --scrim:rgba(9,12,19,.94); --on-scrim:#F2F4F8;
  --hist:#8E3B2C; --hist-soft:#F5E6E2; --soc:#1C6670; --soc-soft:#DDEFF0;
  --ok:#1D7448; --ok-soft:#DFF1E6; --part:#94600C; --part-soft:#F6EAD3; --bad:#AF3535; --bad-soft:#F7E1E1;
  --f-display:"Alegreya","PT Serif",Georgia,serif;
  --f-body:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"PT Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10141D; --sheet:#181E2A; --ink:#E5E9F1; --muted:#9AA3B7; --line:#2A3244; --line-strong:#4A556C; --rule:#232B3B;
  --accent:#93AAF2; --accent-soft:#1F2945; --on-strong:#10141D; --fig-bg:#ECEEF2;
  --hist:#E39582; --hist-soft:#36211D; --soc:#72C3CC; --soc-soft:#16302F;
  --ok:#68C995; --ok-soft:#15291E; --part:#E2AE5B; --part-soft:#30261A; --bad:#EE8A8A; --bad-soft:#371C1F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#10141D; --sheet:#181E2A; --ink:#E5E9F1; --muted:#9AA3B7; --line:#2A3244; --line-strong:#4A556C; --rule:#232B3B;
  --accent:#93AAF2; --accent-soft:#1F2945; --on-strong:#10141D; --fig-bg:#ECEEF2;
  --hist:#E39582; --hist-soft:#36211D; --soc:#72C3CC; --soc-soft:#16302F;
  --ok:#68C995; --ok-soft:#15291E; --part:#E2AE5B; --part-soft:#30261A; --bad:#EE8A8A; --bad-soft:#371C1F;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 56px}
.app{--subj:var(--hist);--subj-soft:var(--hist-soft);max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.app[data-subj="soc"]{--subj:var(--soc);--subj-soft:var(--soc-soft)}
h1,h2,h3{text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;border:1.5px solid var(--ink);padding:7px 6px 6px 8px;line-height:1;border-radius:2px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:-.01em}
.brand p{margin-top:4px;color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:var(--sheet)}
.seg-b{appearance:none;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg-b.on{background:var(--subj);color:var(--on-strong)}

/* tabs */
.tabs-wrap{overflow-x:auto;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);min-width:max-content}
.tab{appearance:none;border:0;background:none;font-size:15px;color:var(--muted);padding:10px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--subj);font-weight:600}
.count{font-family:var(--f-mono);font-size:12px;background:var(--bad-soft);color:var(--bad);padding:1px 7px;border-radius:999px;font-weight:400}

/* topic chips + navigator */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;appearance:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip.on{border-color:var(--subj);color:var(--subj);background:var(--subj-soft);font-weight:500}
.navbox{display:flex;flex-direction:column;gap:10px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.nav{width:40px;height:40px;font-family:var(--f-mono);font-size:15px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);border-radius:3px;cursor:pointer;font-variant-numeric:tabular-nums}
.nav.s-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.nav.s-part{background:var(--part-soft);border-color:var(--part);color:var(--part)}
.nav.s-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.nav.cur{outline:2px solid var(--subj);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border:1px solid var(--line-strong);border-radius:2px;background:var(--sheet)}
.legend i.ok{background:var(--ok-soft);border-color:var(--ok)}
.legend i.part{background:var(--part-soft);border-color:var(--part)}
.legend i.bad{background:var(--bad-soft);border-color:var(--bad)}

/* task card */
.task{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}
.task-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.task-no{font-family:var(--f-mono);font-size:14px;border:1.5px solid var(--subj);color:var(--subj);padding:3px 7px 2px;border-radius:2px;white-space:nowrap}
.tag{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tag-topic{letter-spacing:0;text-transform:none;font-size:13px;color:var(--subj)}
.task-pts{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prompt{display:flex;flex-direction:column;gap:10px;font-size:17px;line-height:1.55;max-width:65ch}
.src{margin:0;padding:14px 16px;border-left:3px solid var(--subj);background:var(--paper);font-family:var(--f-display);font-size:17px;line-height:1.6;display:flex;flex-direction:column;gap:8px;border-radius:0 4px 4px 0}
.src-l{font-family:var(--f-body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.how{font-size:14px;color:var(--muted)}

.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;font-size:16px;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--line-strong)}
.opt:disabled{cursor:default}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt-d{flex:none;width:26px;height:26px;display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;border:1px solid var(--line-strong);border-radius:2px;background:var(--sheet)}
.opt.on .opt-d{background:var(--accent);color:var(--on-strong);border-color:var(--accent)}
.opt-t{flex:1;min-width:0;padding-top:1px}
.pos{flex:none;align-self:center;font-family:var(--f-mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px}

.match{display:flex;flex-direction:column;gap:14px}
.right{list-style:none;margin:0;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:4px}
.right li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.right li .opt-d{width:24px;height:24px;font-size:13px}
.col-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mrow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.mleft{display:flex;gap:10px;align-items:flex-start}
.mlet{font-family:var(--f-mono);font-weight:700;width:24px;flex:none;text-align:center;color:var(--subj)}
.mpick{display:flex;flex-wrap:wrap;gap:6px;padding-left:34px}
.pick{width:38px;height:38px;font-family:var(--f-mono);font-size:15px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);border-radius:3px;cursor:pointer}
.pick.on{background:var(--accent);border-color:var(--accent);color:var(--on-strong)}
.pick:disabled{cursor:default;opacity:.55}
.pick.on:disabled{opacity:1}

/* answer-sheet cells */
.answer{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px}
.answer-l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:12px}
.sheet{display:flex;flex-direction:column;width:max-content}
.sheet-r{display:flex}
.sheet .lh{width:34px;font-family:var(--f-mono);font-size:13px;text-align:center;color:var(--muted);padding-bottom:3px}
.c{width:34px;height:42px;display:grid;place-items:center;font-family:var(--f-mono);font-size:20px;border:1px solid var(--line-strong);border-left-width:0;background:var(--sheet);color:var(--ink)}
.c:first-child{border-left-width:1px}
.c.f{color:var(--accent)}
.sheet.key .c.f{color:var(--ok)}
.sheet.mine .c.f{color:var(--muted)}
.sheet-wrap{overflow-x:auto;max-width:100%}
.term{font-family:var(--f-mono);font-size:20px;letter-spacing:.06em;padding:8px 12px;border:1px solid var(--line-strong);border-radius:3px;background:var(--sheet);color:var(--ink);width:100%;max-width:380px;min-height:46px}
.essay{width:100%;min-height:210px;font:inherit;font-size:16px;line-height:26px;padding:6px 14px;border:1px solid var(--line-strong);border-radius:4px;color:var(--ink);resize:vertical;
  background-color:var(--sheet);background-image:repeating-linear-gradient(to bottom,transparent 0 25px,var(--rule) 25px 26px);background-position:0 6px;background-attachment:local}
.lbl{font-size:14px;font-weight:500;margin-bottom:-8px}
.meta{font-size:13px;color:var(--muted);margin-top:-8px;font-variant-numeric:tabular-nums}

/* buttons */
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{appearance:none;font-size:15px;font-weight:500;padding:9px 16px;border-radius:4px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);cursor:pointer;min-height:42px;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-strong)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--line)}
.btn.small{font-size:13px;padding:5px 10px;min-height:32px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* feedback */
.hint{background:var(--accent-soft);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.hint .label{color:var(--accent)}
.fb{border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line-strong);background:var(--paper)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.part{background:var(--part-soft);border-color:var(--part)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb-h{font-weight:600;font-size:17px}
.fb.ok .fb-h{color:var(--ok)}
.fb.part .fb-h{color:var(--part)}
.fb.bad .fb-h{color:var(--bad)}
.keys{display:flex;flex-wrap:wrap;gap:12px 24px}
.ai-out{border-top:1px dashed var(--line-strong);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ai-text{white-space:pre-wrap}
.busy{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--bad);font-size:15px}
.note{font-size:14px;color:var(--muted)}
.ok-msg{color:var(--ok);font-size:14px;font-weight:500}

.review{border-top:1px dashed var(--line-strong);padding-top:16px;display:flex;flex-direction:column;gap:4px}
.review-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.review-h span{font-weight:600}
.review-h b{font-family:var(--f-mono);font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}
.crit{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.crit-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.crit-id{font-family:var(--f-mono);font-weight:700}
.crit-s{font-family:var(--f-mono);font-size:14px;padding:1px 9px;border-radius:999px;white-space:nowrap}
.crit-s.s-ok{background:var(--ok-soft);color:var(--ok)}
.crit-s.s-part{background:var(--part-soft);color:var(--part)}
.crit-s.s-bad{background:var(--bad-soft);color:var(--bad)}
.crit-s.s-none{color:var(--muted)}
.crit-t{color:var(--muted);font-size:14px}
.review > .hint,.review > .model,.review > .row,.review > .note{margin-top:10px}
.model{background:var(--paper);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.model .txt{display:flex;flex-direction:column;gap:8px}

/* lists */
.lead{color:var(--muted);max-width:65ch}
.elist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.erow{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.erow:hover{border-color:var(--line-strong)}
.erow-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.erow-t{font-size:13px;color:var(--muted)}
.erow-x{font-size:15px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.erow-s{font-family:var(--f-mono);font-size:14px;color:var(--bad);white-space:nowrap}
.empty{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:24px 20px;display:flex;flex-direction:column;gap:8px}
.empty h2{font-family:var(--f-display);font-size:24px;margin:0}

/* progress */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{background:var(--sheet);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.tp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.tp-n{font-size:15px}
.tp-v{font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{grid-column:1/-1;height:8px;background:var(--paper);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:999px}
.bar i.ok{background:var(--ok)}
.topics{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.topic-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:baseline;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.topic-row:hover{border-color:var(--line-strong)}
.tr-n{font-size:16px;font-weight:500}
.tr-c{font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.topic-row .bar{grid-column:1/-1;display:flex}
.topic-row .bar i{border-radius:0} .bar i.part{background:var(--part)} .bar i.bad{background:var(--bad)}
.advice{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.advice li{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.advice li p{flex:1 1 260px;min-width:0}
.box{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500}
.field small{color:var(--muted);font-size:13px}
.field input,.field textarea,.field select{font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:4px;background:var(--sheet);color:var(--ink);width:100%;min-width:0}
.field textarea{resize:vertical;line-height:1.45}
.report{font-family:var(--f-mono);font-size:13px;line-height:1.5;min-height:180px}
.fields2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

/* teacher */
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow .erow-m{flex:1 1 220px}
.trow-a{display:flex;gap:6px;flex-wrap:wrap}
.dirty{background:var(--part-soft);border:1px solid var(--part);border-radius:4px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dirty p{flex:1 1 220px}
.tform{display:flex;flex-direction:column;gap:14px}
.sub-h{font-family:var(--f-display);font-size:20px;font-weight:700;margin:6px 0 0}

@media (max-width:480px){
  .task{padding:16px}
  .tab{font-size:14px;padding:10px 9px}
  .brand h1{font-size:26px}
  .stat b{font-size:19px}
  .prompt,.src{font-size:16px}
}
/* figures: maps, schemes, illustrations sit on a paper-white plate in both themes */
.figs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.figs.one{grid-template-columns:minmax(0,1fr)}
.fig{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.fig-n{font-family:var(--f-mono);font-size:14px;color:var(--subj)}
.fig-b{appearance:none;display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--fig-bg);cursor:zoom-in}
.fig-b img{display:block;width:100%;height:auto;max-height:440px;object-fit:contain}
.fig-cap{font-size:13px;color:var(--muted);margin-top:-8px}
.zoom{position:fixed;inset:0;z-index:50;background:var(--scrim);color:var(--on-scrim);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.zoom-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;font-size:14px}
.zoom-x{appearance:none;border:1px solid currentColor;background:transparent;color:inherit;border-radius:4px;padding:7px 14px;font:inherit;cursor:pointer}
.zoom-s{flex:1;min-height:0;overflow:auto;display:flex;padding:0 16px 16px}
.zoom-s img{margin:auto;max-width:100%;max-height:100%;background:var(--fig-bg);cursor:zoom-in}
.zoom.big .zoom-s img{margin:0;max-width:none;max-height:none;width:200%;height:auto;cursor:zoom-out}
.flabel{font-size:14px;font-weight:500}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.thumb img,.thumb-add img{display:block;width:120px;height:90px;object-fit:contain;background:var(--fig-bg);border:1px solid var(--line);border-radius:4px}
.thumb-add{appearance:none;padding:0;border:0;background:transparent;cursor:pointer;border-radius:4px}
.thumb-add:hover img{border-color:var(--accent)}
label.btn{display:inline-flex;align-items:center}
.tag-ege{font-family:var(--f-mono);letter-spacing:0;text-transform:none;color:var(--ink);border:1px solid var(--line-strong);border-radius:2px;padding:1px 6px}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;width:100%;min-width:440px;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line-strong);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{font-weight:600;font-size:13px;color:var(--muted);background:var(--paper)}
.tbl td.blank{background:var(--accent-soft);white-space:nowrap}
.tbl .tv{font-family:var(--f-mono);font-size:17px;color:var(--accent);margin-left:8px}
.vh,.field input.vh{position:absolute;width:1px;height:1px;padding:0;border:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.field{position:relative}
@media (prefers-reduced-motion: reduce){.spin{animation:none}*{scroll-behavior:auto!important}}

<script type="application/json" id="bank">{"version":1,"tasks":[{"id":"r_c01","subject":"hist","topic":"Древняя Русь","type":"open","card":true,"max":2,"text":"Рюрик (862–879). Назовите годы и главные события правления.","criteria":[{"id":"K1","max":2,"text":"Названы годы правления и три ключевых события без фактических ошибок — 2 балла; названы два события или есть одна неточность — 1 балл; названо одно событие или ответ неверный — 0 баллов."}],"model":"Годы правления: 862–879.\n1) В 862 году, согласно летописной традиции, был призван на княжение в Новгородскую землю.\n2) Подчинил своему влиянию ряд северных племён и укрепил княжескую власть.\n3) Положил начало династии Рюриковичей, правившей русскими землями более семи столетий.","hint":"Период: древняя русь. Вспомните, чем запомнилось это правление: войны, реформы, законы, постройки."},{"id":"r_c02","subject":"hist","topic":"Древняя Русь","type":"open","card":true,"max":2,"text":"Олег Вещий (879–912). Назовите годы и главные события правления.","criteria":[{"id":"K1","max":2,"text":"Названы годы правления и три ключевых события без фактических ошибок — 2 балла; названы два события или есть одна неточность — 1 балл; названо одно событие или ответ неверный — 0 баллов."}],"model":"Годы правления: 879–912.\n1) В 882 году захватил Киев, объединил северный и южный центры Руси и сделал Киев столицей.\n2) В 907 году совершил поход на Константинополь и, согласно летописи, прибил щит к вратам Царьграда.\n3) Договоры с Византией 907 и 911 годов предоставили русским купцам выгодные условия торговли.","hint":"Период: древняя русь. Вспомните, чем запомнилось это правление: войны, реформы, законы, постройки."},{"id":"r_ch02","subject":"hist","topic":"Древняя Русь","type":"choice","max":2,"text":"Правитель: Олег Вещий (879–912). Какие три из перечисленных событий относятся к этому правлению? Запишите цифры, под которыми они указаны.","options":["Поражение в битве на реке Альте и утрата киевского престола","Поход на Константинополь, щит на вратах Царьграда","Принятие христианства в Константинополе","Договор с Византией, давший выгодные условия торговли русским купцам","Захват Киева и объединение северного и южного центров Руси","Любечский съезд князей"],"answer":"245","hint":"Сравните даты событий с годами правления: 879–912. Лишние события относятся к другим правителям.","explain":"К правлению (879–912) относятся: 2 — поход на Константинополь, щит на вратах Царьграда (907 г.); 4 — договор с Византией, давший выгодные условия торговли русским купцам (911 г.); 5 — захват Киева и объединение северного и южного центров Руси (882 г.). Остальные: 1 — поражение в битве на реке Альте и утрата киевского престола (Святополк Окаянный, 1019 г.); 3 — принятие христианства в Константинополе (Ольга); 6 — Любечский съезд князей (Святополк Изяславич, 1097 г.)."},{"id":"r_c03","subject":"hist","topic":"Древняя Русь","type":"open","card":true,"max":2,"text":"Игорь Рюрикович (912–945). Назовите годы и главные события правления.","criteria":[{"id":"K1","max":2,"text":"Названы годы правления и три ключевых события без фактических ошибок — 2 балла; названы два события или есть одна неточность — 1 балл; названо одно событие или ответ неверный — 0 баллов."}],"model":"Годы правления: 912–945.\n1) В 914 году восстановил подчинение древлян и продолжил укреплять систему сбора дани.\n2) Во время похода на Константинополь в 941 году русский флот был сожжён византийским «греческим огнём»; новый договор был заключён в 944 году.\n3) В 945 году был убит древлянами при попытке повторно собрать с них дань.","hint":"Период: древняя русь. Вспомните, чем запомнилось это правление: войны, реформы, законы, постройки."},{"id":"r_ch03","subject":"hist","topic":"Древняя Русь","type":"choice","max":2,"text":"Правитель: Игорь Рюрикович (912–945). Какие три из перечисленных событий относятся к этому правлению? Запишите цифры, под которыми они указаны.","options":["Любечский съезд князей","Мир с Византией после обороны Доростола","Принятие Правды Ярославичей","Гибель князя при попытке повторно собрать дань с древлян","Договор Руси с Византией после неудачного похода","Поход на Константинополь, русский флот сожжён «греческим огнём»"],"answer":"456","hint":"Сравните даты событий с годами правления: 912–945. Лишние события относятся к другим правителям.","explain":"К правлению (912–945) относятся: 4 — гибель князя при попытке повторно собрать дань с древлян (945 г.); 5 — договор Руси с Византией после неудачного похода (944 г.); 6 — поход на Константинополь, русский флот сожжён «греческим огнём» (941 г.). Остальные: 1 — Любечский съезд князей (Святополк Изяславич, 1097 г.); 2 — мир с Византией после обороны Доростола (Святослав Игоревич, 971 г.); 3 — принятие Правды Ярославичей (Ярославичи, 1072 г.)."},{"id":"r_c04","subject":"hist","topic":"Древняя Русь","type":"open","card":true,"max":2,"text":"Княгиня Ольга (945–964). Назовите годы и главные события правления.","criteria":[{"id":"K1","max":2,"text":"Названы годы правления и три ключевых события без фактических ошибок — 2 балла; названы два события или есть одна неточность — 1 балл; названо одно событие или ответ неверный — 0 баллов."}],"model":"Годы правления: 945–964.\n1) После гибели Игоря в 945 году подавила восстание древлян и сохранила престол за малолетним Святославом.\n2) Провела налоговую реформу, установив уроки — размеры дани — и погосты — места её сбора.\n3) Около 957 года приняла христианство в Константинополе, создав предпосылки для будущего Крещения Руси.","hint":"Период: древняя русь. Вспомните, чем запомнилось это правление: войны, реформы, законы, постройки."},{"id":"r_ch04","subject":"hist","topic":"Древняя Русь","type":"choice","max":2,"text":"Правитель: Княгиня Ольга (945–964). Какие три из перечисленных событий относятся к этому правлению? Запишите цифры, под которыми они указаны.","options":["Подавление восстания древлян","Долобский съезд князей","Гибель князя в столкновении с печенегами","Принятие христианства в Константинополе","Установление уроков и погостов","Объединение большей части Руси после смерти Мстислава Тмутараканского"],"answer":"145","hint":"Сравните даты событий с годами правления: 945–964. Лишние события относятся к другим правителям.","explain":"К правлению (945–964) относятся: 1 — подавление восстания древлян (945 г.); 4 — принятие христианства в Константинополе; 5 — установление уроков и погостов. Остальные: 2 — Долобский съезд князей (Святополк Изяславич, 1103 г.); 3 — гибель князя в столкновении с печенегами (Святослав Игоревич, 972 г.); 6 — объединение большей части Руси после смерти Мстислава Тмутараканского (Ярослав Мудрый, 1036 г.)."},{"id":"r_c05","subject":"hist","topic":"Древняя Русь","type":"open","card":true,"max":2,"text":"Святослав Игоревич (964–972). Назовите годы и главные события правления.","criteria":[{"id":"K1","max":2,"text":"Названы годы правления и три ключевых события без фактических ошибок — 2 балла; названы два события или есть одна неточность — 1 балл; названо одно событие или ответ неверный — 0 баллов."}],"model":"Годы правления: 964–972.\n1) В 965 году разгромил Хазарский каганат и установил контроль над важными торговыми путями.\n2) В 968 году начал походы на Балканы и пытался перенести политический центр государства в Переяславец на Дунае.\n3) После войны с Византией заключил мир в 971 году, а в 972 году погиб в столкновении с печенегами.","hint":"Период: древняя русь. Вспомните, чем запомнилось это правление: войны, реформы, законы, постройки."},{"id":"r_ch05","subject":"hist","topic":"Древняя Русь","type":"choice","max":2,"text":"Правитель: Святослав Игоревич (964–972). Какие три из перечисленных событий относятся к этому правлению? Запишите цифры, под которыми они указаны.","options":["Гибель Олега Святославича в междоусобной борьбе братьев","Начало походов на Балканы, попытка перенести центр государства в Переяславец на Дунае","Любечский съезд князей","Захват Киева и объединение северного и южного центров Руси","Гибель князя в столкно т засчитывается, если в нём есть конкретный факт и объяснение его связи с точкой зрения."}],"model":"1) Иван Калита добился права собирать ордынскую дань с ряда русских земель, что укрепило московскую казну и влияние князя.\n2) При нём Москва стала постоянной резиденцией русских митрополитов и важнейшим духовным центром Руси.\n(Также: после Тверского восстания 1327 г. он получил ханскую поддержку и ослабил главного соперника — Тверь.)","hint":"Подумайте о деньгах, церкви и борьбе с Тверью."},{"id":"r_c31","subject":"hist","topic":"Российское царство","type":"open","card":true,"max":2,"text":"Иван IV Грозный (1533–1584). Назовите годы и главные события правления.","criteria":[{"id":"K1","max":2,"text":"Названы годы правления и три ключевых события без фактических ошибок — 2 балла; названы два события или есть одна неточность — 1 балл; названо одно событие или ответ неверный — 0 баллов."}],"model":"Годы правления: 1533–1584.\n1) В 1547 году венчался на царство, а реформы 1550-х годов создали стрелецкое войско и усовершенствовали систему управления.\n2) В 1552 и 1556 годах присоединил Казанское и Астраханское ханства.\n3) Ливонская война 1558–1583 годов и опричнина 1565–1572 годов истощили страну и привели к тяжёлому хозяйственному кризису.","hint":"Период: российское царство. Вспомните, чем запомнилось это правление: войны, реформы, законы, постройки."},{"id":"r_ch31","subject":"hist","topic":"Российское царство","type":"choice","max":2,"text":"Правитель: Иван IV Грозный (1533–1584). Какие три из перечисленных событий относятся к этому правлению? Запишите цифры, под которыми они указаны.","options":["Отмена местничества","Убийство самозванца в результате боярского заговора","Создание стрелецкого войска","Созыв первого Земского собора","Начало церковной реформы патриарха Никона","Введение опричнины"],"answer":"346","hint":"Сравните даты событий с годами правления: 1533–1584. Лишние события относятся к другим правителям.","explain":"К правлению (1533–1584) относятся: 3 ами их правления: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["Алексей Михайлович","Фёдор Иванович","Пётр I","Иван IV Грозный"],"right":["1533–1584","1584–1598","1613–1645","1645–1676","1682–1725","1682–1696"],"answer":"4251","hint":"Вспомните, кто правил до и после каждого из них: годы правлений идут друг за другом.","explain":"А — 1645–1676; Б — 1584–1598; В — 1682–1725; Г — 1533–1584. Лишние: 1613–1645 — Михаил Фёдорович; 1682–1696 — Иван V."},{"id":"r_h04","subject":"hist","topic":"Российское царство","ege":3,"type":"match","max":2,"text":"Установите соответствие между процессами (явлениями, событиями) и фактами, относящимися к этим процессам (явлениям, событиям): к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["реформы Ивана IV 1550-х гг.","Смутное время","правление Алексея Михайловича","правление Фёдора Алексеевича"],"right":["создание стрелецкого войска","принятие Соборного уложения","учреждение Сената","отмена местничества","введение подушной подати","восстание Ивана Болотникова"],"answer":"1624","hint":"Лишние факты относятся к правлению Петра I.","explain":"Реформы 1550-х — стрелецкое войско; Смута — восстание Болотникова (1606–1607 гг.); Алексей Михайлович — Соборное уложение (1649 г.); Фёдор Алексеевич — отмена местничества (1682 г.). Сенат и подушная подать — реформы Петра I."},{"id":"r_o10","subject":"hist","topic":"Российское царство","ege":19,"type":"open","max":3,"text":"Для Смутного времени укажите:\nа) одну причину, связанную с прекращением правящей династии;\nб) одну причину, связанную с хозяйственным положением страны;\nв) событие, положившее начало выходу из Смуты в 1613 г.","criteria":[{"id":"K1","max":3,"text":"Правильно указаны три элемента (а, б, в) — 3 балла; два элемента — 2 балла; один элемент — 1 балл; ответ неправильный или рассуждения общего характера — 0 баллов."}],"model":"А) В 1598 г. умер бездетный Фёдор Иванович, и московская линия Рюриковичей прекратилась.\nб) Голод 1601–1603 гг. вызвал массовую смертность, разорение хозяйства и падение авторитета власти.\nв) Избрание Михаила Романова Земским собором в 1613 г., начало династии Романовых.","hint":"Каждый пункт — отдельный вопрос: династия, голод, Земский собор."},{"id":"r_o11","subject":"hist","topic":"Российское царство","ege":19,"type":"open","max":3,"text":"Для Соборного уложения 1649 г. укажите:\nа) событие 1648 г., ускорившее подготовку нового законодательства;\nб) одно положение Уложения, касающееся крестьян;\nв) одно значение Уложения для государства.","criteria":[{"id":"K1","max":3,"text":"Правильно указаны три элемента (а, б, в) — 3 балла; два элемента — 2 балла; один элемент — 1 балл; ответ неправильный или рассуждения общего характера — 0 баллов."}],"model":"А) Соляной бунт 1648 г., после которого власть созвала Земский собор.\nб) Окончательное закрепощение крестьян (бессрочный сыск беглых).\nв) Уложение стало общегосударственным сводом законов.","hint":"Вспомните городское восстание 1648 г. и что Уложение изменило в положении крестьян."},{"id":"r_o12","subject":"hist","topic":"Российское царство","ege":20,"type":"open","max":2,"text":"Используя знание исторического понятия «местничество», объясните его смысл и укажите, как изменился порядок назначений после его отмены в 1682 г. Дайте только один ответ на каждый вопрос.","criteria":[{"id":"K1","max":2,"text":"Правильно даны два ответа — 2 балла; один ответ — 1 балл; ответ неправильный — 0 баллов. Если на вопрос дано несколько ответов, оценивается только первый."}],"model":"1) Местничество — порядок назначения на должности в зависимости от знатности рода и службы предков.\n2) После отмены назначения стали меньше зависеть от знатности рода, больше — от личных заслуг.","hint":"Почему спор «чей род знатнее» мешал армии и управлению?"},{"id":"r_o13","subject":"hist","topic":"Российское царство","ege":20,"type":"open","max":2,"text":"Используя знание исторического понятия «опричнина», объясните его смысл и укажите одно последствие опричнины для страны. Дайте только один ответ на каждый вопрос.","criteria":[{"id":"K1","max":2,"text":"Правильно даны два ответа — 2 балла; один ответ — 1 балл; ответ неправильный — 0 баллов. Если на вопрос дано несколько ответов, оценивается только первый."}],"model":"1) Опричнина — политика Ивана IV в 1565–1572 гг.: выделение части территории государства в особое управление царя с собственным войском и проведение массовых репрессий.\n2) Опричнина вместе с Ливонской войной истощила страну и привела к тяжёлому хозяйственному кризису.","hint":"Годы опричнины — 1565–1572. Что стало со страной к концу правления Ивана IV?"},{"id":"r_o14","subject":"hist","topic":"Российское царство","ege":20,"type":"open","max":2,"text":"Используя знание исторического понятия «крестоцеловальная запись», объясните его смысл и укажите, что обещал в ней Василий Шуйский. Дайте только один ответ на каждый вопрос.","criteria":[{"id":"K1","max":2,"text":"Правильно даны два ответа — 2 балла; один ответ — 1 балл; ответ неправильный — 0 баллов. Если на вопрос дано несколько ответов, оценивается только первый."}],"model":"1) Крестоцеловальная запись — клятвенное обязательство царя, скреплённое целованием креста.\n2) Василий Шуйский обещал не наказывать бояр без суда.","hint":"Это первая в истории России попытка ограничить произвол монарха."},{"id":"r_o15","subject":"hist","topic":"Российское царство","ege":21,"type":"open","max":3,"text":"Сравните приход к власти Бориса Годунова и Михаила Романова. Сформулируйте один тезис о сходстве и приведите два обоснования этого тезиса с опорой на исторические факты. В каждом обосновании приведите факты по обоим царям.","criteria":[{"id":"K1","max":3,"text":"Сформулирован верный тезис и приведены два корректных обоснования с фактами — 3 балла. Тезис и одно корректное обоснование или два обоснования с неточностями, не искажающими смысла, — 2 балла. Тезис без корректных обоснований — 1 балл. Тезис неверный или не сформулирован — 0 баллов. Общие рассуждения фактами не считаются; оценивается только первый тезис."}],"model":"Тезис: оба царя пришли к власти путём избрания после пресечения прежней династии.\nОбоснование 1: Борис Годунов в 1598 г. и Михаил Романов в 1613 г. были избраны Земским собором.\nОбоснование 2: Годунов стал царём после смерти бездетного Фёдора Ивановича, когда прекратилась московская линия Рюриковичей; Михаил — после Смуты, когда законной династии не осталось (свергнуты Годуновы, Лжедмитрий I и Василий Шуйский).","hint":"Как они пришли к власти и что случилось с прежней династией?"},{"id":"r_c43","subject":"hist","topic":"Российская империя","type":"open","card":true,"max":2,"text":"Екатерина I (1725–1727). Назовите годы и главные события правления.","criteria":[{"id":"K1","max":2,"text":"Названы годы правления и три ключевых события без фактических ошибок — 2 балла; названы два события или есть одна неточность — 1 балл; названо одно событие или ответ неверный — 0 баллов."}],"model":"Годы правления: 1725–1727.\n1) В 1725 году заняла престол при поддержке гвардии и Александра Меншикова.\n2) В 1726 году учредила Верховный тайный совет, сосредоточивший руководство важнейшими государственными делами.\n3) Перед смертью в 1727 году назначила наследником Петра II.","hint":"Период: российская империя. Вспомните, чем запомнилось это правление: войны, реформы, законы, постройки."},{"id":"r_c44","subject":"hist","topic":"Российская империя","type":"open","card":true,"max":2,"text":"Пётр II (1727–1730). Назовите годы и главные события правления.","criteria":[{"id":"K1","max":2,"text":"Названы годы правления и три ключевых события без фактических ошибок — 2 балла; названы два события или есть одна неточность — 1 балл; названо одно событие или ответ неверный — 0 баллов."}],"model":"Годы правления: 1727–1730.\n1) В начале правления находился под сильным влиянием Александра Меншикова.\n2) В 1727 году Меншиков был отправлен в ссылку, а влияние при дворе перешло к князьям Дол й (911 г.). Лишние: Александр I (1801–1825), В. И. Ленин (1917–1924)."},{"id":"r_xp2","subject":"hist","topic":"Факты и деятели","ege":5,"type":"match","max":2,"text":"Установите соответствие между событиями и правителями, в период правления которых они произошли: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["Гибель императора в Михайловском замке в результате дворцового заговора","Отмена местничества","Губернская реформа","Отмена внутренних таможенных пошлин"],"right":["Павел I","Екатерина II","Василий III","Фёдор Алексеевич","Юрий Всеволодович","Елизавета Петровна"],"answer":"1426","hint":"Годы правления: Юрий Всеволодович — 1212–1216, 1218–1238; Василий III — 1505–1533; Фёдор Алексеевич — 1676–1682; Елизавета Петровна — 1741–1761; Екатерина II — 1762–1796; Павел I — 1796–1801.","explain":"А — Павел I (1801 г.); Б — Фёдор Алексеевич (1682 г.); В — Екатерина II (1775 г.); Г — Елизавета Петровна. Лишние: Василий III (1505–1533), Юрий Всеволодович (1212–1216, 1218–1238)."},{"id":"h6a","subject":"hist","topic":"Источники","ege":6,"type":"choice","max":2,"text":"Прочитайте отрывок из исторического источника и выберите в приведённом списке верные суждения. Запишите цифры, под которыми они указаны.","source":"«На обязанность правительства возлагаем Мы выполнение непреклонной Нашей воли:\n1. Даровать населению незыблемые основы гражданской свободы на началах действительной неприкосновенности личности, свободы совести, слова, собраний и союзов.\n2. Не останавливая предназначенных выборов в Государственную думу, привлечь теперь же к участию в Думе \u003c…> те классы населения, которые ныне совсем лишены избирательных прав \u003c…>.\n3. Установить, как незыблемое правило, чтобы никакой закон не мог восприять силу без одобрения Государственной думы и чтобы выборным от народа обеспечена была возможность действительного участия в надзоре за закономерностью действий поставленных от Нас властей».","options":["Документ был издан в период Первой российской революции.","Документ был издан императором Александром III.","В документе провозглашалось, что ни один закон не может вступить в силу без одобрения Государственной думы.","Документом был учреждён Правительствующий сенат.","Вскоре после издания документа в России была провозглашена республика.","Документ был издан в период Первой мировой войны."],"answer":"13","hint":"Определите год документа: выборы в Государственную думу уже назначены, населению обещаны гражданские свободы.","explain":"Это Манифест 17 октября 1905 г. Николая II, изданный в разгар Первой российской революции (1905–1907 гг.). В нём закреплено, что закон не вступает в силу без одобрения Думы. Сенат учреждён Петром I в 1711 г., республика провозглашена в 1917 г., Первая мировая война началась в 1914 г. По правилам ЕГЭ: одна неверная, лишняя или пропущенная цифра — 1 балл."},{"id":"h13a","subject":"hist","topic":"Источники","ege":13,"type":"open","max":2,"text":"Прочитайте отрывок из исторического источника и кратко ответьте на вопрос.\n\nУкажите год, когда был издан документ, и императора, от имени которого он был издан. Назовите революцию, в ходе которой был издан документ.","source":"«На обязанность правительства возлагаем Мы выполнение непреклонной Нашей воли:\n1. Даровать населению незыблемые основы гражданской свободы на началах действительной неприкосновенности личности, свободы совести, слова, собраний и союзов.\n2. Не останавливая предназначенных выборов в Государственную думу, привлечь теперь же к участию в Думе \u003c…> те классы населения, которые ныне совсем лишены избирательных прав \u003c…>.\n3. Установить, как незыблемое правило, чтобы никакой закон не мог восприять силу без одобрения Государственной думы и чтобы выборным от народа обеспечена была возможность действительного участия в надзоре за закономерностью действий поставленных от Нас властей».","criteria":[{"id":"K1","max":2,"text":"Правильно указаны три элемента (год, император, революция) — 2 балла; два элемента — 1 балл; один элемент или ответ неправильный — 0 баллов."}],"model":"1905 г.; Николай II; Первая российская революция (революция 1905–1907 гг.).","hint":"Выборы в Государственную думу уже назначены, но законодательных прав у неё ещё нет. Какой это год?"},{"id":"h14a","subject":"hist","topic":"Источники","ege":14,"type":"open","max":2,"text":"Используя отрывок из документа, ответьте на вопросы.\n1) Какие гражданские свободы даровались населению? Укажите любые две.\n2) Какое изменение в порядке выборов в Государственную думу предусматривал документ?\n3) Какое правило принятия законов устанавливал документ?","source":"«На обязанность правительства возлагаем Мы выполнение непреклонной Нашей воли:\n1. Даровать населению незыблемые основы гражданской свободы на началах действительной неприкосновенности личности, свободы совести, слова, собраний и союзов.\n2. Не останавливая предназначенных выборов в Государственную думу, привлечь теперь же к участию в Думе \u003c…> те классы населения, которые ныне совсем лишены избирательных прав \u003c…>.\n3. Установить, как незыблемое правило, чтобы никакой закон не мог восприять силу без одобрения Государственной думы и чтобы выборным от народа обеспечена была возможность действительного участия в надзоре за закономерностью действий поставленных от Нас властей».","criteria":[{"id":"K1","max":2,"text":"Правильно даны ответы на три вопроса — 2 балла; на два вопроса — 1 балл; на один вопрос или ответ неправильный — 0 баллов. Ответы могут быть приведены в виде цитат или своими словами."}],"model":"1) Неприкосновенность личности, свобода совести, слова, собраний и союзов (любые две).\n2) К участию в выборах в Думу привлекались те классы населения, которые прежде были лишены избирательных прав.\n3) Никакой закон не может вступить в силу без одобрения Государственной думы.","hint":"Ответы есть в самом тексте: посмотрите пункты 1, 2 и 3 документа."},{"id":"h15a","subject":"hist","topic":"Источники","ege":15,"type":"open","max":2,"text":"В том же году, когда был издан документ, завершилась война России с Японией. Назовите город в США, где был подписан мирный договор, и президента США, выступившего посредником на мирных переговорах.","source":"«На обязанность правительства возлагаем Мы выполнение непреклонной Нашей воли:\n1. Даровать населению незыблемые основы гражданской свободы на началах действительной неприкосновенности личности, свободы совести, слова, собраний и союзов.\n2. Не останавливая предназначенных выборов в Государственную думу, привлечь теперь же к участию в Думе \u003c…> те классы населения, которые ныне совсем лишены избирательных прав \u003c…>.\n3. Установить, как незыблемое правило, чтобы никакой закон не мог восприять силу без одобрения Государственной думы и чтобы выборным от народа обеспечена была возможность действительного участия в надзоре за закономерностью действий поставленных от Нас властей».","criteria":[{"id":"K1","max":2,"text":"Правильно названы город и президент — 2 балла; правильно назван один элемент — 1 балл; ответ неправильный — 0 баллов."}],"model":"Портсмут; Теодор Рузвельт.","hint":"Переговоры шли в городе на атлантическом побережье США. Посредник вскоре получил за это Нобелевскую премию мира."},{"id":"h10","subject":"hist","topic":"Культура","type":"match","max":2,"text":"Установите соответствие между памятниками культуры и их авторами: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["икона «Троица»","памятник Петру I «Медный всадник»","храм Христа Спасителя в Москве","картина «Явление Христа народу»"],"right":["Феофан Грек","К. А. Тон","А. А. Иванов","Андрей Рублёв","В. В. Растрелли","Э. Фальконе"],"answer":"4623","hint":"Феофан Грек и Андрей Рублёв — иконописцы рубежа XIV–XV вв. Растрелли строил дворцы при Елизавете Петровне.","explain":"«Троица» — Андрей Рублёв (начало XV в.), «Медный всадник» — Этьен Фальконе (открыт в 1782 г.), храм Христа Спасителя — Константин Тон, «Явление Христа народу» — Александр Иванов, который работал над картиной около двадцати лет.","ege":7},{"id":"h19a","subject":"hist","topic":"Причины и понятия","ege":19,"type":"open","max":3,"text":"Для крестьянской реформы 1861 г. укажите:\nа) одну причину, связанную с развитием экономики России;\nб) одно последствие реформы для правового положения крестьян;\nв) одно последствие, связанное с получением крестьянами земли.","criteria":[{"id":"K1","max":3,"text":"Правильно указаны три элемента (а, б, в) — 3 балла; два элемента — 2 балла; один элемент — 1 балл; ответ неправильный или рассуждения общего характера — 0 баллов."}],"model":"а) Крепостное право сдерживало развитие промышленности: не хватало вольнонаёмной рабочей силы, внутренний рынок оставался узким.\nб) Крестьяне получили личную свободу и общегражданские права: могли заключать сделки, владеть имуществом, заниматься торговлей и промыслами.\nв) Землю крестьяне получали за выкуп: до перехода на выкуп они оставались временнообязанными, затем десятилетиями выплачивали выкупные платежи; часть земли отошла помещикам (отрезки).","hint":"Каждый пункт отвечает на свой вопрос. Общие слова вроде «Россия отставала» не засчитываются — нужна конкретика: что именно мешало развитию и что именно изменилось для крестьян."},{"id":"h20a","subject":"hist","topic":"Причины и понятия","ege":20,"type":"open","max":2,"text":"Используя знание исторического понятия «заповедные лета», объясните его смысл и укажите, какое право крестьян, закреплённое Судебником 1497 г., временно отменялось в заповедные лета. Дайте только один ответ на каждый вопрос.","criteria":[{"id":"K1","max":2,"text":"Правильно даны два ответа — 2 балла; один ответ — 1 балл; ответ неправильный — 0 баллов. Если на вопрос дано несколько ответов, оценивается только первый."}],"model":"1) Заповедные лета — годы, в которые временно запрещался переход крестьян от одного землевладельца к другому (введены в начале 1580-х гг.).\n2) Отменялось право перехода в Юрьев день — за неделю до и неделю после 26 ноября — с уплатой «пожилого».","hint":"Слово «заповедь» здесь значит «запрет». Что именно запрещалось крестьянам и в какой день по Судебнику это право действовало?"},{"id":"h20b","subject":"hist","topic":"Причины и понятия","ege":20,"type":"open","max":2,"text":"Используя знание исторического понятия «продразвёрстка», объясните, как её применение было связано с крестьянскими восстаниями 1920–1921 гг., и укажите, чем её заменили в 1921 г. Дайте только один ответ на каждый вопрос.","criteria":[{"id":"K1","max":2,"text":"Правильно даны два ответа — 2 балла; один ответ — 1 балл; ответ неправильный — 0 баллов. Если на вопрос дано несколько ответов, оценивается только первый."}],"model":"1) Продразвёрстка обязывала крестьян сдавать государству по твёрдым ценам все «излишки» хлеба, а на деле изымалось и необходимое для жизни и посева. Это вызвало массовое недовольство и восстания крестьян (например, в Тамбовской губернии, в Западной Сибири).\n2) В 1921 г. по решению X съезда РКП(б) продразвёрстку заменили продовольственным налогом (продналогом); это стало началом нэпа.","hint":"Подумайте, что оставалось у крестьянина после прихода продотряда. Решение о замене принял X съезд партии."},{"id":"h21a","subject":"hist","topic":"Сравнение и аргументация","ege":21,"type":"open","max":3,"text":"Сравните внешнюю политику России во второй половине XVIII в. (правление Екатерины II) и в первой четверти XIX в. (правление Александра I). Сформулируйте один тезис о сходстве и приведите два обоснования этого тезиса с опорой на исторические факты. В каждом обосновании приведите факты по обоим периодам.","criteria":[{"id":"K1","max":3,"text":"Сформулирован верный тезис о сходстве и приведены два корректных обоснования с фактами — 3 балла. Тезис и одно корректное обоснование или два обоснования с неточностями, не искажающими смысла, — 2 балла. Тезис без корректных обоснований — 1 балл. Тезис неверный или не сформулирован — 0 баллов. Общие рассуждения («одержано много побед») фактами не считаются; оценивается только первый тезис."}],"model":"Тезис: в оба периода Россия вела успешные войны и расширяла свою территорию.\nОбоснование 1: при Екатерине II к России был присоединён Крым (1783 г.); при Александре I по Бухарестскому миру 1812 г. к России отошла Бессарабия.\nОбоснование 2: при Екатерине II Россия участвовала в разделах Речи Посполитой (1772, 1793, 1795 гг.); при Александре I по решению Венского конгресса (1815 г.) к России отошла большая часть Варшавского герцогства (Царство Польское).","hint":"Тезис — одно предложение о том, что было общим. Обоснование — конкретные факты из каждого периода: война, договор, год, территория."},{"id":"h22a","subject":"hist","topic":"Сравнение и аргументация","ege":22,"type":"open","max":2,"text":"Существует точка зрения, что преобразования Петра I превратили Россию в великую европейскую державу. Используя исторические знания, приведите два аргумента, которыми можно подтвердить эту точку зрения. При изложении аргументов обязательно используйте исторические факты. Факты, приведённые во втором аргументе, не должны повторять факты первого.","criteria":[{"id":"K1","max":2,"text":"Приведены два аргумента — 2 балла; один аргумент — 1 балл; аргументы не приведены, рассуждения общего характера или ответ неправильный — 0 баллов. Аргумент засчитывается, если в нём есть конкретный исторический факт и объяснение его связи с точкой зрения."}],"model":"1) Пётр I создал регулярную армию на основе рекрутской повинности и военно-морской флот. Это позволило победить Швецию в Северной войне: по Ништадтскому миру 1721 г. Россия получила выход к Балтийскому морю и стала сильнейшей державой Северной Европы.\n2) В 1721 г. Россия была провозглашена империей, а Пётр I принял титул императора. Европейские государства постепенно признали этот титул, что закрепило новый статус России среди великих держав.","hint":"Аргумент = факт + связка. Назовите конкретную реформу, войну или договор и объясните, почему это сделало Россию великой державой."},{"id":"s1","subject":"soc","topic":"Человек и общество","type":"choice","max":2,"text":"Выберите верные суждения о человеке и его деятельности и запишите цифры, под которыми они указаны.","options":["Человек — биосоциальное существо.","Все потребности человека имеют исключительно биологическую природу.","Мотив — это то, что побуждает человека к деятельности, ради чего она совершается.","Деятельность человека, в отличие от поведения животных, предполагает осознанную постановку цели.","Индивидуальность — это принадлежность человека к биологическому виду Homo sapiens."],"answer":"134","hint":"Сравните три понятия: индивид, индивидуальность, личность. И вспомните, какие бывают потребности: биологические, социальные, духовные.","explain":"Верны 1, 3 и 4. Суждение 2 неверно: кроме биологических есть социальные и духовные потребности. Суждение 5 описывает индивида, а индивидуальность — это неповторимое своеобразие человека."},{"id":"s2","subject":"soc","topic":"Человек и общество","type":"text","max":1,"text":"Запишите термин: процесс усвоения индивидом образцов поведения, социальных норм и ценностей, необходимых для успешной жизни в обществе.","answer":["социализация"],"hint":"Этот процесс начинается в семье и продолжается всю жизнь.","explain":"Социализация. Её агенты — семья, школа, сверстники, СМИ и другие; различают первичную и вторичную социализацию."},{"id":"s3","subject":"soc","topic":"Экономика","type":"choice","max":2,"text":"Выберите верные суждения о рыночной экономике и запишите цифры, под которыми они указаны.","options":["Цены на большинство товаров устанавливает государство.","Основу рыночной экономики составляет частная собственность.","Конкуренция побуждает производителей снижать издержки и повышать качество.","Рыночная экономика не нуждается ни в каком государственном регулировании.","Спрос и предложение согласуют действия покупателей и продавцов."],"answer":"235","hint":"Ищите признаки, которые отличают рынок от командной экономики. Слова «все», «ни в каком» часто сигнализируют о неверном суждении.","explain":"Верны 2, 3 и 5. Цены в рыночной экономике складываются под влиянием спроса и предложения, а не назначаются государством. Совсем без государства рынок не работает: оно защищает собственность и конкуренцию, производит общественные блага."},{"id":"s4","subject":"soc","topic":"Экономика","type":"text","max":1,"text":"Запишите термин: ценная бумага, которая даёт владельцу право на часть прибыли акционерного общества в виде дивидендов и на участие в управлении им.","answer":["акция"],"hint":"Не путайте с облигацией: облигация — долговая бумага, она не даёт права на управление.","explain":"Акция — долевая ценная бумага. Облигация, в отличие от неё, подтверждает, что владелец дал деньги в долг, и права голоса не даёт."},{"id":"s5","subject":"soc","topic":"Экономика","type":"choice","max":2,"text":"Какие из перечисленных факторов могут вызвать увеличение спроса на велосипеды (сдвиг кривой спроса вправо)? Запишите цифры, под которыми они указаны.","options":["рост доходов населения","снижение цены на велосипеды","строительство в городе сети велодорожек","рост цен на сталь и алюминий","удешевление проката велосипедов","мода на здоровый образ жизни"],"answer":"136","hint":"Изменение цены самого товара не сдвигает кривую спроса — оно меняет величину спроса. А цены на сырьё влияют на предложение.","explain":"Верны 1, 3 и 6: рост доходов, удобная инфраструктура и мода повышают спрос при любой цене. Снижение цены велосипедов меняет лишь величину спроса (движение по кривой). Подорожание металла сокращает предложение. Дешёвый прокат — товар-заменитель, он уменьшает спрос на покупку велосипедов."},{"id":"s13","subject":"soc","topic":"Экономика","type":"choice","max":2,"text":"На графике отражено изменение ситуации на рынке легковых автомобилей: линия предложения переместилась из положения S в положение S1 (P — цена товара, Q — количество товара). Какие из перечисленных факторов могли вызвать такое изменение? Запишите цифры, под которыми они указаны.","images":["g_supply"],"options":["снижение налогов на производителей автомобилей","рост доходов населения","внедрение технологий, снижающих издержки производства","подорожание стали и комплектующих","выход на рынок новых производителей","подорожание бензина"],"answer":"135","hint":"Линия сдвинулась вправо: при любой цене продавцы теперь готовы продать больше. Ищите то, что удешевляет производство или увеличивает число продавцов. Доходы покупателей и цены на бензин влияют на спрос, а не на предложение.","explain":"Сдвиг линии предложения вправо означает рост предложения. Его могли вызвать снижение налогов на производителей (1), технологии, снижающие издержки (3), и приход на рынок новых производителей (5). Рост доходов населения (2) и подорожание бензина (6) меняют спрос на автомобили. Подорожание стали и комплектующих (4) повышает издержки и сдвигает предложение влево."},{"id":"s11","subject":"soc","topic":"Экономика","type":"open","max":3,"text":"Приведите три примера, иллюстрирующих разные функции денег. В каждом примере укажите, какую функцию он иллюстрирует.","criteria":[{"id":"K1","max":3,"text":"Каждый пример, который сформулирован развёрнуто, иллюстрирует названную функцию и не повторяет другие примеры, — 1 балл, не больше трёх."}],"model":"Мера стоимости: в магазине на зимней куртке указана цена — 8 000 рублей.\nСредство обращения: Ольга купила в булочной хлеб и сразу расплатилась наличными.\nСредство платежа: предприятие перечислило работникам зарплату за месяц; гражданин уплатил налог на имущество.\nСредство накопления: семья каждый месяц откладывает часть дохода на вклад, чтобы купить квартиру.\nМировые деньги: российская компания оплатила поставку оборудования из Китая в юанях.","hint":"Функций денег пять: мера стоимости, средство обращения, средство платежа, средство накопления, мировые деньги. Пример — это конкретная ситуация с участником и действием, а не определение."},{"id":"s6","subject":"soc","topic":"Социальные отношения","type":"choice","max":2,"text":"Выберите примеры вертикальной социальной мобильности и запишите цифры, под которыми они указаны.","options":["рабочий получил высшее образование и стал инженером","семья переехала из Твери в Рязань","учитель перешёл в другую школу на ту же должность","спортсмен сменил вид спорта","менеджер получил должность начальника отдела","директор предприятия обанкротился и стал безработным"],"answer":"156","hint":"Вертикальная мобильность — изменение статуса вверх или вниз. Если статус остался прежним, мобильность горизонтальная.","explain":"Вертикальная мобильность — 1 и 5 (восходящая) и 6 (нисходящая). Переезд, переход в другую школу на ту же должность и смена вида спорта не меняют статус — это горизонтальная мобильность."},{"id":"s7","subject":"soc","topic":"Политика","type":"match","max":2,"text":"Установите соответствие между понятиями и элементами формы государства: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["республика","федерация","демократический режим","монархия","унитарное государство"],"right":["форма правления","форма государственного (территориального) устройства","политический режим"],"answer":"12312","hint":"Форма правления отвечает на вопрос, кто и как получает высшую власть; устройство — как организована территория; режим — какими методами осуществляется власть.","explain":"Республика и монархия — формы правления; федерация и унитарное государство — формы государственного устройства; демократия — политический режим."},{"id":"s8","subject":"soc","topic":"Политика","type":"choice","max":2,"text":"Какие из перечисленных полномочий принадлежат Президенту Российской Федерации согласно Конституции РФ? Запишите цифры, под которыми они указаны.","options":["принимает федеральный бюджет","является Верховным Главнокомандующим Вооружёнными Силами РФ","объявляет амнистию","осуществляет помилование","утверждает изменение границ между субъектами РФ","назначает Председателя Правительства РФ после утверждения его кандидатуры Государственной Думой"],"answer":"246","hint":"Помилование и амнистию часто путают: одно касается конкретного человека, другое — широкого круга лиц, и его объявляет парламент.","explain":"Президенту принадлежат полномочия 2, 4 и 6. Федеральный бюджет принимает Государственная Дума, она же объявляет амнистию. Изменение границ между субъектами РФ утверждает Совет Федерации."},{"id":"s10","subject":"soc","topic":"Политика","type":"open","max":3,"text":"Используя обществоведческие знания, составьте сложный план, позволяющий раскрыть по существу тему «Политические партии в демократическом обществе». План должен содержать не менее трёх пунктов, непосредственно раскрывающих тему, из которых два или более детализированы в подпунктах.","criteria":[{"id":"K1","max":2,"text":"Раскрытие темы по существу. Ключевые пункты: понятие и признаки партии; функции партий; виды партий или партийные системы. Все три ключевых пункта, два из них раскрыты в трёх и более подпунктах — 2 балла; два ключевых пункта с такой детализацией — 1 балл."},{"id":"K2","max":1,"text":"Корректность формулировок: пункты и подпункты сформулированы без ошибок, конкретно, не абстрактно."}],"model":"1. Понятие политической партии.\n2. Признаки партии:\nа) организационная структура и членство;\nб) программа и идеология;\nв) стремление к завоеванию и осуществлению власти;\nг) социальная база — опора на определённые группы общества.\n3. Функции партий:\nа) выражение и представление интересов социальных групп;\nб) участие в выборах и формирование органов власти;\nв) политическая социализация граждан;\nг) подготовка и выдвижение политических лидеров.\n4. Виды партий:\nа) по идеологии — либеральные, консервативные, социал-демократические;\nб) по отношению к власти — правящие и оппозиционные;\nв) по организации — кадровые и массовые.\n5. Партийные системы: однопартийная, двухпартийная, многопартийная.\n6. Правовое регулирование деятельности партий в РФ.","hint":"Ответьте себе на вопросы: что такое партия? чем она отличается от других объединений? зачем она нужна обществу? какими бывают партии и партийные системы? Каждый вопрос — пункт плана."},{"id":"s9","subject":"soc","topic":"Теория права","type":"match","max":2,"text":"Установите соответствие между примерами и отраслями права, которые регулируют эти отношения.","left":["гражданин заключил договор купли-продажи квартиры","работодатель предоставил сотруднику ежегодный оплачиваемый отпуск","водителя оштрафовали за превышение скорости","супруги заключили брачный договор","гражданин совершил кражу"],"right":["административное право","семейное право","гражданское право","уголовное право","трудовое право"],"answer":"35124","hint":"Штраф за нарушение правил дорожного движения — административная ответственность. Кража — преступление.","explain":"Купля-продажа — гражданское право, отпуск — трудовое, штраф за превышение скорости — административное, брачный договор — семейное, кража — уголовное."},{"id":"law_o01","subject":"soc","topic":"Теория права","ege":15,"type":"match","max":2,"text":"Установите соответствие между вопросами и кодексами, которые их регулируют: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["перечень преступлений и наказаний за них","порядок возбуждения уголовного дела и расследования","административные наказания, например предупреждение","права участников уголовного судопроизводства","категории преступлений"],"right":["Уголовный кодекс РФ","Уголовно-процессуальный кодекс РФ","Кодекс РФ об административных правонарушениях"],"answer":"12321","hint":"УК — «что наказуемо», УПК — «как расследуют и судят», КоАП — административные правонарушения.","explain":"УК РФ: А, Д. УПК РФ: Б, Г. КоАП РФ: В."},{"id":"law_o02","subject":"soc","topic":"Теория права","ege":15,"type":"match","max":2,"text":"Установите соответствие между предметом регулирования и отраслями права: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["отношения в сфере государственного управления","личные неимущественные и имущественные отношения, возникающие из брака, родства и усыновления","трудовые и непосредственно связанные с ними отношения","имущественные и личные неимущественные отношения, основанные на равенстве, автономии воли и имущественной самостоятельности участников","выдача паспортов и водительских удостоверений"],"right":["гражданское право","семейное право","трудовое право","административное право"],"answer":"42314","hint":"Найдите в каждом описании ключевое слово: управление, брак, труд, равенство.","explain":"Административное: А, Д. Семейное: Б. Трудовое: В. Гражданское: Г."},{"id":"law_tp01","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Что такое право?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Право — система 1) общеобязательных 2) формально определённых 3) правил поведения, 4) установленных или признанных государством и 5) обеспечиваемых его принудительной силой.","hint":"В определении пять признаков: общеобязательность, формальная определённость, правила поведения, связь с государством, принудительная сила."},{"id":"law_tp02","subject":"soc","topic":"Теория права","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к признакам права, отличающим его от других социальных норм? Запишите цифры, под которыми они указаны.","options":["общеобязательность для всех, кому адресована норма","формальная определённость, закреплённость в официальных источниках","обеспечение возможностью государственного принуждения","регулирование поведения людей в обществе","опора исключительно на силу общественного мнения","установление или признание государством"],"answer":"1236","hint":"Ищите то, что есть только у права. Регулировать поведение людей могут любые социальные нормы, а на общественное мнение опирается мораль.","explain":"Признаки права — 1, 2, 3 и 6. Регулирование поведения (4) свойственно всем социальным нормам, а опора только на общественное мнение (5) — признак норм морали."},{"id":"law_tp03","subject":"soc","topic":"Теория права","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о праве и его источниках и запишите цифры, под которыми они указаны.","options":["Право обеспечивается возможностью государственного принуждения.","Нормы права формально определены и закрепляются в официальных источниках.","Любое сложившееся в обществе правило является правовым обычаем, даже если оно не признано государством.","Нормы морали, в отличие от норм права, всегда закрепляются в нормативных правовых актах.","Норма права — общеобязательное правило поведения, установленное или признанное государством."],"answer":"125","hint":"Правовой обычай становится источником права только после признания государством. Подумайте, где закрепляются нормы морали.","explain":"Верны 1, 2 и 5. Обычай становится правовым только тогда, когда его признаёт государство (3). Нормы морали живут в общественном сознании и в нормативных правовых актах не закрепляются (4)."},{"id":"law_tp04","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Что такое источники права? Какие существуют виды источников права?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Источники (формы) права — официальные способы выражения и закрепления правовых норм.\nОсновные виды:\n— Нормативный правовой акт (НПА) — официальный документ, содержащий нормы права и принятый в установленном порядке.\n— Судебный прецедент — решение суда по конкретному делу, признанное обязательным образцом при разрешении аналогичных дел.\n— Правовой обычай — сложившееся в результате длительного применения правило поведения, признанное государством в качестве правовой нормы.\n— Нормативный договор — соглашение двух или более сторон, устанавливающее нормы права, рассчитанные на неоднократное применение. Например, коллективный договор.\nДругие источники:\n— Религиозные тексты — содержат предписания, которым государство придаёт юридическую силу.\n— Правовая доктрина — научные положения и выводы учёных-юристов, признаваемые в качестве источника права.\n— Международные договоры — соглашения между государствами и другими субъектами международного права. Международные договоры, содержащие правовые нормы, относятся к нормативным договорам.","hint":"Основных видов четыре: НПА, судебный прецедент, правовой обычай, нормативный договор. Назовите и другие."},{"id":"law_tp05","subject":"soc","topic":"Теория права","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и видами источников (форм) права: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["Федеральный закон «О полиции»","коллективный договор, заключённый работниками и работодателем","правило поведения, сложившееся в результате длительного применения и признанное государством","постановление Правительства РФ, содержащее нормы права","международный договор, устанавливающий правила, рассчитанные на неоднократное применение"],"right":["нормативный правовой акт","правовой обычай","нормативный договор"],"answer":"13213","hint":"Нормативный договор — соглашение сторон, устанавливающее нормы права. Нормативный правовой акт принимает уполномоченный орган власти.","explain":"НПА: закон «О полиции» (А), постановление Правительства (Г). Нормативный договор: коллективный договор (Б), международный договор с нормами права (Д). Правовой обычай: правило, сложившееся в практике и признанное государством (В)."},{"id":"law_tp06","subject":"soc","topic":"Теория права","type":"text","max":1,"text":"Запишите термин: решение суда по конкретному делу, признанное обязательным образцом при разрешении аналогичных дел.","answer":["судебный прецедент","прецедент"],"hint":"Этот источник права особенно распространён в Великобритании и США.","explain":"Судебный прецедент."},{"id":"law_tp07","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Что такое нормативный правовой акт? Какие существуют виды законов и подзаконных актов?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Нормативный правовой акт — официальный документ, принятый в установленном порядке уполномоченным субъектом или на референдуме, устанавливающий, изменяющий или отменяющий нормы права.\nНПА подразделяются на законы и подзаконные акты.\nЗаконы — нормативные правовые акты, принимаемые органами законодательной власти или на референдуме, регулирующие важнейшие общественные отношения и имеющие приоритет перед подзаконными актами.\nВиды законов в РФ:\n1) Конституция РФ — основной закон государства, обладающий высшей юридической силой.\n2) Федеральные конституционные законы — принимаются по вопросам, предусмотренным Конституцией РФ. Например, «О судебной системе Российской Федерации».\n3) Федеральные законы — регулируют различные сферы общественных отношений. Например, «О полиции».\n4) Конституции (уставы) и законы субъектов РФ — регулируют вопросы ведения субъектов, а также вопросы совместного ведения в соответствии с федеральным законодательством.\nПодзаконные акты — нормативные правовые акты, принимаемые на основе и во исполнение законов и не противоречащие им.\nВиды:\n1) Нормативные указы Президента РФ.\n2) Нормативные постановления Правительства РФ.\n3) Нормативные акты министерств и ведомств.\n4) Подзаконные нормативные акты органов власти субъектов РФ и органов местного самоуправления.\n5) Локальные нормативные акты организаций. Например, правила внутреннего трудового распорядка.","hint":"Законы: Конституция, ФКЗ, ФЗ, конституции (уставы) и законы субъектов. Подзаконные: пять видов — от указов Президента до локальных актов."},{"id":"law_tp08","subject":"soc","topic":"Теория права","ege":15,"type":"match","max":2,"text":"Установите соответствие между нормативными правовыми актами и их видами: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["Федеральный конституционный закон «О судебной системе Российской Федерации»","постановление Правительства РФ","правила внутреннего трудового распорядка организации","устав (конституция) субъекта РФ","нормативный указ Президента РФ"],"right":["закон","подзаконный акт"],"answer":"12212","hint":"Законы принимают законодательные органы или народ на референдуме. Указ Президента, хотя и обладает высокой силой, к законам не относится.","explain":"Законы: ФКЗ «О судебной системе РФ» (А), устав (конституция) субъекта РФ (Г). Подзаконные акты: постановление Правительства (Б), локальный акт организации (В), указ Президента (Д)."},{"id":"law_tp09","subject":"soc","topic":"Теория права","type":"order","max":1,"text":"Расположите нормативные правовые акты РФ в порядке убывания их юридической силы.","options":["федеральный закон","Конституция РФ","постановление Правительства РФ","федеральный конституционный закон"],"answer":"2413","hint":"Подзаконный акт всегда ниже закона, а федеральный конституционный закон принимается по вопросам, прямо названным в Конституции.","explain":"Конституция РФ → федеральный конституционный закон → федеральный закон → постановление Правительства РФ (подзаконный акт)."},{"id":"law_tp10","subject":"soc","topic":"Теория права","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о нормативных правовых актах и запишите цифры, под которыми они указаны.","options":["Нормативный правовой акт — официальный документ, принятый в установленном порядке уполномоченным субъектом или на референдуме.","Подзаконные акты принимаются на основе и во исполнение законов и не должны им противоречить.","Федеральные конституционные законы принимаются по вопросам, предусмотренным Конституцией РФ.","Локальные нормативные акты организаций относятся к законам.","Законы субъектов РФ обладают высшей юридической силой на всей территории России."],"answer":"123","hint":"Высшая юридическая сила на всей территории России только у одного акта. Локальный акт принимает сама организация.","explain":"Верны 1, 2 и 3. Локальные акты организаций — подзаконные (4). Высшей юридической силой обладает Конституция РФ, а законы субъектов действуют на территории своего субъекта (5)."},{"id":"law_tp11","subject":"soc","topic":"Теория права","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к подзаконным нормативным правовым актам? Запишите цифры, под которыми они указаны.","options":["постановление Правительства РФ","федеральный конституционный закон","приказ министерства, содержащий нормы права","нормативный указ Президента РФ","Конституция РФ","правила внутреннего трудового распорядка организации"],"answer":"1346","hint":"Подзаконные акты принимаются на основе и во исполнение законов. Подумайте, какие из актов в списке — законы.","explain":"Подзаконные акты — 1, 3, 4 и 6. Федеральный конституционный закон (2) и Конституция РФ (5) — законы."},{"id":"law_tp12","subject":"soc","topic":"Теория права","type":"open","card":true,"max":2,"text":"Что такое система права, отрасль права, институт права и норма права?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Система права — внутреннее строение права, выражающее единство и согласованность правовых норм и их объединение в институты и отрасли.\nОтрасль права — сово
