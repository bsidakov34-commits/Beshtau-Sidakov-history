<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренажёр ЕГЭ по истории и обществознанию</title>
<meta name="description" content="Задания ЕГЭ по истории и обществознанию: автопроверка тестов, подсказки, самопроверка развёрнутых ответов и работа над ошибками.">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141D" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренажёр ЕГЭ">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22sky%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%0A%3Cstop%20offset%3D%220%22%20stop-color%3D%22%231F357F%22%2F%3E%3Cstop%20offset%3D%220.55%22%20stop-color%3D%22%235B70BE%22%2F%3E%3Cstop%20offset%3D%220.86%22%20stop-color%3D%22%23E8B97E%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%0A%3Crect%20width%3D%22512%22%20height%3D%22512%22%20fill%3D%22url(%23sky)%22%2F%3E%0A%3Ccircle%20cx%3D%22372%22%20cy%3D%22262%22%20r%3D%2240%22%20fill%3D%22%23FFE6B8%22%2F%3E%3Cpath%20d%3D%22M0%20318%20Q70%20286%20128%20300%20Q190%20268%20252%20292%20Q330%20262%20392%20288%20Q452%20270%20512%20290%20L512%20512%20L0%20512Z%22%20fill%3D%22%237C86BF%22%20opacity%3D%220.75%22%2F%3E%3Cpath%20d%3D%22M0%20352%20Q40%20336%2070%20318%20Q96%20300%20118%20304%20Q134%20292%20150%20296%20L186%20238%20Q206%20200%20222%20176%20Q232%20160%20242%20158%20Q252%20160%20262%20178%20L290%20232%20Q300%20244%20312%20236%20Q326%20214%20340%20212%20Q352%20214%20364%20238%20L384%20276%20Q404%20272%20422%20286%20Q446%20296%20470%20316%20Q492%20330%20512%20336%20L512%20512%20L0%20512Z%22%20fill%3D%22%2314203B%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Golos+Text:wght@400;500;600&family=PT+Mono&display=swap">
<style id="app-css">
/* Layout: one workbook column; the ЕГЭ answer-sheet cell row is the signature element */
:root{
  --paper:#EDF0F5; --sheet:#FFFFFF; --ink:#172036; --muted:#566077; --line:#D4DAE4; --line-strong:#9BA5B9; --rule:#DCE3EF;
  --accent:#2B47A3; --accent-soft:#E3E9F8; --on-strong:#FFFFFF;
  --fig-bg:#FFFFFF; --scrim:rgba(9,12,19,.94); --on-scrim:#F2F4F8;
  --hist:#8E3B2C; --hist-soft:#F5E6E2; --soc:#1C6670; --soc-soft:#DDEFF0;
  --ok:#1D7448; --ok-soft:#DFF1E6; --part:#94600C; --part-soft:#F6EAD3; --bad:#AF3535; --bad-soft:#F7E1E1;
  --f-display:"Alegreya","PT Serif",Georgia,serif;
  --f-body:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"PT Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10141D; --sheet:#181E2A; --ink:#E5E9F1; --muted:#9AA3B7; --line:#2A3244; --line-strong:#4A556C; --rule:#232B3B;
  --accent:#93AAF2; --accent-soft:#1F2945; --on-strong:#10141D; --fig-bg:#ECEEF2;
  --hist:#E39582; --hist-soft:#36211D; --soc:#72C3CC; --soc-soft:#16302F;
  --ok:#68C995; --ok-soft:#15291E; --part:#E2AE5B; --part-soft:#30261A; --bad:#EE8A8A; --bad-soft:#371C1F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#10141D; --sheet:#181E2A; --ink:#E5E9F1; --muted:#9AA3B7; --line:#2A3244; --line-strong:#4A556C; --rule:#232B3B;
  --accent:#93AAF2; --accent-soft:#1F2945; --on-strong:#10141D; --fig-bg:#ECEEF2;
  --hist:#E39582; --hist-soft:#36211D; --soc:#72C3CC; --soc-soft:#16302F;
  --ok:#68C995; --ok-soft:#15291E; --part:#E2AE5B; --part-soft:#30261A; --bad:#EE8A8A; --bad-soft:#371C1F;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 56px}
.app{--subj:var(--hist);--subj-soft:var(--hist-soft);max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.app[data-subj="soc"]{--subj:var(--soc);--subj-soft:var(--soc-soft)}
h1,h2,h3{text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;border:1.5px solid var(--ink);padding:7px 6px 6px 8px;line-height:1;border-radius:2px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:-.01em}
.brand p{margin-top:4px;color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:var(--sheet)}
.seg-b{appearance:none;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg-b.on{background:var(--subj);color:var(--on-strong)}

/* tabs */
.tabs-wrap{overflow-x:auto;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);min-width:max-content}
.tab{appearance:none;border:0;background:none;font-size:15px;color:var(--muted);padding:10px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--subj);font-weight:600}
.count{font-family:var(--f-mono);font-size:12px;background:var(--bad-soft);color:var(--bad);padding:1px 7px;border-radius:999px;font-weight:400}

/* topic chips + navigator */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;appearance:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip.on{border-color:var(--subj);color:var(--subj);background:var(--subj-soft);font-weight:500}
.navbox{display:flex;flex-direction:column;gap:10px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.nav{width:40px;height:40px;font-family:var(--f-mono);font-size:15px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);border-radius:3px;cursor:pointer;font-variant-numeric:tabular-nums}
.nav.s-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.nav.s-part{background:var(--part-soft);border-color:var(--part);color:var(--part)}
.nav.s-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.nav.cur{outline:2px solid var(--subj);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border:1px solid var(--line-strong);border-radius:2px;background:var(--sheet)}
.legend i.ok{background:var(--ok-soft);border-color:var(--ok)}
.legend i.part{background:var(--part-soft);border-color:var(--part)}
.legend i.bad{background:var(--bad-soft);border-color:var(--bad)}

/* task card */
.task{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}
.task-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.task-no{font-family:var(--f-mono);font-size:14px;border:1.5px solid var(--subj);color:var(--subj);padding:3px 7px 2px;border-radius:2px;white-space:nowrap}
.tag{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tag-topic{letter-spacing:0;text-transform:none;font-size:13px;color:var(--subj)}
.task-pts{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prompt{display:flex;flex-direction:column;gap:10px;font-size:17px;line-height:1.55;max-width:65ch}
.src{margin:0;padding:14px 16px;border-left:3px solid var(--subj);background:var(--paper);font-family:var(--f-display);font-size:17px;line-height:1.6;display:flex;flex-direction:column;gap:8px;border-radius:0 4px 4px 0}
.src-l{font-family:var(--f-body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.how{font-size:14px;color:var(--muted)}

.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;font-size:16px;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--line-strong)}
.opt:disabled{cursor:default}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt-d{flex:none;width:26px;height:26px;display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;border:1px solid var(--line-strong);border-radius:2px;background:var(--sheet)}
.opt.on .opt-d{background:var(--accent);color:var(--on-strong);border-color:var(--accent)}
.opt-t{flex:1;min-width:0;padding-top:1px}
.pos{flex:none;align-self:center;font-family:var(--f-mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px}

.match{display:flex;flex-direction:column;gap:14px}
.right{list-style:none;margin:0;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:4px}
.right li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.right li .opt-d{width:24px;height:24px;font-size:13px}
.col-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mrow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.mleft{display:flex;gap:10px;align-items:flex-start}
.mlet{font-family:var(--f-mono);font-weight:700;width:24px;flex:none;text-align:center;color:var(--subj)}
.mpick{display:flex;flex-wrap:wrap;gap:6px;padding-left:34px}
.pick{width:38px;height:38px;font-family:var(--f-mono);font-size:15px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);border-radius:3px;cursor:pointer}
.pick.on{background:var(--accent);border-color:var(--accent);color:var(--on-strong)}
.pick:disabled{cursor:default;opacity:.55}
.pick.on:disabled{opacity:1}

/* answer-sheet cells */
.answer{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px}
.answer-l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:12px}
.sheet{display:flex;flex-direction:column;width:max-content}
.sheet-r{display:flex}
.sheet .lh{width:34px;font-family:var(--f-mono);font-size:13px;text-align:center;color:var(--muted);padding-bottom:3px}
.c{width:34px;height:42px;display:grid;place-items:center;font-family:var(--f-mono);font-size:20px;border:1px solid var(--line-strong);border-left-width:0;background:var(--sheet);color:var(--ink)}
.c:first-child{border-left-width:1px}
.c.f{color:var(--accent)}
.sheet.key .c.f{color:var(--ok)}
.sheet.mine .c.f{color:var(--muted)}
.sheet-wrap{overflow-x:auto;max-width:100%}
.term{font-family:var(--f-mono);font-size:20px;letter-spacing:.06em;padding:8px 12px;border:1px solid var(--line-strong);border-radius:3px;background:var(--sheet);color:var(--ink);width:100%;max-width:380px;min-height:46px}
.essay{width:100%;min-height:210px;font:inherit;font-size:16px;line-height:26px;padding:6px 14px;border:1px solid var(--line-strong);border-radius:4px;color:var(--ink);resize:vertical;
  background-color:var(--sheet);background-image:repeating-linear-gradient(to bottom,transparent 0 25px,var(--rule) 25px 26px);background-position:0 6px;background-attachment:local}
.lbl{font-size:14px;font-weight:500;margin-bottom:-8px}
.meta{font-size:13px;color:var(--muted);margin-top:-8px;font-variant-numeric:tabular-nums}

/* buttons */
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{appearance:none;font-size:15px;font-weight:500;padding:9px 16px;border-radius:4px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);cursor:pointer;min-height:42px;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-strong)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--line)}
.btn.small{font-size:13px;padding:5px 10px;min-height:32px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* feedback */
.hint{background:var(--accent-soft);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.hint .label{color:var(--accent)}
.fb{border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line-strong);background:var(--paper)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.part{background:var(--part-soft);border-color:var(--part)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb-h{font-weight:600;font-size:17px}
.fb.ok .fb-h{color:var(--ok)}
.fb.part .fb-h{color:var(--part)}
.fb.bad .fb-h{color:var(--bad)}
.keys{display:flex;flex-wrap:wrap;gap:12px 24px}
.ai-out{border-top:1px dashed var(--line-strong);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ai-text{white-space:pre-wrap}
.busy{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--bad);font-size:15px}
.note{font-size:14px;color:var(--muted)}
.ok-msg{color:var(--ok);font-size:14px;font-weight:500}

.review{border-top:1px dashed var(--line-strong);padding-top:16px;display:flex;flex-direction:column;gap:4px}
.review-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.review-h span{font-weight:600}
.review-h b{font-family:var(--f-mono);font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}
.crit{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.crit-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.crit-id{font-family:var(--f-mono);font-weight:700}
.crit-s{font-family:var(--f-mono);font-size:14px;padding:1px 9px;border-radius:999px;white-space:nowrap}
.crit-s.s-ok{background:var(--ok-soft);color:var(--ok)}
.crit-s.s-part{background:var(--part-soft);color:var(--part)}
.crit-s.s-bad{background:var(--bad-soft);color:var(--bad)}
.crit-s.s-none{color:var(--muted)}
.crit-t{color:var(--muted);font-size:14px}
.review > .hint,.review > .model,.review > .row,.review > .note{margin-top:10px}
.model{background:var(--paper);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.model .txt{display:flex;flex-direction:column;gap:8px}

/* lists */
.lead{color:var(--muted);max-width:65ch}
.elist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.erow{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.erow:hover{border-color:var(--line-strong)}
.erow-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.erow-t{font-size:13px;color:var(--muted)}
.erow-x{font-size:15px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.erow-s{font-family:var(--f-mono);font-size:14px;color:var(--bad);white-space:nowrap}
.empty{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:24px 20px;display:flex;flex-direction:column;gap:8px}
.empty h2{font-family:var(--f-display);font-size:24px;margin:0}

/* progress */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{background:var(--sheet);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.tp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.tp-n{font-size:15px}
.tp-v{font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{grid-column:1/-1;height:8px;background:var(--paper);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:999px}
.bar i.ok{background:var(--ok)}
.topics{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.topic-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:baseline;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.topic-row:hover{border-color:var(--line-strong)}
.tr-n{font-size:16px;font-weight:500}
.tr-c{font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.topic-row .bar{grid-column:1/-1;display:flex}
.topic-row .bar i{border-radius:0} .bar i.part{background:var(--part)} .bar i.bad{background:var(--bad)}
.advice{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.advice li{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.advice li p{flex:1 1 260px;min-width:0}
.box{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500}
.field small{color:var(--muted);font-size:13px}
.field input,.field textarea,.field select{font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:4px;background:var(--sheet);color:var(--ink);width:100%;min-width:0}
.field textarea{resize:vertical;line-height:1.45}
.report{font-family:var(--f-mono);font-size:13px;line-height:1.5;min-height:180px}
.fields2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

/* teacher */
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow .erow-m{flex:1 1 220px}
.trow-a{display:flex;gap:6px;flex-wrap:wrap}
.dirty{background:var(--part-soft);border:1px solid var(--part);border-radius:4px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dirty p{flex:1 1 220px}
.tform{display:flex;flex-direction:column;gap:14px}
.sub-h{font-family:var(--f-display);font-size:20px;font-weight:700;margin:6px 0 0}

@media (max-width:480px){
  .task{padding:16px}
  .tab{font-size:14px;padding:10px 9px}
  .brand h1{font-size:26px}
  .stat b{font-size:19px}
  .prompt,.src{font-size:16px}
}
/* figures: maps, schemes, illustrations sit on a paper-white plate in both themes */
.figs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.figs.one{grid-template-columns:minmax(0,1fr)}
.fig{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.fig-n{font-family:var(--f-mono);font-size:14px;color:var(--subj)}
.fig-b{appearance:none;display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--fig-bg);cursor:zoom-in}
.fig-b img{display:block;width:100%;height:auto;max-height:440px;object-fit:contain}
.fig-cap{font-size:13px;color:var(--muted);margin-top:-8px}
.zoom{position:fixed;inset:0;z-index:50;background:var(--scrim);color:var(--on-scrim);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.zoom-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;font-size:14px}
.zoom-x{appearance:none;border:1px solid currentColor;background:transparent;color:inherit;border-radius:4px;padding:7px 14px;font:inherit;cursor:pointer}
.zoom-s{flex:1;min-height:0;overflow:auto;display:flex;padding:0 16px 16px}
.zoom-s img{margin:auto;max-width:100%;max-height:100%;background:var(--fig-bg);cursor:zoom-in}
.zoom.big .zoom-s img{margin:0;max-width:none;max-height:none;width:200%;height:auto;cursor:zoom-out}
.flabel{font-size:14px;font-weight:500}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.thumb img,.thumb-add img{display:block;width:120px;height:90px;object-fit:contain;background:var(--fig-bg);border:1px solid var(--line);border-radius:4px}
.thumb-add{appearance:none;padding:0;border:0;background:transparent;cursor:pointer;border-radius:4px}
.thumb-add:hover img{border-color:var(--accent)}
label.btn{display:inline-flex;align-items:center}
.tag-ege{font-family:var(--f-mono);letter-spacing:0;text-transform:none;color:var(--ink);border:1px solid var(--line-strong);border-radius:2px;padding:1px 6px}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;width:100%;min-width:440px;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line-strong);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{font-weight:600;font-size:13px;color:var(--muted);background:var(--paper)}
.tbl td.blank{background:var(--accent-soft);white-space:nowrap}
.tbl .tv{font-family:var(--f-mono);font-size:17px;color:var(--accent);margin-left:8px}
.vh,.field input.vh{position:absolute;width:1px;height:1px;padding:0;border:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.field{position:relative}
@media (prefers-reduced-motion: reduce){.spin{animation:none}*{scroll-behavior:auto!important}}

<script type="application/json" id="bank">{"version":1,"tasks":[{"id":"h4","subject":"hist","topic":"Хронология","type":"match","max":2,"text":"Установите соответствие между событиями и годами: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["Полтавская битва","Учреждение Сената","Куликовская битва","Принятие Судебника Ивана III"],"right":["1380 г.","1497 г.","1550 г.","1709 г.","1711 г.","1725 г."],"answer":"4512","hint":"Два события из правления Петра I идут почти подряд: сначала победа над шведами, через два года — новый высший орган власти.","explain":"Полтавская битва — 1709 г., Сенат учреждён в 1711 г., Куликовская битва — 1380 г., Судебник Ивана III — 1497 г. 1550 г. — год Судебника Ивана IV, его легко перепутать с Судебником 1497 г.","ege":1},{"id":"h1b","subject":"hist","topic":"Хронология","ege":1,"type":"match","max":2,"text":"Установите соответствие между событиями и годами: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["Курская битва","Ялтинская (Крымская) конференция","операция «Багратион»","начало битвы за Москву"],"right":["1939 г.","1941 г.","1943 г.","1944 г.","1945 г.","1947 г."],"answer":"3542","hint":"Коренной перелом в войне — 1942–1943 гг. Освобождение Белоруссии — лето следующего года. Конференция в Ялте прошла в последние месяцы войны.","explain":"Курская битва — июль–август 1943 г.; Ялтинская (Крымская) конференция — февраль 1945 г.; операция «Багратион» по освобождению Белоруссии — июнь–август 1944 г.; битва за Москву началась 30 сентября 1941 г."},{"id":"h1","subject":"hist","topic":"Хронология","type":"order","max":1,"text":"Расположите в хронологической последовательности исторические события. Запишите цифры, которыми обозначены события, в правильной последовательности.","options":["Ледовое побоище","Стояние на реке Угре","Крещение Руси"],"answer":"312","hint":"Вспомните, с какими правителями связаны события: Владимир Святославич, Александр Невский, Иван III. В каком порядке они правили?","explain":"Крещение Руси — 988 г. (князь Владимир), Ледовое побоище — 1242 г. (Александр Невский), стояние на реке Угре — 1480 г. (Иван III, конец ордынского ига). Порядок: 3, 1, 2.","ege":2},{"id":"h2","subject":"hist","topic":"Хронология","type":"order","max":1,"text":"Расположите в хронологической последовательности исторические события. Запишите цифры, которыми обозначены события, в правильной последовательности.","options":["Отмена крепостного права","Восстание декабристов","Начало работы I Государственной думы"],"answer":"213","hint":"Сопоставьте события с правлениями: Николай I, Александр II, Николай II.","explain":"Восстание декабристов — 1825 г., отмена крепостного права — 1861 г., I Государственная дума начала работу в 1906 г. Порядок: 2, 1, 3.","ege":2},{"id":"h3","subject":"hist","topic":"Хронология","type":"order","max":1,"text":"Расположите в хронологической последовательности исторические события. Запишите цифры, которыми обозначены события, в правильной последовательности.","options":["Начало Сталинградской битвы","Принятие плана ГОЭЛРО","Полёт Ю. А. Гагарина в космос"],"answer":"213","hint":"Гражданская война, Великая Отечественная, «оттепель» — какой период идёт за каким?","explain":"План ГОЭЛРО принят в 1920 г., Сталинградская битва началась в июле 1942 г., полёт Гагарина — 12 апреля 1961 г. Порядок: 2, 1, 3.","ege":2},{"id":"h3a","subject":"hist","topic":"Факты и деятели","ege":3,"type":"match","max":2,"text":"Установите соответствие между процессами (явлениями, событиями) и фактами, относящимися к этим процессам (явлениям, событиям): к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["реформы государственного управления Петра I","Северная война","внутренняя политика Елизаветы Петровны","политика «просвещённого абсолютизма» Екатерины II"],"right":["учреждение коллегий","созыв Уложенной комиссии","основание Московского университета","Гангутское сражение","создание Верховного тайного совета","издание Манифеста о вольности дворянства"],"answer":"1432","hint":"Два факта лишние. Верховный тайный совет появился уже после смерти Петра I, а Манифест о вольности дворянства издал Пётр III.","explain":"Коллегии учреждены в 1717–1721 гг.; Гангутское сражение (1714 г.) — первая крупная победа русского флота в Северной войне; Московский университет основан в 1755 г. при Елизавете Петровне; Уложенная комиссия созвана Екатериной II в 1767 г. Верховный тайный совет создан в 1726 г. при Екатерине I, Манифест о вольности дворянства издан Петром III в 1762 г."},{"id":"h4t","subject":"hist","topic":"Факты и деятели","ege":4,"type":"table","max":3,"text":"Заполните пустые ячейки таблицы, используя представленные в приведённом ниже списке данные. Для каждой ячейки, обозначенной буквой, выберите номер нужного элемента.","head":["Географический объект","Событие (явление, процесс)","Время, когда произошло событие"],"rows":[["Полтава","_","1709 г."],["_","Ледовое побоище","_"],["река Угра","_","1480 г."],["_","_","1552 г."]],"right":["Чудское озеро","взятие Казани войсками Ивана IV","генеральное сражение Северной войны","1242 г.","Казань","стояние войск, завершившее зависимость Руси от Орды","1240 г.","Астрахань","морское сражение у мыса Гангут"],"answer":"314652","hint":"Начните с того, в чём уверены, например с года Ледового побоища. 1240 г. — год Невской битвы, а Астрахань присоединили в 1556 г.","explain":"Полтавская битва 1709 г. — генеральное сражение Северной войны; Ледовое побоище произошло на Чудском озере в 1242 г.; стояние на реке Угре в 1480 г. завершило зависимость Руси от Орды; в 1552 г. войска Ивана IV взяли Казань. По правилам ЕГЭ за задание 3 балла: одна ошибка — 2 балла, две или три ошибки — 1 балл."},{"id":"h5n","subject":"hist","topic":"Факты и деятели","ege":5,"type":"match","max":2,"text":"Установите соответствие между событиями (процессами) и их участниками: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["денежная реформа, введение золотого рубля","аграрная реформа: выход крестьян из общины на хутора и отруба","подготовка плана преобразования государственного управления (1809 г.)","отмена условий Парижского мира о нейтрализации Чёрного моря"],"right":["А. М. Горчаков","С. Ю. Витте","Д. А. Милютин","П. А. Столыпин","М. М. Сперанский","Е. Ф. Канкрин"],"answer":"2451","hint":"Золотой рубль ввели в конце XIX в. — кто тогда был министром финансов? Е. Ф. Канкрин проводил денежную реформу раньше, при Николае I, и рубль у него был серебряный.","explain":"Денежная реформа 1897 г. — С. Ю. Витте; аграрная реформа с 1906 г. — П. А. Столыпин; план преобразований 1809 г. («Введение к уложению государственных законов») — М. М. Сперанский; отказ от нейтрализации Чёрного моря (1870 г.) — министр иностранных дел А. М. Горчаков. Д. А. Милютин проводил военные реформы 1860–1870-х гг., Е. Ф. Канкрин — денежную реформу 1839–1843 гг."},{"id":"h6a","subject":"hist","topic":"Источники","ege":6,"type":"choice","max":2,"text":"Прочитайте отрывок из исторического источника и выберите в приведённом списке верные суждения. Запишите цифры, под которыми они указаны.","source":"«На обязанность правительства возлагаем Мы выполнение непреклонной Нашей воли:\n1. Даровать населению незыблемые основы гражданской свободы на началах действительной неприкосновенности личности, свободы совести, слова, собраний и союзов.\n2. Не останавливая предназначенных выборов в Государственную думу, привлечь теперь же к участию в Думе \u003c…> те классы населения, которые ныне совсем лишены избирательных прав \u003c…>.\n3. Установить, как незыблемое правило, чтобы никакой закон не мог восприять силу без одобрения Государственной думы и чтобы выборным от народа обеспечена была возможность действительного участия в надзоре за закономерностью действий поставленных от Нас властей».","options":["Документ был издан в период Первой российской революции.","Документ был издан императором Александром III.","В документе провозглашалось, что ни один закон не может вступить в силу без одобрения Государственной думы.","Документом был учреждён Правительствующий сенат.","Вскоре после издания документа в России была провозглашена республика.","Документ был издан в период Первой мировой войны."],"answer":"13","hint":"Определите год документа: выборы в Государственную думу уже назначены, населению обещаны гражданские свободы.","explain":"Это Манифест 17 октября 1905 г. Николая II, изданный в разгар Первой российской революции (1905–1907 гг.). В нём закреплено, что закон не вступает в силу без одобрения Думы. Сенат учреждён Петром I в 1711 г., республика провозглашена в 1917 г., Первая мировая война началась в 1914 г. По правилам ЕГЭ: одна неверная, лишняя или пропущенная цифра — 1 балл."},{"id":"h10","subject":"hist","topic":"Культура","type":"match","max":2,"text":"Установите соответствие между памятниками культуры и их авторами: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["икона «Троица»","памятник Петру I «Медный всадник»","храм Христа Спасителя в Москве","картина «Явление Христа народу»"],"right":["Феофан Грек","К. А. Тон","А. А. Иванов","Андрей Рублёв","В. В. Растрелли","Э. Фальконе"],"answer":"4623","hint":"Феофан Грек и Андрей Рублёв — иконописцы рубежа XIV–XV вв. Растрелли строил дворцы при Елизавете Петровне.","explain":"«Троица» — Андрей Рублёв (начало XV в.), «Медный всадник» — Этьен Фальконе (открыт в 1782 г.), храм Христа Спасителя — Константин Тон, «Явление Христа народу» — Александр Иванов, который работал над картиной около двадцати лет.","ege":7},{"id":"h13a","subject":"hist","topic":"Источники","ege":13,"type":"open","max":2,"text":"Прочитайте отрывок из исторического источника и кратко ответьте на вопрос.\n\nУкажите год, когда был издан документ, и императора, от имени которого он был издан. Назовите революцию, в ходе которой был издан документ.","source":"«На обязанность правительства возлагаем Мы выполнение непреклонной Нашей воли:\n1. Даровать населению незыблемые основы гражданской свободы на началах действительной неприкосновенности личности, свободы совести, слова, собраний и союзов.\n2. Не останавливая предназначенных выборов в Государственную думу, привлечь теперь же к участию в Думе \u003c…> те классы населения, которые ныне совсем лишены избирательных прав \u003c…>.\n3. Установить, как незыблемое правило, чтобы никакой закон не мог восприять силу без одобрения Государственной думы и чтобы выборным от народа обеспечена была возможность действительного участия в надзоре за закономерностью действий поставленных от Нас властей».","criteria":[{"id":"K1","max":2,"text":"Правильно указаны три элемента (год, император, революция) — 2 балла; два элемента — 1 балл; один элемент или ответ неправильный — 0 баллов."}],"model":"1905 г.; Николай II; Первая российская революция (революция 1905–1907 гг.).","hint":"Выборы в Государственную думу уже назначены, но законодательных прав у неё ещё нет. Какой это год?"},{"id":"h14a","subject":"hist","topic":"Источники","ege":14,"type":"open","max":2,"text":"Используя отрывок из документа, ответьте на вопросы.\n1) Какие гражданские свободы даровались населению? Укажите любые две.\n2) Какое изменение в порядке выборов в Государственную думу предусматривал документ?\n3) Какое правило принятия законов устанавливал документ?","source":"«На обязанность правительства возлагаем Мы выполнение непреклонной Нашей воли:\n1. Даровать населению незыблемые основы гражданской свободы на началах действительной неприкосновенности личности, свободы совести, слова, собраний и союзов.\n2. Не останавливая предназначенных выборов в Государственную думу, привлечь теперь же к участию в Думе \u003c…> те классы населения, которые ныне совсем лишены избирательных прав \u003c…>.\n3. Установить, как незыблемое правило, чтобы никакой закон не мог восприять силу без одобрения Государственной думы и чтобы выборным от народа обеспечена была возможность действительного участия в надзоре за закономерностью действий поставленных от Нас властей».","criteria":[{"id":"K1","max":2,"text":"Правильно даны ответы на три вопроса — 2 балла; на два вопроса — 1 балл; на один вопрос или ответ неправильный — 0 баллов. Ответы могут быть приведены в виде цитат или своими словами."}],"model":"1) Неприкосновенность личности, свобода совести, слова, собраний и союзов (любые две).\n2) К участию в выборах в Думу привлекались те классы населения, которые прежде были лишены избирательных прав.\n3) Никакой закон не может вступить в силу без одобрения Государственной думы.","hint":"Ответы есть в самом тексте: посмотрите пункты 1, 2 и 3 документа."},{"id":"h15a","subject":"hist","topic":"Источники","ege":15,"type":"open","max":2,"text":"В том же году, когда был издан документ, завершилась война России с Японией. Назовите город в США, где был подписан мирный договор, и президента США, выступившего посредником на мирных переговорах.","source":"«На обязанность правительства возлагаем Мы выполнение непреклонной Нашей воли:\n1. Даровать населению незыблемые основы гражданской свободы на началах действительной неприкосновенности личности, свободы совести, слова, собраний и союзов.\n2. Не останавливая предназначенных выборов в Государственную думу, привлечь теперь же к участию в Думе \u003c…> те классы населения, которые ныне совсем лишены избирательных прав \u003c…>.\n3. Установить, как незыблемое правило, чтобы никакой закон не мог восприять силу без одобрения Государственной думы и чтобы выборным от народа обеспечена была возможность действительного участия в надзоре за закономерностью действий поставленных от Нас властей».","criteria":[{"id":"K1","max":2,"text":"Правильно названы город и президент — 2 балла; правильно назван один элемент — 1 балл; ответ неправильный — 0 баллов."}],"model":"Портсмут; Теодор Рузвельт.","hint":"Переговоры шли в городе на атлантическом побережье США. Посредник вскоре получил за это Нобелевскую премию мира."},{"id":"h19a","subject":"hist","topic":"Причины и понятия","ege":19,"type":"open","max":3,"text":"Для крестьянской реформы 1861 г. укажите:\nа) одну причину, связанную с развитием экономики России;\nб) одно последствие реформы для правового положения крестьян;\nв) одно последствие, связанное с получением крестьянами земли.","criteria":[{"id":"K1","max":3,"text":"Правильно указаны три элемента (а, б, в) — 3 балла; два элемента — 2 балла; один элемент — 1 балл; ответ неправильный или рассуждения общего характера — 0 баллов."}],"model":"а) Крепостное право сдерживало развитие промышленности: не хватало вольнонаёмной рабочей силы, внутренний рынок оставался узким.\nб) Крестьяне получили личную свободу и общегражданские права: могли заключать сделки, владеть имуществом, заниматься торговлей и промыслами.\nв) Землю крестьяне получали за выкуп: до перехода на выкуп они оставались временнообязанными, затем десятилетиями выплачивали выкупные платежи; часть земли отошла помещикам (отрезки).","hint":"Каждый пункт отвечает на свой вопрос. Общие слова вроде «Россия отставала» не засчитываются — нужна конкретика: что именно мешало развитию и что именно изменилось для крестьян."},{"id":"h20a","subject":"hist","topic":"Причины и понятия","ege":20,"type":"open","max":2,"text":"Используя знание исторического понятия «заповедные лета», объясните его смысл и укажите, какое право крестьян, закреплённое Судебником 1497 г., временно отменялось в заповедные лета. Дайте только один ответ на каждый вопрос.","criteria":[{"id":"K1","max":2,"text":"Правильно даны два ответа — 2 балла; один ответ — 1 балл; ответ неправильный — 0 баллов. Если на вопрос дано несколько ответов, оценивается только первый."}],"model":"1) Заповедные лета — годы, в которые временно запрещался переход крестьян от одного землевладельца к другому (введены в начале 1580-х гг.).\n2) Отменялось право перехода в Юрьев день — за неделю до и неделю после 26 ноября — с уплатой «пожилого».","hint":"Слово «заповедь» здесь значит «запрет». Что именно запрещалось крестьянам и в какой день по Судебнику это право действовало?"},{"id":"h20b","subject":"hist","topic":"Причины и понятия","ege":20,"type":"open","max":2,"text":"Используя знание исторического понятия «продразвёрстка», объясните, как её применение было связано с крестьянскими восстаниями 1920–1921 гг., и укажите, чем её заменили в 1921 г. Дайте только один ответ на каждый вопрос.","criteria":[{"id":"K1","max":2,"text":"Правильно даны два ответа — 2 балла; один ответ — 1 балл; ответ неправильный — 0 баллов. Если на вопрос дано несколько ответов, оценивается только первый."}],"model":"1) Продразвёрстка обязывала крестьян сдавать государству по твёрдым ценам все «излишки» хлеба, а на деле изымалось и необходимое для жизни и посева. Это вызвало массовое недовольство и восстания крестьян (например, в Тамбовской губернии, в Западной Сибири).\n2) В 1921 г. по решению X съезда РКП(б) продразвёрстку заменили продовольственным налогом (продналогом); это стало началом нэпа.","hint":"Подумайте, что оставалось у крестьянина после прихода продотряда. Решение о замене принял X съезд партии."},{"id":"h21a","subject":"hist","topic":"Сравнение и аргументация","ege":21,"type":"open","max":3,"text":"Сравните внешнюю политику России во второй половине XVIII в. (правление Екатерины II) и в первой четверти XIX в. (правление Александра I). Сформулируйте один тезис о сходстве и приведите два обоснования этого тезиса с опорой на исторические факты. В каждом обосновании приведите факты по обоим периодам.","criteria":[{"id":"K1","max":3,"text":"Сформулирован верный тезис о сходстве и приведены два корректных обоснования с фактами — 3 балла. Тезис и одно корректное обоснование или два обоснования с неточностями, не искажающими смысла, — 2 балла. Тезис без корректных обоснований — 1 балл. Тезис неверный или не сформулирован — 0 баллов. Общие рассуждения («одержано много побед») фактами не считаются; оценивается только первый тезис."}],"model":"Тезис: в оба периода Россия вела успешные войны и расширяла свою территорию.\nОбоснование 1: при Екатерине II к России был присоединён Крым (1783 г.); при Александре I по Бухарестскому миру 1812 г. к России отошла Бессарабия.\nОбоснование 2: при Екатерине II Россия участвовала в разделах Речи Посполитой (1772, 1793, 1795 гг.); при Александре I по решению Венского конгресса (1815 г.) к России отошла большая часть Варшавского герцогства (Царство Польское).","hint":"Тезис — одно предложение о том, что было общим. Обоснование — конкретные факты из каждого периода: война, договор, год, территория."},{"id":"h22a","subject":"hist","topic":"Сравнение и аргументация","ege":22,"type":"open","max":2,"text":"Существует точка зрения, что преобразования Петра I превратили Россию в великую европейскую державу. Используя исторические знания, приведите два аргумента, которыми можно подтвердить эту точку зрения. При изложении аргументов обязательно используйте исторические факты. Факты, приведённые во втором аргументе, не должны повторять факты первого.","criteria":[{"id":"K1","max":2,"text":"Приведены два аргумента — 2 балла; один аргумент — 1 балл; аргументы не приведены, рассуждения общего характера или ответ неправильный — 0 баллов. Аргумент засчитывается, если в нём есть конкретный исторический факт и объяснение его связи с точкой зрения."}],"model":"1) Пётр I создал регулярную армию на основе рекрутской повинности и военно-морской флот. Это позволило победить Швецию в Северной войне: по Ништадтскому миру 1721 г. Россия получила выход к Балтийскому морю и стала сильнейшей державой Северной Европы.\n2) В 1721 г. Россия была провозглашена империей, а Пётр I принял титул императора. Европейские государства постепенно признали этот титул, что закрепило новый статус России среди великих держав.","hint":"Аргумент = факт + связка. Назовите конкретную реформу, войну или договор и объясните, почему это сделало Россию великой державой."},{"id":"s1","subject":"soc","topic":"Человек и общество","type":"choice","max":2,"text":"Выберите верные суждения о человеке и его деятельности и запишите цифры, под которыми они указаны.","options":["Человек — биосоциальное существо.","Все потребности человека имеют исключительно биологическую природу.","Мотив — это то, что побуждает человека к деятельности, ради чего она совершается.","Деятельность человека, в отличие от поведения животных, предполагает осознанную постановку цели.","Индивидуальность — это принадлежность человека к биологическому виду Homo sapiens."],"answer":"134","hint":"Сравните три понятия: индивид, индивидуальность, личность. И вспомните, какие бывают потребности: биологические, социальные, духовные.","explain":"Верны 1, 3 и 4. Суждение 2 неверно: кроме биологических есть социальные и духовные потребности. Суждение 5 описывает индивида, а индивидуальность — это неповторимое своеобразие человека."},{"id":"s2","subject":"soc","topic":"Человек и общество","type":"text","max":1,"text":"Запишите термин: процесс усвоения индивидом образцов поведения, социальных норм и ценностей, необходимых для успешной жизни в обществе.","answer":["социализация"],"hint":"Этот процесс начинается в семье и продолжается всю жизнь.","explain":"Социализация. Её агенты — семья, школа, сверстники, СМИ и другие; различают первичную и вторичную социализацию."},{"id":"s3","subject":"soc","topic":"Экономика","type":"choice","max":2,"text":"Выберите верные суждения о рыночной экономике и запишите цифры, под которыми они указаны.","options":["Цены на большинство товаров устанавливает государство.","Основу рыночной экономики составляет частная собственность.","Конкуренция побуждает производителей снижать издержки и повышать качество.","Рыночная экономика не нуждается ни в каком государственном регулировании.","Спрос и предложение согласуют действия покупателей и продавцов."],"answer":"235","hint":"Ищите признаки, которые отличают рынок от командной экономики. Слова «все», «ни в каком» часто сигнализируют о неверном суждении.","explain":"Верны 2, 3 и 5. Цены в рыночной экономике складываются под влиянием спроса и предложения, а не назначаются государством. Совсем без государства рынок не работает: оно защищает собственность и конкуренцию, производит общественные блага."},{"id":"s4","subject":"soc","topic":"Экономика","type":"text","max":1,"text":"Запишите термин: ценная бумага, которая даёт владельцу право на часть прибыли акционерного общества в виде дивидендов и на участие в управлении им.","answer":["акция"],"hint":"Не путайте с облигацией: облигация — долговая бумага, она не даёт права на управление.","explain":"Акция — долевая ценная бумага. Облигация, в отличие от неё, подтверждает, что владелец дал деньги в долг, и права голоса не даёт."},{"id":"s5","subject":"soc","topic":"Экономика","type":"choice","max":2,"text":"Какие из перечисленных факторов могут вызвать увеличение спроса на велосипеды (сдвиг кривой спроса вправо)? Запишите цифры, под которыми они указаны.","options":["рост доходов населения","снижение цены на велосипеды","строительство в городе сети велодорожек","рост цен на сталь и алюминий","удешевление проката велосипедов","мода на здоровый образ жизни"],"answer":"136","hint":"Изменение цены самого товара не сдвигает кривую спроса — оно меняет величину спроса. А цены на сырьё влияют на предложение.","explain":"Верны 1, 3 и 6: рост доходов, удобная инфраструктура и мода повышают спрос при любой цене. Снижение цены велосипедов меняет лишь величину спроса (движение по кривой). Подорожание металла сокращает предложение. Дешёвый прокат — товар-заменитель, он уменьшает спрос на покупку велосипедов."},{"id":"s13","subject":"soc","topic":"Экономика","type":"choice","max":2,"text":"На графике отражено изменение ситуации на рынке легковых автомобилей: линия предложения переместилась из положения S в положение S1 (P — цена товара, Q — количество товара). Какие из перечисленных факторов могли вызвать такое изменение? Запишите цифры, под которыми они указаны.","images":["g_supply"],"options":["снижение налогов на производителей автомобилей","рост доходов населения","внедрение технологий, снижающих издержки производства","подорожание стали и комплектующих","выход на рынок новых производителей","подорожание бензина"],"answer":"135","hint":"Линия сдвинулась вправо: при любой цене продавцы теперь готовы продать больше. Ищите то, что удешевляет производство или увеличивает число продавцов. Доходы покупателей и цены на бензин влияют на спрос, а не на предложение.","explain":"Сдвиг линии предложения вправо означает рост предложения. Его могли вызвать снижение налогов на производителей (1), технологии, снижающие издержки (3), и приход на рынок новых производителей (5). Рост доходов населения (2) и подорожание бензина (6) меняют спрос на автомобили. Подорожание стали и комплектующих (4) повышает издержки и сдвигает предложение влево."},{"id":"s11","subject":"soc","topic":"Экономика","type":"open","max":3,"text":"Приведите три примера, иллюстрирующих разные функции денег. В каждом примере укажите, какую функцию он иллюстрирует.","criteria":[{"id":"K1","max":3,"text":"Каждый пример, который сформулирован развёрнуто, иллюстрирует названную функцию и не повторяет другие примеры, — 1 балл, не больше трёх."}],"model":"Мера стоимости: в магазине на зимней куртке указана цена — 8 000 рублей.\nСредство обращения: Ольга купила в булочной хлеб и сразу расплатилась наличными.\nСредство платежа: предприятие перечислило работникам зарплату за месяц; гражданин уплатил налог на имущество.\nСредство накопления: семья каждый месяц откладывает часть дохода на вклад, чтобы купить квартиру.\nМировые деньги: российская компания оплатила поставку оборудования из Китая в юанях.","hint":"Функций денег пять: мера стоимости, средство обращения, средство платежа, средство накопления, мировые деньги. Пример — это конкретная ситуация с участником и действием, а не определение."},{"id":"s6","subject":"soc","topic":"Социальные отношения","type":"choice","max":2,"text":"Выберите примеры вертикальной социальной мобильности и запишите цифры, под которыми они указаны.","options":["рабочий получил высшее образование и стал инженером","семья переехала из Твери в Рязань","учитель перешёл в другую школу на ту же должность","спортсмен сменил вид спорта","менеджер получил должность начальника отдела","директор предприятия обанкротился и стал безработным"],"answer":"156","hint":"Вертикальная мобильность — изменение статуса вверх или вниз. Если статус остался прежним, мобильность горизонтальная.","explain":"Вертикальная мобильность — 1 и 5 (восходящая) и 6 (нисходящая). Переезд, переход в другую школу на ту же должность и смена вида спорта не меняют статус — это горизонтальная мобильность."},{"id":"s7","subject":"soc","topic":"Политика","type":"match","max":2,"text":"Установите соответствие между понятиями и элементами формы государства: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["республика","федерация","демократический режим","монархия","унитарное государство"],"right":["форма правления","форма государственного (территориального) устройства","политический режим"],"answer":"12312","hint":"Форма правления отвечает на вопрос, кто и как получает высшую власть; устройство — как организована территория; режим — какими методами осуществляется власть.","explain":"Республика и монархия — формы правления; федерация и унитарное государство — формы государственного устройства; демократия — политический режим."},{"id":"s8","subject":"soc","topic":"Политика","type":"choice","max":2,"text":"Какие из перечисленных полномочий принадлежат Президенту Российской Федерации согласно Конституции РФ? Запишите цифры, под которыми они указаны.","options":["принимает федеральный бюджет","является Верховным Главнокомандующим Вооружёнными Силами РФ","объявляет амнистию","осуществляет помилование","утверждает изменение границ между субъектами РФ","назначает Председателя Правительства РФ после утверждения его кандидатуры Государственной Думой"],"answer":"246","hint":"Помилование и амнистию часто путают: одно касается конкретного человека, другое — широкого круга лиц, и его объявляет парламент.","explain":"Президенту принадлежат полномочия 2, 4 и 6. Федеральный бюджет принимает Государственная Дума, она же объявляет амнистию. Изменение границ между субъектами РФ утверждает Совет Федерации."},{"id":"s10","subject":"soc","topic":"Политика","type":"open","max":3,"text":"Используя обществоведческие знания, составьте сложный план, позволяющий раскрыть по существу тему «Политические партии в демократическом обществе». План должен содержать не менее трёх пунктов, непосредственно раскрывающих тему, из которых два или более детализированы в подпунктах.","criteria":[{"id":"K1","max":2,"text":"Раскрытие темы по существу. Ключевые пункты: понятие и признаки партии; функции партий; виды партий или партийные системы. Все три ключевых пункта, два из них раскрыты в трёх и более подпунктах — 2 балла; два ключевых пункта с такой детализацией — 1 балл."},{"id":"K2","max":1,"text":"Корректность формулировок: пункты и подпункты сформулированы без ошибок, конкретно, не абстрактно."}],"model":"1. Понятие политической партии.\n2. Признаки партии:\nа) организационная структура и членство;\nб) программа и идеология;\nв) стремление к завоеванию и осуществлению власти;\nг) социальная база — опора на определённые группы общества.\n3. Функции партий:\nа) выражение и представление интересов социальных групп;\nб) участие в выборах и формирование органов власти;\nв) политическая социализация граждан;\nг) подготовка и выдвижение политических лидеров.\n4. Виды партий:\nа) по идеологии — либеральные, консервативные, социал-демократические;\nб) по отношению к власти — правящие и оппозиционные;\nв) по организации — кадровые и массовые.\n5. Партийные системы: однопартийная, двухпартийная, многопартийная.\n6. Правовое регулирование деятельности партий в РФ.","hint":"Ответьте себе на вопросы: что такое партия? чем она отличается от других объединений? зачем она нужна обществу? какими бывают партии и партийные системы? Каждый вопрос — пункт плана."},{"id":"law_f01","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Что такое семейное право?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Семейное право — это отрасль российского права, регулирующая личные неимущественные и имущественные отношения, возникающие из брака, родства и усыновления (удочерения).","hint":"Назовите вид отрасли и три основания отношений, которые она регулирует."},{"id":"law_f02","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Что такое брак? Каков порядок заключения брака в РФ?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Брак — это 1) добровольный 2) равноправный 3) союз мужчины и женщины, 4) направленный на создание семьи, 5) зарегистрированный в установленном законом порядке и 6) порождающий взаимные права и обязанности супругов.\nПорядок заключения брака в РФ:\nЛица, вступающие в брак, подают в орган ЗАГС совместное заявление, в котором указывают желаемую дату регистрации. Эта дата не может быть назначена ранее чем через месяц и позднее чем через год со дня подачи заявления.\nОднако при наличии уважительных причин срок может быть сокращён, а при особых обстоятельствах (беременности, рождении ребёнка, непосредственной угрозе жизни одной из сторон и т. д.) брак может быть зарегистрирован в день подачи заявления\nОрган ЗАГС регистрирует брак в личном присутствии лиц, вступающих в брак, и выдаёт свидетельство о браке.\nВ РФ признаётся только брак, зарегистрированный в установленном законом порядке. Супруги могут проживать вместе и без регистрации, однако это не порождает прав и обязанностей супругов.","hint":"В определении брака шесть признаков. Порядок: заявление → срок → регистрация."},{"id":"law_f03","subject":"soc","topic":"Семейное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о заключении брака в РФ и запишите цифры, под которыми они указаны.","options":["Дата регистрации брака по общему правилу назначается не ранее чем через месяц и не позднее чем через год со дня подачи заявления.","Брак регистрируется органом ЗАГС в личном присутствии лиц, вступающих в брак.","Совместное проживание без регистрации брака порождает права и обязанности супругов.","По общему правилу брачный возраст в РФ — 18 лет.","Разрешение на вступление в брак с 16 лет при наличии уважительных причин даёт суд."],"answer":"124","hint":"Обратите внимание, кто именно разрешает снизить брачный возраст, и признаётся ли в РФ незарегистрированный союз.","explain":"Верны 1, 2 и 4. Совместное проживание без регистрации прав и обязанностей супругов не порождает (3). Разрешение на брак с 16 лет даёт орган местного самоуправления, а не суд (5)."},{"id":"law_f04","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Каковы условия заключения брака?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Условия заключения брака:\n1) Взаимное добровольное согласие лиц, вступающих в брак;\n2) Достижение брачного возраста — по общему правилу 18 лет. Однако при наличии уважительных причин орган местного самоуправления может разрешить вступление в брак с 16 лет.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_f05","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Какие обстоятельства препятствуют заключению брака?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Обстоятельства, препятствующие заключению брака:\n— Хотя бы одно из лиц уже состоит в другом зарегистрированном браке;\n— Наличие родства по прямой восходящей или нисходящей линии (родители и дети, дедушки, бабушки и внуки), а также отношений между полнородными или неполнородными братом и сестрой;\n— Наличие отношений между усыновителем и усыновлённым;\n— Хотя бы одно из лиц признано судом недееспособным вследствие психического расстройства.","hint":"Их четыре: другой брак, близкое родство, усыновление, недееспособность."},{"id":"law_f06","subject":"soc","topic":"Семейное право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного препятствует заключению брака по семейному законодательству РФ? Запишите цифры, под которыми они указаны.","options":["одно из лиц уже состоит в другом зарегистрированном браке","лица являются двоюродными братом и сестрой","лица являются усыновителем и усыновлённым","одно из лиц признано судом недееспособным вследствие психического расстройства","у одного из лиц нет постоянного места работы","лица являются неполнородными братом и сестрой"],"answer":"1346","hint":"Запрет касается родства по прямой линии и братьев-сестёр (полнородных и неполнородных). Двоюродное родство в этот перечень не входит.","explain":"Препятствуют браку 1, 3, 4 и 6. Двоюродное родство (2) и отсутствие работы (5) не входят в перечень обстоятельств, препятствующих браку."},{"id":"law_f07","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Какие личные неимущественные и какие имущественные права и обязанности приобретают супруги при вступлении в брак?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Вступление в брак порождает личные и имущественные права и обязанности.\nЛичные права и обязанности супругов:\n— Каждый супруг свободен в выборе рода занятий, профессии, места пребывания и жительства;\n— Супруги обязаны строить отношения в семье на основе взаимоуважения и взаимопомощи, содействовать благополучию и укреплению семьи, заботиться о благосостоянии и развитии своих детей;\n— Супруги по своему желанию выбирают при заключении брака фамилию одного из них в качестве общей, сохраняют свои добрачные фамилии либо присоединяют к своей фамилии фамилию другого супруга.\nИмущественные права и обязанности супругов связаны с общим и личным имуществом супругов, владением, пользованием и распоряжением им, а также с взаимным материальным содержанием супругов.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_f08","subject":"soc","topic":"Семейное право","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и видами прав и обязанностей супругов: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["выбор при заключении брака фамилии одного из супругов в качестве общей","распоряжение общим имуществом по взаимному согласию","свобода выбора места пребывания и жительства","взаимное материальное содержание супругов","свобода выбора рода занятий и профессии"],"right":["личные неимущественные","имущественные"],"answer":"12121","hint":"Имущественные связаны с имуществом и деньгами, личные — с самой личностью: фамилией, профессией, местом жительства.","explain":"Личные: фамилия (А), место пребывания и жительства (В), род занятий и профессия (Д). Имущественные: распоряжение общим имуществом (Б), взаимное содержание (Г)."},{"id":"law_f09","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"В чём суть законного и договорного режимов имущества супругов? Что такое брачный договор, что он может и не может регулировать, каков порядок его заключения?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Существуют два вида правовых режимов имущества супругов:\n1) Законный (основан на семейном законодательстве). Согласно данному режиму имущество, нажитое супругами во время брака, является их совместной собственностью независимо от того, на чьё имя оно оформлено. Супруги владеют, пользуются и распоряжаются им по взаимному согласию. При разделе такого имущества доли супругов, как правило, признаются равными\nОднако закон выделяет несколько видов имущества, относящихся к личной собственности супругов и не подлежащих разделу:\n— Имущество, принадлежавшее одному из супругов до вступления в брак. Однако оно может быть признано совместным, если во время брака были произведены вложения, значительно увеличившие его стоимость, например капитальный ремонт;\n— Имущество, полученное в дар, по наследству или по иной безвозмездной сделке;\n— Вещи индивидуального пользования (обувь, одежда и т. д.), за исключением драгоценностей и предметов роскоши;\n— Награды, единовременные денежные призы и ценные подарки, полученные одним из супругов за личные достижения в области спорта, науки, культуры или искусства;\n— Исключительное право на результат интеллектуальной деятельности, созданный одним из супругов.\n2) Договорный режим. Основан на брачном договоре.\nБрачный договор — это письменный, нотариально удостоверенный договор, регулирующий имущественные права и обязанности супругов.\nБрачный договор:\nзаключается по желанию супругов;\nможет регулировать только имущественные права и обязанности.\nБрачный договор регулирует:\n— режим совместной, долевой или раздельной собственности супругов;\n— способы участия в доходах друг друга и порядок несения семейных расходов;\n— порядок раздела имущества в случае развода.\nБрачный договор не может:\n— ограничивать правоспособность и дееспособность супругов;\n— ограничивать право супругов обращаться в суд за защитой своих прав;\n— ограничивать право нетрудоспособного нуждающегося супруга на получение алиментов;\n— регулировать права и обязанности родителей в отношении детей;\n— включать условия, которые ставят одного из супругов в крайне неблагоприятное положение или противоречат основам семейного законодательства.\nПорядок заключения и форма брачного договора:\n— Брачный договор заключается исключительно в письменной форме;\n— Брачный договор подлежит обязательному нотариальному удостоверению;\n— Брачный договор может быть заключён как после регистрации брака, так и до неё. В последнем случае он вступает в силу только после регистрации брака.","hint":"Два режима. Пять видов личного имущества. Брачный договор: форма, что может и чего не может."},{"id":"law_f10","subject":"soc","topic":"Семейное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о законном режиме имущества супругов и запишите цифры, под которыми они указаны.","options":["Имущество, нажитое во время брака, является совместной собственностью супругов независимо от того, на чьё имя оно оформлено.","При разделе общего имущества доли супругов, как правило, признаются равными.","Имущество, полученное одним из супругов во время брака по наследству, становится совместной собственностью.","Драгоценности относятся к вещам индивидуального пользования и разделу не подлежат.","Добрачное имущество может быть признано совместным, если во время брака в него были сделаны вложения, значительно увеличившие его стоимость."],"answer":"125","hint":"Вспомните пять видов личного имущества супругов и исключение для вещей индивидуального пользования.","explain":"Верны 1, 2 и 5. Наследство — личное имущество супруга (3). Драгоценности и предметы роскоши — исключение из вещей индивидуального пользования: они делятся (4)."},{"id":"law_f11","subject":"soc","topic":"Семейное право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного по общему правилу является личной собственностью одного из супругов и при разводе не делится? Запишите цифры, под которыми они указаны.","options":["квартира, купленная одним из супругов до вступления в брак","автомобиль, купленный во время брака на заработную плату мужа","дача, полученная женой по наследству во время брака","одежда и обувь мужа","ювелирные украшения, купленные во время брака","исключительное право на роман, написанный женой"],"answer":"1346","hint":"Личное имущество: добрачное, полученное безвозмездно, вещи индивидуального пользования (кроме драгоценностей), исключительное право на результат интеллектуальной деятельности, награды за личные достижения.","explain":"Личная собственность — 1, 3, 4, 6. Автомобиль, купленный в браке на зарплату (2), — совместное имущество. Драгоценности (5) не относятся к личным вещам индивидуального пользования."},{"id":"law_f12","subject":"soc","topic":"Семейное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о брачном договоре и запишите цифры, под которыми они указаны.","options":["Брачный договор заключается в письменной форме и подлежит нотариальному удостоверению.","Брачный договор может определять, с кем из родителей будут жить дети после развода.","Брачный договор, заключённый до регистрации брака, вступает в силу со дня регистрации брака.","Брачный договор может устанавливать режим раздельной собственности супругов.","Брачный договор может ограничивать право супруга обращаться в суд."],"answer":"134","hint":"Брачный договор регулирует только имущественные отношения и не может ограничивать права супругов.","explain":"Верны 1, 3 и 4. Права и обязанности родителей в отношении детей брачный договор регулировать не может (2), ограничивать право обращаться в суд — тоже (5)."},{"id":"law_f13","subject":"soc","topic":"Семейное право","ege":15,"type":"match","max":2,"text":"Установите соответствие между условиями и возможностью включить их в брачный договор: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["порядок раздела имущества в случае развода","отказ нетрудоспособного нуждающегося супруга от права на алименты","порядок несения семейных расходов","обязанность одного из супругов не обращаться в суд за защитой своих прав","порядок воспитания детей"],"right":["может быть включено в брачный договор","не может быть включено в брачный договор"],"answer":"12122","hint":"Договор может регулировать только имущественные права и обязанности и не может ущемлять права супругов или касаться детей.","explain":"Можно: раздел имущества (А), семейные расходы (В). Нельзя: ограничивать право нетрудоспособного нуждающегося супруга на алименты (Б), право на суд (Г), регулировать отношения родителей и детей (Д)."},{"id":"law_f14","subject":"soc","topic":"Семейное право","type":"text","max":1,"text":"Запишите термин: письменный нотариально удостоверенный договор, регулирующий имущественные права и обязанности супругов.","answer":["брачный договор","брачным договором"],"hint":"Он определяет договорный режим имущества супругов.","explain":"Брачный договор. Он основа договорного режима имущества супругов."},{"id":"law_f15","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"В каком порядке расторгается брак: а) через ЗАГС; б) через суд?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Расторжение брака производится:\nв ЗАГСе:\n— если оба супруга согласны и у них нет общих несовершеннолетних детей;\n— независимо от наличия общих несовершеннолетних детей, если один из супругов: признан судом недееспособным; признан судом безвестно отсутствующим; осуждён к лишению свободы на срок свыше трёх лет.\nв суде:\n— если у супругов есть общие несовершеннолетние дети. При отсутствии соглашения между родителями суд определяет, с кем будет жить ребёнок после развода, учитывая следующие обстоятельства: привязанность ребёнка к каждому из родителей; возраст ребёнка; личные качества родителей и их отношения с ребёнком; материальные и жилищные условия родителей; мнение ребёнка (с 10 лет его учёт обязателен, если это не противоречит его интересам);\n— если один из супругов не согласен с расторжением брака. В таком случае другой супруг подаёт в суд исковое заявление. Суд вправе принять меры к примирению сторон, предоставив им срок до трёх месяцев. Если это не дало результата, суд, установив, что дальнейшая совместная жизнь супругов и сохранение семьи невозможны, расторгает брак.\nФактическое прекращение брачных отношений не влечёт юридического прекращения брака. Муж не имеет права без согласия жены инициировать расторжение брака во время её беременности, а также в течение года со дня рождения ребёнка.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_f16","subject":"soc","topic":"Семейное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о расторжении брака и запишите цифры, под которыми они указаны.","options":["При взаимном согласии супругов, не имеющих общих несовершеннолетних детей, брак расторгается в органе ЗАГС.","Если у супругов есть общие несовершеннолетние дети, брак по общему правилу расторгается в суде.","Муж вправе без согласия жены инициировать расторжение брака во время её беременности.","Суд вправе дать супругам срок для примирения до трёх месяцев.","Фактическое прекращение брачных отношений означает юридическое прекращение брака."],"answer":"124","hint":"Вспомните ограничение для мужа во время беременности жены и после рождения ребёнка.","explain":"Верны 1, 2 и 4. Без согласия жены муж не может инициировать развод во время её беременности и в течение года после рождения ребёнка (3). Фактическое прекращение отношений не прекращает брак юридически (5)."},{"id":"law_f17","subject":"soc","topic":"Семейное право","ege":15,"type":"match","max":2,"text":"Установите соответствие между ситуациями и органами, в которых расторгается брак: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["супруги согласны на развод, общих несовершеннолетних детей у них нет","жена не согласна на расторжение брака","муж осуждён к лишению свободы на шесть лет, у супругов есть пятилетний сын","супруги согласны развестись, но у них двое несовершеннолетних детей","жена признана судом безвестно отсутствующей"],"right":["орган ЗАГС","суд"],"answer":"12121","hint":"В ЗАГСе — при согласии обоих и отсутствии общих детей, а также независимо от детей, если второй супруг недееспособен, безвестно отсутствует или осуждён больше чем на три года.","explain":"ЗАГС: А, В (осуждение на срок свыше трёх лет — независимо от детей), Д (безвестное отсутствие). Суд: Б (несогласие супруга), Г (есть общие несовершеннолетние дети)."},{"id":"law_f18","subject":"soc","topic":"Семейное право","type":"open","max":3,"text":"Супруги К. расторгают брак в суде и не могут договориться, с кем будет жить их одиннадцатилетняя дочь.\n1) Назовите любые три обстоятельства, которые учтёт суд, решая этот вопрос.\n2) Обязан ли суд учесть мнение девочки? Объясните почему.\n3) Назовите любые две обязанности, которые сохранятся у родителя, который будет жить отдельно.","criteria":[{"id":"K1","max":3,"text":"Правильно даны ответы на три вопроса — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) Привязанность ребёнка к каждому из родителей; возраст ребёнка; личные качества родителей и их отношения с ребёнком; материальные и жилищные условия родителей; мнение ребёнка (любые три).\n2) Да: девочке больше 10 лет, а с 10 лет учёт мнения ребёнка обязателен, если это не противоречит его интересам.\n3) Содержать ребёнка; воспитывать его, заботиться о его здоровье и нравственном развитии; обеспечить получение общего образования (любые две). Кроме того, он вправе общаться с ребёнком и участвовать в его воспитании.","hint":"Обстоятельства перечислены в ответе о расторжении брака через суд; возраст девочки важен для второго вопроса."},{"id":"law_f19","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Назовите основные права и обязанности родителей.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Права и обязанности родителей:\n— права:\n— воспитывать и обучать ребёнка;\n— выбирать образовательную организацию и форму получения ребёнком образования;\n— защищать права и интересы ребёнка и выступать его законными представителями;\n— общаться с ребёнком и участвовать в его воспитании при раздельном проживании.\nобязанности:\n— воспитывать ребёнка и заботиться о его физическом и психическом здоровье, нравственном развитии;\n— обеспечить получение ребёнком общего образования;\n— содержать ребёнка;\n— не осуществлять родительские права в ущерб интересам ребёнка.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_f20","subject":"soc","topic":"Семейное право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к обязанностям родителей? Запишите цифры, под которыми они указаны.","options":["содержать ребёнка","обеспечить получение ребёнком общего образования","выбирать образовательную организацию для ребёнка","заботиться о физическом и психическом здоровье ребёнка","распоряжаться заработком ребёнка-подростка","общаться с ребёнком при раздельном проживании"],"answer":"124","hint":"Часть пунктов — права родителей. Сравните: «обязан обеспечить» и «вправе выбрать».","explain":"Обязанности: 1, 2, 4. Выбор образовательной организации (3) и общение при раздельном проживании (6) — права родителей. Распоряжаться заработком подросток с 14 лет вправе сам (5)."},{"id":"law_f21","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Назовите основные права детей.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Права детей:\n— жить и воспитываться в семье;\n— общаться с родителями и другими родственниками;\n— защищать свои права и законные интересы;\n— выражать своё мнение;\n— иметь имя, отчество и фамилию.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_f22","subject":"soc","topic":"Семейное право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к правам ребёнка по семейному законодательству РФ? Запишите цифры, под которыми они указаны.","options":["жить и воспитываться в семье","выражать своё мнение","самостоятельно выбирать школу с 10 лет","иметь имя, отчество и фамилию","общаться с родителями и другими родственниками","распоряжаться имуществом родителей"],"answer":"1245","hint":"Права ребёнка — жить в семье, общаться с родными, защищать свои права, выражать мнение, иметь имя.","explain":"Права ребёнка: 1, 2, 4, 5. Выбор образовательной организации — право родителей (3), распоряжаться имуществом родителей ребёнок не вправе (6)."},{"id":"law_f23","subject":"soc","topic":"Семейное право","type":"open","card":true,"max":2,"text":"Назовите основные начала (принципы) семейного права.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные начала (принципы) семейного права:\n— добровольность брачного союза мужчины и женщины;\n— равенство прав супругов в семье;\n— разрешение внутрисемейных вопросов по взаимному согласию;\n— приоритет семейного воспитания детей, забота об их благосостоянии и развитии, приоритетная защита их прав и интересов;\n— приоритетная защита прав и интересов нетрудоспособных членов семьи\nи др.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_f24","subject":"soc","topic":"Семейное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о принципах семейного права и запишите цифры, под которыми они указаны.","options":["Брачный союз мужчины и женщины является добровольным.","Внутрисемейные вопросы разрешаются по взаимному согласию.","Права мужа в семье имеют приоритет перед правами жены.","Приоритет семейного воспитания детей — один из принципов семейного права.","Защита прав нетрудоспособных членов семьи не относится к принципам семейного права."],"answer":"124","hint":"Среди принципов — равенство прав супругов и приоритетная защита детей и нетрудоспособных.","explain":"Верны 1, 2, 4. Принцип — равенство прав супругов (3 неверно). Приоритетная защита прав нетрудоспособных членов семьи — тоже принцип (5 неверно)."},{"id":"law_u01","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Что такое уголовное право?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Уголовное право — это отрасль права, регулирующая общественные отношения, возникающие в связи с совершением преступления и назначением за него наказания. Уголовное законодательство основывается на Конституции РФ и общепризнанных принципах и н
