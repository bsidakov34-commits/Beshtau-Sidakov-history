ормах международного права, а его основным источником является Уголовный кодекс РФ (УК РФ).","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_u02","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Что такое преступление? Что является основанием уголовной ответственности?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основанием уголовной ответственности является совершение деяния, содержащего все признаки состава преступления, предусмотренного УК РФ.\nПреступлением признается 1) виновно совершенное 2) общественно опасное 3) деяние, 4) запрещенное Уголовным кодексом под угрозой наказания.\nИными словами, исчерпывающий перечень преступлений и наказаний за них содержится в УК РФ.","hint":"В определении преступления четыре признака."},{"id":"law_u03","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о уголовном праве и запишите цифры, под которыми они указаны.","options":["Основным источником уголовного права является Уголовный кодекс РФ.","Преступлением признаётся виновно совершённое общественно опасное деяние, запрещённое Уголовным кодексом под угрозой наказания.","Новые преступления могут устанавливаться указами Президента РФ.","Основанием уголовной ответственности является совершение деяния, содержащего все признаки состава преступления.","Уголовно-процессуальный кодекс РФ определяет, какие деяния признаются преступлениями."],"answer":"124","hint":"Исчерпывающий перечень преступлений содержится в одном законе. Не путайте УК и УПК.","explain":"Верны 1, 2, 4. Перечень преступлений исчерпывающе установлен УК РФ, а не указами (3). УПК устанавливает порядок судопроизводства, а не перечень преступлений (5)."},{"id":"law_u04","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Что такое состав преступления и из каких элементов он состоит?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Состав преступления — это совокупность элементов и признаков, необходимых для квалификации данного деяния как преступления. Выделяют 4 элемента состава преступления:\n1) Субъект. Это лицо, которое совершило преступление. Согласно УК РФ, это вменяемое физическое лицо, достигшее возраста уголовной ответственности — 16 лет. По некоторым преступлениям (например, убийство, разбой, грабеж и т. д.) возраст уголовной ответственности снижен до 14 лет. Иными словами, если лицо, совершившее преступление, не достигло указанного возраста, уголовная ответственность не наступает в связи с отсутствием одного из элементов состава преступления — субъекта.\n2) Субъективная сторона. Это внутреннее психическое отношение лица к совершаемому деянию и его последствиям. Центральной категорией субъективной стороны является вина. Вина бывает в двух формах — умысел и неосторожность. При умысле лицо осознает общественную опасность деяния, предвидит его последствия и желает их наступления либо сознательно допускает их. При неосторожности лицо предвидит возможность наступления последствий, но без достаточных оснований рассчитывает их предотвратить, либо не предвидит их, хотя должно и могло предвидеть. При отсутствии вины уголовная ответственность не наступает — это невиновное причинение вреда.\n3) Объект. Это те общественные отношения, на которые посягает преступник и которым он причиняет вред. Например, жизнь и здоровье человека, собственность, общественный порядок и т. д.\n4) Объективная сторона. Характеризует совокупность внешних проявлений преступления: общественно опасное деяние, а для преступлений с материальным составом — также общественно опасные последствия и причинно-следственную связь между ними. Например, один человек бьет другого (деяние)тот умирает (последствия)однако экспертиза установила, что умер он не от удара, а, например, из-за приступа диабета, поскольку вовремя не принял лекарство. В данном случае отсутствует причинно-следственная связь между ударом и смертью, поэтому деяние не будет квалифицировано как оконченное убийство.","hint":"Четыре элемента: субъект, субъективная сторона, объект, объективная сторона."},{"id":"law_u05","subject":"soc","topic":"Уголовное право и процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между характеристиками и элементами состава преступления: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["вина в форме умысла или неосторожности","вменяемое физическое лицо, достигшее возраста уголовной ответственности","общественные отношения, которым причиняется вред, например собственность","причинно-следственная связь между деянием и последствиями","общественно опасное деяние"],"right":["субъект","субъективная сторона","объект","объективная сторона"],"answer":"21344","hint":"Субъективная сторона — внутреннее отношение к деянию; объективная — внешние проявления преступления.","explain":"Вина — субъективная сторона (А); лицо — субъект (Б); охраняемые отношения — объект (В); причинная связь (Г) и само деяние (Д) — объективная сторона."},{"id":"law_u06","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о вине в уголовном праве и запишите цифры, под которыми они указаны.","options":["Вина бывает в двух формах — умысел и неосторожность.","При умысле лицо осознаёт общественную опасность деяния, предвидит его последствия и желает их наступления либо сознательно допускает их.","Если лицо не предвидело последствий, хотя должно было и могло их предвидеть, это неосторожность.","Невиновное причинение вреда влечёт уголовную ответственность.","Вина относится к объективной стороне состава преступления."],"answer":"123","hint":"Вина — центральная категория одного из элементов состава. Какого?","explain":"Верны 1, 2, 3. При отсутствии вины ответственность не наступает (4). Вина относится к субъективной стороне (5)."},{"id":"law_u07","subject":"soc","topic":"Уголовное право и процесс","type":"text","max":1,"text":"С какого возраста по общему правилу наступает уголовная ответственность? Запишите число.","answer":["16","шестнадцати","шестнадцать"],"hint":"По отдельным преступлениям возраст снижен, но спрашивается общее правило.","explain":"По общему правилу — с 16 лет; за отдельные преступления (убийство, разбой, грабёж и др.) — с 14 лет."},{"id":"law_u08","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Какие существуют категории преступлений в УК РФ?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Уголовный кодекс РФ признает преступлениями множество деяний. Так, выделяют преступления против личности, против военной службы, против общественной безопасности и общественного порядка, в сфере экономики, против государственной власти, против мира и безопасности человечества. Преступления, перечисленные в УК РФ, разделяются на 4 категории:\nНебольшой тяжести. Максимальное наказание не превышает 3 лет лишения свободы (например, «Коммерческий подкуп» — ч. 1 ст. 204 УК РФ; «Вандализм» — ст. 214 УК РФ);\nСредней тяжести.\nМаксимальное наказание не превышает 5 лет лишения свободы за умышленные деяния, а за неосторожные деяния составляет более 3, но не более 10 лет лишения свободы (например, «Возбуждение ненависти либо вражды, а равно унижение человеческого достоинства» — ч. 1 ст. 282 УК РФ; «Подмена ребенка» — ст. 153 УК РФ);\nТяжкие. Максимальное наказание составляет более 5, но не превышает 10 лет лишения свободы за умышленные деяния, а за неосторожные деяния — более 10, но не более 15 лет лишения свободы (например, «Мародерство» — ч. 1 ст. 356.1 УК РФ; «Незаконное изготовление оружия» — ч. 1 ст. 223 УК РФ);\nОсобо тяжкие. Это умышленные преступления, за которые предусмотрено наказание свыше 10 лет лишения свободы или более строгое наказание (например, «Убийство» — ст. 105 УК РФ; «Террористический акт» — ст. 205 УК РФ).","hint":"Четыре категории; границы для умышленных деяний — 3, 5 и 10 лет."},{"id":"law_u09","subject":"soc","topic":"Уголовное право и процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между максимальным наказанием за умышленное преступление и категорией преступления: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["лишение свободы на срок до 3 лет","лишение свободы на срок до 8 лет","лишение свободы на срок до 5 лет","лишение свободы на срок до 20 лет","пожизненное лишение свободы"],"right":["небольшой тяжести","средней тяжести","тяжкое","особо тяжкое"],"answer":"13244","hint":"Для умышленных деяний: не более 3 лет, не более 5, не более 10, свыше 10 лет или более строгое наказание.","explain":"До 3 лет — небольшой тяжести (А); до 5 — средней тяжести (В); до 8 — тяжкое, так как больше 5, но не больше 10 (Б); свыше 10 лет (Г) и пожизненное (Д) — особо тяжкие."},{"id":"law_u10","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о категориях преступлений и запишите цифры, под которыми они указаны.","options":["Особо тяжкими могут быть только умышленные преступления.","Неосторожное деяние с максимальным наказанием 12 лет лишения свободы относится к тяжким преступлениям.","Умышленное деяние с максимальным наказанием 4 года лишения свободы относится к преступлениям небольшой тяжести.","Вандализм (ст. 214 УК РФ) — пример преступления небольшой тяжести.","Убийство относится к тяжким преступлениям."],"answer":"124","hint":"Для неосторожных деяний границы другие: средней тяжести — до 10 лет, тяжкие — до 15 лет.","explain":"Верны 1, 2, 4. Умышленное деяние с максимумом 4 года — средней тяжести (3). Убийство — особо тяжкое преступление (5)."},{"id":"law_u11","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Что такое судимость? В чём отличие погашения судимости от снятия?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Судимость — это особое правовое состояние лица, которое действует со дня вступления обвинительного приговора суда в законную силу до момента погашения или снятия судимости.\nВ период судимости:\n1) совершение нового умышленного преступления лицом, имеющим судимость за ранее совершенное умышленное преступление, может быть признано рецидивом и повлечь более строгое наказание;\n2) существуют ограничения на работу по определенным профессиям и специальностям;\n3) действуют некоторые другие установленные законом ограничения.\nСудимость, как правило, не погашается одновременно с отбытием наказания, а продолжается в течение установленного законом срока. Этот срок зависит от вида наказания и категории преступления. Например, в отношении лиц, отбывших лишение свободы за преступления небольшой или средней тяжести, судимость погашается по истечении 3 лет после отбытия наказания, а за тяжкие преступления — по истечении 8 лет.\nЕсли осужденный после отбытия наказания вел себя безупречно и возместил вред, причиненный преступлением, то по его ходатайству суд может снять с него судимость до истечения срока ее погашения.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_u12","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о судимости и запишите цифры, под которыми они указаны.","options":["Судимость действует со дня вступления обвинительного приговора в законную силу до её погашения или снятия.","Судимость погашается одновременно с отбытием наказания.","За тяжкие преступления судимость погашается по истечении 8 лет после отбытия лишения свободы.","Суд может снять судимость до истечения срока её погашения по ходатайству осуждённого.","Административное наказание влечёт судимость."],"answer":"134","hint":"Судимость продолжается и после отбытия наказания. Какая ответственность её не влечёт?","explain":"Верны 1, 3, 4. Судимость, как правило, не погашается одновременно с отбытием наказания (2). Административная ответственность судимости не влечёт (5)."},{"id":"law_u13","subject":"soc","topic":"Уголовное право и процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между характеристиками и способами прекращения судимости: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["наступает по истечении установленного законом срока","происходит по решению суда по ходатайству осуждённого","возможно до истечения срока погашения","для преступлений средней тяжести наступает через 3 года после отбытия лишения свободы","требует безупречного поведения после отбытия наказания и возмещения вреда"],"right":["погашение судимости","снятие судимости"],"answer":"12212","hint":"Погашение связано со сроком, снятие — с решением суда раньше срока.","explain":"Погашение: А, Г (истечение установленного срока). Снятие: Б, В, Д — суд снимает судимость досрочно при безупречном поведении и возмещении вреда."},{"id":"law_u14","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Какие существуют виды уголовных наказаний? Назовите любые семь.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Виды уголовных наказаний:\n— штраф;\n— арест;\n— обязательные работы;\n— исправительные работы;\n— принудительные работы;\n— ограничение свободы;\n— содержание в дисциплинарной воинской части;\n— ограничение по военной службе;\n— лишение права занимать определенные должности или заниматься определенной деятельностью;\n— лишение специального, воинского или почетного звания, классного чина и государственных наград;\n— лишение свободы на определенный срок;\n— пожизненное лишение свободы;\n— смертная казнь (в УК РФ сохранилась, однако в настоящее время не назначается и не исполняется в силу решений Конституционного Суда РФ).","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_u15","subject":"soc","topic":"Уголовное право и процесс","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к видам уголовных наказаний? Запишите цифры, под которыми они указаны.","options":["исправительные работы","предупреждение","лишение специального, воинского или почётного звания","выговор","принудительные работы","дисквалификация"],"answer":"135","hint":"Предупреждение и дисквалификация — административные наказания, выговор — дисциплинарное взыскание.","explain":"Уголовные наказания: 1, 3, 5. Предупреждение (2) и дисквалификация (6) — административные наказания, выговор (4) — дисциплинарное взыскание."},{"id":"law_u16","subject":"soc","topic":"Уголовное право и процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между мерами и видами наказаний: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["содержание в дисциплинарной воинской части","административное выдворение за пределы РФ","исправительные работы","дисквалификация","ограничение свободы"],"right":["уголовное наказание","административное наказание"],"answer":"12121","hint":"Сравните перечни наказаний из УК РФ и КоАП РФ.","explain":"Уголовные: А, В, Д. Административные: Б (выдворение иностранного гражданина), Г (дисквалификация)."},{"id":"law_u17","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Что такое уголовный процесс? Чем УК РФ отличается от УПК РФ?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Уголовный процесс — это урегулированная нормами уголовно-процессуального права деятельность уполномоченных лиц и органов по расследованию преступлений и рассмотрению уголовных дел в суде. Уголовный процесс осуществляется на основе Уголовно-процессуального кодекса Российской Федерации (УПК РФ).\nНе стоит путать УК РФ и УПК РФ, хотя эти два закона тесно связаны. Первый устанавливает, какие деяния признаются преступлениями и какие наказания предусмотрены за них. УПК РФ устанавливает порядок уголовного судопроизводства: возбуждение уголовного дела, расследование, права участников процесса, порядок проведения следственных и судебных действий и т. д.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_u18","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о уголовном процессе и запишите цифры, под которыми они указаны.","options":["Уголовный процесс осуществляется на основе Уголовно-процессуального кодекса РФ.","УПК РФ устанавливает, какие деяния признаются преступлениями.","УПК РФ устанавливает порядок возбуждения уголовного дела и расследования.","Уголовный процесс — деятельность уполномоченных лиц и органов по расследованию преступлений и рассмотрению уголовных дел в суде.","Уголовный процесс регулируется Кодексом административного судопроизводства РФ."],"answer":"134","hint":"УК отвечает на вопрос «что наказуемо», УПК — «как расследуют и судят».","explain":"Верны 1, 3, 4. Перечень преступлений устанавливает УК РФ (2). КАС РФ регулирует обжалование решений органов власти (5)."},{"id":"law_u19","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Назовите участников уголовного процесса.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Участники уголовного процесса:\nСуд. Уголовное дело может рассматриваться судьей единолично, коллегией из трех судей, а в предусмотренных законом случаях — судьей с участием коллегии присяжных заседателей. Суд занимает центральное место в уголовном процессе, поскольку на него возложены важнейшие задачи:\nведет общий ход судебного процесса (предоставляет слово, следит за порядком судебного заседания и т. д.);\nпо окончании судебного разбирательства выносит приговор — судебный акт, которым подсудимый признается виновным или невиновным в совершении преступления.\n— Участники уголовного процесса со стороны обвинения:\n1) Прокурор (поддерживает государственное обвинение в суде; осуществляет надзор за процессуальной деятельностью органов дознания и предварительного следствия);\n2) Следователь (производит предварительное следствие по уголовным делам, отнесенным к его подследственности);\n3) Дознаватель (производит дознание и другие процессуальные действия в пределах своих полномочий);\n4) Потерпевший (лицо, которому преступлением причинен физический, имущественный или моральный вред);\n5) Частный обвинитель (лицо, подавшее заявление в суд по уголовному делу частного обвинения и поддерживающее обвинение в суде, например по делам об умышленном причинении легкого вреда здоровью или клевете без квалифицирующих признаков);\n6) Гражданский истец — физическое или юридическое лицо, предъявившее требование о возмещении имущественного вреда или компенсации морального вреда, причиненного преступлением.\n— Участники уголовного процесса со стороны защиты:\n1) Подозреваемый/обвиняемый/подсудимый — зачастую это одно лицо, статус которого меняется на разных стадиях уголовного процесса;\n2) Защитник. Как правило, защитником является адвокат. По решению суда наряду с адвокатом в качестве защитника может быть допущен близкий родственник обвиняемого или другое лицо, о допуске которого ходатайствует обвиняемый. Если обвиняемый является несовершеннолетним, в уголовном деле также участвует его законный представитель;\n3) Гражданский ответчик — физическое или юридическое лицо, которое в соответствии с гражданским законодательством несет ответственность за вред, причиненный преступлением.\n— Иные участники (лица, способствующие проведению разбирательства):\n1) Свидетель. Лицо, которому могут быть известны какие-либо сведения, имеющие значение для расследования и разрешения уголовного дела, и которое вызвано для дачи показаний;\n2) Переводчик. Лицо, свободно владеющее языком, знание которого необходимо для перевода в ходе уголовного судопроизводства;\n3) Понятой. Лицо, не заинтересованное в исходе уголовного дела и привлекаемое для удостоверения факта производства следственного действия, а также его хода и результатов;\n4) Специалист. Лицо, обладающее специальными знаниями и привлекаемое к участию в процессуальных действиях;\n5) Эксперт. Лицо, обладающее специальными знаниями и привлекаемое для проведения судебной экспертизы и дачи заключения.","hint":"Суд; сторона обвинения; сторона защиты; иные участники."},{"id":"law_u20","subject":"soc","topic":"Уголовное право и процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между участниками уголовного процесса и группами участников: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["следователь","гражданский ответчик","понятой","потерпевший","эксперт"],"right":["сторона обвинения","сторона защиты","иные участники"],"answer":"12313","hint":"Потерпевший — на стороне обвинения. Гражданский ответчик отвечает за вред и стоит на стороне защиты.","explain":"Обвинение: следователь (А), потерпевший (Г). Защита: гражданский ответчик (Б). Иные участники: понятой (В), эксперт (Д)."},{"id":"law_u21","subject":"soc","topic":"Уголовное право и процесс","ege":16,"type":"choice","max":2,"text":"Кто из перечисленных относится к участникам уголовного процесса со стороны защиты? Запишите цифры, под которыми они указаны.","options":["защитник","дознаватель","обвиняемый","частный обвинитель","гражданский ответчик","свидетель"],"answer":"135","hint":"Дознаватель и частный обвинитель — сторона обвинения, свидетель — иной участник.","explain":"Сторона защиты: защитник (1), обвиняемый (3), гражданский ответчик (5). Дознаватель (2) и частный обвинитель (4) — сторона обвинения; свидетель (6) — иной участник."},{"id":"law_u22","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Назовите стадии уголовного процесса.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные стадии уголовного процесса. Уголовный процесс состоит из двух основных частей:\n1) Досудебное производство;\n2) Судебное производство.\nЭти части внутри себя подразделяются на определенные стадии.\nДосудебное производство:\n1) Возбуждение уголовного дела. Уполномоченное лицо при наличии достаточных данных, указывающих на признаки преступления, принимает решение о возбуждении уголовного дела. Поводами могут послужить заявление о преступлении, явка с повинной, сообщение о совершенном или готовящемся преступлении, полученное из других источников, и т. д. Какой конкретно орган расследует дело (МВД, ФСБ и т. д.), определяется правилами подследственности;\n2) Предварительное расследование в форме предварительного следствия или дознания, в рамках которого собираются и проверяются доказательства. Форма расследования определяется не сложностью дела, а установленными законом правилами. В ходе расследования следователь или дознаватель проводит различные следственные действия: обыск, выемку, следственный эксперимент, эксгумацию и др.\nТакже в ходе процесса принимаются меры по установлению лиц, причастных к совершению преступления. Лицу или нескольким лицам может быть предъявлено обвинение, после чего они приобретают статус обвиняемых.\n\n3) По окончании предварительного расследования следователь составляет обвинительное заключение, а дознаватель — обвинительный акт или обвинительное постановление. Итоговый документ вместе с материалами дела передается прокурору. Если прокурор утвердит его, уголовное дело направляется в суд и начинается судебное производство.\nСудебное производство. В рамках судебного производства решается вопрос о виновности или невиновности лица. Судебное производство проходит следующие стадии:\n1) Подготовка к судебному заседанию. Судья изучает материалы дела, разрешает предусмотренные законом вопросы и принимает решение о назначении судебного заседания либо другое предусмотренное законом решение.\n2) Предварительное слушание. Проводится при наличии установленных законом оснований. На этом этапе решаются вопросы об исключении недопустимых доказательств, возвращении уголовного дела прокурору, приостановлении или прекращении дела и другие процессуальные вопросы.\n3) Непосредственно судебное разбирательство, состоящее из:\n— Подготовительной части судебного заседания. Судья объявляет дело к рассмотрению, устанавливает личности участников, разъясняет их права и обязанности.\n— Судебного следствия. Прокурор оглашает предъявленное подсудимому обвинение. Стороны представляют свои доказательства и допрашивают свидетелей.\n— Прений сторон. Представители обвинения и защиты подводят итоги и высказывают свои аргументы относительно виновности или невиновности подсудимого.\n— Последнего слова подсудимого. Подсудимый имеет право высказать свое мнение по делу перед вынесением приговора.\n— Вынесения приговора. Суд удаляется в совещательную комнату и на основе исследованных доказательств выносит обвинительный или оправдательный приговор.\n— Обжалования в суде апелляционной инстанции. Сторона защиты или обвинения либо обе стороны могут обжаловать не вступивший в законную силу приговор в вышестоящий суд. Срок апелляционного обжалования составляет 15 суток со дня постановления приговора, а для осужденного, содержащегося под стражей, — со дня вручения ему копии приговора. Вышестоящий суд вправе оставить приговор без изменения, отменить или изменить его либо принять другое предусмотренное законом решение. Если приговор не был обжалован, он вступает в законную силу после истечения срока обжалования, а если был обжалован — в день вынесения решения судом апелляционной инстанции, если приговор не отменен.\n— Исполнения приговора. Исполнением наказаний и других предписаний приговора в пределах своей компетенции занимаются суд, ФСИН России, ФССП России и другие государственные органы.\n— После вступления приговора в законную силу он может быть пересмотрен в кассационном или надзорном порядке, а также ввиду новых или вновь открывшихся обстоятельств. Если вышестоящий суд установит существенные нарушения закона, судебное решение может быть изменено или отменено, а дело — направлено на новое рассмотрение.","hint":"Две части: досудебное и судебное производство, внутри — стадии."},{"id":"law_u23","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о стадиях уголовного процесса и запишите цифры, под которыми они указаны.","options":["Уголовный процесс включает досудебное и судебное производство.","Предварительное расследование проводится в форме предварительного следствия или дознания.","По окончании предварительного следствия следователь составляет обвинительное заключение.","Приговор по уголовному делу выносит прокурор.","Срок апелляционного обжалования приговора составляет один месяц."],"answer":"123","hint":"Кто выносит приговор? Каков срок апелляционного обжалования в уголовном процессе?","explain":"Верны 1, 2, 3. Приговор выносит суд (4). Срок апелляционного обжалования приговора — 15 суток (5); один месяц — срок в гражданском процессе."},{"id":"law_u24","subject":"soc","topic":"Уголовное право и процесс","type":"order","max":1,"text":"Расположите этапы судебного разбирательства по уголовному делу в правильной последовательности.","options":["прения сторон","вынесение приговора","судебное следствие","последнее слово подсудимого"],"answer":"3142","hint":"Сначала исследуют доказательства, затем стороны подводят итоги, затем говорит подсудимый.","explain":"Судебное следствие → прения сторон → последнее слово подсудимого → вынесение приговора."},{"id":"law_u25","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Что такое меры пресечения и какие они бывают? Что такое иные меры процессуального принуждения и какие они бывают?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"К подозреваемому или обвиняемому могут быть применены меры пресечения — меры процессуального принуждения, применяемые, чтобы лицо не скрылось от дознания, следствия или суда, не продолжило преступную деятельность, не угрожало участникам процесса, не уничтожило доказательства и не воспрепятствовало производству по делу иным способом.\nВыделяют следующие меры пресечения:\n— подписка о невыезде;\n— личное поручительство;\n— наблюдение командования воинской части;\n— присмотр за несовершеннолетним обвиняемым;\n— запрет определенных действий;\n— залог;\n— домашний арест;\n— заключение под стражу.\nТакже в ходе производства могут быть применены иные меры процессуального принуждения. Они применяются для обеспечения установленного порядка уголовного судопроизводства и надлежащего исполнения приговора. В зависимости от вида меры они могут применяться к подозреваемому, обвиняемому, потерпевшему, свидетелю, гражданскому истцу, гражданскому ответчику, эксперту, специалисту, переводчику или понятому:\n— обязательство о явке;\n— привод;\n— временное отстранение от должности;\n— наложение ареста на имущество;\n— приостановление операций с денежными средствами, электронными денежными средствами и денежными средствами, внесенными в качестве аванса за услуги связи;\n— денежное взыскание.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_u26","subject":"soc","topic":"Уголовное право и процесс","ege":16,"type":"choice","max":2,"text":"Что из перечисленного является мерой пресечения? Запишите цифры, под которыми они указаны.","options":["подписка о невыезде","привод","домашний арест","залог","обязательство о явке","административный арест"],"answer":"134","hint":"Привод и обязательство о явке — иные меры процессуального принуждения; административный арест — наказание по КоАП.","explain":"Меры пресечения: 1, 3, 4. Привод (2) и обязательство о явке (5) — иные меры процессуального принуждения, административный арест (6) — административное наказание."},{"id":"law_u27","subject":"soc","topic":"Уголовное право и процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и мерами процессуального принуждения: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["личное поручительство","временное отстранение от должности","заключение под стражу","наложение ареста на имущество","денежное взыскание"],"right":["мера пресечения","иная мера процессуального принуждения"],"answer":"12122","hint":"Меры пресечения применяются к подозреваемому или обвиняемому, чтобы он не скрылся и не мешал делу. Их восемь.","explain":"Меры пресечения: личное поручительство (А), заключение под стражу (В). Иные меры: отстранение от должности (Б), арест имущества (Г), денежное взыскание (Д)."},{"id":"law_u28","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Назовите основные принципы уголовного процесса.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные принципы уголовного процесса:\n— Принцип законности. Действия суда и других участников процесса должны осуществляться на всех стадиях процесса в строгом соответствии с законом. Данный принцип необходим для предотвращения произвола, а также обеспечения прав и свобод человека;\n— Презумпция невиновности. Данный принцип является одним из базовых и закреплен в законодательстве. Его положения:\nОбвиняемый считается невиновным, пока его виновность в совершении преступления не будет доказана в предусмотренном законом порядке и установлена вступившим в законную силу приговором суда;\nПодозреваемый или обвиняемый не обязан доказывать свою невиновность. Бремя доказывания обвинения и опровержения доводов, приводимых в защиту подозреваемого или обвиняемого, лежит на стороне обвинения;\nВсе сомнения в виновности обвиняемого, которые не могут быть устранены в установленном законом порядке, толкуются в его пользу. Обвинительный приговор не может быть основан на предположениях;\n— Состязательность сторон. Уголовный процесс строится на разграничении функций обвинения, защиты и разрешения уголовного дела. Стороны обвинения и защиты равноправны перед судом;\n— Принцип осуществления правосудия только судом. Признать лицо виновным в совершении преступления и назначить ему уголовное наказание может только суд;\n— Принцип обеспечения права на защиту. Подозреваемый и обвиняемый имеют право защищаться лично и пользоваться помощью защитника. В предусмотренных законом случаях участие защитника обеспечивается государством;\n— Принцип гласности. Судебное разбирательство является открытым для посторонних лиц, за исключением случаев, предусмотренных законом, например при рассмотрении дел, связанных с государственной тайной;\n— Принцип свободы оценки доказательств. Никакие доказательства не имеют заранее установленной силы. Суд, прокурор, следователь и дознаватель оценивают их по своему внутреннему убеждению, основанному на совокупности доказательств, руководствуясь законом и совестью;\n— Принцип неприкосновенности личности. Никто не может быть задержан по подозрению в совершении преступления или заключен под стражу без предусмотренных законом оснований.\nДоказательства также должны отвечать требованиям относимости и допустимости: иметь отношение к уголовному делу и быть получены с соблюдением требований закона.","hint":"Законность, презумпция невиновности, состязательность, правосудие только судом, право на защиту, гласность, свобода оценки доказательств, неприкосновенность личности."},{"id":"law_u29","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о презумпции невиновности и запишите цифры, под которыми они указаны.","options":["Обвиняемый считается невиновным, пока его виновность не доказана в установленном порядке и не установлена вступившим в силу приговором суда.","Обвиняемый обязан доказать свою невиновность.","Неустранимые сомнения в виновности обвиняемого толкуются в его пользу.","Обвинительный приговор может быть основан на предположениях, если они правдоподобны.","Бремя доказывания обвинения лежит на стороне обвинения."],"answer":"135","hint":"Кто должен доказывать вину? Можно ли осудить на основании предположений?","explain":"Верны 1, 3, 5. Обвиняемый не обязан доказывать невиновность (2), обвинительный приговор не может основываться на предположениях (4). По данным ФИПИ, этот принцип — частая ошибка выпускников."},{"id":"law_u30","subject":"soc","topic":"Уголовное право и процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между положениями и принципами уголовного процесса: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["признать лицо виновным и назначить наказание может только суд","судебное разбирательство открыто для посторонних лиц, кроме случаев, предусмотренных законом","функции обвинения, защиты и разрешения дела разграничены","стороны обвинения и защиты равноправны перед судом","дела, связанные с государственной тайной, рассматриваются в закрытом заседании как исключение"],"right":["состязательность сторон","гласность","осуществление правосудия только судом"],"answer":"32112","hint":"Состязательность — про стороны и их равенство, гласность — про открытость заседаний.","explain":"Только суд: А. Гласность: Б и Д (исключение из правила открытости). Состязательность: В, Г."},{"id":"law_u31","subject":"soc","topic":"Уголовное право и процесс","type":"open","card":true,"max":2,"text":"Каковы особенности уголовной ответственности несовершеннолетних?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Уголовная ответственность несовершеннолетних применяется к лицам, которым во время совершения преступления исполнилось 14, но не исполнилось 18 лет, при этом по общему правилу ответственность наступает с 16 лет, а за отдельные преступления — с 14 лет. При назначении наказания суд учитывает условия жизни и воспитания несовершеннолетнего, уровень его психического развития, особенности личности и влияние старших. Несовершеннолетний, совершивший преступление небольшой или средней тяжести, может быть освобожден от уголовной ответственности с применением принудительных мер воспитательного воздействия. К несовершеннолетним не применяются пожизненное лишение свободы и смертная казнь, максимальный срок лишения свободы составляет 10 лет, а наказание отбывается в воспитательной колонии.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_u32","subject":"soc","topic":"Уголовное право и процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о уголовной ответственности несовершеннолетних и запишите цифры, под которыми они указаны.","options":["Несовершеннолетними признаются лица, которым на момент преступления исполнилось 14, но не исполнилось 18 лет.","К несовершеннолетнему может быть применено пожизненное лишение свободы.","Максимальный срок лишения свободы для несовершеннолетних — 10 лет.","Несовершеннолетние отбывают лишение свободы в воспитательной колонии.","Несовершеннолетний, совершивший тяжкое преступление, может быть освобождён от уголовной ответственности с применением принудительных мер воспитательного воздействия."],"answer":"134","hint":"Освобождение с мерами воспитательного воздействия возможно не по всем категориям преступлений.","explain":"Верны 1, 3, 4. Пожизненное лишение свободы к несовершеннолетним не применяется (2). Освобождение с принудительными мерами воспитательного воздействия возможно за преступления небольшой или средней тяжести, а не за тяжкие (5)."},{"id":"law_u33","subject":"soc","topic":"Уголовное право и процесс","ege":22,"type":"open","max":4,"text":"Пятнадцатилетний Кирилл совершил грабёж.\n1) Может ли Кирилл быть привлечён к уголовной ответственности? Объясните почему.\n2) Назовите любые два обстоятельства, которые суд учтёт при назначении ему наказания.\n3) Где Кирилл будет отбывать наказание, если суд назначит лишение свободы?\n4) Назовите любой вид наказания, который к нему не может быть применён.","criteria":[{"id":"K1","max":4,"text":"Правильно даны ответы на четыре вопроса — 4 балла; на 3 — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) Да: за грабёж уголовная ответственность наступает с 14 лет.\n2) Условия жизни и воспитания, уровень психического развития, особенности личности, влияние старших (любые два).\n3) В воспитательной колонии.\n4) Пожизненное лишение свободы или смертная казнь.","hint":"Вспомните, по каким преступлениям возраст ответственности снижен до 14 лет, и особенности ответственности несовершеннолетних."},{"id":"law_a01","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Что такое административное право? Назовите некоторые вопросы, которые оно регулирует.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Административное право — это отрасль российского права, регулирующая общественные отношения в сфере государственного управления.\nИными словами, административное право регулирует деятельность органов государственной власти в процессе реализации ими своих полномочий, а также порядок предоставления ими различных государственных услуг населению. В связи с тем, что государственных органов как и вопросов которыми они занимаются очень много (на федеральном, региональном и местном уровне), административное право состоит из большого количества законов, постановлений, приказов, распоряжений и тд. И эти акты и образуют административное право.\nВот лишь некоторые вопросы, регулируемые административным правом:\n— Полномочия и компетенция министерств, ведомств, агентств, служб и тд. (Министерства здравоохранения, торговли, культуры, сельского хозяйства и других министерств, ГИБДД, Федральной налоговой службы, Росреестра и многих других);\n— Проведение проверок и инспекций. Государственные органы осуществляют проверки на предмет соблюдения закона организациями и индивидуальными предпринимателями;\n— Регистрация актов гражданского состояния. Рождение, брак, смерть, и другие акты гражданского состояния регистрируются государственными органами;\n— Оформление и выдача документов. Паспорта, заграничные паспорта, водительские удостоверения и другие документы.\n— Регулирование миграционных процессов. Вопросы, связанные с выдачей виз, видов на жительство, разрешений на работу и др;\n— Рассмотрение жалоб на действия государственных органов. Граждане могут подавать жалобы на действия или бездействие государственных органов в рамках процедуры, также регулируемых административным правом;\n— Организация и проведение выборов. Процедуры проведения выборов и референдумов на всех уровнях.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a02","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Как соотносятся государство и другие участники административных правоотношений?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Так как одной из сторон административно-правовых отношений является государство, в таких отношениях воля одной стороны (наделенной властными полномочиями) главенствует над волей другой стороны. Однако, все стороны административных отношений выполняют свои действия в строгом соответствии с законом и равны перед законом.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a03","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Что такое административная юрисдикция?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Органы государственной власти, в процессе реализации своих полномочий также осуществляют административную юрисдикцию.\nАдминистративная юрисдикция — это деятельность органов государственной власти по выявлению административных правонарушений, административному расследованию, а также привлечению к административной ответственности в установленном законом порядке.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a04","subject":"soc","topic":"Административное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о административном праве и запишите цифры, под которыми они указаны.","options":["Административное право регулирует общественные отношения в сфере государственного управления.","Административное право регулирует выдачу паспортов и водительских удостоверений.","В административных правоотношениях стороны равноправны, ни одна не обладает властными полномочиями.","Административная юрисдикция — деятельность органов власти по выявлению административных правонарушений, административному расследованию и привлечению к ответственности.","Административное право состоит из одного кодекса."],"answer":"124","hint":"В административных отношениях одна сторона — государство с властными полномочиями.","explain":"Верны 1, 2, 4. В административных отношениях воля стороны, наделённой властными полномочиями, главенствует (3). Административное право состоит из большого количества законов и других актов (5)."},{"id":"law_a05","subject":"soc","topic":"Административное право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного регулируется административным правом? Запишите цифры, под которыми они указаны.","options":["регистрация актов гражданского состояния","выдача разрешений на работу иностранным гражданам","заключение брачного договора","проведение государственными органами проверок организаций","наследование по завещанию","назначение уголовного наказания"],"answer":"124","hint":"Административное право — это деятельность органов власти и услуги, которые они оказывают населению.","explain":"Административное право: 1, 2, 4. Брачный договор (3) — семейное право, наследование (5) — гражданское, уголовное наказание (6) — уголовное право."},{"id":"law_a06","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Что такое административное правонарушение (административный проступок)?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"К административной ответственности лицо привлекается за совершение административных правонарушений.\nАдминистративное правонарушение (административный проступок) — признаётся противоправное, виновное действие (бездействие) физического или юридического лица, за которое законодательством установлена административная ответственность.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a07","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Каким законом регулируется порядок привлечения к административной ответственности?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Перечень деяний, за которые лицо привлекается к административной ответственности, а также порядок привлечения к административной ответственности регулируется Кодексом Российской Федерации об административных правонарушениях (КоАП РФ).\nСубъекты Российской Федерации на своих территориях также могут дополнительно принимать законы, устанавливающие за определенные деяния административную ответственность.\nТаким образом, те деяния, которые несут большую общественную опасность включены в Уголовный кодекс РФ, несущие меньшую опасность-в КоАП РФ.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a08","subject":"soc","topic":"Административное право","type":"text","max":1,"text":"Каким кодексом установлены перечень административных правонарушений и порядок привлечения к административной ответственности? Запишите сокращённое название.","answer":["КоАП","КоАП РФ","Кодекс об административных правонарушениях","Кодекс Российской Федерации об административных правонарушениях"],"hint":"Кодекс Российской Федерации об административных правонарушениях.","explain":"КоАП РФ. Субъекты РФ также могут принимать законы об административной ответственности."},{"id":"law_a09","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Что такое административная ответственность?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Административная ответственность — вид юридической ответственности, наступающей за совершение административного правонарушения.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a10","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Каковы особенности административной ответственности?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Административная ответственность имеет много схожего с уголовной ответственностью, но имеет и большие отличия.\nОсобенности административной ответственности:\n1) Основанием для её возникновения является совершение административного правонарушения (в отличие от уголовной ответственности, наступающей за преступления);\n2) к субъектам, совершившим административные правонарушения, применяются менее суровые взыскания, чем к субъектам, совершившим преступления;\n3) административная ответственность, в отличие от уголовной, не влечет состояние судимости;\n4) в отличие от уголовной ответственности, к которой привлекает только суд, правом привлекать к административной ответственности наделен ряд государственных органов в рамках своей компетенции. Например:\n— судьи (например, ст.18.12 «Нарушение беженцем или вынужденным переселенцем правил пребывания (проживания) в Российской Федерации»)\n— комиссии по делам несовершеннолетних и защите их прав (например, ст. 5.35 «Неисполнение родителями или иными законными представителями несовершеннолетних обязанностей по содержанию и воспитанию несовершеннолетних»)\n— таможенные органы (например, 16.2 «Недекларирование либо недостоверное декларирование товаров»)\n— налоговые органы (например, ст. 15.1 «Нарушение порядка работы с денежной наличностью и порядка ведения кассовых операций, а также нарушение требований об использовании специальных банковских счетов»)\n— пограничные органы (например, ст. 18.2. «Нарушение пограничного режима в пограничной зоне»);\n— и многие другие государственные органы (наделенных таким правом более 70 на федеральном уровне).\n5) к административной ответственности могут привлекаться не только физические (граждане РФ, иностранцы) лица (с 16-летнего возраста), но и юридические лица (организации). К уголовной же ответственности привлекаются только физические лица.\nПример нормы КоАП: «ст. 14.1.2 «Осуществление предпринимательской деятельности в области транспорта без лицензии влечет наложение административного штрафа на граждан и должностных лиц в размере пятидесяти тысяч рублей; на индивидуальных предпринимателей - ста тысяч рублей; на юридических лиц - четырехсот тысяч рублей»;\n6) Порядок привлечения к административной ответственности схож с уголовным процессом-имеются стадии возбуждения дела, административного расследования, вынесения постановления и тд). Однако, все происходит более оперативно и экономично, чем в уголовном процессе. А в некоторых делах административное расследование и вовсе может не проводиться.","hint":"Сравните с уголовной: основание, суровость, судимость, кто привлекает, субъекты, порядок."},{"id":"law_a11","subject":"soc","topic":"Административное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о административной ответственности и запишите цифры, под которыми они указаны.","options":["Административная ответственность наступает за совершение административного правонарушения.","Административная ответственность влечёт состояние судимости.","К административной ответственности могут привлекаться юридические лица.","Привлекать к административной ответственности вправе только суд.","Порядок привлечения к административной ответственности установлен КоАП РФ."],"answer":"135","hint":"Сравните административную ответственность с уголовной: кто привлекает и есть ли судимость.","explain":"Верны 1, 3, 5. Административная ответственность не влечёт судимости (2). Привлекать к ней вправе не только суд, но и многие органы: налоговые, таможенные, комиссии по делам несовершеннолетних и др. (4)."},{"id":"law_a12","subject":"soc","topic":"Административное право","ege":15,"type":"match","max":2,"text":"Установите соответствие между признаками и видами юридической ответственности: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["наступает за проступок, предусмотренный КоАП РФ","к ней привлекаются только физические лица","влечёт состояние судимости","к ней вправе привлекать налоговые и таможенные органы","по общему правилу наступает с 16 лет, а за отдельные деяния — с 14 лет"],"right":["административная","уголовная"],"answer":"12212","hint":"Юридические лица несут только административную ответственность. Возраст 14 лет — особенность уголовной.","explain":"Административная: А, Г. Уголовная: Б (только физические лица), В (судимость), Д (снижение возраста до 14 лет по отдельным преступлениям)."},{"id":"law_a13","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Назовите стадии дела об административном правонарушении.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Стадии дела об административном правонарушении:\n1) Возбуждение дела об административном правонарушении. Начинается с составления протокола об административном правонарушении или принятия постановления о возбуждении дела. Протокол составляется уполномоченным должностным лицом или органом. В нем указываются обстоятельства нарушения, данные о правонарушителе и свидетелях;\n2) Рассмотрение дела об административном правонарушении. Дело рассматривается органом или должностным лицом, уполномоченным на это. В процессе рассмотрения дела выясняются все обстоятельства правонарушения, заслушиваются объяснения лица, в отношении которого ведется дело, а также свидетелей. Должностное лицо вправе запросить дополнительные доказательства, если это необходимо;\n3) Принятие постановления (решения) по делу. По итогам рассмотрения дела принимается постановление о назначении административного наказания или о прекращении производства по делу, если отсутствует состав правонарушения;\n4) Обжалование постановления. Лицо, в отношении которого вынесено постановление, а также потерпевший имеют право обжаловать его в вышестоящем органе или суде. Жалоба подается в течение 10 дней со дня вынесения постановления;\n5) Исполнение постановления. Постановление вступает в законную силу после истечения срока на обжалование или после рассмотрения жалобы.\nЕсли назначено наказание (например, штраф), оно подлежит исполнению в установленном порядке.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a14","subject":"soc","topic":"Административное право","type":"order","max":1,"text":"Расположите стадии производства по делу об административном правонарушении в правильной последовательности.","options":["рассмотрение дела","исполнение постановления","возбуждение дела","принятие постановления по делу","обжалование постановления"],"answer":"31452","hint":"Дело начинается с протокола, а исполняется постановление после вступления в силу.","explain":"Возбуждение дела → рассмотрение → принятие постановления → обжалование → исполнение."},{"id":"law_a15","subject":"soc","topic":"Административное право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о производстве по делу об административном правонарушении и запишите цифры, под которыми они указаны.","options":["Дело может быть возбуждено составлением протокола об административном правонарушении.","Жалоба на постановление по общему правилу подаётся в течение 10 дней со дня его вынесения.","Постановление вступает в законную силу сразу после вынесения независимо от обжалования.","При отсутствии состава правонарушения производство по делу прекращается.","Обжаловать постановление может только прокурор."],"answer":"124","hint":"Когда вступает в силу постановление и кто вправе его обжаловать?","explain":"Верны 1, 2, 4. Постановление вступает в силу после истечения срока обжалования или рассмотрения жалобы (3). Обжаловать его вправе лицо, в отношении которого оно вынесено, и потерпевший (5)."},{"id":"law_a16","subject":"soc","topic":"Административное право","type":"open","card":true,"max":2,"text":"Назовите виды административных наказаний.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Виды административных наказаний:\n— ︎ Предупреждение.\n— ︎ Административный штраф.\n— ︎ Конфискация орудия совершения или предмета административного правонарушения.\n— ︎ Лишение специального права, предоставленного физическому лицу.\n— ︎ Административный арест.\n— ︎ Административное выдворение за пределы Российской Федерации иностранного гражданина или лица без гражданства.\n— ︎ Дисквалификация.\n— ︎ Административное приостановление деятельности.\n— ︎ Обязательные работы.\n— ︎ Административный запрет на посещение мест проведения официальных спортивных соревнований в дни их проведения.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_a17","subject":"soc","topic":"Административное право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к административным наказаниям? Запишите цифры, под которыми они указаны.","options":["предупреждение","замечание","дисквалификация","исправительные работы","административное приостановление деятельности","ограничение свободы"],"answer":"135","hint":"Замечание — дисциплинарное взыскание; исправительные работы и ограничение свободы — уголовные наказания.","explain":"Административные наказания: 1, 3, 5. Замечание (2) — дисциплинарное взыскание, исправительные работы (4) и ограничение свободы (6) — уголовные наказания."},{"id":"law_a18","subject":"soc","topic":"Административное право","ege":15,"type":"match","max":2,"text":"Установите соответствие между мерами и видами юридической ответственности: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["выговор","лишение специального права, предоставленного физическому лицу","пожизненное лишение свободы","административный запрет на посещение мест проведения официальных спортивных соревнований","замечание"],"right":["административное наказание","уголовное наказание","дисциплинарное взыскание"],"answer":"31213","hint":"Замечание и выговор — взыскания работодателя. Лишение специального права (например, водительских прав) есть в КоАП.","explain":"Дисциплинарные: выговор (А), замечание (Д). Административные: лишение специального права (Б), запрет на посещение соревнований (Г). Уголовное: пожизненное лишение свободы (В)."},{"id":"law_a19","subject":"soc","topic":"Административное право","ege":22,"type":"open","max":4,"text":"Инспектор ГИБДД остановил гражданина Н., превысившего скорость, составил протокол и вынес постановление о штрафе.\n1) Какой вид юридической ответственности применён к Н.?\n2) Каким кодексом регулируется привлечение к этой ответственности?\n3) В течение какого срока Н. может обжаловать постановление?\n4) Повлечёт ли это наказание судимость? Объясните почему.","criteria":[{"id":"K1","max":4,"text":"Правильно даны ответы на четыре вопроса — 4 балла; на 3 — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) Административная ответственность (административный штраф).\n2) Кодекс РФ об административных правонарушениях (КоАП РФ).\n3) В течение 10 дней со дня вынесения постановления.\n4) Нет: административная ответственность, в отличие от уголовной, не влечёт состояния судимости.","hint":"Штраф за нарушение правил дорожного движения назначает не суд, а уполномоченный орган. Вспомните особенности административной ответственности."},{"id":"law_g01","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое гражданское право?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Гражданское право — отрасль права, регулирующая личные неимущественные и имущественные отношения, основанные на равенстве, автономии воли и имущественной самостоятельности участников.\nПримеры: купля-продажа, оказание услуг, аренда, наследование, создание юридических лиц.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g02","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Назовите субъектов гражданского права.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Физические лица — люди.\n2) Юридические лица — организации.\n3) Публично-правовые образования — РФ, субъекты РФ и муниципальные образования.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g03","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о гражданском праве и запишите цифры, под которыми они указаны.","options":["Гражданское право регулирует имущественные и личные неимущественные отношения.","Отношения, регулируемые гражданским правом, основаны на равенстве, автономии воли и имущественной самостоятельности участников.","Субъектами гражданского права являются только физические лица.","Российская Федерация, её субъекты и муниципальные образования могут быть субъектами гражданского права.","В гражданских правоотношениях одна сторона находится во властном подчинении у другой."],"answer":"124","hint":"Субъектов гражданского права три вида. Подчинение характерно для административного права.","explain":"Верны 1, 2, 4. Субъекты — физические лица, юридические лица и публично-правовые образования (3). Властного подчинения в гражданском праве нет: принцип равенства участников (5)."},{"id":"law_g04","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое правоспособность и дееспособность?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Правосубъектность физического лица включает правоспособность и дееспособность.\nПРАВОСПОСОБНОСТЬ — способность ИМЕТЬ гражданские права и нести обязанности. Возникает с рождения и прекращается со смертью.\nГраждане могут иметь имущество в собственности, совершать законные сделки, участвовать в обязательствах, выбирать место жительства, иметь авторские и другие имущественные и личные неимущественные права.\nДо совершеннолетия часть сделок совершается самостоятельно, остальные — с участием законных представителей.\nПример: Николай дарит квартиру пятилетнему Петру. Собственником станет Пётр, но договор подпишет его родитель.\nДЕЕСПОСОБНОСТЬ — способность СВОИМИ ДЕЙСТВИЯМИ приобретать и осуществлять гражданские права, создавать для себя обязанности и исполнять их. По общему правилу полностью наступает в 18 лет.\nС 18 лет Пётр будет самостоятельно подписывать договоры.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g05","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между характеристиками и понятиями: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["возникает с рождения","по общему правилу в полном объёме наступает с 18 лет","способность своими действиями приобретать и осуществлять права, создавать для себя обязанности и исполнять их","способность иметь гражданские права и нести обязанности","прекращается со смертью"],"right":["правоспособность","дееспособность"],"answer":"12211","hint":"Правоспособность — «иметь права», дееспособность — «своими действиями».","explain":"Правоспособность: А, Г, Д. Дееспособность: Б, В."},{"id":"law_g06","subject":"soc","topic":"Гражданское право","type":"text","max":1,"text":"Запишите термин: способность гражданина иметь гражданские права и нести обязанности, возникающая с рождения.","answer":["правоспособность","гражданская правоспособность"],"hint":"Не путайте с дееспособностью — способностью действовать самостоятельно.","explain":"Правоспособность: возникает с рождения и прекращается со смертью."},{"id":"law_g07","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Какова дееспособность несовершеннолетних от 6 до 14 лет и от 14 до 18 лет?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Дееспособность формируется постепенно: с 6 лет появляется определённый объём, с 14 — расширяется, с 18 по общему правилу становится полной.\nОт 6 до 14 лет можно самостоятельно:\n1) Совершать мелкие бытовые сделки: например, покупать недорогие товары или оплачивать недорогую доставку еды.\n2) Безвозмездно получать выгоду по сделкам, не требующим нотариального удостоверения или государственной регистрации.\nШестилетний Пётр может сам принять в подарок компьютер. При дарении квартиры нотариально удостоверяемый договор подписывают родители, а собственником становится Пётр.\n3) Распоряжаться средствами, предоставленными законными представителями либо другими лицами с их согласия для определённой цели или свободного распоряжения. Например, карманными деньгами.\nОт 14 до 18 лет можно самостоятельно:\n1) Распоряжаться заработком, стипендией и другими доходами.\n2) Осуществлять права автора произведений науки, литературы, искусства и других охраняемых результатов интеллектуальной деятельности.\n3) Вносить вклады в кредитные организации и распоряжаться ими по закону. Для открытия банковского счёта нужно согласие законных представителей, если полная дееспособность ещё не приобретена.\n— Сохраняются возможности, предусмотренные для возраста 6–14 лет. Другие сделки по общему правилу совершаются с письменного согласия законных представителей.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g08","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между действиями несовершеннолетних и возрастом, с которого их можно совершать самостоятельно: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["совершать мелкие бытовые сделки","распоряжаться своим заработком и стипендией","вносить вклады в кредитные организации","распоряжаться карманными деньгами, предоставленными родителями","осуществлять права автора произведения"],"right":["с 6 лет","только с 14 лет"],"answer":"12212","hint":"С 6 лет — мелкие бытовые сделки, безвозмездная выгода и карманные деньги. С 14 — заработок, авторские права, вклады.","explain":"С 6 лет: А, Г. Только с 14 лет: Б, В, Д."},{"id":"law_g09","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о дееспособности несовершеннолетних и запишите цифры, под которыми они указаны.","options":["С 6 лет ребёнок вправе самостоятельно безвозмездно получать выгоду по сделкам, не требующим нотариального удостоверения или государственной регистрации.","Договор дарения квартиры шестилетнему ребёнку подписывают родители, а собственником становится ребёнок.","Четырнадцатилетний подросток может самостоятельно продать принадлежащую ему квартиру.","Несовершеннолетний от 14 до 18 лет совершает большинство других сделок с письменного согласия законных представителей.","Для открытия банковского счёта несовершеннолетнему 15 лет согласие законных представителей не нужно."],"answer":"124","hint":"Что можно сделать в 14–18 лет самостоятельно, а что — только с согласия родителей?","explain":"Верны 1, 2, 4. Продажа квартиры не входит в перечень самостоятельных сделок, нужно согласие законных представителей (3). Для открытия счёта до полной дееспособности нужно согласие законных представителей (5)."},{"id":"law_g10","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое эмансипация?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Эмансипация — объявление несовершеннолетнего от 16 до 18 лет полностью дееспособным (ст. 27 ГК РФ).\nРешение принимает орган опеки и попечительства с согласия обоих родителей, усыновителей или попечителя, а при отсутствии согласия — суд.\nПолная дееспособность до 18 лет может приобретаться:\n— При вступлении в брак в предусмотренных законом случаях — это самостоятельное основание.\n— Через эмансипацию при работе по трудовому договору.\n— Через эмансипацию при предпринимательской деятельности с согласия родителей, усыновителей или попечителя.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g11","subject":"soc","topic":"Гражданское право","ege":16,"type":"choice","max":2,"text":"В каких случаях несовершеннолетний может приобрести полную дееспособность до 18 лет? Запишите цифры, под которыми они указаны.","options":["при вступлении в брак в предусмотренных законом случаях","при эмансипации, если он работает по трудовому договору","при получении паспорта в 14 лет","при эмансипации, если он с согласия родителей занимается предпринимательской деятельностью","при поступлении в колледж","автоматически при достижении 16 лет"],"answer":"124","hint":"Эмансипация возможна только при работе по трудовому договору или занятии предпринимательством. Брак — отдельное основание.","explain":"Верно: 1, 2, 4. Паспорт (3), учёба (5) и сам по себе возраст 16 лет (6) полной дееспособности не дают."},{"id":"law_g12","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о эмансипации и запишите цифры, под которыми они указаны.","options":["Эмансипация — объявление несовершеннолетнего, достигшего 16 лет, полностью дееспособным.","При согласии обоих родителей решение об эмансипации принимает орган опеки и попечительства.","Без согласия родителей эмансипация невозможна.","Эмансипация возможна с 14 лет.","Вступление в брак до 18 лет — самостоятельное основание приобретения полной дееспособности."],"answer":"125","hint":"Кто решает вопрос об эмансипации, если родители не согласны?","explain":"Верны 1, 2, 5. При отсутствии согласия родителей решение принимает суд (3). Эмансипация возможна с 16 лет (4)."},{"id":"law_g13","subject":"soc","topic":"Гражданское право","type":"text","max":1,"text":"Запишите термин: объявление несовершеннолетнего, достигшего 16 лет, полностью дееспособным.","answer":["эмансипация"],"hint":"Решение принимает орган опеки и попечительства или суд.","explain":"Эмансипация (ст. 27 ГК РФ)."},{"id":"law_g14","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"В каком порядке и при каких условиях гражданина признают недееспособным, ограниченно дееспособным, безвестно отсутствующим, объявляют умершим?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"ПРИЗНАНИЕ НЕДЕЕСПОСОБНЫМ, ОГРАНИЧЕНИЕ ДЕЕСПОСОБНОСТИ, БЕЗВЕСТНОЕ ОТСУТСТВИЕ И ОБЪЯВЛЕНИЕ УМЕРШИМ\n1) Недееспособным суд может признать человека, который вследствие психического расстройства не может понимать значение своих действий или руководить ими.\nОбратиться могут указанные в законе лица и организации, в том числе члены семьи. Самостоятельно совершать сделки такой гражданин не может: от его имени действует назначенный опекун.\n2) Ограничить дееспособность суд может, если человек:\nИз-за пристрастия к азартным играм, злоупотребления алкоголем или наркотиками ставит семью в тяжёлое материальное положение.\nИз-за психического расстройства понимает значение своих действий или руководит ими только при помощи других лиц.\nЗаявление подают указанные в законе лица и организации. Назначается попечитель. Мелкие бытовые сделки гражданин совершает самостоятельно; возможность совершать другие сделки зависит от основания ограничения. Для остальных нужно согласие попечителя.\n3) Безвестно отсутствующим суд может признать гражданина, если в месте его жительства нет сведений о месте его пребывания не менее года.\nЗаявление подают заинтересованные лица. Суд проверяет обстоятельства и выясняет, кто может сообщить сведения об отсутствующем.\n4) Объявить умершим суд по общему правилу может гражданина, если в месте его жительства нет сведений о месте его пребывания 5 лет.\nЗаявление подают заинтересованные лица, часто родственники. Открывается наследство и наступают другие предусмотренные законом последствия смерти.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g15","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между ситуациями и правовыми последствиями: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["гражданин вследствие психического расстройства не может понимать значение своих действий","гражданин из-за пристрастия к азартным играм ставит семью в тяжёлое материальное положение","в месте жительства гражданина нет сведений о месте его пребывания в течение года","в месте жительства гражданина нет сведений о месте его пребывания пять лет","над гражданином устанавливается попечительство"],"right":["признание недееспособным","ограничение дееспособности","признание безвестно отсутствующим","объявление умершим"],"answer":"12342","hint":"Опекун — у недееспособного, попечитель — у ограниченно дееспособного. Сроки: год и пять лет.","explain":"Недееспособность: А. Ограничение дееспособности: Б и Д (назначается попечитель). Безвестное отсутствие — год (В). Объявление умершим — пять лет (Г)."},{"id":"law_g16","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о признании гражданина недееспособным, ограниченно дееспособным, безвестно отсутствующим и объявлении умершим и запишите цифры, под которыми они указаны.","options":["Признать гражданина недееспособным может только суд.","От имени недееспособного гражданина сделки совершает опекун.","Ограниченно дееспособный гражданин не может совершать даже мелкие бытовые сделки.","Объявление гражданина умершим влечёт открытие наследства.","Безвестно отсутствующим гражданина признаёт орган опеки и попечительства."],"answer":"124","hint":"Все эти решения принимает один и тот же орган.","explain":"Верны 1, 2, 4. Мелкие бытовые сделки ограниченно дееспособный совершает самостоятельно (3). Безвестно отсутствующим гражданина признаёт суд (5)."},{"id":"law_g17","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое юридическое лицо?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Юридическое лицо — организация, которая:\n1) Имеет обособленное имущество.\n2) Отвечает им по своим обязательствам.\n3) От своего имени приобретает и осуществляет гражданские права, несёт обязанности.\n4) Может быть истцом и ответчиком в суде.\nПравоспособность и дееспособность возникают одновременно с внесением в ЕГРЮЛ записи о создании юридического лица и прекращаются с внесением записи о его прекращении.\nОтдельные виды деятельности требуют лицензии: например, фармацевтическая деятельность аптеки.\nПо основной цели юридические лица делятся на:\nКоммерческие — основная цель: извлечение прибыли.\nНекоммерческие — создаются для иных основных целей.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g18","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о юридическом лице и запишите цифры, под которыми они указаны.","options":["Юридическое лицо имеет обособленное имущество и отвечает им по своим обязательствам.","Юридическое лицо может быть истцом и ответчиком в суде.","Правоспособность юридического лица возникает с момента внесения в ЕГРЮЛ записи о его создании.","Основная цель любого юридического лица — извлечение прибыли.","Юридическое лицо приобретает права только от имени своих учредителей."],"answer":"123","hint":"Юридические лица делятся на коммерческие и некоммерческие.","explain":"Верны 1, 2, 3. Извлечение прибыли — основная цель только коммерческих организаций (4). Юридическое лицо приобретает права от своего имени (5)."},{"id":"law_g19","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Перечислите шесть видов коммерческих юридических лиц.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Для бизнеса по общему правилу нужна регистрация: она обеспечивает учёт для налогообложения и контроль деятельности. Два основных варианта — зарегистрироваться как ИП, который также может нанимать работников, или создать коммерческую организацию.\nГК РФ предусматривает 6 видов коммерческих юридических лиц:\n1) Хозяйственные товарищества.\n2) Хозяйственные общества.\n3) Хозяйственные партнёрства.\n4) Крестьянские (фермерские) хозяйства.\n5) Производственные кооперативы.\n6) Государственные и муниципальные унитарные предприятия.","hint":"Вспомните определение и ключевые признаки, затем пере
