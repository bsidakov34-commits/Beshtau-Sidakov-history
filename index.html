"card":true,"max":2,"text":"Каковы права и обязанности истца и ответчика?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Права истца и ответчика:\n1) Знакомиться с материалами дела, делать выписки и снимать копии.\n2) Заявлять отводы.\n3) Представлять доказательства, участвовать в их исследовании, задавать вопросы другим участникам процесса.\n4) Заявлять ходатайства, в том числе об истребовании доказательств.\n5) Давать устные и письменные объяснения, приводить доводы и возражать против доводов и ходатайств других лиц.\n6) Обжаловать судебные постановления.\nОбязанности истца и ответчика:\n1) Добросовестно пользоваться процессуальными правами, не злоупотреблять ими.\n2) Доказывать обстоятельства, на которых основаны их требования и возражения, если законом не предусмотрено иное.\n3) Соблюдать порядок в судебном заседании и выполнять законные распоряжения суда.\n4) Нести судебные расходы в случаях и порядке, установленных законом.\n5) Сообщать суду о перемене своего адреса во время производства по делу.\n6) Выполнять обязательные для них судебные постановления.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p09","subject":"soc","topic":"Гражданский процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и элементами процессуального статуса сторон: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["нести судебные расходы в установленных законом случаях","заявлять отводы","доказывать обстоятельства, на которых основаны требования","обжаловать судебные постановления","сообщать суду о перемене адреса"],"right":["права","обязанности"],"answer":"21212","hint":"Права расширяют возможности стороны, обязанности требуют от неё определённого поведения.","explain":"Права: заявлять отводы (Б), обжаловать (Г). Обязанности: расходы (А), доказывание (В), сообщать об адресе (Д)."},{"id":"law_p10","subject":"soc","topic":"Гражданский процесс","type":"open","card":true,"max":2,"text":"Назовите стадии гражданского процесса.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Стадии гражданского процесса на примере искового производства:\nВозбуждение гражданского дела. В суд подаётся исковое заявление. По общему правилу иск предъявляется по месту жительства ответчика или по адресу организации-ответчика. Есть исключения: например, потребитель может предъявить иск также по своему месту жительства.\nСудья в течение пяти дней со дня поступления заявления решает вопрос о его принятии. Принятие заявления к производству означает возбуждение дела.\nПодготовка дела к судебному разбирательству. Судья уточняет требования и возражения сторон, определяет необходимые доказательства и состав участников. Может проводиться предварительное судебное заседание. Подготовленное дело назначается к разбирательству, участников извещают о месте и времени заседания.\nСудебное разбирательство. Суд проверяет явку участников, разъясняет права и обязанности. Затем рассматривает дело по существу: заслушивает объяснения, исследует доказательства, допрашивает свидетелей. После этого проходят судебные прения, в которых участники обосновывают свои позиции.\nДля принятия решения суд удаляется в совещательную комнату, затем объявляет решение или его резолютивную часть — итог разрешения спора.\nПо общему правилу дело рассматривается в течение двух месяцев со дня поступления заявления в суд, а мировым судьёй — одного месяца со дня принятия заявления. Дела о восстановлении на работе и взыскании алиментов рассматриваются в течение месяца. Предусмотрены исключения и возможность продления сроков.\nАпелляционное производство. Не вступившее в законную силу решение может быть обжаловано. По общему правилу апелляционная жалоба подаётся через суд, принявший решение, в течение одного месяца со дня принятия решения в окончательной форме.\nАпелляционный суд вправе оставить решение без изменения, изменить или отменить его.\nЕсли жалоба не подана, решение вступает в законную силу после истечения срока обжалования. Если подана — после рассмотрения жалобы, когда решение не отменено. Новое решение апелляционного суда вступает в силу немедленно.\nКассационное и надзорное производство. Вступившие в законную силу судебные постановления могут пересматриваться вышестоящими судами в установленном порядке. При наличии оснований постановление может быть изменено или отменено, в том числе с направлением дела на новое рассмотрение.\nПересмотр по вновь открывшимся или новым обстоятельствам. При наличии предусмотренных законом обстоятельств вступившее в силу постановление пересматривает суд, который его принял.\nИсполнение решения. Решение исполняется добровольно или принудительно, как правило, после вступления в законную силу. Принудительным исполнением обычно занимаются судебные приставы-исполнители. Некоторые решения подлежат немедленному исполнению.\nНе каждое дело проходит все перечисленные стадии.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p11","subject":"soc","topic":"Гражданский процесс","type":"order","max":1,"text":"Расположите стадии гражданского процесса (искового производства) в правильной последовательности.","options":["судебное разбирательство","возбуждение гражданского дела","апелляционное производство","подготовка дела к судебному разбирательству"],"answer":"2413","hint":"Дело возбуждается принятием искового заявления, обжалуется — уже вынесенное решение.","explain":"Возбуждение дела → подготовка → судебное разбирательство → апелляционное производство."},{"id":"law_p12","subject":"soc","topic":"Гражданский процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о стадиях гражданского процесса и запишите цифры, под которыми они указаны.","options":["Судья решает вопрос о принятии искового заявления в течение пяти дней со дня его поступления.","По общему правилу дело рассматривается в течение двух месяцев со дня поступления заявления в суд.","Апелляционная жалоба по общему правилу подаётся в течение месяца со дня принятия решения в окончательной форме.","Иск по общему правилу предъявляется по месту жительства истца.","Решение суда исполняется только принудительно."],"answer":"123","hint":"Где по общему правилу подаётся иск? Может ли решение исполняться добровольно?","explain":"Верны 1, 2, 3. Иск по общему правилу предъявляется по месту жительства ответчика (4). Решение исполняется добровольно или принудительно (5)."},{"id":"law_p13","subject":"soc","topic":"Гражданский процесс","type":"open","card":true,"max":2,"text":"Назовите основные принципы гражданского процесса.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные принципы гражданского процесса:\n1) Законность. Суд и другие участники процесса должны соблюдать требования законодательства.\n2) Диспозитивность. Стороны самостоятельно распоряжаются своими правами в пределах закона: определяют требования, могут отказаться от иска, признать иск или заключить мировое соглашение.\n3) Состязательность и равноправие сторон.\nСтороны обосновывают свои требования и возражения, представляют доказательства и обладают равными процессуальными возможностями для защиты своей позиции.\n4) Единоличное и коллегиальное рассмотрение дел. Дела рассматриваются одним судьёй или коллегией судей в соответствии с законом.\n5) Разумный срок судопроизводства. Рассмотрение дела и исполнение судебного постановления должны происходить без неоправданных задержек, с учётом сложности дела и других обстоятельств.\n6) Гласность судебного разбирательства. Судебные заседания открыты. Закрытое рассмотрение допускается в предусмотренных законом случаях, например по делам об усыновлении.\n7) Независимость судей. Судьи независимы и подчиняются только Конституции РФ и федеральному закону.\n8) Язык гражданского судопроизводства. Процесс ведётся на русском языке либо в предусмотренных законом случаях на государственном языке соответствующей республики в составе РФ. Лицам, не владеющим языком судопроизводства, обеспечивается право пользоваться услугами переводчика.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p14","subject":"soc","topic":"Гражданский процесс","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к принципам гражданского процесса? Запишите цифры, под которыми они указаны.","options":["диспозитивность","презумпция невиновности","состязательность и равноправие сторон","гласность судебного разбирательства","приоритет семейного воспитания детей","независимость судей"],"answer":"1346","hint":"Презумпция невиновности — принцип уголовного процесса, приоритет семейного воспитания — принцип семейного права.","explain":"Принципы гражданского процесса: 1, 3, 4, 6. Презумпция невиновности (2) — уголовный процесс, приоритет семейного воспитания (5) — семейное право."},{"id":"law_p15","subject":"soc","topic":"Гражданский процесс","type":"open","card":true,"max":2,"text":"Что такое арбитражный процесс?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Ответ:\nАрбитражный процесс — это рассмотрение дел в арбитражных судах с целью разрешить экономические споры, возникающие между организациями или гражданами-предпринимателями. Арбитражный процесс проходит в Арбитражных судах РФ и регулируется нормами Арбитражного процессуального кодекса РФ (АПК РФ). ⏺Пример: Фирма «ЕвроОбувь» арендовала помещение у фирмы «Вега». После того, как арендная плата не производилась в течение 6 месяцев, фирма «Вега» обратилась в суд.\nАрбитражный процесс в целом схож с гражданским (наличие истца и ответчика, те же основные принципы и тд), хоть и имеет некоторые отличия.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p16","subject":"soc","topic":"Гражданский процесс","type":"open","card":true,"max":2,"text":"В каком порядке обжалуются решения органов государственной власти и каким законом это регулируется?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"В каком порядке производится обжалование решений органов государственной власти и каким законом регулируется?\nОтвет:\nОбжалование решений органов государственной власти производится в порядке, регулируемом Кодексом административного судопроизводства РФ (КАС РФ). Порядок имеет много общих черт с гражданским процессом. ⏺ Пример: Гражданка Смирнова подала заявление в органы социальной защиты для получения субсидии на оплату коммунальных услуг, так как её доходы соответствуют установленным критериям. Однако ей было отказано на основании того, что в документах якобы отсутствует подтверждение низкого дохода. Смирнова считает отказ незаконным, так как все необходимые документы были предоставлены. Смирнова подает в суд на государственный орган (в данном случае орган социальной защиты). Смирнова будет иметь статус административного истца, государственный орган-административного ответчика. Суд будет разбирать дело в порядке КАС РФ.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p17","subject":"soc","topic":"Гражданский процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между спорами и законами, по которым они рассматриваются в суде: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["фирма требует с другой фирмы долг по арендной плате","гражданка оспаривает отказ органа социальной защиты в субсидии","гражданин требует восстановления на работе","супруги делят имущество при разводе","индивидуальный предприниматель и организация спорят об оплате поставки"],"right":["Гражданский процессуальный кодекс РФ","Арбитражный процессуальный кодекс РФ","Кодекс административного судопроизводства РФ"],"answer":"23112","hint":"Экономические споры организаций и предпринимателей — в арбитражных судах; споры с органами власти — по КАС РФ.","explain":"АПК РФ: А, Д (экономические споры). КАС РФ: Б (обжалование решения органа власти). ГПК РФ: В (трудовой спор), Г (семейный спор)."},{"id":"law_p18","subject":"soc","topic":"Гражданский процесс","type":"text","max":1,"text":"По какому кодексу рассматриваются в суде споры граждан с органами государственной власти? Запишите сокращённое название.","answer":["КАС","КАС РФ","Кодекс административного судопроизводства","Кодекс административного судопроизводства РФ"],"hint":"Гражданин в таком споре — административный истец.","explain":"Кодекс административного судопроизводства РФ (КАС РФ)."},{"id":"law_j01","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Что такое юридическая ответственность?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Юридическая ответственность — применение к правонарушителю предусмотренных законом мер государственного принуждения, выражающихся в лишениях личного, имущественного или организационного характера.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j02","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Что такое правонарушение?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Правонарушение — виновное, противоправное, общественно вредное (опасное) деяние в форме действия или бездействия, за которое предусмотрена юридическая ответственность.\nПравонарушения подразделяются на преступления и проступки.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j03","subject":"soc","topic":"Юридическая ответственность","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о юридической ответственности и правонарушениях и запишите цифры, под которыми они указаны.","options":["Юридическая ответственность — применение к правонарушителю предусмотренных законом мер государственного принуждения.","Правонарушения подразделяются на преступления и проступки.","Правонарушение может быть совершено только в форме действия.","Правонарушение — виновное противоправное деяние.","Юридическая ответственность может наступить и без правонарушения."],"answer":"124","hint":"В какой форме может быть совершено правонарушение? Что является основанием ответственности?","explain":"Верны 1, 2, 4. Правонарушение совершается в форме действия или бездействия (3). Основание ответственности — правонарушение (5)."},{"id":"law_j04","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Назовите основные виды юридической ответственности, их особенности и меры.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Уголовная ответственность\n— Наступает за совершение преступления.\n— Предусматривает наиболее строгие меры государственного принуждения.\n— Признать человека виновным в преступлении и назначить уголовное наказание может только суд.\n— Осуждение, как правило, влечёт судимость.\nПримеры наказаний: штраф, обязательные работы, исправительные работы, принудительные работы, ограничение свободы, лишение свободы.\n2) Административная ответственность\n— Наступает за совершение административного правонарушения.\n— Применяется судьями, уполномоченными органами и должностными лицами.\n— Не влечёт судимости.\nПримеры наказаний: предупреждение, административный штраф, лишение специального права, административный арест, обязательные работы.\n3) Дисциплинарная ответственность\n— В трудовых отношениях наступает за дисциплинарный проступок — виновное неисполнение или ненадлежащее исполнение работником своих трудовых обязанностей.\n— Применяется работодателем.\nОсновные дисциплинарные взыскания: замечание, выговор, увольнение по соответствующим основаниям.\nДля отдельных категорий работников законом предусмотрены и другие дисциплинарные взыскания.\n4) Гражданско-правовая ответственность\n— Наступает за нарушение гражданско-правовых обязательств, причинение вреда и другие гражданские правонарушения.\n— Имеет преимущественно имущественный характер.\n— Может реализовываться добровольно или принудительно, в том числе через суд.\nОсновные меры: возмещение убытков, уплата неустойки, компенсация морального вреда в предусмотренных законом случаях.\nНе все способы защиты гражданских прав являются мерами ответственности. Например, признание права собственности само по себе не является такой мерой.\n5) Материальная ответственность\n— Предусматривает обязанность работника или работодателя возместить ущерб, причинённый другой стороне трудовых отношений.\n— Работник возмещает прямой действительный ущерб. Неполученные работодателем доходы с работника не взыскиваются.\n— По общему правилу ответственность работника ограничена его средним месячным заработком. Полная материальная ответственность наступает в установленных законом случаях.\nНапример, работник по своей вине повредил оборудование. Он обязан возместить причинённый ущерб с учётом установленных законом ограничений.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j05","subject":"soc","topic":"Юридическая ответственность","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и видами юридической ответственности: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["гражданину назначено наказание в виде исправительных работ","водителю назначен административный штраф","продавец выплатил покупателю неустойку за просрочку доставки","организации назначено административное приостановление деятельности","виновник ДТП возместил владельцу автомобиля убытки"],"right":["уголовная","административная","гражданско-правовая"],"answer":"12323","hint":"Неустойка и возмещение убытков — меры гражданско-правовой ответственности.","explain":"Уголовная: А. Административная: Б, Г. Гражданско-правовая: В, Д."},{"id":"law_j06","subject":"soc","topic":"Юридическая ответственность","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и видами ответственности в трудовых отношениях: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["работнику объявлен выговор","работник возместил стоимость оборудования, повреждённого по его вине","работнику сделано замечание за опоздание","взыскание ущерба с работника ограничено его средним месячным заработком","работник уволен за появление на работе в состоянии опьянения"],"right":["дисциплинарная","материальная"],"answer":"12121","hint":"Дисциплинарная — взыскание за проступок, материальная — возмещение ущерба.","explain":"Дисциплинарная: выговор (А), замечание (В), увольнение (Д). Материальная: возмещение ущерба (Б), ограничение средним заработком (Г)."},{"id":"law_j07","subject":"soc","topic":"Юридическая ответственность","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о видах юридической ответственности и запишите цифры, под которыми они указаны.","options":["Назначить уголовное наказание может только суд.","Административная ответственность не влечёт судимости.","Дисциплинарную ответственность применяет работодатель.","Работник возмещает работодателю и неполученные доходы.","Гражданско-правовая ответственность имеет преимущественно неимущественный характер."],"answer":"123","hint":"Какой ущерб возмещает работник? Каков характер гражданско-правовой ответственности?","explain":"Верны 1, 2, 3. Работник возмещает только прямой действительный ущерб, неполученные доходы не взыскиваются (4). Гражданско-правовая ответственность преимущественно имущественная (5)."},{"id":"law_j08","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Что такое состав правонарушения? Какие элементы он включает?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Состав правонарушения — совокупность установленных правом признаков, позволяющих квалифицировать деяние как определённое правонарушение.\nВыделяют четыре элемента:\n1) Субъект — лицо, совершившее правонарушение и способное нести юридическую ответственность. В предусмотренных законом случаях субъектом может быть юридическое лицо.\n2) Субъективная сторона — внутреннее отношение лица к своему деянию и его последствиям: вина в форме умысла или неосторожности, а также мотив и цель, если они имеют правовое значение.\n3) Объект — охраняемые правом общественные отношения, на которые посягает правонарушение.\n4) Объективная сторона — внешние признаки правонарушения: деяние, а в предусмотренных законом случаях — вредные последствия, причинная связь, место, время, способ совершения и другие обстоятельства.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j09","subject":"soc","topic":"Юридическая ответственность","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о составе правонарушения и запишите цифры, под которыми они указаны.","options":["Субъектом правонарушения в предусмотренных законом случаях может быть юридическое лицо.","Субъективная сторона включает вину, а также мотив и цель, если они имеют правовое значение.","Объект правонарушения — охраняемые правом общественные отношения.","Время и способ совершения правонарушения относятся к субъективной стороне.","Состав правонарушения включает три элемента."],"answer":"123","hint":"Внешние признаки правонарушения относятся к одному элементу, внутреннее отношение — к другому.","explain":"Верны 1, 2, 3. Время, место и способ — признаки объективной стороны (4). Элементов состава четыре (5)."},{"id":"law_j10","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Каковы принципы юридической ответственности?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Законность. Ответственность наступает только по предусмотренным законом основаниям и с соблюдением установленного порядка.\n2) Гуманизм. Меры ответственности не должны иметь целью причинение физических страданий или унижение человеческого достоинства.\n3) Неотвратимость ответственности. Каждое правонарушение должно получать правовую оценку и предусмотренную законом реакцию государства. Освобождение от ответственности допускается только на законных основаниях.\n4) Справедливость. Меры ответственности должны соответствовать характеру и тяжести правонарушения.\n5) Индивидуализация ответственности. При выборе меры учитываются обстоятельства правонарушения, степень вины и личность нарушителя.\n6) Ответственность за вину. По общему правилу ответственность наступает при наличии умысла или неосторожности. В гражданском праве допускаются исключения, например ответственность за вред, причинённый источником повышенной опасности.\n7) Недопустимость обратной силы закона, устанавливающего или отягчающего ответственность. Такой закон не применяется к деяниям, совершённым до его вступления в силу.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j11","subject":"soc","topic":"Юридическая ответственность","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и принципами юридической ответственности: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["закон, вступивший в силу в 2026 г. и увеличивший штраф, не применяется к нарушению, совершённому в 2025 г.","суд учёл степень вины и личность нарушителя при выборе меры ответственности","ответственность наступает только по основаниям, предусмотренным законом","меры ответственности не должны унижать человеческое достоинство","наказание назначено с соблюдением установленного законом порядка"],"right":["законность","недопустимость обратной силы закона, отягчающего ответственность","индивидуализация ответственности","гуманизм"],"answer":"23141","hint":"Обратная сила закона — частая ошибка на ЕГЭ: ухудшающий положение закон не применяется к прошлым деяниям.","explain":"Обратная сила: А. Индивидуализация: Б. Законность: В, Д. Гуманизм: Г."},{"id":"law_j12","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Какие функции выполняет юридическая ответственность?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Карательная — применение к правонарушителю предусмотренных законом лишений и ограничений.\n2) Воспитательная — формирование уважения к праву и привычки соблюдать закон.\n3) Превентивная — предупреждение новых правонарушений как со стороны самого нарушителя, так и со стороны других лиц.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j13","subject":"soc","topic":"Юридическая ответственность","ege":15,"type":"match","max":2,"text":"Установите соответствие между характеристиками и функциями юридической ответственности: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["восстановление нарушенных прав","предупреждение новых правонарушений","формирование уважения к праву","применение к правонарушителю лишений и ограничений","возмещение вреда потерпевшему"],"right":["карательная","воспитательная","превентивная","правовосстановительная"],"answer":"43214","hint":"Превентивная — от слова «предупреждать».","explain":"Правовосстановительная: А, Д. Превентивная: Б. Воспитательная: В. Карательная: Г."},{"id":"law_j14","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Какие обстоятельства отягчают и какие смягчают уголовное наказание?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Обстоятельства, влияющие на уголовное наказание, и обстоятельства, исключающие преступность деяния\nНекоторые обстоятельства, отягчающие наказание:\n— Рецидив преступлений — совершение умышленного преступления лицом, имеющим учитываемую законом судимость за ранее совершённое умышленное преступление.\n— Наступление тяжких последствий в результате преступления.\n— Совершение преступления группой лиц, группой по предварительному сговору, организованной группой или преступным сообществом.\n— Совершение преступления по мотивам политической, идеологической, расовой, национальной или религиозной ненависти либо вражды, а также ненависти или вражды в отношении социальной группы.\n— Совершение преступления с особой жестокостью.\n— Совершение преступления с использованием оружия, боеприпасов или взрывчатых веществ.\nНекоторые обстоятельства, смягчающие наказание:\n— Совершение впервые преступления небольшой или средней тяжести вследствие случайного стечения обстоятельств.\n— Несовершеннолетие виновного.\n— Беременность.\n— Наличие малолетних детей у виновного.\n— Совершение преступления вследствие тяжёлых жизненных обстоятельств или по мотиву сострадания.\n— Совершение преступления при нарушении условий правомерности необходимой обороны.\n— Явка с повинной.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j15","subject":"soc","topic":"Юридическая ответственность","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к обстоятельствам, смягчающим уголовное наказание? Запишите цифры, под которыми они указаны.","options":["явка с повинной","рецидив преступлений","несовершеннолетие виновного","совершение преступления с особой жестокостью","наличие малолетних детей у виновного","совершение преступления группой лиц"],"answer":"135","hint":"Рецидив, жестокость и групповой характер делают преступление опаснее.","explain":"Смягчающие: 1, 3, 5. Рецидив (2), особая жестокость (4), совершение группой (6) — отягчающие обстоятельства."},{"id":"law_j16","subject":"soc","topic":"Юридическая ответственность","ege":15,"type":"match","max":2,"text":"Установите соответствие между обстоятельствами и их влиянием на уголовное наказание: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["совершение преступления с использованием оружия","беременность","совершение преступления по мотиву сострадания","наступление тяжких последствий","совершение преступления организованной группой"],"right":["отягчающее","смягчающее"],"answer":"12211","hint":"Смягчают обстоятельства, связанные с личностью и тяжёлой жизненной ситуацией виновного.","explain":"Отягчающие: оружие (А), тяжкие последствия (Г), организованная группа (Д). Смягчающие: беременность (Б), сострадание (В)."},{"id":"law_j17","subject":"soc","topic":"Юридическая ответственность","type":"open","card":true,"max":2,"text":"Какие обстоятельства исключают преступность деяния?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Обстоятельства, исключающие преступность деяния:\n1) Необходимая оборона. Защита от общественно опасного посягательства путём причинения вреда посягающему при соблюдении установленных законом пределов.\nНапример, человек причиняет вред нападающему, защищаясь от опасного для жизни нападения с ножом.\n2) Причинение вреда при задержании лица, совершившего преступление. Допускается для передачи преступника органам власти, если иначе задержать его невозможно и не превышены необходимые меры.\nНапример, прохожий удерживает убегающего грабителя до прибытия полиции, причинив ему ссадины.\n3) Крайняя необходимость. Причинение меньшего вреда для устранения непосредственно угрожающей опасности, которую невозможно устранить другими средствами.\nНапример, человек разбивает стекло чужого горящего автомобиля, чтобы спасти находящегося внутри ребёнка.\n4) Физическое или психическое принуждение.\nЕсли физическое принуждение лишило человека возможности руководить своими действиями, деяние не признаётся преступлением. При сохранении такой возможности, в том числе при угрозах, применяются условия крайней необходимости.\nНапример, связанный преступниками охранник не может воспрепятствовать хищению имущества.\n5) Обоснованный риск. Причинение вреда при достижении общественно полезной цели, которую нельзя достичь без риска, если приняты достаточные меры для предотвращения вреда. Риск не должен заведомо угрожать жизни многих людей, экологической катастрофой или общественным бедствием.\nНапример, при необходимом испытании новой спасательной техники, несмотря на принятые меры безопасности, повреждено оборудование.\n6) Исполнение приказа или распоряжения. Причинение вреда при исполнении обязательного приказа, незаконность которого не была заведомо известна исполнителю. Исполнение заведомо незаконного приказа не освобождает от ответственности за умышленное преступление.\nНапример, пожарный по законному приказу руководителя тушения пожара ломает дверь для спасения людей.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_j18","subject":"soc","topic":"Юридическая ответственность","ege":15,"type":"match","max":2,"text":"Установите соответствие между ситуациями и обстоятельствами, исключающими преступность деяния: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["прохожий удержал убегающего грабителя до приезда полиции, причинив ему ссадины","человек разбил стекло чужого горящего автомобиля, чтобы спасти ребёнка внутри","человек причинил вред нападавшему, защищаясь от нападения с ножом","водитель, уклоняясь от столкновения с внезапно выбежавшим ребёнком, повредил чужой забор","охранник, защищая кассира от вооружённого грабителя, причинил грабителю вред"],"right":["необходимая оборона","крайняя необходимость","причинение вреда при задержании лица, совершившего преступление"],"answer":"32121","hint":"Оборона — защита от посягательства; крайняя необходимость — меньший вред ради устранения опасности; задержание — чтобы передать преступника властям.","explain":"Задержание: А. Крайняя необходимость: Б, Г (меньший вред для устранения опасности). Необходимая оборона: В, Д (защита от посягательства, в том числе другого человека)."},{"id":"law_j19","subject":"soc","topic":"Юридическая ответственность","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к обстоятельствам, исключающим преступность деяния? Запишите цифры, под которыми они указаны.","options":["обоснованный риск","явка с повинной","исполнение приказа, незаконность которого не была заведомо известна исполнителю","физическое принуждение, лишившее человека возможности руководить своими действиями","несовершеннолетие виновного","крайняя необходимость"],"answer":"1346","hint":"Явка с повинной и несовершеннолетие смягчают наказание, но не исключают преступность.","explain":"Исключают преступность: 1, 3, 4, 6. Явка с повинной (2) и несовершеннолетие (5) — смягчающие обстоятельства."},{"id":"s9","subject":"soc","topic":"Отрасли права","type":"match","max":2,"text":"Установите соответствие между примерами и отраслями права, которые регулируют эти отношения.","left":["гражданин заключил договор купли-продажи квартиры","работодатель предоставил сотруднику ежегодный оплачиваемый отпуск","водителя оштрафовали за превышение скорости","супруги заключили брачный договор","гражданин совершил кражу"],"right":["административное право","семейное право","гражданское право","уголовное право","трудовое право"],"answer":"35124","hint":"Штраф за нарушение правил дорожного движения — административная ответственность. Кража — преступление.","explain":"Купля-продажа — гражданское право, отпуск — трудовое, штраф за превышение скорости — административное, брачный договор — семейное, кража — уголовное."},{"id":"law_o01","subject":"soc","topic":"Отрасли права","ege":15,"type":"match","max":2,"text":"Установите соответствие между вопросами и кодексами, которые их регулируют: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["перечень преступлений и наказаний за них","порядок возбуждения уголовного дела и расследования","административные наказания, например предупреждение","права участников уголовного судопроизводства","категории преступлений"],"right":["Уголовный кодекс РФ","Уголовно-процессуальный кодекс РФ","Кодекс РФ об административных правонарушениях"],"answer":"12321","hint":"УК — «что наказуемо», УПК — «как расследуют и судят», КоАП — административные правонарушения.","explain":"УК РФ: А, Д. УПК РФ: Б, Г. КоАП РФ: В."},{"id":"law_o02","subject":"soc","topic":"Отрасли права","ege":15,"type":"match","max":2,"text":"Установите соответствие между предметом регулирования и отраслями права: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["отношения в сфере государственного управления","личные неимущественные и имущественные отношения, возникающие из брака, родства и усыновления","трудовые и непосредственно связанные с ними отношения","имущественные и личные неимущественные отношения, основанные на равенстве, автономии воли и имущественной самостоятельности участников","выдача паспортов и водительских удостоверений"],"right":["гражданское право","семейное право","трудовое право","административное право"],"answer":"42314","hint":"Найдите в каждом описании ключевое слово: управление, брак, труд, равенство.","explain":"Административное: А, Д. Семейное: Б. Трудовое: В. Гражданское: Г."}],"images":{"g_supply":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20360%20300%22%20width%3D%22720%22%20height%3D%22600%22%3E%3Crect%20width%3D%22360%22%20height%3D%22300%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Cdefs%3E%3Cmarker%20id%3D%22ar%22%20viewBox%3D%220%200%2010%2010%22%20refX%3D%229%22%20refY%3D%225%22%20markerWidth%3D%227%22%20markerHeight%3D%227%22%20orient%3D%22auto%22%3E%3Cpath%20d%3D%22M0%200L10 const SUBJ = { hist: 'История', soc: 'Обществознание' };

const KEY = 'ege-trainer-v1', DKEY = 'ege-trainer-draft-v1';

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const paras = s => String(s || '').split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('');
const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[«»"'.,!?()]/g, '').replace(/\s+/g, ' ').trim();
const plural = (n, a, b, c) => { const m = Math.abs(n) % 100, k = m % 10; if (m > 10 && m < 20) return c; if (k > 1 && k < 5) return b; if (k === 1) return a; return c; };
const pts = n => n + ' ' + plural(n, 'балл', 'балла', 'баллов');
const snip = s => { const x = String(s || '').split('\n')[0]; return x.length > 120 ? x.slice(0, 117) + '…' : x; };
const words = s => { const n = (String(s || '').match(/[A-Za-zА-Яа-яЁё0-9]+/g) || []).length; return n + ' ' + plural(n, 'слово', 'слова', 'слов'); };
const clone = o => JSON.parse(JSON.stringify(o));
const MAXIMG = 4;
const imgSrc = (id, src) => ((src || bank).images || {})[id] || '';
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return 'i' + (h >>> 0).toString(36) + s.length.toString(36); }
const fmtSize = kb => kb < 1024 ? kb + ' КБ' : (kb / 1024).toFixed(1).replace('.', ',') + ' МБ';

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

let bank;
try { bank = JSON.parse($('#bank').textContent); } catch (e) { bank = { version: 1, tasks: [] }; }
if (!bank || !Array.isArray(bank.tasks)) bank = { version: 1, tasks: [] };
const PUBLISHED = JSON.stringify(bank);

const store = Object.assign({ rec: {}, drafts: {}, name: '', subject: 'hist' }, lsGet(KEY) || {});
if (!SUBJ[store.subject]) store.subject = 'hist';

  tab: 'tasks', topic: 'all', current: { hist: null, soc: null }, st: {}, scroll: false,

};

else if (lsGet(TKEY) === true) canEdit = true;

const canShare = typeof navigator.share === 'function';

const tasksOf = (subj, src) => (src || bank).tasks.filter(t => t.subject === subj);

const numOf = t => tasksOf(t.subject).indexOf(t) + 1;
const visibleTasks = () => { const all = tasksOf(store.subject); return ui.topic === 'all' ? all : all.filter(t => t.topic === ui.topic); };
function recState(t) { const r = store.rec[t.id]; if (!r) return 'none'; if (r.last >= t.max) return 'ok'; if (r.last > 0) return 'part'; return 'bad'; }
const errorTasks = subj => tasksOf(subj).filter(t => { const r = store.rec[t.id]; return r && r.last < t.max; });
function currentTask() {
  const list = visibleTasks();

  return t || null;
}

/* ---------- per-task working state ---------- */
const slotted = t => t.type === 'match' || t.type === 'table';
function blanksOf(t) {
  const out = [];
  (t.rows || []).forEach((r, ri) => r.forEach((c, ci) => { if (c === '_') out.push({ ri, ci, col: (t.head || [])[ci] || '' }); }));
  return out;
}
const nSlots = t => t.type === 'table' ? blanksOf(t).length : (t.left || []).length;
function mistakes(t, ans) {
  if (slotted(t)) { let e = 0; for (let i = 0; i < t.answer.length; i++) if ((ans[i] || '') !== t.answer[i]) e++; return 'Неверных позиций: ' + e + '.'; }
  if (t.type === 'choice') {
    const a = new Set(ans), k = new Set(t.answer.split('')); let miss = 0, extra = 0;
    k.forEach(x => { if (!a.has(x)) miss++; }); a.forEach(x => { if (!k.has(x)) extra++; });
    return 'Не отмечено верных вариантов: ' + miss + ', отмечено лишних: ' + extra + '.';
  }
  return '';
}
function fresh(t) {
  let ans = '';
  if (slotted(t)) ans = Array.from({ length: nSlots(t) }, () => '');
  else if (t.type === 'choice' || t.type === 'order') ans = [];
  else if (t.type === 'open') ans = store.drafts[t.id] || '';
  return { ans, phase: 'idle', score: null, tries: 0, hint: false, expl: '', explBusy: false, explErr: '', ctl: null,
    aiBusy: false, aiErr: '', review: null, selfOpen: false, self: {}, selfSaved: false, modelShown: false };
}
const st = t => ui.st[t.id] || (ui.st[t.id] = fresh(t));

function ready(t, s) {
  if (t.type === 'order') return s.ans.length === t.options.length;
  if (slotted(t)) return s.ans.every(Boolean);
  if (t.type === 'choice') return s.ans.length > 0;
  if (t.type === 'text') return norm(s.ans).length > 0;
  return false;
}
function hasInput(t, s) {
  if (slotted(t)) return s.ans.some(Boolean);
  if (t.type === 'text') return String(s.ans).length > 0;
  return s.ans.length > 0;
}
const ansString = (t, a) => t.type === 'choice' ? a.slice().sort().join('') : slotted(t) ? a.map(x => x || '·').join('') : t.type === 'order' ? a.join('') : String(a);

/* Scoring follows the ФИПИ rules (ЕГЭ-2027 specification):
   соответствие (1, 3, 5, 7): одна неверная позиция — минус 1 балл;
   таблица (4): 3 балла; одна ошибка — 2; две-три ошибки — 1;
   выбор (история 6, 12; обществознание 2, 4, 5, 7, 8, 10, 11, 14, 16): 1 балл, если один символ
   неверен, один лишний наряду с верными или одного не хватает. */
function scoreTask(t, ans) {
  if (t.type === 'order') return ans.join('') === t.answer ? t.max : 0;
  if (slotted(t)) {
    let err = 0; for (let i = 0; i < t.answer.length; i++) if ((ans[i] || '') !== t.answer[i]) err++;
    if (err === 0) return t.max;
    if (t.max >= 3) return err === 1 ? t.max - 1 : err <= 3 ? t.max - 2 : 0;
    return err === 1 && t.max > 1 ? t.max - 1 : 0;
  }
  if (t.type === 'choice') {
    const a = new Set(ans), k = new Set(t.answer.split('')); let miss = 0, extra = 0;
    k.forEach(x => { if (!a.has(x)) miss++; }); a.forEach(x => { if (!k.has(x)) extra++; });
    if (!miss && !extra) return t.max;
    const near = Math.max(miss, extra) <= 1;
    return near && t.max > 1 ? t.max - 1 : 0;
  }
  if (t.type === 'text') { const n = norm(ans); return t.answer.some(v => norm(v) === n) ? t.max : 0; }
  return 0;
}

function record(t, score, flags) {
  const r = store.rec[t.id] || { tries: 0 };
  if (r.first == null) { r.first = score; r.at = Date.now(); }

  if (flags && flags.self) r.self = true;

}

        t.right.map((_, di) => { const d = String(di + 1), on = s.ans[ri] === d; return '<button class="pick' + (on ? ' on' : '') + '" data-act="m" data-r="' + ri + '" data-v="' + d + '" aria-pressed="' + on + '"' + (locked ? ' disabled' : '') + '>' + d + '</button>'; }).join('') +

function keyString(t) { return t.type === 'text' ? t.answer[0] : t.answer; }
function feedbackTest(t, s) {

function statsFor(subj) {
  const tasks = tasksOf(subj);
  const topics = topicsOf(subj).map(tp => {
    const ts = tasks.filter(t => t.topic === tp), done = ts.filter(t => store.rec[t.id]);
    const earned = done.reduce((a, t) => a + Math.min(store.rec[t.id].first, t.max), 0), maxAtt = done.reduce((a, t) => a + t.max, 0);
    return { tp, total: ts.length, done: done.length, earned, maxAtt, pct: maxAtt ? earned / maxAtt : null };
  });
  const sum = k => topics.reduce((a, x) => a + x[k], 0);
  return { topics, total: tasks.length, done: sum('done'), earned: sum('earned'), maxAtt: sum('maxAtt'), errors: errorTasks(subj).length };
}
function advice(subj) {
  const S = statsFor(subj), out = [];
  if (!S.done) return [{ text: 'Начни с любого задания. После первых ответов здесь появятся советы, что повторить.', act: 'tab', v: 'tasks', btn: 'К заданиям' }];
  const weak = S.topics.filter(x => x.pct !== null && x.pct < 0.7).sort((a, b) => a.pct - b.pct);
  if (weak.length) out.push({ text: 'Слабее всего тема «' + weak[0].tp + '»: ' + Math.round(weak[0].pct * 100) + '% баллов с первой попытки. Повтори материал и реши задания этой темы ещё раз.', act: 'topic', v: weak[0].tp, btn: 'Задания по теме' });
  if (S.errors) out.push({ text: S.errors + ' ' + plural(S.errors, 'задание ждёт', 'задания ждут', 'заданий ждут') + ' в работе над ошибками.', act: 'tab', v: 'errors', btn: 'Открыть' });
  const untouched = S.topics.filter(x => x.done === 0);
  if (untouched.length) out.push({ text: 'Ещё не начаты: ' + untouched.map(x => '«' + x.tp + '»').join(', ') + '.', act: 'topic', v: untouched[0].tp, btn: 'Начать' });
  const unsolved = S.topics.filter(x => x.done > 0 && x.done < x.total);
  if (!out.length && unsolved.length) out.push({ text: 'В теме «' + unsolved[0].tp + '» остались нерешённые задания.', act: 'topic', v: unsolved[0].tp, btn: 'Продолжить' });
  if (!out.length) out.push({ text: 'Все задания решены уверенно. Попроси учителя добавить новые.' });
  return out;
}
function viewProgress() {

  return '<section class="sec"><h2 class="sec-h">' + SUBJ[store.subject] + '</h2>' +

function reportText() {
  const lines = [(store.name.trim() || 'Ученик') + ' · отчёт от ' + new Date().toLocaleDateString('ru-RU')];
  ['hist', 'soc'].forEach(subj => {
    const S = statsFor(subj);
    lines.push('', SUBJ[subj].toUpperCase());
    if (!S.done) { lines.push('Пока не решал(а).'); return; }
    lines.push('Баллы с первой попытки: ' + S.earned + ' из ' + S.maxAtt + '. Решено заданий: ' + S.done + ' из ' + S.total + '.');
    S.topics.forEach(x => lines.push('— ' + x.tp + ': ' + (x.done ? x.earned + ' из ' + x.maxAtt + ' (' + x.done + ' из ' + x.total + ' заданий)' : 'не начато')));
    const errs = errorTasks(subj);
    if (errs.length) lines.push('Не решены на полный балл: ' + errs.map(t => '№ ' + numOf(t) + ' (' + typeLabel(t).toLowerCase() + ', ' + t.topic + ')').join('; ') + '.');
    const selfN = tasksOf(subj).filter(t => store.rec[t.id] && store.rec[t.id].self && !store.rec[t.id].ai).length;
    if (selfN) lines.push('Развёрнутых ответов с самопроверкой: ' + selfN + '.');
  });
  return lines.join('\n');
}

function gcImages(work, keep) {
  const used = new Set(keep || []), imgs = work.images || {};
  work.tasks.forEach(t => (t.images || []).forEach(id => used.add(id)));

}
function readAsDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function compressImage(file) {
  if (file.type === 'image/svg+xml' && file.size < 400000) return readAsDataURL(file);
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.82));
      } catch (e) { rej(e); } finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src = url;
  });
}
async function addImages(files) {
  const T = ui.teacher, f = T.form, list = Array.from(files || []);
  if (!list.length) return;
  f.images = f.images || [];
  T.imgBusy = true; T.formErr = ''; render();
  for (const file of list) {
    if (f.images.length >= MAXIMG) { T.formErr = 'К одному заданию можно прикрепить не больше ' + MAXIMG + ' изображений.'; break; }
    try {
      const data = await compressImage(file), id = hashStr(data);
      T.work.images = T.work.images || {};
      T.work.images[id] = data;
      if (!f.images.includes(id)) f.images.push(id);
    } catch (e) { T.formErr = 'Не удалось открыть файл «' + file.name + '». Подойдут фото, скриншот, JPG или PNG.'; }
  }
  T.imgBusy = false; saveDraft(); render();
}

function buildTask(f) {
  const lines = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
  const t = { id: f.editId || ('t' + Date.now().toString(36)), subject: f.subject, topic: f.topic.trim(), type: f.type, text: f.text.trim() };
  if (!t.topic) return { err: 'Укажите тему задания.' };
  if (!t.text) return { err: 'Введите текст задания.' };
  const eg = parseInt(f.ege, 10);
  if (eg >= 1 && eg <= 30) t.ege = eg;
  if (f.source.trim()) t.source = f.source.trim();
  const imgs = (f.images || []).filter(id => ui.teacher.work.images && ui.teacher.work.images[id]);
  if (imgs.length) t.images = imgs.slice(0, MAXIMG);
  const digits = String(f.answer || '').replace(/\D/g, '');
  if (f.type === 'choice' || f.type === 'order') {
    t.options = lines(f.options);
    const n = t.options.length;
    if (n < 2 || n > 9) return { err: 'Нужно от 2 до 9 вариантов, по одному в строке.' };
    if (!digits) return { err: 'Запишите правильный ответ цифрами, например 135.' };
    if (digits.split('').some(d => +d < 1 || +d > n)) return { err: 'В ответе есть цифра, для которой нет варианта.' };
    if (new Set(digits).size !== digits.length) return { err: 'Цифры в ответе не должны повторяться.' };
    if (f.type === 'order' && digits.length !== n) return { err: 'В задании на хронологию ответ должен включать все ' + n + ' варианта.' };
    t.answer = f.type === 'choice' ? digits.split('').sort().join('') : digits;
    t.max = DEFMAX[f.type];
  } else if (f.type === 'match') {
    t.left = lines(f.left); t.right = lines(f.right);
    if (t.left.length < 2 || t.left.length > LET.length) return { err: 'В первом столбце нужно от 2 до ' + LET.length + ' позиций.' };
    if (t.right.length < 2 || t.right.length > 9) return { err: 'Во втором столбце нужно от 2 до 9 позиций.' };
    if (digits.length !== t.left.length) return { err: 'В ответе должно быть ' + t.left.length + ' цифр, по одной на каждую букву.' };
    if (digits.split('').some(d => +d < 1 || +d > t.right.length)) return { err: 'В ответе есть цифра, которой нет во втором столбце.' };
    t.answer = digits; t.max = DEFMAX.match;
  } else if (f.type === 'table') {
    t.head = String(f.head || '').split('|').map(x => x.trim()).filter(Boolean);
    t.rows = lines(f.rows).map(r => r.split('|').map(x => x.trim()));
    if (t.head.length < 2) return { err: 'Укажите хотя бы два заголовка столбцов через |.' };
    if (!t.rows.length) return { err: 'Добавьте строки таблицы.' };
    if (t.rows.some(r => r.length !== t.head.length)) return { err: 'В каждой строке должно быть столько же ячеек, сколько столбцов: ' + t.head.length + '.' };
    const nb = blanksOf(t).length;
    if (nb < 2 || nb > LET.length) return { err: 'Пустых ячеек (_) должно быть от 2 до ' + LET.length + '.' };
    t.right = lines(f.right);
    if (t.right.length < 2 || t.right.length > 9) return { err: 'Элементов для вставки нужно от 2 до 9.' };
    if (digits.length !== nb) return { err: 'В ответе должно быть ' + nb + ' цифр — по одной на каждую пустую ячейку.' };
    if (digits.split('').some(d => +d < 1 || +d > t.right.length)) return { err: 'В ответе есть цифра, которой нет в списке элементов.' };
    t.answer = digits; t.max = DEFMAX.table;
  } else if (f.type === 'text') {
    const v = String(f.answer || '').split(/[;\n]/).map(x => x.trim()).filter(Boolean);
    if (!v.length) return { err: 'Запишите правильный термин. Несколько допустимых вариантов разделите точкой с запятой.' };
    t.answer = v; t.max = DEFMAX.text;
  } else if (f.type === 'open') {
    const ls = lines(f.criteria), crit = [];
    for (let i = 0; i < ls.length; i++) {
      const m = ls[i].match(/^(\d+)\s*[|;:]\s*(.+)$/);
      if (!m || +m[1] < 1 || +m[1] > 9) return { err: 'Критерий в строке ' + (i + 1) + ' записан не по образцу «2 | что требуется».' };
      crit.push({ id: 'K' + (i + 1), max: +m[1], text: m[2].trim() });
    }
    if (!crit.length) return { err: 'Добавьте хотя бы один критерий.' };
    if (!f.model.trim()) return { err: 'Добавьте эталонный ответ: по нему ученик проверяет себя.' };
    t.criteria = crit; t.model = f.model.trim(); t.max = crit.reduce((a, c) => a + c.max, 0);
  } else return { err: 'Выберите тип задания.' };
  if (f.hint.trim()) t.hint = f.hint.trim();
  if (f.type !== 'open') t.explain = f.explain.trim() || 'Правильный ответ: ' + (f.type === 'text' ? t.answer[0] : t.answer) + '.';
  return { task: t };
}

    field('hint', 'Подсказка', 'area', 'Наводящая мысль без готового ответа. Ученик видит её по кнопке и после ошибки.', 2) +
    (f.type !== 'open' ? field('explain', 'Пояснение к ответу', 'area', 'Ученик видит его после верного ответа или когда открывает решение.', 3) : '') +
    (T.formErr ? '<p class="err" role="alert">' + esc(T.formErr) + '</p>' : '') +
    '<div class="row"><button type="submit" class="btn primary">' + (f.editId ? 'Сохранить задание' : 'Добавить в банк') + '</button>' + (f.editId ? '<button type="button" class="btn ghost" data-act="t-cancel">Отмена</button>' : '') + '</div></form></section>' +
    '<section class="sec"><div class="row"><button class="btn ghost small" data-act="t-full">Скачать сайт целиком</button><button class="btn ghost small" data-act="t-exit">Выйти из режима учителя</button></div></section>';
}
function saveForm() {
  const T = ui.teacher, res = buildTask(T.form);
  if (res.err) { T.formErr = res.err; render(); return; }
  const i = T.work.tasks.findIndex(x => x.id === res.task.id);
  if (i >= 0) T.work.tasks[i] = res.task; else T.work.tasks.push(res.task);
  T.formErr = ''; T.err = ''; T.msg = (i >= 0 ? 'Задание изменено.' : 'Задание добавлено.') + ' Не забудьте скачать обновлённый файл.';
  T.form = blankForm(); T.form.subject = res.task.subject; T.form.type = res.task.type;
  gcImages(T.work); saveDraft(); render();
}
function buildDoc(b) {
  return '<!doctype html>\n<html lang="ru">\n<head>\n' + HEAD_META + '\n<style id="app-css">' + $('#app-css').textContent + '</style>\n</head>\n<body>\n<main id="app" class="app"></main>\n' +
    '<script type="application/json" id="bank">' + JSON.stringify(b).replace(/</g, '\\u003c') + '<\/script>\n' +
    '<script id="app-js">' + $('#app-js').textContent + '<\/script>\n</body>\n</html>\n';
}
function downloadSite(b) {
  const T = ui.teacher;
  T.err = ''; T.msg = '';
  try {
    const url = URL.createObjectURL(new Blob([buildDoc(b)], { type: 'text/html;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'index.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    T.msg = 'Файл index.html скачан. Загрузите его на хостинг вместо старого.';
  } catch (e) { T.err = 'Не удалось скачать файл. Откройте сайт в Chrome или Яндекс Браузере и попробуйте снова.'; }
  render();
}
function shareText() {
  const site = /^https?:/.test(location.protocol) ? location.origin + location.pathname : '';
  return { site, text: reportText() };
}

/* ---------- actions ---------- */
function goNext(t) {
  const list = visibleTasks(), i = list.indexOf(t);
  const after = list.slice(i + 1).concat(list.slice(0, Math.max(i, 0)));
  const nxt = after.find(x => !store.rec[x.id]) || after.find(x => recState(x) !== 'ok') || after[0] || t;
  ui.current[store.subject] = nxt.id; ui.scroll = true;
}
function act(a, d) {
  const t = ui.tab === 'tasks' ? currentTask() : null, s = t ? st(t) : null;
  const T = ui.teacher;
  switch (a) {
    case 'subj': store.subject = d.v; ui.topic = 'all'; save(); if (ui.teacher.form && !ui.teacher.form.editId) ui.teacher.form.subject = d.v; break;
    case 'tab': ui.tab = d.v; ui.copyMsg = ''; break;
    case 'topic': ui.topic = d.v; ui.tab = 'tasks'; ui.current[store.subject] = null; break;
    case 'go': ui.current[store.subject] = d.v; ui.scroll = true; break;
    case 'opt':
      if (!t) break;
      s.ans = s.ans.includes(d.v) ? s.ans.filter(x => x !== d.v) : s.ans.concat(d.v);
      break;
    case 'm': if (t) { const r = +d.r; s.ans[r] = s.ans[r] === d.v ? '' : d.v; } break;
    case 'clear': if (t) s.ans = fresh(t).ans; break;
    case 'hint': if (s) s.hint = true; break;
    case 'check':
      if (!t || !ready(t, s)) break;
      s.tries++; s.score = scoreTask(t, s.ans); record(t, s.score);
      if (s.score >= t.max) s.phase = 'done'; else { s.phase = 'wrong'; s.hint = true; }
      break;
    case 'retry': if (s) s.phase = 'idle'; break;
    case 'reveal': if (s) s.phase = 'revealed'; break;
    case 'next': if (t) goNext(t); break;
    case 'redo-here': if (t) { ui.st[t.id] = fresh(t); } break;
    case 'self-open': if (s) s.selfOpen = true; break;
    case 'self': if (s) { s.self[+d.c] = +d.v; s.selfSaved = false; } break;
    case 'self-save':
      if (t && t.criteria.every((c, i) => s.self[i] != null)) { record(t, t.criteria.reduce((x, c, i) => x + s.self[i], 0), { self: true }); s.selfSaved = true; }
      break;
    case 'model': if (s) s.modelShown = true; break;
    case 'redo': {
      const x = bank.tasks.find(y => y.id === d.v);
      if (x) { ui.st[x.id] = fresh(x); ui.tab = 'tasks'; ui.topic = x.topic; ui.current[store.subject] = x.id; ui.scroll = true; }
      break;
    }
    case 'cont': {
      const x = bank.tasks.find(y => y.id === d.v);
      if (x) { ui.topic = x.topic; ui.current[store.subject] = x.id; ui.scroll = true; }
      break;
    }
    case 'copy': {
      ui.report = reportText();
      const done = ok => { ui.copyMsg = ok ? 'Отчёт скопирован. Отправь его учителю.' : 'Скопировать автоматически не вышло. Выдели текст ниже и скопируй вручную.'; render(); };
      try { navigator.clipboard.writeText(ui.report).then(() => done(true), () => done(false)); } catch (e) { done(false); }
      break;
    }
    case 'reset': ui.confirmReset = true; break;
    case 'reset-no': ui.confirmReset = false; break;
    case 'reset-yes': store.rec = {}; store.drafts = {}; ui.st = {}; ui.report = ''; ui.copyMsg = ''; ui.confirmReset = false; save(); break;
    case 't-edit': { const x = T.work.tasks.find(y => y.id === d.v); if (x) { T.form = formFrom(x); T.formErr = ''; T.msg = ''; ui.scrollForm = true; } break; }
    case 't-cancel': T.form = blankForm(); T.formErr = ''; gcImages(T.work); saveDraft(); break;
    case 't-del': T.delId = d.v; break;
    case 't-del-no': T.delId = null; break;
    case 't-del-yes':
      T.work.tasks = T.work.tasks.filter(y => y.id !== d.v); T.delId = null; T.msg = 'Задание удалено. Не забудьте скачать обновлённый файл.';
      if (T.form.editId === d.v) T.form = blankForm();
      gcImages(T.work, T.form.images); saveDraft(); break;
    case 't-img-del': T.form.images = (T.form.images || []).filter(x => x !== d.v); gcImages(T.work, T.form.images); saveDraft(); break;
    case 't-img-use': T.form.images = T.form.images || []; if (T.form.images.length < MAXIMG && !T.form.images.includes(d.v)) T.form.images.push(d.v); break;
    case 'zoom': { const src = imgSrc(d.v); if (src) openZoom(src); return; }
    case 't-publish': downloadSite(T.work); return;
    case 't-full': downloadSite(dirty() ? T.work : bank); return;
    case 't-exit': lsDel(TKEY); canEdit = false; ui.tab = 'tasks'; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ } break;
    case 'share': {
      const r = shareText(); ui.report = r.text;
      navigator.share({ title: 'Отчёт: тренажёр ЕГЭ', text: r.text }).then(() => { ui.copyMsg = 'Отчёт отправлен.'; render(); }, err => { if (!err || err.name !== 'AbortError') { ui.copyMsg = 'Не получилось открыть отправку. Скопируй отчёт вручную.'; render(); } });
      break;
    }
    case 'tg': {
      const r = shareText(); ui.report = r.text;
      const link = 'https://t.me/share/url?url=' + encodeURIComponent(r.site || 'Тренажёр ЕГЭ') + '&text=' + encodeURIComponent('\n' + r.text);
      const w = window.open(link, '_blank', 'noopener');
      if (!w) location.href = link;
      ui.copyMsg = 'Выбери в Telegram чат с учителем и отправь.';
      break;
    }
    case 't-discard': T.confirmDiscard = true; break;
    case 't-discard-no': T.confirmDiscard = false; break;
    case 't-discard-yes': T.work = clone(bank); T.confirmDiscard = false; T.restored = false; T.msg = ''; T.err = ''; T.form = blankForm(); lsDel(DKEY); break;
    default: return;
  }
  render();
}

/* ---------- render ---------- */
function render() {
  const app = $('#app');
  if (ui.tab === 'teacher' && !canEdit) ui.tab = 'tasks';
  app.dataset.subj = store.subject;
  let body = '';
  if (ui.tab === 'errors') body = viewErrors();
  else if (ui.tab === 'progress') body = viewProgress();
  else if (ui.tab === 'teacher') body = viewTeacher();
  else body = viewTasks();
  app.innerHTML = header() + tabs() + body;
  if (ui.scroll) {
    ui.scroll = false;
    const card = $('#task-card');
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (card) card.scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' });
  }
  if (ui.scrollForm) { ui.scrollForm = false; const f = $('#tform'); if (f) f.scrollIntoView({ block: 'start' }); }
}

const app = $('#app');
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || !app.contains(b)) return;
  act(b.dataset.act, b.dataset);
});
app.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.in === 'term' || el.dataset.in === 'open') {
    const t = currentTask(); if (!t) return;
    const s = st(t); s.ans = el.value;
    if (el.dataset.in === 'term') { const b = $('[data-act="check"]'); if (b) b.disabled = !ready(t, s); }
    else {
      store.drafts[t.id] = el.value; saveSoon();
      const c = document.getElementById('cnt-' + t.id); if (c) c.textContent = words(el.value);
      const short = el.value.trim().length < 15, b = $('[data-act="self-open"]'), n = $('#self-note');
      if (b && !s.selfOpen) b.disabled = short;
      if (n) n.hidden = !short;
    }
  } else if (el.dataset.in === 'name') { store.name = el.value; saveSoon(); }
  else if (el.dataset.f && ui.teacher.form) { ui.teacher.form[el.dataset.f] = el.value; }
});
app.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'f-img') { addImages(el.files); return; }
  if (el.dataset.f === 'type' || el.dataset.f === 'subject') { ui.teacher.form[el.dataset.f] = el.value; ui.teacher.formErr = ''; render(); }
});
app.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'tform') saveForm(); });
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.in === 'term') { e.preventDefault(); const b = $('[data-act="check"]'); if (b && !b.disabled) b.click(); }
});

render();

})();
</script>
</body>
</html>
