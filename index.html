числите элементы по порядку."},{"id":"law_g20","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Раскройте особенности хозяйственных товариществ и хозяйственных обществ.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Корпоративные коммерческие организации со складочным капиталом, разделённым на вклады участников. Созданное и приобретённое имущество принадлежит товариществу.\n— Индивидуальные предприниматели или коммерческие организации объединяются для бизнеса от имени товарищества.\n— Полные товарищи дополнительно отвечают по его долгам своим имуществом, если имущества товарищества недостаточно.\nПолное товарищество: все участники ведут предпринимательскую деятельность от его имени и несут дополнительную имущественную ответственность.\nТоварищество на вере (коммандитное): полные товарищи управляют и дополнительно отвечают своим имуществом; вкладчики-коммандитисты не ведут дела товарищества и рискуют только вкладами.\nИз-за высокого риска товарищества создаются редко и требуют большого доверия между партнёрами.\nКорпоративные коммерческие организации с уставным капиталом, разделённым на доли участников. Имущество принадлежит обществу.\n— Участники объединяют вклады и по общему правилу не отвечают по долгам общества, рискуя стоимостью своих долей или акций.\nООО — общество с ограниченной ответственностью. Распространённая форма; можно создать одному человеку. Риск участников обычно ограничен стоимостью долей.\nАО — акционерное общество: капитал разделён на акции, участники называются акционерами. Публичные АО (ПАО) могут публично размещать акции и обеспечивать их публичное обращение. Непубличные АО не имеют установленных законом признаков публичности.\nУчастники обществ обычно рискуют меньше полных товарищей. Общества — распространённая форма бизнеса.\nИтого: товарищества и общества — корпоративные коммерческие организации с разделённым на вклады или доли складочным либо уставным капиталом.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g21","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Раскройте особенности хозяйственных партнёрств, крестьянских (фермерских) хозяйств, производственных кооперативов и унитарных предприятий.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Гибкая форма коммерческой организации, введённая в России с 2012 года и пока редкая.\n— Создаются 2–50 лицами. Имеют устав и соглашение об управлении партнёрством. В соглашении в пределах закона определяют голосование, распределение прибыли, права и обязанности участников.\n— Участники по общему правилу не отвечают по обязательствам партнёрства и рискуют стоимостью вкладов.\nОт полных товариществ отличаются меньшим риском для участников, от обществ — большей гибкостью правил управления.\nДобровольные объединения граждан на основе членства для сельскохозяйственной деятельности: выращивания культур, производства молока, мяса и т. д.\n— КФХ как юридическое лицо создаётся объединением граждан, например членами одной или нескольких семей. Один гражданин может создать КФХ без образования юридического лица.\n— Члены лично участвуют в деятельности, используя имущество хозяйства: землю, технику, животных.\n— Члены несут субсидиарную — дополнительную — ответственность по обязательствам хозяйства своим имуществом, как полные товарищи.\nДобровольное объединение граждан на основе членства для совместной производственной или иной хозяйственной деятельности. Члены объединяют паевые взносы и лично участвуют в деятельности.\n— Не менее 5 членов.\n— Каждый вносит паевой взнос: деньги, имущество, технику.\n— Основа — личное трудовое участие, хотя закон допускает членов, которые лично не трудятся.\n— Прибыль обычно распределяется по трудовому участию с учётом закона и устава.\nПримеры: объединения сапожников, парикмахеров.\nСоздаются государством или муниципалитетом, часто для общественных целей и предоставления коммунальных услуг. ГУПы и МУПы являются унитарными организациями; остальные пять видов — корпоративными.\n— Имущество закреплено на праве хозяйственного ведения или оперативного управления. Его собственником остаётся государство или муниципальное образование.\n— Руководителя назначает собственник.\n— Предприятие отвечает по обязательствам всем принадлежащим ему имуществом.\nПримеры: водоканалы, транспортные предприятия, коммунальные службы.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g22","subject":"soc","topic":"Гражданское право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного является организационно-правовой формой коммерческих организаций? Запишите цифры, под которыми они указаны.","options":["хозяйственное партнёрство","потребительский кооператив","крестьянское (фермерское) хозяйство","товарищество собственников недвижимости","производственный кооператив","политическая партия"],"answer":"135","hint":"Похожие названия — ловушка: производственный и потребительский кооператив, хозяйственное товарищество и товарищество собственников недвижимости.","explain":"Коммерческие: 1, 3, 5. Потребительский кооператив (2), товарищество собственников недвижимости (4) и политическая партия (6) — некоммерческие организации."},{"id":"law_g23","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между характеристиками и видами коммерческих организаций: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["участники дополнительно отвечают по долгам организации своим имуществом","капитал разделён на доли или акции, участники рискуют их стоимостью","не менее пяти членов, основа — личное трудовое участие","может быть создано одним человеком","прибыль обычно распределяется по трудовому участию"],"right":["полное товарищество","хозяйственное общество (ООО, АО)","производственный кооператив"],"answer":"12323","hint":"Полные товарищи рискуют всем имуществом, участники обществ — стоимостью долей, члены кооператива лично трудятся.","explain":"Полное товарищество: А. Хозяйственное общество: Б, Г (ООО можно создать одному). Производственный кооператив: В, Д."},{"id":"law_g24","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о коммерческих организациях и запишите цифры, под которыми они указаны.","options":["В товариществе на вере вкладчики-коммандитисты рискуют только своими вкладами.","Публичное акционерное общество может публично размещать акции.","Имущество государственного унитарного предприятия принадлежит ему на праве собственности.","Хозяйственное партнёрство создаётся двумя — пятьюдесятью лицами.","Члены крестьянского (фермерского) хозяйства не несут дополнительной ответственности по его обязательствам."],"answer":"124","hint":"Кто собственник имущества унитарного предприятия? Как отвечают члены КФХ?","explain":"Верны 1, 2, 4. Собственник имущества ГУП — государство, у предприятия оно на праве хозяйственного ведения или оперативного управления (3). Члены КФХ несут субсидиарную (дополнительную) ответственность (5)."},{"id":"law_g25","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое некоммерческая организация? Приведите примеры.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Для НКО извлечение прибыли не является основной целью. Их организационно-правовых форм больше, чем у коммерческих организаций.\nПримеры: общественные и благотворительные фонды, политические партии, государственные и муниципальные учреждения, в том числе большинство школ.\nНекоторые названия похожи, но обозначают разные организации:\n— Производственный кооператив — коммерческая организация. Потребительский кооператив — НКО, созданная для удовлетворения потребностей участников, например совместного приобретения товаров или услуг.\nЖилищный кооператив приобретает или строит жильё для членов и управляет домом.\n— Хозяйственное товарищество — коммерческая организация. Товарищество собственников недвижимости — НКО для совместного управления общим имуществом. Например, собственники вносят взносы на содержание крыши, лифта, подъезда и прилегающей территории.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g26","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Может ли некоммерческая организация извлекать прибыль?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Да, если приносящая доход деятельность предусмотрена уставом, соответствует целям организации и служит их достижению.\nПрибыль направляется на цели НКО: развитие деятельности, социальные программы, улучшение условий работы. По общему правилу она не распределяется между учредителями или участниками, кроме предусмотренных специальным законом исключений.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g27","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о некоммерческих организациях и запишите цифры, под которыми они указаны.","options":["Для некоммерческой организации извлечение прибыли не является основной целью.","НКО может вести приносящую доход деятельность, если она предусмотрена уставом и служит целям организации.","Прибыль НКО по общему правилу распределяется между её участниками.","Потребительский кооператив — некоммерческая организация.","Производственный кооператив — некоммерческая организация."],"answer":"124","hint":"Куда направляется прибыль НКО? Какой из кооперативов коммерческий?","explain":"Верны 1, 2, 4. Прибыль НКО направляется на её цели и по общему правилу не распределяется между участниками (3). Производственный кооператив — коммерческая организация (5)."},{"id":"law_g28","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между организациями и их видами: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["производственный кооператив","жилищный кооператив","муниципальное унитарное предприятие","благотворительный фонд","товарищество собственников недвижимости"],"right":["коммерческая организация","некоммерческая организация"],"answer":"12122","hint":"Жилищный кооператив строит жильё для членов, а не извлекает прибыль.","explain":"Коммерческие: производственный кооператив (А), МУП (В). Некоммерческие: жилищный кооператив (Б), благотворительный фонд (Г), ТСН (Д)."},{"id":"law_g29","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Какие отношения регулирует гражданское право? Что такое личные неимущественные и имущественные отношения?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Личные неимущественные.\n2) Имущественные.\nВозникают по поводу нематериальных благ: имени, жизни и здоровья, личной неприкосновенности, неприкосновенности жилища, чести, доброго имени, деловой репутации.\nНе имеют имущественного содержания и неразрывно связаны с личностью.\nВозникают по поводу принадлежности и передачи имущества, выполнения работ, оказания услуг и других имущественных интересов.\nОсновные рассматриваемые виды:\n1) Вещные.\n2) Обязательственные.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g30","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и видами отношений, регулируемых гражданским правом: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["защита деловой репутации организации","аренда квартиры","защита чести и доброго имени гражданина","наследование дома","оказание услуг по ремонту"],"right":["личные неимущественные","имущественные"],"answer":"12122","hint":"Личные неимущественные — нематериальные блага, неразрывно связанные с личностью.","explain":"Личные неимущественные: деловая репутация (А), честь и доброе имя (В). Имущественные: аренда (Б), наследование (Г), услуги (Д)."},{"id":"law_g31","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое вещные права? Назовите любые пять видов. Что такое право собственности и каковы три правомочия собственника?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Вещные права обеспечивают юридическое господство лица над вещью.\n1) Право собственности — юридически обеспеченная возможность владеть, пользоваться и распоряжаться имуществом, защищать своё право.\nТри правомочия собственника:\nВладение — фактически обладать вещью.\nПользование — извлекать её полезные свойства.\nРаспоряжение — определять юридическую судьбу вещи, например менять её принадлежность.\nДругие вещные права:\n2) Постоянное (бессрочное) пользование земельным участком.\n3) Пожизненное наследуемое владение земельным участком.\n4) Сервитут — ограниченное пользование чужим земельным участком.\n5) Хозяйственное ведение.\n6) Оперативное управление. Существуют и иные вещные права.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g32","subject":"soc","topic":"Гражданское право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к вещным правам? Запишите цифры, под которыми они указаны.","options":["сервитут","право требовать возврата долга","право хозяйственного ведения","право собственности","исключительное право на изобретение","право на получение неустойки"],"answer":"134","hint":"Вещные права — юридическое господство над вещью. Долг и неустойка — из обязательств, изобретение — интеллектуальное право.","explain":"Вещные права: 1, 3, 4. Требование долга (2) и неустойки (6) — обязательственные права, исключительное право (5) — интеллектуальное."},{"id":"law_g33","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и правомочиями собственника: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["Анна продала свою машину","Олег хранит у себя дома принадлежащий ему велосипед","Ирина живёт в своей квартире","Пётр подарил брату свой ноутбук","фермер собирает урожай со своего сада"],"right":["владение","пользование","распоряжение"],"answer":"31232","hint":"Владение — фактически обладать; пользование — извлекать полезные свойства; распоряжение — определять юридическую судьбу вещи.","explain":"Распоряжение: продажа (А), дарение (Г). Владение: хранит у себя (Б). Пользование: живёт в квартире (В), собирает урожай (Д)."},{"id":"law_g34","subject":"soc","topic":"Гражданское право","type":"text","max":1,"text":"Запишите термин: вещное право ограниченного пользования чужим земельным участком.","answer":["сервитут"],"hint":"Слово латинского происхождения, входит в перечень вещных прав.","explain":"Сервитут."},{"id":"law_g35","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Каковы основания возникновения права собственности?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Купля-продажа, мена и другие сделки об отчуждении имущества.\n2) Наследование по завещанию или закону.\n3) Законное изготовление или создание вещи.\n4) Приобретение бесхозяйных вещей в установленном законом порядке и другие основания.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g36","subject":"soc","topic":"Гражданское право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного является основанием возникновения права собственности? Запишите цифры, под которыми они указаны.","options":["договор купли-продажи","наследование по закону","договор аренды","законное изготовление новой вещи","хранение вещи по договору","приобретение бесхозяйной вещи в установленном законом порядке"],"answer":"1246","hint":"Аренда и хранение дают пользование или обязанность хранить, но не собственность.","explain":"Основания: 1, 2, 4, 6. Аренда (3) и хранение (5) права собственности не порождают."},{"id":"law_g37","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое вещь? Каковы её свойства и виды?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Вещь — материальный объект гражданских прав, который может быть объектом имущественных отношений.\nИмеет материальную сущность.\nУдовлетворяет материальные, культурные и другие потребности.\nИмеет ценность, не обязательно выраженную рыночной ценой.\n1) Недвижимые — прочно связаны с землёй и не могут перемещаться без несоразмерного ущерба назначению: земельные участки, здания, сооружения. Закон также относит к недвижимости подлежащие государственной регистрации воздушные и морские суда, суда внутреннего плавания и некоторые другие объекты.\n2) Движимые — остальные вещи, включая документарные ценные бумаги и наличные деньги.\n3) Неделимые — нельзя разделить в натуре без разрушения, повреждения или изменения назначения: телефон, стол.\n4) Сложные — несколько вещей, используемых по общему назначению: чайный сервиз, компьютерный комплект, кухонный гарнитур.\n5) Плоды, продукция и доходы — имущество, полученное от использования вещи; обычно принадлежит её собственнику.\n6) Животные.\n7) Наличные деньги.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g38","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между объектами и видами вещей: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["земельный участок","наличные деньги","морское судно, подлежащее государственной регистрации","документарная ценная бумага","здание"],"right":["недвижимые","движимые"],"answer":"12121","hint":"Закон относит к недвижимости не только то, что связано с землёй, но и некоторые суда.","explain":"Недвижимые: земельный участок (А), морское судно, подлежащее регистрации (В), здание (Д). Движимые: наличные деньги (Б), документарная ценная бумага (Г)."},{"id":"law_g39","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о вещах как объектах гражданских прав и запишите цифры, под которыми они указаны.","options":["Вещь — материальный объект гражданских прав.","Неделимую вещь нельзя разделить в натуре без разрушения, повреждения или изменения назначения.","Плоды, продукция и доходы от использования вещи обычно принадлежат её собственнику.","Кухонный гарнитур — пример неделимой вещи.","Ценность вещи всегда выражается в её рыночной цене."],"answer":"123","hint":"Несколько вещей с общим назначением — какой это вид вещей?","explain":"Верны 1, 2, 3. Кухонный гарнитур — сложная вещь (4). Ценность вещи не обязательно выражена рыночной ценой (5)."},{"id":"law_g40","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое обязательственные права и обязательства? Каковы основания их возникновения?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Возникают по поводу передачи имущества, выполнения работ, оказания услуг и связывают кредитора с должником.\nОБЯЗАТЕЛЬСТВО — правоотношение, в котором должник обязан совершить в пользу кредитора действие: передать имущество, выполнить работу, оказать услугу, внести вклад в совместную деятельность, уплатить деньги — либо воздержаться от действия. Кредитор вправе требовать исполнения.\nОснования возникновения:\n1) Сделки, включая договоры.\n2) Неправомерные действия, например причинение вреда.\n3) Акты государственных органов в предусмотренных законом случаях.\n4) Судебные решения и другие законные основания.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g41","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о обязательствах и запишите цифры, под которыми они указаны.","options":["В обязательстве должник обязан совершить в пользу кредитора определённое действие либо воздержаться от действия.","Кредитор вправе требовать от должника исполнения обязательства.","Обязательство может возникнуть из причинения вреда.","Обязательства возникают только из договоров.","Судебное решение не может быть основанием возникновения обязательства."],"answer":"123","hint":"Оснований возникновения обязательств четыре группы.","explain":"Верны 1, 2, 3. Обязательства возникают из сделок, неправомерных действий, актов государственных органов, судебных решений и других оснований (4, 5 неверны)."},{"id":"law_g42","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое сделка? Каковы формы и виды сделок?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Сделка — действие граждан или юридических лиц, направленное на установление, изменение или прекращение гражданских прав и обязанностей.\nФормы:\n1) Устная.\n2) Простая письменная.\n3) Письменная нотариальная.\nУстные сделки тоже обязательны, но:\n1) Их труднее доказывать.\n2) Закон может требовать письменную форму: например, по общему правилу для сделок юридических лиц между собой или с гражданами. Для завещания по общему правилу нужно нотариальное удостоверение.\nНарушение простой письменной формы обычно ограничивает использование свидетельских показаний, но не всегда делает сделку недействительной. Отсутствие обязательного нотариального удостоверения по общему правилу влечёт ничтожность.\n1) Односторонние — достаточно воли одной стороны, например завещание.\nДвусторонние и многосторонние — нужно согласие двух или более сторон; это договоры, например купля-продажа, бартер.\n2) Возмездные — есть встречное предоставление: купля-продажа, аренда.\nБезвозмездные — встречного предоставления нет: дарение.\n3) Консенсуальные договоры заключаются при согласовании существенных условий в требуемой форме.\nРеальные требуют также передачи имущества: например, дарение с непосредственной передачей вещи.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g43","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о сделках и запишите цифры, под которыми они указаны.","options":["Сделка — действие, направленное на установление, изменение или прекращение гражданских прав и обязанностей.","Устные сделки не имеют юридической силы.","Для завещания по общему правилу требуется нотариальное удостоверение.","Отсутствие обязательного нотариального удостоверения по общему правилу влечёт ничтожность сделки.","Нарушение простой письменной формы всегда делает сделку недействительной."],"answer":"134","hint":"Чем грозит нарушение простой письменной формы и чем — отсутствие нотариального удостоверения?","explain":"Верны 1, 3, 4. Устные сделки тоже обязательны (2). Нарушение простой письменной формы обычно лишь ограничивает использование свидетельских показаний (5)."},{"id":"law_g44","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между сделками и их видами: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["купля-продажа","дарение","аренда","мена (бартер)","передача квартиры в дар сыну"],"right":["возмездная","безвозмездная"],"answer":"12112","hint":"Возмездная сделка предполагает встречное предоставление.","explain":"Возмездные: купля-продажа (А), аренда (В), мена (Г). Безвозмездные: дарение (Б, Д)."},{"id":"law_g45","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о видах сделок и запишите цифры, под которыми они указаны.","options":["Завещание — пример односторонней сделки.","Для заключения договора необходимо согласие двух или более сторон.","Дарение относится к возмездным сделкам.","Реальный договор требует не только согласования условий, но и передачи имущества.","Консенсуальный договор считается заключённым только после передачи вещи."],"answer":"124","hint":"Консенсуальный договор заключается согласованием условий, реальный — передачей имущества.","explain":"Верны 1, 2, 4. Дарение — безвозмездная сделка (3). Консенсуальный договор заключён с момента согласования существенных условий в требуемой форме (5)."},{"id":"law_g46","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Назовите способы обеспечения обязательств.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Правовые механизмы, дающие кредитору дополнительные гарантии исполнения обязательства.\n1) Залог.\nИмущество обеспечивает обязательство и может оставаться у залогодателя. При неисполнении кредитор может получить удовлетворение за счёт его стоимости в установленном порядке.\nПримеры: квартира при ипотеке, драгоценности при займе в ломбарде.\n2) Поручительство.\nПоручитель обязуется отвечать перед кредитором за исполнение обязательства должником. По общему правилу отвечает наряду с должником.\nПример: поручитель при банковском кредите.\n3) Задаток.\nПо письменному соглашению одна сторона передаёт другой деньги в счёт платежей по договору и в обеспечение исполнения.\nЕсли за неисполнение отвечает давшая задаток сторона, он остаётся у другой. Если получившая — возвращает вдвойне. При исполнении задаток засчитывается в платёж.\nНиколай снимает дом за 20 тысяч рублей и вносит 5 тысяч задатка. При исполнении доплачивает 15 тысяч. Если за срыв отвечает Николай, теряет 5 тысяч; если владелец — возвращает Николаю 10 тысяч.\n4) Неустойка — штраф, пеня.\nУстановленная законом или договором сумма, которую должник платит за неисполнение или ненадлежащее исполнение, включая просрочку.\nРемонт квартиры должен завершиться 1 сентября 2024 года. Со 2 сентября за просрочку начисляется предусмотренная договором неустойка, например 1000 рублей в день.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g47","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и способами обеспечения обязательств: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["квартира, купленная в ипотеку, обеспечивает возврат кредита","друг заёмщика обязался отвечать перед банком за возврат кредита","наниматель передал владельцу дома 5 тыс. руб. в счёт будущей оплаты и в обеспечение договора","подрядчик платит 1000 руб. за каждый день просрочки ремонта","золотое кольцо сдано в ломбард в обеспечение займа"],"right":["залог","поручительство","задаток","неустойка"],"answer":"12341","hint":"Залог — имущество, поручительство — другое лицо, задаток — деньги наперёд, неустойка — плата за нарушение.","explain":"Залог: ипотека (А), ломбард (Д). Поручительство: Б. Задаток: В. Неустойка (пеня): Г."},{"id":"law_g48","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о задатке и неустойке и запишите цифры, под которыми они указаны.","options":["Если за неисполнение договора отвечает сторона, давшая задаток, он остаётся у другой стороны.","Если за неисполнение договора отвечает сторона, получившая задаток, она возвращает его в двойном размере.","Соглашение о задатке заключается в письменной форме.","При исполнении договора задаток возвращается в двойном размере.","Неустойка может быть установлена только законом."],"answer":"123","hint":"Что происходит с задатком, если договор исполнен?","explain":"Верны 1, 2, 3. При исполнении договора задаток засчитывается в платёж (4). Неустойка устанавливается законом или договором (5)."},{"id":"law_g49","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Что такое интеллектуальные права и каковы их особенности?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Права на охраняемые результаты интеллектуальной деятельности и приравненные к ним средства индивидуализации: произведения искусства, изобретения, товарные знаки, промышленные образцы.\nВключают имущественное исключительное право: использование объекта, получение дохода, распоряжение правом в пределах закона. В предусмотренных законом случаях включают и личные неимущественные права, например право авторства, связанное с личностью создателя.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g50","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о интеллектуальных правах и запишите цифры, под которыми они указаны.","options":["Произведения искусства и изобретения относятся к охраняемым результатам интеллектуальной деятельности.","Исключительное право позволяет использовать объект, получать доход и распоряжаться правом в пределах закона.","Право авторства — личное неимущественное право, связанное с личностью создателя.","Товарный знак не охраняется законом.","Интеллектуальные права относятся к вещным правам."],"answer":"123","hint":"Товарные знаки — средства индивидуализации, приравненные к результатам интеллектуальной деятельности.","explain":"Верны 1, 2, 3. Товарный знак охраняется как средство индивидуализации (4). Интеллектуальные права — самостоятельная группа прав, а не вещные (5)."},{"id":"law_g51","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Назовите способы защиты гражданских прав.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Предусмотренные законом меры защиты и восстановления нарушенных прав: например, при нарушении договора, повреждении имущества или незаконном использовании произведения.\nОсновные способы (ст. 12 ГК РФ):\n1) Возмещение убытков. Например, виновник ДТП возмещает ущерб владельцу повреждённого автомобиля.\n2) Присуждение к исполнению обязанности в натуре. Суд обязывает должника исполнить обязательство: например, ремонтную организацию — выполнить согласованный ремонт автомобиля.\n3) Взыскание неустойки — см. п. 21.\n4) Компенсация морального вреда — денежная компенсация физических или нравственных страданий, добровольно либо по решению суда.\n5) Самозащита права — самостоятельные законные действия по защите прав без обращения в государственные органы.\n6) Признание права — подтверждение его существования уполномоченным органом.\n7) Признание сделки недействительной.\n8) Иные способы, перечисленные в ст. 12 ГК РФ.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g52","subject":"soc","topic":"Гражданское право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к способам защиты гражданских прав по ст. 12 ГК РФ? Запишите цифры, под которыми они указаны.","options":["возмещение убытков","выговор","компенсация морального вреда","признание сделки недействительной","административный штраф","самозащита права"],"answer":"1346","hint":"Выговор — дисциплинарное взыскание, штраф по КоАП — административное наказание. По данным ФИПИ, их часто путают.","explain":"Способы защиты гражданских прав: 1, 3, 4, 6. Выговор (2) — дисциплинарное взыскание, административный штраф (5) — административное наказание."},{"id":"law_g53","subject":"soc","topic":"Гражданское право","ege":15,"type":"match","max":2,"text":"Установите соответствие между ситуациями и способами защиты гражданских прав: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["виновник ДТП оплатил ремонт повреждённого автомобиля","суд обязал ремонтную организацию выполнить согласованный ремонт","газета выплатила гражданину деньги за нравственные страдания, причинённые публикацией","сосед возместил стоимость испорченной им мебели","суд обязал продавца передать покупателю оплаченный товар"],"right":["возмещение убытков","присуждение к исполнению обязанности в натуре","компенсация морального вреда"],"answer":"12312","hint":"Исполнение в натуре — суд заставляет сделать то, что было обещано.","explain":"Возмещение убытков: А, Г. Исполнение обязанности в натуре: Б, Д. Компенсация морального вреда: В."},{"id":"law_g54","subject":"soc","topic":"Гражданское право","type":"open","card":true,"max":2,"text":"Назовите основные начала (принципы) гражданского права.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные начала (ст. 1 ГК РФ):\n1) Равенство участников: одна сторона не находится во властном подчинении у другой.\n2) Неприкосновенность собственности. Изъятие имущества допускается в установленных законом случаях, например при обращении взыскания для погашения долгов, взысканных судом.\n3) Свобода договора:\nА) участники приобретают и осуществляют гражданские права своей волей и в своём интересе;\nБ) свободны в установлении договорных прав, обязанностей и условий, не противоречащих законодательству.\n4) Свободное перемещение товаров, услуг и финансовых средств на всей территории РФ.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_g55","subject":"soc","topic":"Гражданское право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о принципах гражданского права и запишите цифры, под которыми они указаны.","options":["Равенство участников — один из принципов гражданского права.","Свобода договора позволяет сторонам устанавливать любые условия, в том числе противоречащие закону.","Изъятие имущества допускается только в установленных законом случаях.","Свободное перемещение товаров, услуг и финансовых средств по всей территории РФ — основное начало гражданского права.","Неприкосновенность собственности означает, что имущество ни при каких условиях не может быть изъято."],"answer":"134","hint":"Свобода договора имеет границы, а неприкосновенность собственности допускает исключения.","explain":"Верны 1, 3, 4. Условия договора не должны противоречить законодательству (2). Изъятие имущества возможно в установленных законом случаях (5)."},{"id":"law_g56","subject":"soc","topic":"Гражданское право","ege":22,"type":"open","max":4,"text":"Шестнадцатилетняя Катя работает по трудовому договору курьером и хочет стать полностью дееспособной. Её родители согласны.\n1) Какой объём дееспособности у Кати сейчас?\n2) Может ли Катя сейчас самостоятельно распоряжаться своей зарплатой?\n3) Как называется объявление несовершеннолетнего полностью дееспособным?\n4) Какой орган примет решение, если родители согласны?","criteria":[{"id":"K1","max":4,"text":"Правильно даны ответы на четыре вопроса — 4 балла; на 3 — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) Частичная (неполная) дееспособность несовершеннолетнего от 14 до 18 лет.\n2) Да: с 14 лет несовершеннолетний вправе самостоятельно распоряжаться заработком, стипендией и иными доходами.\n3) Эмансипация.\n4) Орган опеки и попечительства (без согласия родителей — суд).","hint":"Катя работает по трудовому договору и ей уже 16 — это условие эмансипации."},{"id":"law_l01","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Что такое трудовое право?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Трудовое право — отрасль права, регулирующая трудовые и непосредственно связанные с ними отношения.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l02","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Кто такой работодатель? Кто может быть работодателем?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Работодатель — физическое лицо либо юридическое лицо (организация), вступившее в трудовые отношения с работником.\nРаботодателями могут быть:\n— Юридические лица.\n— Индивидуальные предприниматели, частные нотариусы, адвокаты, учредившие адвокатские кабинеты, и другие предусмотренные законом лица.\n— Физические лица, нанимающие работников для личного обслуживания и помощи по хозяйству: садовников, поваров и т. д.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l03","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Кто такой работник? Кто может быть работником?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Работник — физическое лицо, вступившее в трудовые отношения с работодателем.\nРаботниками могут быть граждане РФ, иностранные граждане и лица без гражданства при соблюдении возрастных и иных требований закона.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l04","subject":"soc","topic":"Трудовое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о субъектах трудового права и запишите цифры, под которыми они указаны.","options":["Трудовое право регулирует трудовые и непосредственно связанные с ними отношения.","Работодателем может быть физическое лицо, нанимающее работников для личного обслуживания и помощи по хозяйству.","Работником может быть только гражданин РФ.","Индивидуальный предприниматель может быть работодателем.","Работником может быть юридическое лицо."],"answer":"124","hint":"Работник — всегда физическое лицо. Может ли им быть иностранец?","explain":"Верны 1, 2, 4. Работниками могут быть и иностранные граждане, и лица без гражданства (3). Работник — физическое лицо (5)."},{"id":"law_l05","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"С какого возраста по общему правилу заключается трудовой договор? При каких условиях его можно заключить с лицами, достигшими 15 лет, 14 лет и не достигшими 14 лет?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"По общему правилу трудовой договор заключается с 16 лет.\nС 15 лет самостоятельно, если:\n1) Труд лёгкий и не причиняет вреда здоровью.\n2) Общее образование получено либо подросток законно оставил школу или был отчислен и продолжает получать общее образование в иной форме без ущерба для освоения программы.\nС 14 лет, если:\n1) Труд лёгкий и не причиняет вреда здоровью.\n2) Общее образование получено либо работа выполняется в свободное от учёбы время без ущерба для освоения программы.\n3) Есть письменное согласие одного из родителей или попечителя.\nДля детей-сирот и детей, оставшихся без попечения родителей, требуется письменное согласие органа опеки и попечительства или иного законного представителя.\nДо 14 лет — в кино, театрах, театральных и концертных организациях, цирках для участия в создании или исполнении произведений:\n— Без ущерба здоровью и нравственному развитию.\n— С согласия одного из родителей или опекуна и разрешения органа опеки и попечительства.\n— Договор от имени ребёнка подписывает родитель или опекун.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l06","subject":"soc","topic":"Трудовое право","ege":15,"type":"match","max":2,"text":"Установите соответствие между условиями заключения трудового договора и возрастом работника: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["лёгкий труд в свободное от учёбы время с письменного согласия одного из родителей","участие в создании или исполнении произведения в театре с разрешения органа опеки и попечительства","лёгкий труд после получения общего образования, согласие родителей не требуется","договор от имени работника подписывает родитель или опекун","лёгкий труд; подросток законно оставил школу и продолжает обучение в иной форме, договор заключает сам"],"right":["с 14 лет","с 15 лет","до 14 лет"],"answer":"13232","hint":"С 15 лет договор заключают самостоятельно, с 14 — с согласия родителя, до 14 — только в сфере искусства.","explain":"С 14 лет: А. С 15 лет: В, Д (самостоятельно). До 14 лет: Б, Г (театр, кино, цирк; договор подписывает родитель или опекун)."},{"id":"law_l07","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Каковы особенности трудового статуса несовершеннолетних работников?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Запрещены вредные, опасные и подземные работы, а также работа, способная повредить здоровью или нравственному развитию.\n2) Сокращённая рабочая неделя: до 16 лет — не более 24 часов, с 16 до 18 лет — не более 35 часов. При совмещении работы с общим или средним профессиональным образованием в учебном году — не более половины этих норм.\n3) По общему правилу запрещены сверхурочная и ночная работа, командировки, работа в выходные и праздники. Закон предусматривает отдельные исключения.\n4) Не устанавливается испытательный срок. 5) Ежегодный основной оплачиваемый отпуск — 31 календарный день в удобное для работника время.\n6) Обязательны предварительный и ежегодные медицинские осмотры до достижения 18 лет за счёт работодателя.\n7) Запрещена работа по совместительству.\n8) Увольнение по инициативе работодателя требует согласия государственной инспекции труда и комиссии по делам несовершеннолетних, кроме ликвидации организации или прекращения деятельности ИП.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l08","subject":"soc","topic":"Трудовое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о труде несовершеннолетних и запишите цифры, под которыми они указаны.","options":["Для работников младше 16 лет рабочее время — не более 24 часов в неделю.","Для работников от 16 до 18 лет рабочее время — не более 35 часов в неделю.","Несовершеннолетним устанавливается испытательный срок до трёх месяцев.","Ежегодный оплачиваемый отпуск несовершеннолетних — 31 календарный день в удобное для них время.","Несовершеннолетний вправе работать по совместительству."],"answer":"124","hint":"Вспомните перечень особенностей: часы, отпуск, испытание, совместительство.","explain":"Верны 1, 2, 4. Несовершеннолетним испытание не устанавливается (3), работа по совместительству им запрещена (5)."},{"id":"law_l09","subject":"soc","topic":"Трудовое право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного по общему правилу запрещено для работников младше 18 лет? Запишите цифры, под которыми они указаны.","options":["ночная работа","работа в выходные и праздничные дни","ежегодные медицинские осмотры","подземные работы","ежегодный отпуск 31 календарный день","направление в командировку"],"answer":"1246","hint":"Медосмотры и отпуск — это гарантии, а не запреты.","explain":"Запрещены: 1, 2, 4, 6. Медосмотры (3) обязательны за счёт работодателя, отпуск 31 день (5) — гарантия для несовершеннолетних."},{"id":"law_l10","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Что такое трудовой договор? Перечислите любые четыре сведения и четыре условия, включаемые в него.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Трудовой договор — соглашение, по которому работник обязуется лично выполнять трудовую функцию и соблюдать правила внутреннего трудового распорядка, а работодатель — предоставить работу, обеспечить надлежащие условия труда и своевременно выплачивать заработную плату в полном объёме.\nЧетыре сведения:\n— Дата заключения договора.\n— Место заключения договора.\n— Фамилия, имя, отчество работника и наименование работодателя либо его ФИО, если это физическое лицо.\n— Сведения о документах, удостоверяющих личность работника и работодателя — физического лица.\nЧетыре обязательных условия:\n— Место работы.\n— Трудовая функция.\n— Условия оплаты труда.\n— Условия труда на рабочем месте.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l11","subject":"soc","topic":"Трудовое право","ege":15,"type":"match","max":2,"text":"Установите соответствие между элементами трудового договора и их видами: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["место работы","дата заключения договора","трудовая функция","сведения о документах, удостоверяющих личность работника","условия оплаты труда"],"right":["сведения","обязательные условия"],"answer":"21212","hint":"Сведения — кто, где и когда заключил договор. Условия — что, где и за какую оплату делает работник.","explain":"Сведения: дата (Б), документы, удостоверяющие личность (Г). Обязательные условия: место работы (А), трудовая функция (В), условия оплаты (Д)."},{"id":"law_l12","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Каков общий порядок заключения трудового договора и оформления приёма на работу?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Работник предъявляет необходимые документы. До подписания договора работодатель знакомит его под подпись с правилами внутреннего трудового распорядка, связанными с работой локальными актами и коллективным договором при его наличии.\n2) Договор заключается в письменной форме. При бумажном оформлении стороны подписывают два экземпляра: один получает работник, другой остаётся у работодателя. Получение своего экземпляра работник подтверждает подписью.\n3) Работодатель вправе издать приказ о приёме на работу на основании договора.\n4) Работодатель оформляет сведения о трудовой деятельности и вносит запись в бумажную трудовую книжку, если она ведётся.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l13","subject":"soc","topic":"Трудовое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о трудовом договоре и запишите цифры, под которыми они указаны.","options":["По трудовому договору работник обязуется лично выполнять определённую трудовую функцию.","Трудовой договор заключается в письменной форме.","До подписания договора работодатель знакомит работника с правилами внутреннего трудового распорядка.","С несовершеннолетним трудовой договор заключается в устной форме.","При бумажном оформлении договор составляется в одном экземпляре, который хранится у работодателя."],"answer":"123","hint":"Сколько экземпляров договора подписывают стороны?","explain":"Верны 1, 2, 3. Трудовой договор всегда заключается письменно (4). При бумажном оформлении подписывают два экземпляра: один у работника, другой у работодателя (5)."},{"id":"law_l14","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Перечислите семь документов, которые предъявляются при приёме на работу в предусмотренных законом случаях.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) Паспорт или иной документ, удостоверяющий личность.\n2) Трудовая книжка и (или) сведения о трудовой деятельности, кроме первого трудоустройства.\n3) Документ, подтверждающий регистрацию в системе индивидуального персонифицированного учёта, в том числе электронный.\n4) Документы воинского учёта — для военнообязанных и лиц, подлежащих призыву.\n5) Документ об образовании, квалификации или специальных знаниях — если работа требует соответствующей подготовки.\n6) Справка о наличии или отсутствии судимости и факта уголовного преследования либо о его прекращении по реабилитирующим основаниям.\n7) Справка о наличии или отсутствии административного наказания за незаконное потребление наркотических, психотропных или новых потенциально опасных психоактивных веществ.\nСправки из пунктов 6 и 7 требуются только для предусмотренных законом видов деятельности.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l15","subject":"soc","topic":"Трудовое право","ege":16,"type":"choice","max":2,"text":"Какие из перечисленных документов предъявляются при приёме на работу в предусмотренных законом случаях? Запишите цифры, под которыми они указаны.","options":["паспорт или иной документ, удостоверяющий личность","документы воинского учёта — для военнообязанных","свидетельство о браке","документ об образовании, если работа требует специальной подготовки","справка о доходах супруга","трудовая книжка и (или) сведения о трудовой деятельности"],"answer":"1246","hint":"Свидетельство о браке и сведения о доходах родственников работодатель требовать не вправе.","explain":"Предъявляются: 1, 2, 4, 6. Свидетельства о браке (3) и справки о доходах супруга (5) в перечне нет."},{"id":"law_l16","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Какие виды трудовых договоров выделяют по сроку действия? Каково общее правило изменения трудового договора?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"1) На неопределённый срок — срок окончания трудовых отношений не устанавливается. Такой договор заключается по общему правилу.\n2) Срочный — заключается на определённый срок, обычно не более пяти лет, если законом не предусмотрено иное. Для его заключения необходимы законные основания.\nЕсли срок истёк, работник продолжает работать и ни одна сторона не потребовала прекращения договора, он становится бессрочным.\n10. Изменение трудового договора\nПо общему правилу изменение согласованных сторонами условий допускается только по их взаимному соглашению, оформленному письменно. Исключения устанавливаются законом.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l17","subject":"soc","topic":"Трудовое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о сроке и изменении трудового договора и запишите цифры, под которыми они указаны.","options":["По общему правилу трудовой договор заключается на неопределённый срок.","Срочный трудовой договор по общему правилу заключается не более чем на пять лет.","Если срок договора истёк, работник продолжает работать и никто не потребовал прекращения договора, он становится бессрочным.","Работодатель вправе в любое время изменить условия трудового договора в одностороннем порядке.","Срочный договор заключается по желанию работодателя без каких-либо законных оснований."],"answer":"123","hint":"Как по общему правилу меняются согласованные условия договора?","explain":"Верны 1, 2, 3. Изменение условий по общему правилу — только по соглашению сторон в письменной форме (4). Для срочного договора нужны законные основания (5)."},{"id":"law_l18","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Что такое испытательный срок? Какова его максимальная продолжительность? Кому испытание не устанавливается?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Испытательный срок — установленный соглашением сторон период проверки соответствия работника поручаемой работе.\nПо общему правилу — не более трёх месяцев. Для отдельных руководящих должностей, например руководителей организаций и главных бухгалтеров, — до шести месяцев.\nУсловие об испытании должно быть согласовано до начала работы.\nИспытание не устанавливается:\n— Лицам младше 18 лет.\n— Беременным женщинам и женщинам, имеющим детей до трёх лет.\n— Лицам, избранным на выборную должность на оплачиваемую работу.\n— Лицам, заключающим трудовой договор на срок до двух месяцев.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l19","subject":"soc","topic":"Трудовое право","ege":16,"type":"choice","max":2,"text":"Кому испытательный срок при приёме на работу не устанавливается? Запишите цифры, под которыми они указаны.","options":["лицам младше 18 лет","беременным женщинам","главным бухгалтерам","лицам, заключающим трудовой договор на срок до двух месяцев","женщинам, имеющим детей в возрасте до трёх лет","работникам старше 50 лет"],"answer":"1245","hint":"Главным бухгалтерам испытание, наоборот, может быть установлено на более долгий срок.","explain":"Испытание не устанавливается: 1, 2, 4, 5. Главным бухгалтерам оно может длиться до шести месяцев (3); для работников старше 50 лет исключения нет (6). С 1 сентября 2026 г. запрет распространяется на женщин с детьми до трёх лет (раньше — до полутора)."},{"id":"law_l20","subject":"soc","topic":"Трудовое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о испытательном сроке и запишите цифры, под которыми они указаны.","options":["По общему правилу испытательный срок не может превышать трёх месяцев.","Для руководителей организаций и главных бухгалтеров испытание может длиться до шести месяцев.","Условие об испытании можно установить через месяц после начала работы.","Испытание устанавливается по соглашению сторон.","Лицам, избранным на выборную должность на оплачиваемую работу, испытание устанавливается обязательно."],"answer":"124","hint":"Когда должно быть согласовано условие об испытании?","explain":"Верны 1, 2, 4. Условие об испытании согласуется до начала работы (3). Избранным на выборную оплачиваемую должность испытание не устанавливается (5)."},{"id":"law_l21","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Каковы основания прекращения трудового договора по инициативе работника, по соглашению сторон и в связи с истечением срока?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Прекращение трудового договора А) По инициативе работника\nПо общему правилу работник письменно предупреждает работодателя не менее чем за две недели. Срок отсчитывается со следующего дня после получения заявления работодателем.\nДо истечения срока заявление можно отозвать, если на место работника письменно не приглашён другой работник, которому по закону нельзя отказать в приёме.\nУволиться раньше можно по соглашению сторон. При невозможности продолжать работу, например в связи с зачислением в образовательную организацию или выходом на пенсию, работодатель обязан уволить в срок, указанный в заявлении.\nБ) По соглашению сторон\nДоговор может быть расторгнут в любое время по взаимному соглашению работника и работодателя.\nВ) Истечение срока\nПо общему правилу работодатель письменно предупреждает работника не менее чем за три календарных дня. Исключение — договор на время исполнения обязанностей отсутствующего работника: он прекращается с выходом этого работника на работу.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l22","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Каковы основания прекращения трудового договора по инициативе работодателя и по обстоятельствам, не зависящим от воли сторон?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Некоторые основания:\n1) Прогул — отсутствие на рабочем месте без уважительных причин весь рабочий день или смену независимо от продолжительности либо более четырёх часов подряд.\n2) Появление на работе в состоянии алкогольного, наркотического или иного токсического опьянения.\n3) Неоднократное неисполнение трудовых обязанностей без уважительных причин при наличии действующего дисциплинарного взыскания.\n4) Несоответствие должности вследствие недостаточной квалификации, подтверждённой аттестацией.\n5) Сокращение численности или штата работников.\n6) Ликвидация организации или прекращение деятельности ИП.\nПри сокращении или недостаточной квалификации увольнение допускается, если невозможно перевести работника с его согласия на другую подходящую работу.\nД) По обстоятельствам, не зависящим от воли сторон\nНекоторые основания:\n1) Призыв на срочную военную службу или направление на альтернативную гражданскую службу.\n2) Восстановление прежнего работника по решению суда или государственной инспекции труда.\n3) Признание работника полностью неспособным к трудовой деятельности по медицинскому заключению.\n4) Чрезвычайные обстоятельства, препятствующие продолжению трудовых отношений, признанные решением Правительства РФ или органа государственной власти региона.\n5) Прекращение допуска к государственной тайне, если работа требует такого допуска.\n6) Наказание, исключающее продолжение работы: по вступившему в силу приговору суда либо в виде дисквалификации или иного административного наказания.\n7) Неизбрание на должность.\nВ предусмотренных законом случаях увольнение возможно только при невозможности перевода на другую работу.\nВ день прекращения договора работодатель производит окончательный расчёт и выдаёт трудовую книжку или сведения о трудовой деятельности.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l23","subject":"soc","topic":"Трудовое право","ege":15,"type":"match","max":2,"text":"Установите соответствие между ситуациями и основаниями прекращения трудового договора: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["прогул","призыв работника на военную службу","работник подал заявление об увольнении за две недели","сокращение штата","восстановление на работе прежнего работника по решению суда"],"right":["по инициативе работника","по инициативе работодателя","по обстоятельствам, не зависящим от воли сторон"],"answer":"23123","hint":"Призыв и восстановление прежнего работника не зависят ни от работника, ни от работодателя.","explain":"Работник: В. Работодатель: прогул (А), сокращение штата (Г). Не зависят от воли сторон: призыв (Б), восстановление прежнего работника (Д)."},{"id":"law_l24","subject":"soc","topic":"Трудовое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о прекращении трудового договора и запишите цифры, под которыми они указаны.","options":["По общему правилу работник предупреждает работодателя об увольнении не менее чем за две недели.","Работник вправе отозвать заявление до истечения срока предупреждения, если на его место письменно не приглашён работник, которому нельзя отказать в приёме.","О прекращении срочного договора работодатель по общему правилу предупреждает работника не менее чем за три календарных дня.","Прогулом считается только отсутствие на работе более трёх дней подряд.","Трудовой договор нельзя расторгнуть по соглашению сторон раньше чем через две недели."],"answer":"123","hint":"Что такое прогул по закону? Когда можно расторгнуть договор по соглашению сторон?","explain":"Верны 1, 2, 3. Прогул — отсутствие без уважительных причин весь рабочий день или более четырёх часов подряд (4). По соглашению сторон договор расторгается в любое время (5)."},{"id":"law_l25","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Перечислите по четыре права и четыре обязанности работника и работодателя.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Работник\nПрава:\n— На заключение, изменение и расторжение трудового договора.\n— На предоставление работы, обусловленной трудовым договором.\n— На отдых.\n— На своевременную и полную выплату заработной платы.\nОбязанности:\n— Добросовестно исполнять трудовые обязанности.\n— Бережно относиться к имуществу работодателя.\n— Соблюдать трудовую дисциплину.\n— Выполнять установленные нормы труда.\nРаботодатель\nПрава:\n— Заключать, изменять и расторгать трудовые договоры в установленном законом порядке.\n— Поощрять работников за добросовестный и эффективный труд.\n— Привлекать работников к дисциплинарной и материальной ответственности в установленном порядке.\n— Требовать исполнения трудовых обязанностей и бережного отношения к имуществу.\nОбязанности:\n— Соблюдать трудовое законодательство.\n— Предоставлять работу, обусловленную трудовым договором.\n— Обеспечивать безопасность и надлежащие условия труда.\n— Обеспечивать равную оплату за труд равной ценности.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l26","subject":"soc","topic":"Трудовое право","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и элементами правового статуса работника: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["на отдых","бережно относиться к имуществу работодателя","на своевременную и полную выплату заработной платы","соблюдать трудовую дисциплину","выполнять установленные нормы труда"],"right":["права","обязанности"],"answer":"12122","hint":"Права — то, что работник может требовать; обязанности — то, что он должен делать.","explain":"Права: отдых (А), зарплата (В). Обязанности: беречь имущество (Б), дисциплина (Г), нормы труда (Д)."},{"id":"law_l27","subject":"soc","topic":"Трудовое право","ege":15,"type":"match","max":2,"text":"Установите соответствие между примерами и элементами правового статуса работодателя: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["обеспечивать безопасность и надлежащие условия труда","поощрять работников за добросовестный труд","обеспечивать равную оплату за труд равной ценности","привлекать работников к дисциплинарной ответственности","предоставлять работу, обусловленную трудовым договором"],"right":["права","обязанности"],"answer":"21212","hint":"Поощрять и наказывать — право работодателя; условия труда и оплата — его обязанности.","explain":"Права: поощрять (Б), привлекать к дисциплинарной ответственности (Г). Обязанности: безопасность (А), равная оплата (В), предоставление работы (Д)."},{"id":"law_l28","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Какие три основных дисциплинарных взыскания могут применяться к работнику?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные дисциплинарные взыскания:\n— Замечание.\n— Выговор.\n— Увольнение по соответствующим основаниям.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l29","subject":"soc","topic":"Трудовое право","ege":16,"type":"choice","max":2,"text":"Что из перечисленного относится к дисциплинарным взысканиям по Трудовому кодексу РФ? Запишите цифры, под которыми они указаны.","options":["замечание","штраф","выговор","предупреждение","увольнение по соответствующим основаниям","обязательные работы"],"answer":"135","hint":"Штраф и предупреждение есть в КоАП, обязательные работы — и в КоАП, и в УК.","explain":"Дисциплинарные взыскания: 1, 3, 5. Штраф (2), предупреждение (4) и обязательные работы (6) — меры административной или уголовной ответственности."},{"id":"law_l30","subject":"soc","topic":"Трудовое право","type":"open","card":true,"max":2,"text":"Назовите любые три принципа трудового права. Что такое коллективный договор?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"— Запрет принудительного труда.\n— Запрет дискриминации в сфере труда.\n— Защита от безработицы и содействие в трудоустройстве.\n16. Коллективный договор\nКоллективный договор — правовой акт, регулирующий социально-трудовые отношения в организации или у индивидуального предпринимателя и заключаемый работниками и работодателем в лице их представителей.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_l31","subject":"soc","topic":"Трудовое право","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о принципах трудового права и коллективном договоре и запишите цифры, под которыми они указаны.","options":["Запрет принудительного труда — принцип трудового права.","Запрет дискриминации в сфере труда — принцип трудового права.","Коллективный договор заключают работники и работодатель в лице их представителей.","Коллективный договор регулирует имущественные отношения супругов.","Защита от безработицы не относится к принципам трудового права."],"answer":"123","hint":"Коллективный договор регулирует социально-трудовые отношения в организации.","explain":"Верны 1, 2, 3. Отношения супругов регулирует брачный договор (4). Защита от безработицы и содействие в трудоустройстве — принцип трудового права (5)."},{"id":"law_l32","subject":"soc","topic":"Трудовое право","ege":22,"type":"open","max":4,"text":"Работник Сидоров без уважительных причин отсутствовал на рабочем месте пять часов подряд.\n1) Как называется такое нарушение?\n2) Какой вид юридической ответственности может применить к нему работодатель?\n3) Назовите любые два дисциплинарных взыскания.\n4) Может ли работодатель уволить Сидорова за это нарушение? Объясните.","criteria":[{"id":"K1","max":4,"text":"Правильно даны ответы на четыре вопроса — 4 балла; на 3 — 3 балла; на 2 — 2 балла; на 1 — 1 балл; ответ неверный или общие рассуждения — 0 баллов. Каждый ответ должен опираться на условие задачи."}],"model":"1) Прогул: отсутствие на рабочем месте без уважительных причин более четырёх часов подряд.\n2) Дисциплинарную ответственность.\n3) Замечание, выговор, увольнение по соответствующим основаниям (любые два).\n4) Да: прогул — основание для расторжения трудового договора по инициативе работодателя.","hint":"Сравните продолжительность отсутствия с определением прогула."},{"id":"s12","subject":"soc","topic":"Трудовое право","type":"open","max":3,"text":"Шестнадцатилетний Антон устроился курьером по трудовому договору. Работодатель установил ему испытательный срок три месяца и 40-часовую рабочую неделю, а также предложил выходить в ночные смены с повышенной оплатой.\n\n1) Какие условия, предложенные работодателем, противоречат Трудовому кодексу РФ? Поясните каждое.\n2) Какую особенность ежегодного отпуска Трудовой кодекс устанавливает для работников младше 18 лет?","criteria":[{"id":"K1","max":2,"text":"Названы нарушения с пояснением: работникам младше 18 лет не устанавливается испытательный срок; для работников 16–18 лет рабочее время — не более 35 часов в неделю; работников младше 18 лет нельзя привлекать к работе в ночное время. Три нарушения — 2 балла, два — 1 балл."},{"id":"K2","max":1,"text":"Указано, что работникам младше 18 лет ежегодный отпуск предоставляется продолжительностью 31 календарный день в удобное для них время."}],"model":"1) Испытательный срок лицам младше 18 лет не устанавливается (ст. 70 ТК РФ). Для работников от 16 до 18 лет рабочее время сокращено — не более 35 часов в неделю (ст. 92). Работники младше 18 лет не допускаются к работе в ночное время (ст. 96); исключение сделано только для творческих работников, а Антон — курьер.\n2) Работникам младше 18 лет ежегодный оплачиваемый отпуск предоставляется продолжительностью 31 календарный день в удобное для них время (ст. 267).","hint":"Найдите в условии три детали: «три месяца», «40 часов», «ночные смены». Для несовершеннолетних по каждой есть особое правило."},{"id":"law_p01","subject":"soc","topic":"Гражданский процесс","type":"open","card":true,"max":2,"text":"Что такое гражданское процессуальное право и гражданский процесс?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Гражданское процессуальное право — отрасль российского права, регулирующая порядок рассмотрения и разрешения гражданских дел в суде.\nГражданский процесс (гражданское судопроизводство) — урегулированная законом деятельность суда и других участников процесса по рассмотрению и разрешению гражданских дел.\nК гражданским делам относятся:\nспоры из гражданских правоотношений: о возмещении вреда, взыскании долга, расторжении договоров;\nсемейные споры: о расторжении брака, взыскании алиментов, установлении отцовства;\nтрудовые споры: о восстановлении на работе, взыскании невыплаченной заработной платы.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p02","subject":"soc","topic":"Гражданский процесс","type":"open","card":true,"max":2,"text":"Каковы основные отличия гражданского процесса от уголовного?","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Основные отличия гражданского процесса от уголовного:\nВ гражданском процессе отсутствует предварительное расследование. Дело возбуждается судом на основании заявления. При этом для некоторых споров предусмотрен обязательный досудебный порядок урегулирования.\nВ гражданском процессе не решается вопрос о виновности в совершении преступления и не выносится приговор. В исковом производстве спор разрешается решением суда. При этом вина может иметь значение, например, при решении вопроса о возмещении вреда.\nДля гражданского процесса характерен принцип диспозитивности: стороны самостоятельно распоряжаются своими правами в пределах закона. Суд не возбуждает дело по собственной инициативе; истец вправе отказаться от иска, ответчик — признать иск, стороны — заключить мировое соглашение. В уголовном процессе возможности участников распоряжаться ходом дела значительно ограничены публичными интересами.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p03","subject":"soc","topic":"Гражданский процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о гражданском процессе и запишите цифры, под которыми они указаны.","options":["Гражданский процесс — деятельность суда и других участников по рассмотрению и разрешению гражданских дел.","В гражданском процессе нет предварительного расследования.","По гражданскому делу суд выносит приговор.","Споры о взыскании алиментов рассматриваются в порядке гражданского судопроизводства.","Суд возбуждает гражданское дело по собственной инициативе."],"answer":"124","hint":"Принцип диспозитивности: кто начинает гражданское дело?","explain":"Верны 1, 2, 4. Приговор — акт уголовного процесса, по иску суд выносит решение (3). Дело возбуждается на основании заявления, а не по инициативе суда (5)."},{"id":"law_p04","subject":"soc","topic":"Гражданский процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между характеристиками и видами судопроизводства: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["дело возбуждается судом на основании искового заявления","проводится предварительное расследование","итоговый акт по существу дела — приговор","истец вправе отказаться от иска","стороны могут заключить мировое соглашение"],"right":["гражданский процесс","уголовный процесс"],"answer":"12211","hint":"Диспозитивность — стороны сами распоряжаются своими правами — характерна для гражданского процесса.","explain":"Гражданский процесс: А, Г, Д. Уголовный процесс: Б, В."},{"id":"law_p05","subject":"soc","topic":"Гражданский процесс","type":"open","card":true,"max":2,"text":"Назовите участников гражданского процесса.","criteria":[{"id":"K1","max":2,"text":"Ответ полный и без ошибок: названы все ключевые элементы эталона — 2 балла; названа только часть элементов или есть одна неточность — 1 балл; ответ неверный или только общие слова — 0 баллов."}],"model":"Участники гражданского процесса:\nСуд — рассматривает и разрешает дело, руководит процессом, обеспечивает порядок судебного заседания. Дела рассматриваются судьёй единолично или судом коллегиально в зависимости от инстанции и требований закона.\nПри разрешении иска по существу суд выносит решение: удовлетворяет исковые требования полностью или частично либо отказывает в их удовлетворении.\nСтороны:\n1) Истец — лицо, в защиту прав и законных интересов которого возбуждено гражданское дело.\n2) Ответчик — лицо, к которому предъявлен иск.\nИстцами и ответчиками могут быть граждане и организации.\nТретьи лица — лица, участвующие в деле для защиты своих прав и законных интересов. Они могут заявлять самостоятельные требования относительно предмета спора или не заявлять их.\nНапример, два соседа спорят о границе земельных участков. Если её изменение может затронуть участок третьего соседа, он может участвовать в деле в качестве третьего лица.\nПрокурор — в предусмотренных законом случаях обращается в суд в защиту граждан, неопределённого круга лиц или публичных интересов либо вступает в дело для дачи заключения. Он вправе обжаловать судебные постановления. Обвинителем в гражданском процессе прокурор не является.\nГосударственные органы и органы местного самоуправления — участвуют в предусмотренных законом случаях. Например, органы опеки и попечительства дают заключение в спорах о воспитании детей.\nЛица, содействующие осуществлению правосудия:\n1) Свидетель — лицо, которому могут быть известны сведения, имеющие значение для дела.\n2) Переводчик — осуществляет необходимый участникам процесса перевод.\n3) Специалист — обладает специальными знаниями, даёт консультации и оказывает техническую помощь при совершении процессуальных действий.\n4) Эксперт — обладает специальными знаниями, проводит экспертизу и даёт заключение.\n5) Помощник судьи — помогает судье в подготовке и организации процесса, но не осуществляет правосудие.\n6) Секретарь судебного заседания — ведёт протокол и выполняет другие обязанности по обеспечению заседания.","hint":"Вспомните определение и ключевые признаки, затем перечислите элементы по порядку."},{"id":"law_p06","subject":"soc","topic":"Гражданский процесс","ege":15,"type":"match","max":2,"text":"Установите соответствие между участниками гражданского процесса и их группами: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.","left":["истец","эксперт","секретарь судебного заседания","сосед, чей участок может затронуть решение спора о границе соседних участков","ответчик"],"right":["стороны","третьи лица","лица, содействующие осуществлению правосудия"],"answer":"13321","hint":"Третьи лица участвуют в деле для защиты своих прав, хотя спор не между ними.","explain":"Стороны: истец (А), ответчик (Д). Третье лицо: сосед (Г). Содействуют правосудию: эксперт (Б), секретарь (В)."},{"id":"law_p07","subject":"soc","topic":"Гражданский процесс","ege":14,"type":"choice","max":2,"text":"Выберите верные суждения о участниках гражданского процесса и запишите цифры, под которыми они указаны.","options":["Прокурор в гражданском процессе выступает обвинителем.","Прокурор в предусмотренных законом случаях может обратиться в суд в защиту граждан.","Органы опеки и попечительства дают заключение в спорах о воспитании детей.","Помощник судьи осуществляет правосудие наравне с судьёй.","Истцами и ответчиками могут быть как граждане, так и организации."],"answer":"235","hint":"Обвинителя в гражданском процессе нет. Кто осуществляет правосудие?","explain":"Верны 2, 3, 5. Обвинителем в гражданском процессе прокурор не является (1). Помощник судьи помогает судье, но правосудие не осуществляет (4)."},{"id":"law_p08","subject":"soc","topic":"Гражданский процесс","type":"open",
