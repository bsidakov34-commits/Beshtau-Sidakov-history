<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренажёр ЕГЭ по истории и обществознанию</title>
<meta name="description" content="Задания ЕГЭ по истории и обществознанию: автопроверка тестов, подсказки, самопроверка развёрнутых ответов и работа над ошибками.">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141D" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренажёр ЕГЭ">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22sky%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%0A%3Cstop%20offset%3D%220%22%20stop-color%3D%22%231F357F%22%2F%3E%3Cstop%20offset%3D%220.55%22%20stop-color%3D%22%235B70BE%22%2F%3E%3Cstop%20offset%3D%220.86%22%20stop-color%3D%22%23E8B97E%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%0A%3Crect%20width%3D%22512%22%20height%3D%22512%22%20fill%3D%22url(%23sky)%22%2F%3E%0A%3Ccircle%20cx%3D%22372%22%20cy%3D%22262%22%20r%3D%2240%22%20fill%3D%22%23FFE6B8%22%2F%3E%3Cpath%20d%3D%22M0%20318%20Q70%20286%20128%20300%20Q190%20268%20252%20292%20Q330%20262%20392%20288%20Q452%20270%20512%20290%20L512%20512%20L0%20512Z%22%20fill%3D%22%237C86BF%22%20opacity%3D%220.75%22%2F%3E%3Cpath%20d%3D%22M0%20352%20Q40%20336%2070%20318%20Q96%20300%20118%20304%20Q134%20292%20150%20296%20L186%20238%20Q206%20200%20222%20176%20Q232%20160%20242%20158%20Q252%20160%20262%20178%20L290%20232%20Q300%20244%20312%20236%20Q326%20214%20340%20212%20Q352%20214%20364%20238%20L384%20276%20Q404%20272%20422%20286%20Q446%20296%20470%20316%20Q492%20330%20512%20336%20L512%20512%20L0%20512Z%22%20fill%3D%22%2314203B%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Golos+Text:wght@400;500;600&family=PT+Mono&display=swap">
<style id="app-css">
/* Layout: one workbook column; the ЕГЭ answer-sheet cell row is the signature element */
:root{
  --paper:#EDF0F5; --sheet:#FFFFFF; --ink:#172036; --muted:#566077; --line:#D4DAE4; --line-strong:#9BA5B9; --rule:#DCE3EF;
  --accent:#2B47A3; --accent-soft:#E3E9F8; --on-strong:#FFFFFF;
  --fig-bg:#FFFFFF; --scrim:rgba(9,12,19,.94); --on-scrim:#F2F4F8;
  --hist:#8E3B2C; --hist-soft:#F5E6E2; --soc:#1C6670; --soc-soft:#DDEFF0;
  --ok:#1D7448; --ok-soft:#DFF1E6; --part:#94600C; --part-soft:#F6EAD3; --bad:#AF3535; --bad-soft:#F7E1E1;
  --f-display:"Alegreya","PT Serif",Georgia,serif;
  --f-body:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"PT Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10141D; --sheet:#181E2A; --ink:#E5E9F1; --muted:#9AA3B7; --line:#2A3244; --line-strong:#4A556C; --rule:#232B3B;
  --accent:#93AAF2; --accent-soft:#1F2945; --on-strong:#10141D; --fig-bg:#ECEEF2;
  --hist:#E39582; --hist-soft:#36211D; --soc:#72C3CC; --soc-soft:#16302F;
  --ok:#68C995; --ok-soft:#15291E; --part:#E2AE5B; --part-soft:#30261A; --bad:#EE8A8A; --bad-soft:#371C1F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#10141D; --sheet:#181E2A; --ink:#E5E9F1; --muted:#9AA3B7; --line:#2A3244; --line-strong:#4A556C; --rule:#232B3B;
  --accent:#93AAF2; --accent-soft:#1F2945; --on-strong:#10141D; --fig-bg:#ECEEF2;
  --hist:#E39582; --hist-soft:#36211D; --soc:#72C3CC; --soc-soft:#16302F;
  --ok:#68C995; --ok-soft:#15291E; --part:#E2AE5B; --part-soft:#30261A; --bad:#EE8A8A; --bad-soft:#371C1F;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 56px}
.app{--subj:var(--hist);--subj-soft:var(--hist-soft);max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.app[data-subj="soc"]{--subj:var(--soc);--subj-soft:var(--soc-soft)}
h1,h2,h3{text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;border:1.5px solid var(--ink);padding:7px 6px 6px 8px;line-height:1;border-radius:2px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:-.01em}
.brand p{margin-top:4px;color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:var(--sheet)}
.seg-b{appearance:none;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg-b.on{background:var(--subj);color:var(--on-strong)}

/* tabs */
.tabs-wrap{overflow-x:auto;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);min-width:max-content}
.tab{appearance:none;border:0;background:none;font-size:15px;color:var(--muted);padding:10px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--subj);font-weight:600}
.count{font-family:var(--f-mono);font-size:12px;background:var(--bad-soft);color:var(--bad);padding:1px 7px;border-radius:999px;font-weight:400}

/* topic chips + navigator */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;appearance:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip.on{border-color:var(--subj);color:var(--subj);background:var(--subj-soft);font-weight:500}
.navbox{display:flex;flex-direction:column;gap:10px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.nav{width:40px;height:40px;font-family:var(--f-mono);font-size:15px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);border-radius:3px;cursor:pointer;font-variant-numeric:tabular-nums}
.nav.s-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.nav.s-part{background:var(--part-soft);border-color:var(--part);color:var(--part)}
.nav.s-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.nav.cur{outline:2px solid var(--subj);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border:1px solid var(--line-strong);border-radius:2px;background:var(--sheet)}
.legend i.ok{background:var(--ok-soft);border-color:var(--ok)}
.legend i.part{background:var(--part-soft);border-color:var(--part)}
.legend i.bad{background:var(--bad-soft);border-color:var(--bad)}

/* task card */
.task{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}
.task-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.task-no{font-family:var(--f-mono);font-size:14px;border:1.5px solid var(--subj);color:var(--subj);padding:3px 7px 2px;border-radius:2px;white-space:nowrap}
.tag{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tag-topic{letter-spacing:0;text-transform:none;font-size:13px;color:var(--subj)}
.task-pts{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prompt{display:flex;flex-direction:column;gap:10px;font-size:17px;line-height:1.55;max-width:65ch}
.src{margin:0;padding:14px 16px;border-left:3px solid var(--subj);background:var(--paper);font-family:var(--f-display);font-size:17px;line-height:1.6;display:flex;flex-direction:column;gap:8px;border-radius:0 4px 4px 0}
.src-l{font-family:var(--f-body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.how{font-size:14px;color:var(--muted)}

.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;font-size:16px;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--line-strong)}
.opt:disabled{cursor:default}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt-d{flex:none;width:26px;height:26px;display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;border:1px solid var(--line-strong);border-radius:2px;background:var(--sheet)}
.opt.on .opt-d{background:var(--accent);color:var(--on-strong);border-color:var(--accent)}
.opt-t{flex:1;min-width:0;padding-top:1px}
.pos{flex:none;align-self:center;font-family:var(--f-mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px}

.match{display:flex;flex-direction:column;gap:14px}
.right{list-style:none;margin:0;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:4px}
.right li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.right li .opt-d{width:24px;height:24px;font-size:13px}
.col-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mrow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.mleft{display:flex;gap:10px;align-items:flex-start}
.mlet{font-family:var(--f-mono);font-weight:700;width:24px;flex:none;text-align:center;color:var(--subj)}
.mpick{display:flex;flex-wrap:wrap;gap:6px;padding-left:34px}
.pick{width:38px;height:38px;font-family:var(--f-mono);font-size:15px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);border-radius:3px;cursor:pointer}
.pick.on{background:var(--accent);border-color:var(--accent);color:var(--on-strong)}
.pick:disabled{cursor:default;opacity:.55}
.pick.on:disabled{opacity:1}

/* answer-sheet cells */
.answer{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px}
.answer-l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:12px}
.sheet{display:flex;flex-direction:column;width:max-content}
.sheet-r{display:flex}
.sheet .lh{width:34px;font-family:var(--f-mono);font-size:13px;text-align:center;color:var(--muted);padding-bottom:3px}
.c{width:34px;height:42px;display:grid;place-items:center;font-family:var(--f-mono);font-size:20px;border:1px solid var(--line-strong);border-left-width:0;background:var(--sheet);color:var(--ink)}
.c:first-child{border-left-width:1px}
.c.f{color:var(--accent)}
.sheet.key .c.f{color:var(--ok)}
.sheet.mine .c.f{color:var(--muted)}
.sheet-wrap{overflow-x:auto;max-width:100%}
.term{font-family:var(--f-mono);font-size:20px;letter-spacing:.06em;padding:8px 12px;border:1px solid var(--line-strong);border-radius:3px;background:var(--sheet);color:var(--ink);width:100%;max-width:380px;min-height:46px}
.essay{width:100%;min-height:210px;font:inherit;font-size:16px;line-height:26px;padding:6px 14px;border:1px solid var(--line-strong);border-radius:4px;color:var(--ink);resize:vertical;
  background-color:var(--sheet);background-image:repeating-linear-gradient(to bottom,transparent 0 25px,var(--rule) 25px 26px);background-position:0 6px;background-attachment:local}
.lbl{font-size:14px;font-weight:500;margin-bottom:-8px}
.meta{font-size:13px;color:var(--muted);margin-top:-8px;font-variant-numeric:tabular-nums}

/* buttons */
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{appearance:none;font-size:15px;font-weight:500;padding:9px 16px;border-radius:4px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);cursor:pointer;min-height:42px;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-strong)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--line)}
.btn.small{font-size:13px;padding:5px 10px;min-height:32px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* feedback */
.hint{background:var(--accent-soft);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.hint .label{color:var(--accent)}
.fb{border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line-strong);background:var(--paper)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.part{background:var(--part-soft);border-color:var(--part)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb-h{font-weight:600;font-size:17px}
.fb.ok .fb-h{color:var(--ok)}
.fb.part .fb-h{color:var(--part)}
.fb.bad .fb-h{color:var(--bad)}
.keys{display:flex;flex-wrap:wrap;gap:12px 24px}
.ai-out{border-top:1px dashed var(--line-strong);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ai-text{white-space:pre-wrap}
.busy{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--bad);font-size:15px}
.note{font-size:14px;color:var(--muted)}
.ok-msg{color:var(--ok);font-size:14px;font-weight:500}

.review{border-top:1px dashed var(--line-strong);padding-top:16px;display:flex;flex-direction:column;gap:4px}
.review-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.review-h span{font-weight:600}
.review-h b{font-family:var(--f-mono);font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}
.crit{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.crit-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.crit-id{font-family:var(--f-mono);font-weight:700}
.crit-s{font-family:var(--f-mono);font-size:14px;padding:1px 9px;border-radius:999px;white-space:nowrap}
.crit-s.s-ok{background:var(--ok-soft);color:var(--ok)}
.crit-s.s-part{background:var(--part-soft);color:var(--part)}
.crit-s.s-bad{background:var(--bad-soft);color:var(--bad)}
.crit-s.s-none{color:var(--muted)}
.crit-t{color:var(--muted);font-size:14px}
.review > .hint,.review > .model,.review > .row,.review > .note{margin-top:10px}
.model{background:var(--paper);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.model .txt{display:flex;flex-direction:column;gap:8px}

/* lists */
.lead{color:var(--muted);max-width:65ch}
.elist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.erow{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.erow:hover{border-color:var(--line-strong)}
.erow-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.erow-t{font-size:13px;color:var(--muted)}
.erow-x{font-size:15px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.erow-s{font-family:var(--f-mono);font-size:14px;color:var(--bad);white-space:nowrap}
.empty{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:24px 20px;display:flex;flex-direction:column;gap:8px}
.empty h2{font-family:var(--f-display);font-size:24px;margin:0}

/* progress */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{background:var(--sheet);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.tp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.tp-n{font-size:15px}
.tp-v{font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{grid-column:1/-1;height:8px;background:var(--paper);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:999px}
.bar i.ok{background:var(--ok)} .bar i.part{background:var(--part)} .bar i.bad{background:var(--bad)}
.advice{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.advice li{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.advice li p{flex:1 1 260px;min-width:0}
.box{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500}
.field small{color:var(--muted);font-size:13px}
.field input,.field textarea,.field select{font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:4px;background:var(--sheet);color:var(--ink);width:100%;min-width:0}
.field textarea{resize:vertical;line-height:1.45}
.report{font-family:var(--f-mono);font-size:13px;line-height:1.5;min-height:180px}
.fields2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

/* teacher */
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow .erow-m{flex:1 1 220px}
.trow-a{display:flex;gap:6px;flex-wrap:wrap}
.dirty{background:var(--part-soft);border:1px solid var(--part);border-radius:4px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dirty p{flex:1 1 220px}
.tform{display:flex;flex-direction:column;gap:14px}
.sub-h{font-family:var(--f-display);font-size:20px;font-weight:700;margin:6px 0 0}

@media (max-width:480px){
  .task{padding:16px}
  .tab{font-size:14px;padding:10px 9px}
  .brand h1{font-size:26px}
  .stat b{font-size:19px}
  .prompt,.src{font-size:16px}
}
/* figures: maps, schemes, illustrations sit on a paper-white plate in both themes */
.figs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.figs.one{grid-template-columns:minmax(0,1fr)}
.fig{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.fig-n{font-family:var(--f-mono);font-size:14px;color:var(--subj)}
.fig-b{appearance:none;display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--fig-bg);cursor:zoom-in}
.fig-b img{display:block;width:100%;height:auto;max-height:440px;object-fit:contain}
.fig-cap{font-size:13px;color:var(--muted);margin-top:-8px}
.zoom{position:fixed;inset:0;z-index:50;background:var(--scrim);color:var(--on-scrim);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.zoom-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;font-size:14px}
.zoom-x{appearance:none;border:1px solid currentColor;background:transparent;color:inherit;border-radius:4px;padding:7px 14px;font:inherit;cursor:pointer}
.zoom-s{flex:1;min-height:0;overflow:auto;display:flex;padding:0 16px 16px}
.zoom-s img{margin:auto;max-width:100%;max-height:100%;background:var(--fig-bg);cursor:zoom-in}
.zoom.big .zoom-s img{margin:0;max-width:none;max-height:none;width:200%;height:auto;cursor:zoom-out}
.flabel{font-size:14px;font-weight:500}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.thumb img,.thumb-add img{display:block;width:120px;height:90px;object-fit:contain;background:var(--fig-bg);border:1px solid var(--line);border-radius:4px}
.thumb-add{appearance:none;padding:0;border:0;background:transparent;cursor:pointer;border-radius:4px}
.thumb-add:hover img{border-color:var(--accent)}
label.btn{display:inline-flex;align-items:center}
.tag-ege{font-family:var(--f-mono);letter-spacing:0;text-transform:none;color:var(--ink);border:1px solid var(--line-strong);border-radius:2px;padding:1px 6px}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;width:100%;min-width:440px;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line-strong);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{font-weight:600;font-size:13px;color:var(--muted);background:var(--paper)}
.tbl td.blank{background:var(--accent-soft);white-space:nowrap}
.tbl .tv{font-family:var(--f-mono);font-size:17px;color:var(--accent);margin-left:8px}
.vh,.field input.vh{position:absolute;width:1px;height:1px;padding:0;border:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.field{position:relative}
@media (prefers-reduced-motion: reduce){.spin{animation:none}*{scroll-behavior:auto!important}}
</style>

<script type="application/json" id="bank">{"version":1,"tasks":[{"id":"h4","subject":"hist","topic":"Хронология","type":"match","max":2,"text":"Установите соответствие между событиями и годами: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["Полтавская битва","Учреждение Сената","Куликовская битва","Принятие Судебника Ивана III"],"right":["1380 г.","1497 г.","1550 г.","1709 г.","1711 г.","1725 г."],"answer":"4512","hint":"Два события из правления Петра I идут почти подряд: сначала победа над шведами, через два года — новый высший орган власти.","explain":"Полтавская битва — 1709 г., Сенат учреждён в 1711 г., Куликовская битва — 1380 г., Судебник Ивана III — 1497 г. 1550 г. — год Судебника Ивана IV, его легко перепутать с Судебником 1497 г.","ege":1},{"id":"h1b","subject":"hist","topic":"Хронология","ege":1,"type":"match","max":2,"text":"Установите соответствие между событиями и годами: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["Курская битва","Ялтинская (Крымская) конференция","операция «Багратион»","начало битвы за Москву"],"right":["1939 г.","1941 г.","1943 г.","1944 г.","1945 г.","1947 г."],"answer":"3542","hint":"Коренной перелом в войне — 1942–1943 гг. Освобождение Белоруссии — лето следующего года. Конференция в Ялте прошла в последние месяцы войны.","explain":"Курская битва — июль–август 1943 г.; Ялтинская (Крымская) конференция — февраль 1945 г.; операция «Багратион» по освобождению Белоруссии — июнь–август 1944 г.; битва за Москву началась 30 сентября 1941 г."},{"id":"h1","subject":"hist","topic":"Хронология","type":"order","max":1,"text":"Расположите в хронологической последовательности исторические события. Запишите цифры, которыми обозначены события, в правильной последовательности.","options":["Ледовое побоище","Стояние на реке Угре","Крещение Руси"],"answer":"312","hint":"Вспомните, с какими правителями связаны события: Владимир Святославич, Александр Невский, Иван III. В каком порядке они правили?","explain":"Крещение Руси — 988 г. (князь Владимир), Ледовое побоище — 1242 г. (Александр Невский), стояние на реке Угре — 1480 г. (Иван III, конец ордынского ига). Порядок: 3, 1, 2.","ege":2},{"id":"h2","subject":"hist","topic":"Хронология","type":"order","max":1,"text":"Расположите в хронологической последовательности исторические события. Запишите цифры, которыми обозначены события, в правильной последовательности.","options":["Отмена крепостного права","Восстание декабристов","Начало работы I Государственной думы"],"answer":"213","hint":"Сопоставьте события с правлениями: Николай I, Александр II, Николай II.","explain":"Восстание декабристов — 1825 г., отмена крепостного права — 1861 г., I Государственная дума начала работу в 1906 г. Порядок: 2, 1, 3.","ege":2},{"id":"h3","subject":"hist","topic":"Хронология","type":"order","max":1,"text":"Расположите в хронологической последовательности исторические события. Запишите цифры, которыми обозначены события, в правильной последовательности.","options":["Начало Сталинградской битвы","Принятие плана ГОЭЛРО","Полёт Ю. А. Гагарина в космос"],"answer":"213","hint":"Гражданская война, Великая Отечественная, «оттепель» — какой период идёт за каким?","explain":"План ГОЭЛРО принят в 1920 г., Сталинградская битва началась в июле 1942 г., полёт Гагарина — 12 апреля 1961 г. Порядок: 2, 1, 3.","ege":2},{"id":"h3a","subject":"hist","topic":"Факты и деятели","ege":3,"type":"match","max":2,"text":"Установите соответствие между процессами (явлениями, событиями) и фактами, относящимися к этим процессам (явлениям, событиям): к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["реформы государственного управления Петра I","Северная война","внутренняя политика Елизаветы Петровны","политика «просвещённого абсолютизма» Екатерины II"],"right":["учреждение коллегий","созыв Уложенной комиссии","основание Московского университета","Гангутское сражение","создание Верховного тайного совета","издание Манифеста о вольности дворянства"],"answer":"1432","hint":"Два факта лишние. Верховный тайный совет появился уже после смерти Петра I, а Манифест о вольности дворянства издал Пётр III.","explain":"Коллегии учреждены в 1717–1721 гг.; Гангутское сражение (1714 г.) — первая крупная победа русского флота в Северной войне; Московский университет основан в 1755 г. при Елизавете Петровне; Уложенная комиссия созвана Екатериной II в 1767 г. Верховный тайный совет создан в 1726 г. при Екатерине I, Манифест о вольности дворянства издан Петром III в 1762 г."},{"id":"h4t","subject":"hist","topic":"Факты и деятели","ege":4,"type":"table","max":3,"text":"Заполните пустые ячейки таблицы, используя представленные в приведённом ниже списке данные. Для каждой ячейки, обозначенной буквой, выберите номер нужного элемента.","head":["Географический объект","Событие (явление, процесс)","Время, когда произошло событие"],"rows":[["Полтава","_","1709 г."],["_","Ледовое побоище","_"],["река Угра","_","1480 г."],["_","_","1552 г."]],"right":["Чудское озеро","взятие Казани войсками Ивана IV","генеральное сражение Северной войны","1242 г.","Казань","стояние войск, завершившее зависимость Руси от Орды","1240 г.","Астрахань","морское сражение у мыса Гангут"],"answer":"314652","hint":"Начните с того, в чём уверены, например с года Ледового побоища. 1240 г. — год Невской битвы, а Астрахань присоединили в 1556 г.","explain":"Полтавская битва 1709 г. — генеральное сражение Северной войны; Ледовое побоище произошло на Чудском озере в 1242 г.; стояние на реке Угре в 1480 г. завершило зависимость Руси от Орды; в 1552 г. войска Ивана IV взяли Казань. По правилам ЕГЭ за задание 3 балла: одна ошибка — 2 балла, две или три ошибки — 1 балл."},{"id":"h5n","subject":"hist","topic":"Факты и деятели","ege":5,"type":"match","max":2,"text":"Установите соответствие между событиями (процессами) и их участниками: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["денежная реформа, введение золотого рубля","аграрная реформа: выход крестьян из общины на хутора и отруба","подготовка плана преобразования государственного управления (1809 г.)","отмена условий Парижского мира о нейтрализации Чёрного моря"],"right":["А. М. Горчаков","С. Ю. Витте","Д. А. Милютин","П. А. Столыпин","М. М. Сперанский","Е. Ф. Канкрин"],"answer":"2451","hint":"Золотой рубль ввели в конце XIX в. — кто тогда был министром финансов? Е. Ф. Канкрин проводил денежную реформу раньше, при Николае I, и рубль у него был серебряный.","explain":"Денежная реформа 1897 г. — С. Ю. Витте; аграрная реформа с 1906 г. — П. А. Столыпин; план преобразований 1809 г. («Введение к уложению государственных законов») — М. М. Сперанский; отказ от нейтрализации Чёрного моря (1870 г.) — министр иностранных дел А. М. Горчаков. Д. А. Милютин проводил военные реформы 1860–1870-х гг., Е. Ф. Канкрин — денежную реформу 1839–1843 гг."},{"id":"h6a","subject":"hist","topic":"Источники","ege":6,"type":"choice","max":2,"text":"Прочитайте отрывок из исторического источника и выберите в приведённом списке верные суждения. Запишите цифры, под которыми они указаны.","source":"«На обязанность правительства возлагаем Мы выполнение непреклонной Нашей воли:\n1. Даровать населению незыблемые основы гражданской свободы на началах действительной неприкосновенности личности, свободы совести, слова, собраний и союзов.\n2. Не останавливая предназначенных выборов в Государственную думу, привлечь теперь же к участию в Думе \u003c…> те классы населения, которые ныне совсем лишены избирательных прав \u003c…>.\n3. Установить, как незыблемое правило, чтобы никакой закон не мог восприять силу без одобрения Государственной думы и чтобы выборным от народа обеспечена была возможность действительного участия в надзоре за закономерностью действий поставленных от Нас властей».","options":["Документ был издан в период Первой российской революции.","Документ был издан императором Александром III.","В документе провозглашалось, что ни один закон не может вступить в силу без одобрения Государственной думы.","Документом был учреждён Правительствующий сенат.","Вскоре после издания документа в России была провозглашена республика.","Документ был издан в период Первой мировой войны."],"answer":"13","hint":"Определите год документа: выборы в Государственную думу уже назначены, населению обещаны гражданские свободы.","explain":"Это Манифест 17 октября 1905 г. Николая II, изданный в разгар Первой российской революции (1905–1907 гг.). В нём закреплено, что закон не вступает в силу без одобрения Думы. Сенат учреждён Петром I в 1711 г., республика провозглашена в 1917 г., Первая мировая война началась в 1914 г. По правилам ЕГЭ: одна неверная, лишняя или пропущенная цифра — 1 балл."},{"id":"h10","subject":"hist","topic":"Культура","type":"match","max":2,"text":"Установите соответствие между памятниками культуры и их авторами: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["икона «Троица»","памятник Петру I «Медный всадник»","храм Христа Спасителя в Москве","картина «Явление Христа народу»"],"right":["Феофан Грек","К. А. Тон","А. А. Иванов","Андрей Рублёв","В. В. Растрелли","Э. Фальконе"],"answer":"4623","hint":"Феофан Грек и Андрей Рублёв — иконописцы рубежа XIV–XV вв. Растрелли строил дворцы при Елизавете Петровне.","explain":"«Троица» — Андрей Рублёв (начало XV в.), «Медный всадник» — Этьен Фальконе (открыт в 1782 г.), храм Христа Спасителя — Константин Тон, «Явление Христа народу» — Александр Иванов, который работал над картиной около двадцати лет.","ege":7},{"id":"h13a","subject":"hist","topic":"Источники","ege":13,"type":"open","max":2,"text":"Прочитайте отрывок из исторического источника и кратко ответьте на вопрос.\n\nУкажите год, когда был издан документ, и императора, от имени которого он был издан. Назовите революцию, в ходе которой был издан документ.","source":"«На обязанность правительства возлагаем Мы выполнение непреклонной Нашей воли:\n1. Даровать населению незыблемые основы гражданской свободы на началах действительной неприкосновенности личности, свободы совести, слова, собраний и союзов.\n2. Не останавливая предназначенных выборов в Государственную думу, привлечь теперь же к участию в Думе \u003c…> те классы населения, которые ныне совсем лишены избирательных прав \u003c…>.\n3. Установить, как незыблемое правило, чтобы никакой закон не мог восприять силу без одобрения Государственной думы и чтобы выборным от народа обеспечена была возможность действительного участия в надзоре за закономерностью действий поставленных от Нас властей».","criteria":[{"id":"K1","max":2,"text":"Правильно указаны три элемента (год, император, революция) — 2 балла; два элемента — 1 балл; один элемент или ответ неправильный — 0 баллов."}],"model":"1905 г.; Николай II; Первая российская революция (революция 1905–1907 гг.).","hint":"Выборы в Государственную думу уже назначены, но законодательных прав у неё ещё нет. Какой это год?"},{"id":"h14a","subject":"hist","topic":"Источники","ege":14,"type":"open","max":2,"text":"Используя отрывок из документа, ответьте на вопросы.\n1) Какие гражданские свободы даровались населению? Укажите любые две.\n2) Какое изменение в порядке выборов в Государственную думу предусматривал документ?\n3) Какое правило принятия законов устанавливал документ?","source":"«На обязанность правительства возлагаем Мы выполнение непреклонной Нашей воли:\n1. Даровать населению незыблемые основы гражданской свободы на началах действительной неприкосновенности личности, свободы совести, слова, собраний и союзов.\n2. Не останавливая предназначенных выборов в Государственную думу, привлечь теперь же к участию в Думе \u003c…> те классы населения, которые ныне совсем лишены избирательных прав \u003c…>.\n3. Установить, как незыблемое правило, чтобы никакой закон не мог восприять силу без одобрения Государственной думы и чтобы выборным от народа обеспечена была возможность действительного участия в надзоре за закономерностью действий поставленных от Нас властей».","criteria":[{"id":"K1","max":2,"text":"Правильно даны ответы на три вопроса — 2 балла; на два вопроса — 1 балл; на один вопрос или ответ неправильный — 0 баллов. Ответы могут быть приведены в виде цитат или своими словами."}],"model":"1) Неприкосновенность личности, свобода совести, слова, собраний и союзов (любые две).\n2) К участию в выборах в Думу привлекались те классы населения, которые прежде были лишены избирательных прав.\n3) Никакой закон не может вступить в силу без одобрения Государственной думы.","hint":"Ответы есть в самом тексте: посмотрите пункты 1, 2 и 3 документа."},{"id":"h15a","subject":"hist","topic":"Источники","ege":15,"type":"open","max":2,"text":"В том же году, когда был издан документ, завершилась война России с Японией. Назовите город в США, где был подписан мирный договор, и президента США, выступившего посредником на мирных переговорах.","source":"«На обязанность правительства возлагаем Мы выполнение непреклонной Нашей воли:\n1. Даровать населению незыблемые основы гражданской свободы на началах действительной неприкосновенности личности, свободы совести, слова, собраний и союзов.\n2. Не останавливая предназначенных выборов в Государственную думу, привлечь теперь же к участию в Думе \u003c…> те классы населения, которые ныне совсем лишены избирательных прав \u003c…>.\n3. Установить, как незыблемое правило, чтобы никакой закон не мог восприять силу без одобрения Государственной думы и чтобы выборным от народа обеспечена была возможность действительного участия в надзоре за закономерностью действий поставленных от Нас властей».","criteria":[{"id":"K1","max":2,"text":"Правильно названы город и президент — 2 балла; правильно назван один элемент — 1 балл; ответ неправильный — 0 баллов."}],"model":"Портсмут; Теодор Рузвельт.","hint":"Переговоры шли в городе на атлантическом побережье США. Посредник вскоре получил за это Нобелевскую премию мира."},{"id":"h19a","subject":"hist","topic":"Причины и понятия","ege":19,"type":"open","max":3,"text":"Для крестьянской реформы 1861 г. укажите:\nа) одну причину, связанную с развитием экономики России;\nб) одно последствие реформы для правового положения крестьян;\nв) одно последствие, связанное с получением крестьянами земли.","criteria":[{"id":"K1","max":3,"text":"Правильно указаны три элемента (а, б, в) — 3 балла; два элемента — 2 балла; один элемент — 1 балл; ответ неправильный или рассуждения общего характера — 0 баллов."}],"model":"а) Крепостное право сдерживало развитие промышленности: не хватало вольнонаёмной рабочей силы, внутренний рынок оставался узким.\nб) Крестьяне получили личную свободу и общегражданские права: могли заключать сделки, владеть имуществом, заниматься торговлей и промыслами.\nв) Землю крестьяне получали за выкуп: до перехода на выкуп они оставались временнообязанными, затем десятилетиями выплачивали выкупные платежи; часть земли отошла помещикам (отрезки).","hint":"Каждый пункт отвечает на свой вопрос. Общие слова вроде «Россия отставала» не засчитываются — нужна конкретика: что именно мешало развитию и что именно изменилось для крестьян."},{"id":"h20a","subject":"hist","topic":"Причины и понятия","ege":20,"type":"open","max":2,"text":"Используя знание исторического понятия «заповедные лета», объясните его смысл и укажите, какое право крестьян, закреплённое Судебником 1497 г., временно отменялось в заповедные лета. Дайте только один ответ на каждый вопрос.","criteria":[{"id":"K1","max":2,"text":"Правильно даны два ответа — 2 балла; один ответ — 1 балл; ответ неправильный — 0 баллов. Если на вопрос дано несколько ответов, оценивается только первый."}],"model":"1) Заповедные лета — годы, в которые временно запрещался переход крестьян от одного землевладельца к другому (введены в начале 1580-х гг.).\n2) Отменялось право перехода в Юрьев день — за неделю до и неделю после 26 ноября — с уплатой «пожилого».","hint":"Слово «заповедь» здесь значит «запрет». Что именно запрещалось крестьянам и в какой день по Судебнику это право действовало?"},{"id":"h20b","subject":"hist","topic":"Причины и понятия","ege":20,"type":"open","max":2,"text":"Используя знание исторического понятия «продразвёрстка», объясните, как её применение было связано с крестьянскими восстаниями 1920–1921 гг., и укажите, чем её заменили в 1921 г. Дайте только один ответ на каждый вопрос.","criteria":[{"id":"K1","max":2,"text":"Правильно даны два ответа — 2 балла; один ответ — 1 балл; ответ неправильный — 0 баллов. Если на вопрос дано несколько ответов, оценивается только первый."}],"model":"1) Продразвёрстка обязывала крестьян сдавать государству по твёрдым ценам все «излишки» хлеба, а на деле изымалось и необходимое для жизни и посева. Это вызвало массовое недовольство и восстания крестьян (например, в Тамбовской губернии, в Западной Сибири).\n2) В 1921 г. по решению X съезда РКП(б) продразвёрстку заменили продовольственным налогом (продналогом); это стало началом нэпа.","hint":"Подумайте, что оставалось у крестьянина после прихода продотряда. Решение о замене принял X съезд партии."},{"id":"h21a","subject":"hist","topic":"Сравнение и аргументация","ege":21,"type":"open","max":3,"text":"Сравните внешнюю политику России во второй половине XVIII в. (правление Екатерины II) и в первой четверти XIX в. (правление Александра I). Сформулируйте один тезис о сходстве и приведите два обоснования этого тезиса с опорой на исторические факты. В каждом обосновании приведите факты по обоим периодам.","criteria":[{"id":"K1","max":3,"text":"Сформулирован верный тезис о сходстве и приведены два корректных обоснования с фактами — 3 балла. Тезис и одно корректное обоснование или два обоснования с неточностями, не искажающими смысла, — 2 балла. Тезис без корректных обоснований — 1 балл. Тезис неверный или не сформулирован — 0 баллов. Общие рассуждения («одержано много побед») фактами не считаются; оценивается только первый тезис."}],"model":"Тезис: в оба периода Россия вела успешные войны и расширяла свою территорию.\nОбоснование 1: при Екатерине II к России был присоединён Крым (1783 г.); при Александре I по Бухарестскому миру 1812 г. к России отошла Бессарабия.\nОбоснование 2: при Екатерине II Россия участвовала в разделах Речи Посполитой (1772, 1793, 1795 гг.); при Александре I по решению Венского конгресса (1815 г.) к России отошла большая часть Варшавского герцогства (Царство Польское).","hint":"Тезис — одно предложение о том, что было общим. Обоснование — конкретные факты из каждого периода: война, договор, год, территория."},{"id":"h22a","subject":"hist","topic":"Сравнение и аргументация","ege":22,"type":"open","max":2,"text":"Существует точка зрения, что преобразования Петра I превратили Россию в великую европейскую державу. Используя исторические знания, приведите два аргумента, которыми можно подтвердить эту точку зрения. При изложении аргументов обязательно используйте исторические факты. Факты, приведённые во втором аргументе, не должны повторять факты первого.","criteria":[{"id":"K1","max":2,"text":"Приведены два аргумента — 2 балла; один аргумент — 1 балл; аргументы не приведены, рассуждения общего характера или ответ неправильный — 0 баллов. Аргумент засчитывается, если в нём есть конкретный исторический факт и объяснение его связи с точкой зрения."}],"model":"1) Пётр I создал регулярную армию на основе рекрутской повинности и военно-морской флот. Это позволило победить Швецию в Северной войне: по Ништадтскому миру 1721 г. Россия получила выход к Балтийскому морю и стала сильнейшей державой Северной Европы.\n2) В 1721 г. Россия была провозглашена империей, а Пётр I принял титул императора. Европейские государства постепенно признали этот титул, что закрепило новый статус России среди великих держав.","hint":"Аргумент = факт + связка. Назовите конкретную реформу, войну или договор и объясните, почему это сделало Россию великой державой."},{"id":"s1","subject":"soc","topic":"Человек и общество","type":"choice","max":2,"text":"Выберите верные суждения о человеке и его деятельности и запишите цифры, под которыми они указаны.","options":["Человек — биосоциальное существо.","Все потребности человека имеют исключительно биологическую природу.","Мотив — это то, что побуждает человека к деятельности, ради чего она совершается.","Деятельность человека, в отличие от поведения животных, предполагает осознанную постановку цели.","Индивидуальность — это принадлежность человека к биологическому виду Homo sapiens."],"answer":"134","hint":"Сравните три понятия: индивид, индивидуальность, личность. И вспомните, какие бывают потребности: биологические, социальные, духовные.","explain":"Верны 1, 3 и 4. Суждение 2 неверно: кроме биологических есть социальные и духовные потребности. Суждение 5 описывает индивида, а индивидуальность — это неповторимое своеобразие человека."},{"id":"s2","subject":"soc","topic":"Человек и общество","type":"text","max":1,"text":"Запишите термин: процесс усвоения индивидом образцов поведения, социальных норм и ценностей, необходимых для успешной жизни в обществе.","answer":["социализация"],"hint":"Этот процесс начинается в семье и продолжается всю жизнь.","explain":"Социализация. Её агенты — семья, школа, сверстники, СМИ и другие; различают первичную и вторичную социализацию."},{"id":"s3","subject":"soc","topic":"Экономика","type":"choice","max":2,"text":"Выберите верные суждения о рыночной экономике и запишите цифры, под которыми они указаны.","options":["Цены на большинство товаров устанавливает государство.","Основу рыночной экономики составляет частная собственность.","Конкуренция побуждает производителей снижать издержки и повышать качество.","Рыночная экономика не нуждается ни в каком государственном регулировании.","Спрос и предложение согласуют действия покупателей и продавцов."],"answer":"235","hint":"Ищите признаки, которые отличают рынок от командной экономики. Слова «все», «ни в каком» часто сигнализируют о неверном суждении.","explain":"Верны 2, 3 и 5. Цены в рыночной экономике складываются под влиянием спроса и предложения, а не назначаются государством. Совсем без государства рынок не работает: оно защищает собственность и конкуренцию, производит общественные блага."},{"id":"s4","subject":"soc","topic":"Экономика","type":"text","max":1,"text":"Запишите термин: ценная бумага, которая даёт владельцу право на часть прибыли акционерного общества в виде дивидендов и на участие в управлении им.","answer":["акция"],"hint":"Не путайте с облигацией: облигация — долговая бумага, она не даёт права на управление.","explain":"Акция — долевая ценная бумага. Облигация, в отличие от неё, подтверждает, что владелец дал деньги в долг, и права голоса не даёт."},{"id":"s5","subject":"soc","topic":"Экономика","type":"choice","max":2,"text":"Какие из перечисленных факторов могут вызвать увеличение спроса на велосипеды (сдвиг кривой спроса вправо)? Запишите цифры, под которыми они указаны.","options":["рост доходов населения","снижение цены на велосипеды","строительство в городе сети велодорожек","рост цен на сталь и алюминий","удешевление проката велосипедов","мода на здоровый образ жизни"],"answer":"136","hint":"Изменение цены самого товара не сдвигает кривую спроса — оно меняет величину спроса. А цены на сырьё влияют на предложение.","explain":"Верны 1, 3 и 6: рост доходов, удобная инфраструктура и мода повышают спрос при любой цене. Снижение цены велосипедов меняет лишь величину спроса (движение по кривой). Подорожание металла сокращает предложение. Дешёвый прокат — товар-заменитель, он уменьшает спрос на покупку велосипедов."},{"id":"s13","subject":"soc","topic":"Экономика","type":"choice","max":2,"text":"На графике отражено изменение ситуации на рынке легковых автомобилей: линия предложения переместилась из положения S в положение S1 (P — цена товара, Q — количество товара). Какие из перечисленных факторов могли вызвать такое изменение? Запишите цифры, под которыми они указаны.","images":["g_supply"],"options":["снижение налогов на производителей автомобилей","рост доходов населения","внедрение технологий, снижающих издержки производства","подорожание стали и комплектующих","выход на рынок новых производителей","подорожание бензина"],"answer":"135","hint":"Линия сдвинулась вправо: при любой цене продавцы теперь готовы продать больше. Ищите то, что удешевляет производство или увеличивает число продавцов. Доходы покупателей и цены на бензин влияют на спрос, а не на предложение.","explain":"Сдвиг линии предложения вправо означает рост предложения. Его могли вызвать снижение налогов на производителей (1), технологии, снижающие издержки (3), и приход на рынок новых производителей (5). Рост доходов населения (2) и подорожание бензина (6) меняют спрос на автомобили. Подорожание стали и комплектующих (4) повышает издержки и сдвигает предложение влево."},{"id":"s6","subject":"soc","topic":"Социальные отношения","type":"choice","max":2,"text":"Выберите примеры вертикальной социальной мобильности и запишите цифры, под которыми они указаны.","options":["рабочий получил высшее образование и стал инженером","семья переехала из Твери в Рязань","учитель перешёл в другую школу на ту же должность","спортсмен сменил вид спорта","менеджер получил должность начальника отдела","директор предприятия обанкротился и стал безработным"],"answer":"156","hint":"Вертикальная мобильность — изменение статуса вверх или вниз. Если статус остался прежним, мобильность горизонтальная.","explain":"Вертикальная мобильность — 1 и 5 (восходящая) и 6 (нисходящая). Переезд, переход в другую школу на ту же должность и смена вида спорта не меняют статус — это горизонтальная мобильность."},{"id":"s7","subject":"soc","topic":"Политика","type":"match","max":2,"text":"Установите соответствие между понятиями и элементами формы государства: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["республика","федерация","демократический режим","монархия","унитарное государство"],"right":["форма правления","форма государственного (территориального) устройства","политический режим"],"answer":"12312","hint":"Форма правления отвечает на вопрос, кто и как получает высшую власть; устройство — как организована территория; режим — какими методами осуществляется власть.","explain":"Республика и монархия — формы правления; федерация и унитарное государство — формы государственного устройства; демократия — политический режим."},{"id":"s8","subject":"soc","topic":"Право","type":"choice","max":2,"text":"Какие из перечисленных полномочий принадлежат Президенту Российской Федерации согласно Конституции РФ? Запишите цифры, под которыми они указаны.","options":["принимает федеральный бюджет","является Верховным Главнокомандующим Вооружёнными Силами РФ","объявляет амнистию","осуществляет помилование","утверждает изменение границ между субъектами РФ","назначает Председателя Правительства РФ после утверждения его кандидатуры Государственной Думой"],"answer":"246","hint":"Помилование и амнистию часто путают: одно касается конкретного человека, другое — широкого круга лиц, и его объявляет парламент.","explain":"Президенту принадлежат полномочия 2, 4 и 6. Федеральный бюджет принимает Государственная Дума, она же объявляет амнистию. Изменение границ между субъектами РФ утверждает Совет Федерации."},{"id":"s9","subject":"soc","topic":"Право","type":"match","max":2,"text":"Установите соответствие между примерами и отраслями права, которые регулируют эти отношения.","left":["гражданин заключил договор купли-продажи квартиры","работодатель предоставил сотруднику ежегодный оплачиваемый отпуск","водителя оштрафовали за превышение скорости","супруги заключили брачный договор","гражданин совершил кражу"],"right":["административное право","семейное право","гражданское право","уголовное право","трудовое право"],"answer":"35124","hint":"Штраф за нарушение правил дорожного движения — административная ответственность. Кража — преступление.","explain":"Купля-продажа — гражданское право, отпуск — трудовое, штраф за превышение скорости — административное, брачный договор — семейное, кража — уголовное."},{"id":"s10","subject":"soc","topic":"Политика","type":"open","max":3,"text":"Используя обществоведческие знания, составьте сложный план, позволяющий раскрыть по существу тему «Политические партии в демократическом обществе». План должен содержать не менее трёх пунктов, непосредственно раскрывающих тему, из которых два или более детализированы в подпунктах.","criteria":[{"id":"K1","max":2,"text":"Раскрытие темы по существу. Ключевые пункты: понятие и признаки партии; функции партий; виды партий или партийные системы. Все три ключевых пункта, два из них раскрыты в трёх и более подпунктах — 2 балла; два ключевых пункта с такой детализацией — 1 балл."},{"id":"K2","max":1,"text":"Корректность формулировок: пункты и подпункты сформулированы без ошибок, конкретно, не абстрактно."}],"model":"1. Понятие политической партии.\n2. Признаки партии:\nа) организационная структура и членство;\nб) программа и идеология;\nв) стремление к завоеванию и осуществлению власти;\nг) социальная база — опора на определённые группы общества.\n3. Функции партий:\nа) выражение и представление интересов социальных групп;\nб) участие в выборах и формирование органов власти;\nв) политическая социализация граждан;\nг) подготовка и выдвижение политических лидеров.\n4. Виды партий:\nа) по идеологии — либеральные, консервативные, социал-демократические;\nб) по отношению к власти — правящие и оппозиционные;\nв) по организации — кадровые и массовые.\n5. Партийные системы: однопартийная, двухпартийная, многопартийная.\n6. Правовое регулирование деятельности партий в РФ.","hint":"Ответьте себе на вопросы: что такое партия? чем она отличается от других объединений? зачем она нужна обществу? какими бывают партии и партийные системы? Каждый вопрос — пункт плана."},{"id":"s11","subject":"soc","topic":"Экономика","type":"open","max":3,"text":"Приведите три примера, иллюстрирующих разные функции денег. В каждом примере укажите, какую функцию он иллюстрирует.","criteria":[{"id":"K1","max":3,"text":"Каждый пример, который сформулирован развёрнуто, иллюстрирует названную функцию и не повторяет другие примеры, — 1 балл, не больше трёх."}],"model":"Мера стоимости: в магазине на зимней куртке указана цена — 8 000 рублей.\nСредство обращения: Ольга купила в булочной хлеб и сразу расплатилась наличными.\nСредство платежа: предприятие перечислило работникам зарплату за месяц; гражданин уплатил налог на имущество.\nСредство накопления: семья каждый месяц откладывает часть дохода на вклад, чтобы купить квартиру.\nМировые деньги: российская компания оплатила поставку оборудования из Китая в юанях.","hint":"Функций денег пять: мера стоимости, средство обращения, средство платежа, средство накопления, мировые деньги. Пример — это конкретная ситуация с участником и действием, а не определение."},{"id":"s12","subject":"soc","topic":"Право","type":"open","max":3,"text":"Шестнадцатилетний Антон устроился курьером по трудовому договору. Работодатель установил ему испытательный срок три месяца и 40-часовую рабочую неделю, а также предложил выходить в ночные смены с повышенной оплатой.\n\n1) Какие условия, предложенные работодателем, противоречат Трудовому кодексу РФ? Поясните каждое.\n2) Какую особенность ежегодного отпуска Трудовой кодекс устанавливает для работников младше 18 лет?","criteria":[{"id":"K1","max":2,"text":"Названы нарушения с пояснением: работникам младше 18 лет не устанавливается испытательный срок; для работников 16–18 лет рабочее время — не более 35 часов в неделю; работников младше 18 лет нельзя привлекать к работе в ночное время. Три нарушения — 2 балла, два — 1 балл."},{"id":"K2","max":1,"text":"Указано, что работникам младше 18 лет ежегодный отпуск предоставляется продолжительностью 31 календарный день в удобное для них время."}],"model":"1) Испытательный срок лицам младше 18 лет не устанавливается (ст. 70 ТК РФ). Для работников от 16 до 18 лет рабочее время сокращено — не более 35 часов в неделю (ст. 92). Работники младше 18 лет не допускаются к работе в ночное время (ст. 96); исключение сделано только для творческих работников, а Антон — курьер.\n2) Работникам младше 18 лет ежегодный оплачиваемый отпуск предоставляется продолжительностью 31 календарный день в удобное для них время (ст. 267).","hint":"Найдите в условии три детали: «три месяца», «40 часов», «ночные смены». Для несовершеннолетних по каждой есть особое правило."}],"images":{"g_supply":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20360%20300%22%20width%3D%22720%22%20height%3D%22600%22%3E%3Crect%20width%3D%22360%22%20height%3D%22300%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Cdefs%3E%3Cmarker%20id%3D%22ar%22%20viewBox%3D%220%200%2010%2010%22%20refX%3D%229%22%20refY%3D%225%22%20markerWidth%3D%227%22%20markerHeight%3D%227%22%20orient%3D%22auto%22%3E%3Cpath%20d%3D%22M0%200L10%205L0%2010z%22%20fill%3D%22%231B1F2A%22%2F%3E%3C%2Fmarker%3E%3C%2Fdefs%3E%3Cg%20stroke%3D%22%231B1F2A%22%20fill%3D%22none%22%20stroke-width%3D%222%22%3E%3Cpath%20d%3D%22M50%20268V18%22%20marker-end%3D%22url(%23ar)%22%2F%3E%3Cpath%20d%3D%22M42%20260H344%22%20marker-end%3D%22url(%23ar)%22%2F%3E%3C%2Fg%3E%3Cg%20stroke%3D%22%231B1F2A%22%20stroke-width%3D%222.5%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M80%2050L310%20240%22%2F%3E%3Cpath%20d%3D%22M70%20240L250%2050%22%2F%3E%3Cpath%20d%3D%22M130%20240L310%2050%22%2F%3E%3C%2Fg%3E%3Cpath%20d%3D%22M102%20214H146%22%20stroke%3D%22%231B1F2A%22%20stroke-width%3D%221.8%22%20fill%3D%22none%22%20marker-end%3D%22url(%23ar)%22%2F%3E%3Cg%20font-family%3D%22'Times%20New%20Roman'%2CTimes%2Cserif%22%20font-style%3D%22italic%22%20font-size%3D%2220%22%20fill%3D%22%231B1F2A%22%3E%3Ctext%20x%3D%2228%22%20y%3D%2226%22%3EP%3C%2Ftext%3E%3Ctext%20x%3D%22334%22%20y%3D%22286%22%3EQ%3C%2Ftext%3E%3Ctext%20x%3D%2233%22%20y%3D%22281%22%20font-style%3D%22normal%22%20font-size%3D%2216%22%3E0%3C%2Ftext%3E%3Ctext%20x%3D%22315%22%20y%3D%22248%22%3ED%3C%2Ftext%3E%3Ctext%20x%3D%22236%22%20y%3D%2240%22%3ES%3C%2Ftext%3E%3Ctext%20x%3D%22298%22%20y%3D%2240%22%3ES%3Ctspan%20dy%3D%225%22%20font-size%3D%2214%22%3E1%3C%2Ftspan%3E%3C%2Ftext%3E%3C%2Fg%3E%3C%2Fsvg%3E"}}</script>

const $ = (s, r) => (r || document).querySelector(s);

const paras = s => String(s || '').split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('');
const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[«»"'.,!?()]/g, '').replace(/\s+/g, ' ').trim();
const plural = (n, a, b, c) => { const m = Math.abs(n) % 100, k = m % 10; if (m > 10 && m < 20) return c; if (k > 1 && k < 5) return b; if (k === 1) return a; return c; };
const pts = n => n + ' ' + plural(n, 'балл', 'балла', 'баллов');

const clone = o => JSON.parse(JSON.stringify(o));

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return 'i' + (h >>> 0).toString(36) + s.length.toString(36); }
const fmtSize = kb => kb < 1024 ? kb + ' КБ' : (kb / 1024).toFixed(1).replace('.', ',') + ' МБ';

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

/* ---------- bank helpers ---------- */
const tasksOf = (subj, src) => (src || bank).tasks.filter(t => t.subject === subj);
const topicsOf = (subj, src) => { const out = []; tasksOf(subj, src).forEach(t => { if (!out.includes(t.topic)) out.push(t.topic); }); return out; };
const numOf = t => tasksOf(t.subject).indexOf(t) + 1;
const visibleTasks = () => { const all = tasksOf(store.subject); return ui.topic === 'all' ? all : all.filter(t => t.topic === ui.topic); };
function recState(t) { const r = store.rec[t.id]; if (!r) return 'none'; if (r.last >= t.max) return 'ok'; if (r.last > 0) return 'part'; return 'bad'; }
const errorTasks = subj => tasksOf(subj).filter(t => { const r = store.rec[t.id]; return r && r.last < t.max; });
function currentTask() {
  const list = visibleTasks();
  let t = list.find(x => x.id === ui.current[store.subject]);
  if (!t) { t = list.find(x => !store.rec[x.id]) || list.find(x => recState(x) !== 'ok') || list[0]; if (t) ui.current[store.subject] = t.id; }
  return t || null;
}

/* ---------- per-task working state ---------- */
const slotted = t => t.type === 'match' || t.type === 'table';
function blanksOf(t) {
  const out = [];
  (t.rows || []).forEach((r, ri) => r.forEach((c, ci) => { if (c === '_') out.push({ ri, ci, col: (t.head || [])[ci] || '' }); }));
  return out;
}
const nSlots = t => t.type === 'table' ? blanksOf(t).length : (t.left || []).length;
function mistakes(t, ans) {
  if (slotted(t)) { let e = 0; for (let i = 0; i < t.answer.length; i++) if ((ans[i] || '') !== t.answer[i]) e++; return 'Неверных позиций: ' + e + '.'; }
  if (t.type === 'choice') {
    const a = new Set(ans), k = new Set(t.answer.split('')); let miss = 0, extra = 0;
    k.forEach(x => { if (!a.has(x)) miss++; }); a.forEach(x => { if (!k.has(x)) extra++; });
    return 'Не отмечено верных вариантов: ' + miss + ', отмечено лишних: ' + extra + '.';
  }
  return '';
}
function fresh(t) {
  let ans = '';
  if (slotted(t)) ans = Array.from({ length: nSlots(t) }, () => '');
  else if (t.type === 'choice' || t.type === 'order') ans = [];
  else if (t.type === 'open') ans = store.drafts[t.id] || '';
  return { ans, phase: 'idle', score: null, tries: 0, hint: false, expl: '', explBusy: false, explErr: '', ctl: null,
    aiBusy: false, aiErr: '', review: null, selfOpen: false, self: {}, selfSaved: false, modelShown: false };
}
const st = t => ui.st[t.id] || (ui.st[t.id] = fresh(t));

function ready(t, s) {
  if (t.type === 'order') return s.ans.length === t.options.length;
  if (slotted(t)) return s.ans.every(Boolean);
  if (t.type === 'choice') return s.ans.length > 0;
  if (t.type === 'text') return norm(s.ans).length > 0;
  return false;
}
function hasInput(t, s) {
  if (slotted(t)) return s.ans.some(Boolean);
  if (t.type === 'text') return String(s.ans).length > 0;
  return s.ans.length > 0;
}
const ansString = (t, a) => t.type === 'choice' ? a.slice().sort().join('') : slotted(t) ? a.map(x => x || '·').join('') : t.type === 'order' ? a.join('') : String(a);

/* Scoring follows the ФИПИ rules (ЕГЭ-2027 specification):
   соответствие (1, 3, 5, 7): одна неверная позиция — минус 1 балл;
   таблица (4): 3 балла; одна ошибка — 2; две-три ошибки — 1;
   выбор (6, 12) по истории: 1 балл, если один символ неверен, один лишний или одного нет;
   выбор по обществознанию: 1 балл, если одной верной цифры нет или есть одна лишняя. */
function scoreTask(t, ans) {
  if (t.type === 'order') return ans.join('') === t.answer ? t.max : 0;
  if (slotted(t)) {
    let err = 0; for (let i = 0; i < t.answer.length; i++) if ((ans[i] || '') !== t.answer[i]) err++;
    if (err === 0) return t.max;
    if (t.max >= 3) return err === 1 ? t.max - 1 : err <= 3 ? t.max - 2 : 0;
    return err === 1 && t.max > 1 ? t.max - 1 : 0;
  }
  if (t.type === 'choice') {
    const a = new Set(ans), k = new Set(t.answer.split('')); let miss = 0, extra = 0;
    k.forEach(x => { if (!a.has(x)) miss++; }); a.forEach(x => { if (!k.has(x)) extra++; });
    if (!miss && !extra) return t.max;
    const near = t.subject === 'hist' ? Math.max(miss, extra) <= 1 : miss + extra === 1;
    return near && t.max > 1 ? t.max - 1 : 0;
  }
  if (t.type === 'text') { const n = norm(ans); return t.answer.some(v => norm(v) === n) ? t.max : 0; }
  return 0;
}

function record(t, score, flags) {
  const r = store.rec[t.id] || { tries: 0 };
  if (r.first == null) { r.first = score; r.at = Date.now(); }
  r.last = score; r.tries = (r.tries || 0) + 1;
  if (flags && flags.self) r.self = true;
  if (flags && flags.ai) r.ai = true;
  store.rec[t.id] = r; save();
}

function cardHead(t) {
  return '<div class="task-head"><span class="task-no">№ ' + numOf(t) + '</span>' + (t.ege ? '<span class="tag tag-ege">ЕГЭ-' + t.ege + '</span>' : '') + '<span class="tag">' + TYPE[t.type] + '</span><span class="tag tag-topic">' + esc(t.topic) + '</span><span class="task-pts">' + pts(t.max) + '</span></div>';
}
function cellsRow(arr, n, cls, letters) {
  let top = '', cells = '';
  for (let i = 0; i < n; i++) {
    if (letters) top += '<span class="lh">' + LET[i] + '</span>';
    const v = arr[i] || '';
    cells += '<span class="c' + (v ? ' f' : '') + '">' + esc(v) + '</span>';
  }
  return '<div class="sheet-wrap"><div class="sheet ' + (cls || '') + '">' + (letters ? '<div class="sheet-r">' + top + '</div>' : '') + '<div class="sheet-r">' + cells + '</div></div></div>';
}
function sheetFor(t, a, cls) {
  if (slotted(t)) return cellsRow(a, nSlots(t), cls, true);
  if (t.type === 'choice') return cellsRow(a.slice().sort(), t.options.length, cls);
  if (t.type === 'order') return cellsRow(a, t.options.length, cls);
  return '';
}
function hintBlock(t) { return t.hint ? '<div class="hint"><span class="label">Подсказка</span>' + paras(t.hint) + '</div>' : ''; }
function figures(t) {

  return '<div class="figs' + (many ? '' : ' one') + '">' + ids.map((id, i) =>

function closeZoom() { const z = document.getElementById('zoom'); if (z) { z.remove(); document.body.style.overflow = ''; } }
function openZoom(src) {

function testCard(t) {
  const s = st(t), locked = s.phase !== 'idle';
  let inp = '';
  if (t.type === 'choice' || t.type === 'order') {
    inp = '<p class="how">' + (t.type === 'order' ? 'Нажимайте варианты по порядку, от самого раннего к самому позднему. Повторное нажатие убирает вариант.' : 'Отметьте все верные варианты.') + '</p>' +
      '<ol class="opts">' + t.options.map((o, i) => {
        const d = String(i + 1), pos = t.type === 'order' ? s.ans.indexOf(d) : -1, on = t.type === 'order' ? pos >= 0 : s.ans.includes(d);
        return '<li><button class="opt' + (on ? ' on' : '') + '" data-act="opt" data-v="' + d + '" aria-pressed="' + on + '"' + (locked ? ' disabled' : '') + '><span class="opt-d">' + d + '</span><span class="opt-t">' + esc(o) + '</span>' + (pos >= 0 ? '<span class="pos">' + (pos + 1) + '-е</span>' : '') + '</button></li>';
      }).join('') + '</ol>';
  } else if (t.type === 'match') {
    inp = '<div class="match"><div><div class="col-h">Второй столбец</div><ol class="right">' + t.right.map((r, i) => '<li><span class="opt-d">' + (i + 1) + '</span><span>' + esc(r) + '</span></li>').join('') + '</ol></div>' +
      '<div><div class="col-h">Первый столбец: выберите цифру для каждой буквы</div>' + t.left.map((l, ri) =>
        '<div class="mrow"><div class="mleft"><span class="mlet">' + LET[ri] + '</span><span>' + esc(l) + '</span></div><div class="mpick" role="group" aria-label="Позиция ' + LET[ri] + '">' +
        t.right.map((_, di) => { const d = String(di + 1), on = s.ans[ri] === d; return '<button class="pick' + (on ? ' on' : '') + '" data-act="m" data-r="' + ri + '" data-v="' + d + '" aria-pressed="' + on + '"' + (locked ? ' disabled' : '') + '>' + d + '</button>'; }).join('') +
        '</div></div>').join('') + '</div></div>';
  } else if (t.type === 'table') {
    const bl = blanksOf(t);
    let k = 0;
    const cell = c => {
      if (c !== '_') return '<td>' + esc(c) + '</td>';
      const i = k++, v = s.ans[i];
      return '<td class="blank"><span class="mlet">' + LET[i] + '</span>' + (v ? '<b class="tv">' + esc(v) + '</b>' : '') + '</td>';
    };
    inp = '<div class="tbl-wrap"><table class="tbl"><thead><tr>' + t.head.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
      t.rows.map(r => '<tr>' + r.map(cell).join('') + '</tr>').join('') + '</tbody></table></div>' +
      '<div class="match"><div><div class="col-h">Элементы для вставки</div><ol class="right">' + t.right.map((r, i) => '<li><span class="opt-d">' + (i + 1) + '</span><span>' + esc(r) + '</span></li>').join('') + '</ol></div>' +
      '<div><div class="col-h">Выберите номер элемента для каждой буквы</div>' + bl.map((b, ri) =>
        '<div class="mrow"><div class="mleft"><span class="mlet">' + LET[ri] + '</span><span class="how">' + esc(b.col) + ', строка ' + (b.ri + 1) + '</span></div><div class="mpick" role="group" aria-label="Ячейка ' + LET[ri] + '">' +
        t.right.map((_, di) => { const d = String(di + 1), on = s.ans[ri] === d; return '<button class="pick' + (on ? ' on' : '') + '" data-act="m" data-r="' + ri + '" data-v="' + d + '" aria-pressed="' + on + '"' + (locked ? ' disabled' : '') + '>' + d + '</button>'; }).join('') +
        '</div></div>').join('') + '</div></div>';
  } else if (t.type === 'text') {
    inp = '<label class="lbl" for="term-' + esc(t.id) + '">Ответ</label><input id="term-' + esc(t.id) + '" class="term" data-in="term" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(s.ans) + '"' + (locked ? ' disabled' : '') + '>';
  }
  const sheet = t.type !== 'text' ? '<div class="answer"><span class="answer-l">Ответ</span>' + sheetFor(t, s.ans) + '</div>' : '';
  let actions = '';
  if (s.phase === 'idle') {

  }
  const showHint = s.hint && (s.phase === 'idle' || s.phase === 'wrong');

}

function keyString(t) { return t.type === 'text' ? t.answer[0] : t.answer; }
function feedbackTest(t, s) {

    return '<div class="fb ' + (partial ? 'part' : 'bad') + '" role="status"><div class="fb-h">' + (partial ? 'Частично верно: ' + s.score + ' из ' + t.max : 'Неверно') + '</div>' +

      '<div class="row"><button class="btn primary" data-act="retry">Попробовать ещё раз</button><button class="btn" data-act="reveal">Показать решение</button></div></div>';

}

function statsFor(subj) {
  const tasks = tasksOf(subj);
  const topics = topicsOf(subj).map(tp => {
    const ts = tasks.filter(t => t.topic === tp), done = ts.filter(t => store.rec[t.id]);
    const earned = done.reduce((a, t) => a + Math.min(store.rec[t.id].first, t.max), 0), maxAtt = done.reduce((a, t) => a + t.max, 0);
    return { tp, total: ts.length, done: done.length, earned, maxAtt, pct: maxAtt ? earned / maxAtt : null };
  });
  const sum = k => topics.reduce((a, x) => a + x[k], 0);
  return { topics, total: tasks.length, done: sum('done'), earned: sum('earned'), maxAtt: sum('maxAtt'), errors: errorTasks(subj).length };
}
function advice(subj) {
  const S = statsFor(subj), out = [];
  if (!S.done) return [{ text: 'Начни с любого задания. После первых ответов здесь появятся советы, что повторить.', act: 'tab', v: 'tasks', btn: 'К заданиям' }];
  const weak = S.topics.filter(x => x.pct !== null && x.pct < 0.7).sort((a, b) => a.pct - b.pct);
  if (weak.length) out.push({ text: 'Слабее всего тема «' + weak[0].tp + '»: ' + Math.round(weak[0].pct * 100) + '% баллов с первой попытки. Повтори материал и реши задания этой темы ещё раз.', act: 'topic', v: weak[0].tp, btn: 'Задания по теме' });
  if (S.errors) out.push({ text: S.errors + ' ' + plural(S.errors, 'задание ждёт', 'задания ждут', 'заданий ждут') + ' в работе над ошибками.', act: 'tab', v: 'errors', btn: 'Открыть' });
  const untouched = S.topics.filter(x => x.done === 0);
  if (untouched.length) out.push({ text: 'Ещё не начаты: ' + untouched.map(x => '«' + x.tp + '»').join(', ') + '.', act: 'topic', v: untouched[0].tp, btn: 'Начать' });
  const unsolved = S.topics.filter(x => x.done > 0 && x.done < x.total);
  if (!out.length && unsolved.length) out.push({ text: 'В теме «' + unsolved[0].tp + '» остались нерешённые задания.', act: 'topic', v: unsolved[0].tp, btn: 'Продолжить' });
  if (!out.length) out.push({ text: 'Все задания решены уверенно. Попроси учителя добавить новые.' });
  return out;
}

function reportText() {
  const lines = [(store.name.trim() || 'Ученик') + ' · отчёт от ' + new Date().toLocaleDateString('ru-RU')];
  ['hist', 'soc'].forEach(subj => {
    const S = statsFor(subj);
    lines.push('', SUBJ[subj].toUpperCase());
    if (!S.done) { lines.push('Пока не решал(а).'); return; }
    lines.push('Баллы с первой попытки: ' + S.earned + ' из ' + S.maxAtt + '. Решено заданий: ' + S.done + ' из ' + S.total + '.');
    S.topics.forEach(x => lines.push('— ' + x.tp + ': ' + (x.done ? x.earned + ' из ' + x.maxAtt + ' (' + x.done + ' из ' + x.total + ' заданий)' : 'не начато')));
    const errs = errorTasks(subj);
    if (errs.length) lines.push('Не решены на полный балл: ' + errs.map(t => '№ ' + numOf(t) + ' (' + TYPE[t.type].toLowerCase() + ', ' + t.topic + ')').join('; ') + '.');
    const selfN = tasksOf(subj).filter(t => store.rec[t.id] && store.rec[t.id].self && !store.rec[t.id].ai).length;

  });
  return lines.join('\n');

function gcImages(work, keep) {
  const used = new Set(keep || []), imgs = work.images || {};
  work.tasks.forEach(t => (t.images || []).forEach(id => used.add(id)));
  Object.keys(imgs).forEach(id => { if (!used.has(id)) delete imgs[id]; });

}
function readAsDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function compressImage(file) {
  if (file.type === 'image/svg+xml' && file.size < 400000) return readAsDataURL(file);
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.82));
      } catch (e) { rej(e); } finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src = url;
  });
}
async function addImages(files) {
  const T = ui.teacher, f = T.form, list = Array.from(files || []);
  if (!list.length) return;
  f.images = f.images || [];
  T.imgBusy = true; T.formErr = ''; render();
  for (const file of list) {
    if (f.images.length >= MAXIMG) { T.formErr = 'К одному заданию можно прикрепить не больше ' + MAXIMG + ' изображений.'; break; }
    try {
      const data = await compressImage(file), id = hashStr(data);
      T.work.images = T.work.images || {};
      T.work.images[id] = data;
      if (!f.images.includes(id)) f.images.push(id);
    } catch (e) { T.formErr = 'Не удалось открыть файл «' + file.name + '». Подойдут фото, скриншот, JPG или PNG.'; }
  }
  T.imgBusy = false; saveDraft(); render();
}

      others.map(id => '<button type="button" class="thumb-add" data-act="t-img-use" data-v="' + esc(id) + '" aria-label="Прикрепить это изображение"><img src="' + esc(imgs[id]) + '" alt=""></button>').join('') + '</div>' : '') +

function buildTask(f) {
  const lines = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
  const t = { id: f.editId || ('t' + Date.now().toString(36)), subject: f.subject, topic: f.topic.trim(), type: f.type, text: f.text.trim() };
  if (!t.topic) return { err: 'Укажите тему задания.' };
  if (!t.text) return { err: 'Введите текст задания.' };
  const eg = parseInt(f.ege, 10);
  if (eg >= 1 && eg <= 30) t.ege = eg;
  if (f.source.trim()) t.source = f.source.trim();
  const imgs = (f.images || []).filter(id => ui.teacher.work.images && ui.teacher.work.images[id]);
  if (imgs.length) t.images = imgs.slice(0, MAXIMG);
  const digits = String(f.answer || '').replace(/\D/g, '');
  if (f.type === 'choice' || f.type === 'order') {
    t.options = lines(f.options);
    const n = t.options.length;
    if (n < 2 || n > 9) return { err: 'Нужно от 2 до 9 вариантов, по одному в строке.' };
    if (!digits) return { err: 'Запишите правильный ответ цифрами, например 135.' };
    if (digits.split('').some(d => +d < 1 || +d > n)) return { err: 'В ответе есть цифра, для которой нет варианта.' };
    if (new Set(digits).size !== digits.length) return { err: 'Цифры в ответе не должны повторяться.' };
    if (f.type === 'order' && digits.length !== n) return { err: 'В задании на хронологию ответ должен включать все ' + n + ' варианта.' };
    t.answer = f.type === 'choice' ? digits.split('').sort().join('') : digits;
    t.max = DEFMAX[f.type];
  } else if (f.type === 'match') {
    t.left = lines(f.left); t.right = lines(f.right);
    if (t.left.length < 2 || t.left.length > LET.length) return { err: 'В первом столбце нужно от 2 до ' + LET.length + ' позиций.' };
    if (t.right.length < 2 || t.right.length > 9) return { err: 'Во втором столбце нужно от 2 до 9 позиций.' };
    if (digits.length !== t.left.length) return { err: 'В ответе должно быть ' + t.left.length + ' цифр, по одной на каждую букву.' };
    if (digits.split('').some(d => +d < 1 || +d > t.right.length)) return { err: 'В ответе есть цифра, которой нет во втором столбце.' };
    t.answer = digits; t.max = DEFMAX.match;
  } else if (f.type === 'table') {
    t.head = String(f.head || '').split('|').map(x => x.trim()).filter(Boolean);
    t.rows = lines(f.rows).map(r => r.split('|').map(x => x.trim()));
    if (t.head.length < 2) return { err: 'Укажите хотя бы два заголовка столбцов через |.' };
    if (!t.rows.length) return { err: 'Добавьте строки таблицы.' };
    if (t.rows.some(r => r.length !== t.head.length)) return { err: 'В каждой строке должно быть столько же ячеек, сколько столбцов: ' + t.head.length + '.' };
    const nb = blanksOf(t).length;
    if (nb < 2 || nb > LET.length) return { err: 'Пустых ячеек (_) должно быть от 2 до ' + LET.length + '.' };
    t.right = lines(f.right);
    if (t.right.length < 2 || t.right.length > 9) return { err: 'Элементов для вставки нужно от 2 до 9.' };
    if (digits.length !== nb) return { err: 'В ответе должно быть ' + nb + ' цифр — по одной на каждую пустую ячейку.' };
    if (digits.split('').some(d => +d < 1 || +d > t.right.length)) return { err: 'В ответе есть цифра, которой нет в списке элементов.' };
    t.answer = digits; t.max = DEFMAX.table;
  } else if (f.type === 'text') {
    const v = String(f.answer || '').split(/[;\n]/).map(x => x.trim()).filter(Boolean);
    if (!v.length) return { err: 'Запишите правильный термин. Несколько допустимых вариантов разделите точкой с запятой.' };
    t.answer = v; t.max = DEFMAX.text;
  } else if (f.type === 'open') {
    const ls = lines(f.criteria), crit = [];
    for (let i = 0; i < ls.length; i++) {
      const m = ls[i].match(/^(\d+)\s*[|;:]\s*(.+)$/);
      if (!m || +m[1] < 1 || +m[1] > 9) return { err: 'Критерий в строке ' + (i + 1) + ' записан не по образцу «2 | что требуется».' };
      crit.push({ id: 'K' + (i + 1), max: +m[1], text: m[2].trim() });
    }
    if (!crit.length) return { err: 'Добавьте хотя бы один критерий.' };
    if (!f.model.trim()) return { err: 'Добавьте эталонный ответ: по нему ученик проверяет себя.' };
    t.criteria = crit; t.model = f.model.trim(); t.max = crit.reduce((a, c) => a + c.max, 0);
  } else return { err: 'Выберите тип задания.' };
  if (f.hint.trim()) t.hint = f.hint.trim();
  if (f.type !== 'open') t.explain = f.explain.trim() || 'Правильный ответ: ' + (f.type === 'text' ? t.answer[0] : t.answer) + '.';
  return { task: t };
}

function field(name, label, kind, help, rows) {
  const f = ui.teacher.form, id = 'f-' + name, v = esc(f[name]);
  const ctl = kind === 'area' ? '<textarea id="' + id + '" data-f="' + name + '" rows="' + (rows || 3) + '">' + v + '</textarea>' : '<input id="' + id + '" data-f="' + name + '" value="' + v + '"' + (name === 'topic' ? ' list="topic-list"' : '') + '>';
  return '<div class="field"><label for="' + id + '">' + label + '</label>' + ctl + (help ? '<small>' + help + '</small>' : '') + '</div>';
}

  const T = ui.teacher, f = T.form;
  const list = T.work.tasks.filter(t => t.subject === store.subject);
  const topics = topicsOf(f.subject, T.work);
  let typeFields = '';
  if (f.type === 'choice' || f.type === 'order') {
