<style id="app-css">
/* Layout: one workbook column; the ЕГЭ answer-sheet cell row is the signature element */
:root{
  --paper:#EDF0F5; --sheet:#FFFFFF; --ink:#172036; --muted:#566077; --line:#D4DAE4; --line-strong:#9BA5B9; --rule:#DCE3EF;
  --accent:#2B47A3; --accent-soft:#E3E9F8; --on-strong:#FFFFFF;
  --hist:#8E3B2C; --hist-soft:#F5E6E2; --soc:#1C6670; --soc-soft:#DDEFF0;
  --ok:#1D7448; --ok-soft:#DFF1E6; --part:#94600C; --part-soft:#F6EAD3; --bad:#AF3535; --bad-soft:#F7E1E1;
  --f-display:"Alegreya","PT Serif",Georgia,serif;
  --f-body:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"PT Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10141D; --sheet:#181E2A; --ink:#E5E9F1; --muted:#9AA3B7; --line:#2A3244; --line-strong:#4A556C; --rule:#232B3B;
  --accent:#93AAF2; --accent-soft:#1F2945; --on-strong:#10141D;
  --hist:#E39582; --hist-soft:#36211D; --soc:#72C3CC; --soc-soft:#16302F;
  --ok:#68C995; --ok-soft:#15291E; --part:#E2AE5B; --part-soft:#30261A; --bad:#EE8A8A; --bad-soft:#371C1F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#10141D; --sheet:#181E2A; --ink:#E5E9F1; --muted:#9AA3B7; --line:#2A3244; --line-strong:#4A556C; --rule:#232B3B;
  --accent:#93AAF2; --accent-soft:#1F2945; --on-strong:#10141D;
  --hist:#E39582; --hist-soft:#36211D; --soc:#72C3CC; --soc-soft:#16302F;
  --ok:#68C995; --ok-soft:#15291E; --part:#E2AE5B; --part-soft:#30261A; --bad:#EE8A8A; --bad-soft:#371C1F;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 56px}
.app{--subj:var(--hist);--subj-soft:var(--hist-soft);max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.app[data-subj="soc"]{--subj:var(--soc);--subj-soft:var(--soc-soft)}
h1,h2,h3{text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;border:1.5px solid var(--ink);padding:7px 6px 6px 8px;line-height:1;border-radius:2px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:-.01em}
.brand p{margin-top:4px;color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:var(--sheet)}
.seg-b{appearance:none;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg-b.on{background:var(--subj);color:var(--on-strong)}

/* tabs */
.tabs-wrap{overflow-x:auto;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);min-width:max-content}
.tab{appearance:none;border:0;background:none;font-size:15px;color:var(--muted);padding:10px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--subj);font-weight:600}
.count{font-family:var(--f-mono);font-size:12px;background:var(--bad-soft);color:var(--bad);padding:1px 7px;border-radius:999px;font-weight:400}

/* topic chips + navigator */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;appearance:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip.on{border-color:var(--subj);color:var(--subj);background:var(--subj-soft);font-weight:500}
.navbox{display:flex;flex-direction:column;gap:10px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.nav{width:40px;height:40px;font-family:var(--f-mono);font-size:15px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);border-radius:3px;cursor:pointer;font-variant-numeric:tabular-nums}
.nav.s-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.nav.s-part{background:var(--part-soft);border-color:var(--part);color:var(--part)}
.nav.s-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.nav.cur{outline:2px solid var(--subj);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border:1px solid var(--line-strong);border-radius:2px;background:var(--sheet)}
.legend i.ok{background:var(--ok-soft);border-color:var(--ok)}
.legend i.part{background:var(--part-soft);border-color:var(--part)}
.legend i.bad{background:var(--bad-soft);border-color:var(--bad)}

/* task card */
.task{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}
.task-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.task-no{font-family:var(--f-mono);font-size:14px;border:1.5px solid var(--subj);color:var(--subj);padding:3px 7px 2px;border-radius:2px;white-space:nowrap}
.tag{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tag-topic{letter-spacing:0;text-transform:none;font-size:13px;color:var(--subj)}
.task-pts{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prompt{display:flex;flex-direction:column;gap:10px;font-size:17px;line-height:1.55;max-width:65ch}
.src{margin:0;padding:14px 16px;border-left:3px solid var(--subj);background:var(--paper);font-family:var(--f-display);font-size:17px;line-height:1.6;display:flex;flex-direction:column;gap:8px;border-radius:0 4px 4px 0}
.src-l{font-family:var(--f-body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.how{font-size:14px;color:var(--muted)}

.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;font-size:16px;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--line-strong)}
.opt:disabled{cursor:default}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt-d{flex:none;width:26px;height:26px;display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;border:1px solid var(--line-strong);border-radius:2px;background:var(--sheet)}
.opt.on .opt-d{background:var(--accent);color:var(--on-strong);border-color:var(--accent)}
.opt-t{flex:1;min-width:0;padding-top:1px}
.pos{flex:none;align-self:center;font-family:var(--f-mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px}

.match{display:flex;flex-direction:column;gap:14px}
.right{list-style:none;margin:0;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:4px}
.right li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.right li .opt-d{width:24px;height:24px;font-size:13px}
.col-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mrow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.mleft{display:flex;gap:10px;align-items:flex-start}
.mlet{font-family:var(--f-mono);font-weight:700;width:24px;flex:none;text-align:center;color:var(--subj)}
.mpick{display:flex;flex-wrap:wrap;gap:6px;padding-left:34px}
.pick{width:38px;height:38px;font-family:var(--f-mono);font-size:15px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);border-radius:3px;cursor:pointer}
.pick.on{background:var(--accent);border-color:var(--accent);color:var(--on-strong)}
.pick:disabled{cursor:default;opacity:.55}
.pick.on:disabled{opacity:1}

/* answer-sheet cells */
.answer{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px}
.answer-l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:12px}
.sheet{display:flex;flex-direction:column;width:max-content}
.sheet-r{display:flex}
.sheet .lh{width:34px;font-family:var(--f-mono);font-size:13px;text-align:center;color:var(--muted);padding-bottom:3px}
.c{width:34px;height:42px;display:grid;place-items:center;font-family:var(--f-mono);font-size:20px;border:1px solid var(--line-strong);border-left-width:0;background:var(--sheet);color:var(--ink)}
.c:first-child{border-left-width:1px}
.c.f{color:var(--accent)}
.sheet.key .c.f{color:var(--ok)}
.sheet.mine .c.f{color:var(--muted)}
.sheet-wrap{overflow-x:auto;max-width:100%}
.term{font-family:var(--f-mono);font-size:20px;letter-spacing:.06em;padding:8px 12px;border:1px solid var(--line-strong);border-radius:3px;background:var(--sheet);color:var(--ink);width:100%;max-width:380px;min-height:46px}
.essay{width:100%;min-height:210px;font:inherit;font-size:16px;line-height:26px;padding:6px 14px;border:1px solid var(--line-strong);border-radius:4px;color:var(--ink);resize:vertical;
  background-color:var(--sheet);background-image:repeating-linear-gradient(to bottom,transparent 0 25px,var(--rule) 25px 26px);background-position:0 6px;background-attachment:local}
.lbl{font-size:14px;font-weight:500;margin-bottom:-8px}
.meta{font-size:13px;color:var(--muted);margin-top:-8px;font-variant-numeric:tabular-nums}

/* buttons */
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{appearance:none;font-size:15px;font-weight:500;padding:9px 16px;border-radius:4px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);cursor:pointer;min-height:42px;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-strong)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--line)}
.btn.small{font-size:13px;padding:5px 10px;min-height:32px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* feedback */
.hint{background:var(--accent-soft);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.hint .label{color:var(--accent)}
.fb{border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line-strong);background:var(--paper)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.part{background:var(--part-soft);border-color:var(--part)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb-h{font-weight:600;font-size:17px}
.fb.ok .fb-h{color:var(--ok)}
.fb.part .fb-h{color:var(--part)}
.fb.bad .fb-h{color:var(--bad)}
.keys{display:flex;flex-wrap:wrap;gap:12px 24px}
.ai-out{border-top:1px dashed var(--line-strong);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ai-text{white-space:pre-wrap}
.busy{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--bad);font-size:15px}
.note{font-size:14px;color:var(--muted)}
.ok-msg{color:var(--ok);font-size:14px;font-weight:500}

.review{border-top:1px dashed var(--line-strong);padding-top:16px;display:flex;flex-direction:column;gap:4px}
.review-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.review-h span{font-weight:600}
.review-h b{font-family:var(--f-mono);font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}
.crit{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.crit-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.crit-id{font-family:var(--f-mono);font-weight:700}
.crit-s{font-family:var(--f-mono);font-size:14px;padding:1px 9px;border-radius:999px;white-space:nowrap}
.crit-s.s-ok{background:var(--ok-soft);color:var(--ok)}
.crit-s.s-part{background:var(--part-soft);color:var(--part)}
.crit-s.s-bad{background:var(--bad-soft);color:var(--bad)}
.crit-s.s-none{color:var(--muted)}
.crit-t{color:var(--muted);font-size:14px}
.review > .hint,.review > .model,.review > .row,.review > .note{margin-top:10px}
.model{background:var(--paper);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.model .txt{display:flex;flex-direction:column;gap:8px}

/* lists */
.lead{color:var(--muted);max-width:65ch}
.elist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.erow{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.erow:hover{border-color:var(--line-strong)}
.erow-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.erow-t{font-size:13px;color:var(--muted)}
.erow-x{font-size:15px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.erow-s{font-family:var(--f-mono);font-size:14px;color:var(--bad);white-space:nowrap}
.empty{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:24px 20px;display:flex;flex-direction:column;gap:8px}
.empty h2{font-family:var(--f-display);font-size:24px;margin:0}

/* progress */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{background:var(--sheet);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.tp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.tp-n{font-size:15px}
.tp-v{font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{grid-column:1/-1;height:8px;background:var(--paper);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:999px}
.bar i.ok{background:var(--ok)} .bar i.part{background:var(--part)} .bar i.bad{background:var(--bad)}
.advice{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.advice li{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.advice li p{flex:1 1 260px;min-width:0}
.box{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500}
.field small{color:var(--muted);font-size:13px}
.field input,.field textarea,.field select{font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:4px;background:var(--sheet);color:var(--ink);width:100%;min-width:0}
.field textarea{resize:vertical;line-height:1.45}
.report{font-family:var(--f-mono);font-size:13px;line-height:1.5;min-height:180px}
.fields2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

/* teacher */
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow .erow-m{flex:1 1 220px}
.trow-a{display:flex;gap:6px;flex-wrap:wrap}
.dirty{background:var(--part-soft);border:1px solid var(--part);border-radius:4px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dirty p{flex:1 1 220px}
.tform{display:flex;flex-direction:column;gap:14px}
.sub-h{font-family:var(--f-display);font-size:20px;font-weight:700;margin:6px 0 0}

@media (max-width:480px){
  .task{padding:16px}
  .tab{font-size:14px;padding:10px 9px}
  .brand h1{font-size:26px}
  .stat b{font-size:19px}
  .prompt,.src{font-size:16px}
}
@media (prefers-reduced-motion: reduce){.spin{animation:none}*{scroll-behavior:auto!important}}
</style>
</head>

<main id="app" class="app"></main>
<script type="application/json" id="bank">{"version":1,"tasks":[{"id":"h1","subject":"hist","topic":"Русь IX–XV вв.","type":"order","max":1,"text":"Расположите в хронологической последовательности исторические события. Запишите цифры, которыми обозначены события, в правильной последовательности.","options":["Ледовое побоище","Стояние на реке Угре","Крещение Руси"],"answer":"312","hint":"Вспомните, с какими правителями связаны события: Владимир Святославич, Александр Невский, Иван III. В каком порядке они правили?","explain":"Крещение Руси — 988 г. (князь Владимир), Ледовое побоище — 1242 г. (Александр Невский), стояние на реке Угре — 1480 г. (Иван III, конец ордынского ига). Порядок: 3, 1, 2."},{"id":"h2","subject":"hist","topic":"XIX — начало XX в.","type":"order","max":1,"text":"Расположите в хронологической последовательности исторические события. Запишите цифры, которыми обозначены события, в правильной последовательности.","options":["Отмена крепостного права","Восстание декабристов","Начало работы I Государственной думы"],"answer":"213","hint":"Сопоставьте события с правлениями: Николай I, Александр II, Николай II.","explain":"Восстание декабристов — 1825 г., отмена крепостного права — 1861 г., I Государственная дума начала работу в 1906 г. Порядок: 2, 1, 3."},{"id":"h3","subject":"hist","topic":"XX век","type":"order","max":1,"text":"Расположите в хронологической последовательности исторические события. Запишите цифры, которыми обозначены события, в правильной последовательности.","options":["Начало Сталинградской битвы","Принятие плана ГОЭЛРО","Полёт Ю. А. Гагарина в космос"],"answer":"213","hint":"Гражданская война, Великая Отечественная, «оттепель» — какой период идёт за каким?","explain":"План ГОЭЛРО принят в 1920 г., Сталинградская битва началась в июле 1942 г., полёт Гагарина — 12 апреля 1961 г. Порядок: 2, 1, 3."},{"id":"h4","subject":"hist","topic":"Даты и события","type":"match","max":2,"text":"Установите соответствие между событиями и годами: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["Полтавская битва","Учреждение Сената","Куликовская битва","Принятие Судебника Ивана III"],"right":["1380 г.","1497 г.","1550 г.","1709 г.","1711 г.","1725 г."],"answer":"4512","hint":"Два события из правления Петра I идут почти подряд: сначала победа над шведами, через два года — новый высший орган власти.","explain":"Полтавская битва — 1709 г., Сенат учреждён в 1711 г., Куликовская битва — 1380 г., Судебник Ивана III — 1497 г. 1550 г. — год Судебника Ивана IV, его легко перепутать с Судебником 1497 г."},{"id":"h5","subject":"hist","topic":"XIX — начало XX в.","type":"match","max":2,"text":"Установите соответствие между государственными деятелями и событиями (процессами), связанными с их деятельностью.","left":["С. Ю. Витте","П. А. Столыпин","М. М. Сперанский","А. М. Горчаков"],"right":["отмена условий Парижского мира о нейтрализации Чёрного моря","денежная реформа и введение золотого рубля","подготовка плана преобразования государственного управления (1809 г.)","разрешение крестьянам выходить из общины на хутора и отруба","введение всеобщей воинской повинности"],"answer":"2431","hint":"Кто из них был министром финансов, кто — министром иностранных дел, а кто — ближайшим помощником Александра I?","explain":"Витте — денежная реформа 1897 г.; Столыпин — аграрная реформа с 1906 г.; Сперанский — «Введение к уложению государственных законов» (1809 г.); Горчаков — отказ от нейтрализации Чёрного моря (1870 г.). Всеобщую воинскую повинность ввёл военный министр Д. А. Милютин (1874 г.)."},{"id":"h6","subject":"hist","topic":"Русь IX–XV вв.","type":"text","max":1,"text":"Как в Древней Руси назывался ежегодный объезд князем с дружиной подвластных земель для сбора дани? Запишите термин.","answer":["полюдье"],"hint":"Слово связано со словом «люди». Во время такого объезда в 945 г. погиб князь Игорь.","explain":"Полюдье — объезд князем подвластных земель для сбора дани. После гибели Игоря княгиня Ольга упорядочила сбор дани: установила уроки и погосты."},{"id":"h7","subject":"hist","topic":"XX век","type":"text","max":1,"text":"Запишите название экономической политики советского государства, начатой в 1921 г., которая предусматривала замену продразвёрстки продналогом, разрешение частной торговли и аренды мелких предприятий.","answer":["нэп","новая экономическая политика"],"hint":"Сокращённое название — три буквы. Решение о ней принял X съезд РКП(б).","explain":"Новая экономическая политика (нэп) провозглашена в 1921 г. на X съезде РКП(б) и сменила политику «военного коммунизма». Свёрнута в конце 1920-х гг."},{"id":"h8","subject":"hist","topic":"XVI–XVIII вв.","type":"choice","max":2,"text":"Какие три из перечисленных событий относятся к правлению Петра I? Запишите цифры, под которыми они указаны.","options":["учреждение коллегий","созыв Уложенной комиссии","введение подушной подати","основание Московского университета","принятие Табели о рангах","создание Верховного тайного совета"],"answer":"135","hint":"Уложенную комиссию созвала Екатерина II, университет основан при Елизавете Петровне. А что произошло уже после смерти Петра в 1725 г.?","explain":"При Петре I учреждены коллегии (1717–1721), принята Табель о рангах (1722) и введена подушная подать (1724). Уложенная комиссия — 1767 г. (Екатерина II), Московский университет — 1755 г. (Елизавета Петровна), Верховный тайный совет — 1726 г. (Екатерина I)."},{"id":"h9","subject":"hist","topic":"XX век","type":"choice","max":2,"text":"Какие три из перечисленных событий произошли в 1943 г.? Запишите цифры, под которыми они указаны.","options":["Курская битва","Тегеранская конференция","операция «Багратион»","полное снятие блокады Ленинграда","Ялтинская конференция","битва за Днепр"],"answer":"126","hint":"1943 г. — год коренного перелома. «Багратион» — это освобождение Белоруссии, а Ялтинская конференция прошла в последние месяцы войны.","explain":"В 1943 г. прошли Курская битва (июль–август), битва за Днепр (август–декабрь) и Тегеранская конференция (ноябрь–декабрь). Блокада Ленинграда полностью снята в январе 1944 г. (прорвана — в январе 1943 г.), операция «Багратион» — лето 1944 г., Ялтинская конференция — февраль 1945 г."},{"id":"h10","subject":"hist","topic":"Культура","type":"match","max":2,"text":"Установите соответствие между памятниками культуры и их авторами.","left":["икона «Троица»","памятник Петру I «Медный всадник»","храм Христа Спасителя в Москве","картина «Явление Христа народу»"],"right":["Феофан Грек","К. А. Тон","А. А. Иванов","Андрей Рублёв","В. В. Растрелли","Э. Фальконе"],"answer":"4623","hint":"Феофан Грек и Андрей Рублёв — иконописцы рубежа XIV–XV вв. Растрелли строил дворцы при Елизавете Петровне.","explain":"«Троица» — Андрей Рублёв (начало XV в.), «Медный всадник» — Этьен Фальконе (открыт в 1782 г.), храм Христа Спасителя — Константин Тон, «Явление Христа народу» — Александр Иванов, который работал над картиной около двадцати лет."},{"id":"h11","subject":"hist","topic":"Работа с источником","type":"open","max":3,"text":"Прочитайте отрывок из исторического источника и выполните задания.\n\n1) Укажите год издания документа и императора, от имени которого он издан.\n2) Назовите не менее двух положений документа, которые означали изменение политической системы России.","source":"«На обязанность правительства возлагаем Мы выполнение непреклонной Нашей воли:\n1. Даровать населению незыблемые основы гражданской свободы на началах действительной неприкосновенности личности, свободы совести, слова, собраний и союзов.\n2. Не останавливая предназначенных выборов в Государственную думу, привлечь теперь же к участию в Думе \u003c…> те классы населения, которые ныне совсем лишены избирательных прав \u003c…>.\n3. Установить, как незыблемое правило, чтобы никакой закон не мог восприять силу без одобрения Государственной думы и чтобы выборным от народа обеспечена была возможность действительного участия в надзоре за закономерностью действий поставленных от Нас властей».","criteria":[{"id":"K1","max":1,"text":"Указаны год (1905) и император (Николай II). Балл ставится, только если оба элемента верны."},{"id":"K2","max":2,"text":"Названы положения документа, меняющие политическую систему: два положения — 2 балла, одно положение — 1 балл."}],"model":"1) 1905 г., император Николай II (Манифест 17 октября 1905 г.).\n2) Населению даруются гражданские свободы: неприкосновенность личности, свобода совести, слова, собраний и союзов. К выборам в Государственную думу привлекаются группы населения, которые раньше были лишены избирательных прав. Ни один закон не может вступить в силу без одобрения Государственной думы, то есть Дума становится законодательным органом. Выборные от народа получают право надзора за законностью действий властей.","hint":"Обратите внимание на третий пункт: что он меняет в праве монарха единолично издавать законы? И какое событие 1905 г. заставило власть пойти на уступки?"},{"id":"h12","subject":"hist","topic":"XIX — начало XX в.","type":"open","max":2,"text":"Назовите не менее двух причин отмены крепостного права в России и не менее двух последствий этой реформы.","criteria":[{"id":"K1","max":1,"text":"Названы не менее двух причин отмены крепостного права."},{"id":"K2","max":1,"text":"Названы не менее двух последствий реформы."}],"model":"Причины: поражение в Крымской войне показало отставание России от европейских держав; крепостное право сдерживало развитие промышленности — не хватало вольнонаёмной рабочей силы, был узок внутренний рынок; кризис помещичьего хозяйства, основанного на барщине; рост крестьянских выступлений; осуждение крепостничества в обществе.\n\nПоследствия: крестьяне получили личную свободу и гражданские права; появился рынок свободной рабочей силы, ускорилось развитие капитализма и промышленности; до выкупа земли крестьяне оставались временнообязанными, затем платили выкупные платежи; сохранились община и малоземелье (отрезки); потребовались другие реформы — земская, судебная, военная.","hint":"Для причин вспомните итоги Крымской войны и положение промышленности. Для последствий — что изменилось для крестьян и какие реформы последовали в 1860–1870-е гг."},{"id":"h13","subject":"hist","topic":"XVI–XVIII вв.","type":"open","max":3,"text":"Существует точка зрения, что преобразования Петра I превратили Россию в великую европейскую державу. Приведите два аргумента, подтверждающих эту точку зрения, и один аргумент, который может быть использован для её опровержения.","criteria":[{"id":"K1","max":2,"text":"Аргументы в подтверждение: каждый верный аргумент — 1 балл, не больше двух."},{"id":"K2","max":1,"text":"Приведён верный аргумент в опровержение."}],"model":"Подтверждение: создана регулярная армия и флот, одержана победа в Северной войне; по Ништадтскому миру (1721 г.) Россия получила выход к Балтийскому морю; Россия провозглашена империей, её влияние на европейские дела выросло; создана сеть мануфактур, промышленность обеспечивала армию оружием и снаряжением.\n\nОпровержение: преобразования проводились насильственными методами и за счёт усиления крепостного гнёта (подушная подать, приписные и посессионные крестьяне); страна была истощена войнами, население понесло огромные потери; реформы углубили разрыв между европеизированной знатью и основной массой народа.","hint":"Аргумент — это не общая фраза, а конкретный факт: война, договор, реформа. Подумайте о Северной войне и о положении крестьян."},{"id":"s1","subject":"soc","topic":"Человек и общество","type":"choice","max":2,"text":"Выберите верные суждения о человеке и его деятельности и запишите цифры, под которыми они указаны.","options":["Человек — биосоциальное существо.","Все потребности человека имеют исключительно биологическую природу.","Мотив — это то, что побуждает человека к деятельности, ради чего она совершается.","Деятельность человека, в отличие от поведения животных, предполагает осознанную постановку цели.","Индивидуальность — это принадлежность человека к биологическому виду Homo sapiens."],"answer":"134","hint":"Сравните три понятия: индивид, индивидуальность, личность. И вспомните, какие бывают потребности: биологические, социальные, духовные.","explain":"Верны 1, 3 и 4. Суждение 2 неверно: кроме биологических есть социальные и духовные потребности. Суждение 5 описывает индивида, а индивидуальность — это неповторимое своеобразие человека."},{"id":"s2","subject":"soc","topic":"Человек и общество","type":"text","max":1,"text":"Запишите термин: процесс усвоения индивидом образцов поведения, социальных норм и ценностей, необходимых для успешной жизни в обществе.","answer":["социализация"],"hint":"Этот процесс начинается в семье и продолжается всю жизнь.","explain":"Социализация. Её агенты — семья, школа, сверстники, СМИ и другие; различают первичную и вторичную социализацию."},{"id":"s3","subject":"soc","topic":"Экономика","type":"choice","max":2,"text":"Выберите верные суждения о рыночной экономике и запишите цифры, под которыми они указаны.","options":["Цены на большинство товаров устанавливает государство.","Основу рыночной экономики составляет частная собственность.","Конкуренция побуждает производителей снижать издержки и повышать качество.","Рыночная экономика не нуждается ни в каком государственном регулировании.","Спрос и предложение согласуют действия покупателей и продавцов."],"answer":"235","hint":"Ищите признаки, которые отличают рынок от командной экономики. Слова «все», «ни в каком» часто сигнализируют о неверном суждении.","explain":"Верны 2, 3 и 5. Цены в рыночной экономике складываются под влиянием спроса и предложения, а не назначаются государством. Совсем без государства рынок не работает: оно защищает собственность и конкуренцию, производит общественные блага."},{"id":"s4","subject":"soc","topic":"Экономика","type":"text","max":1,"text":"Запишите термин: ценная бумага, которая даёт владельцу право на часть прибыли акционерного общества в виде дивидендов и на участие в управлении им.","answer":["акция"],"hint":"Не путайте с облигацией: облигация — долговая бумага, она не даёт права на управление.","explain":"Акция — долевая ценная бумага. Облигация, в отличие от неё, подтверждает, что владелец дал деньги в долг, и права голоса не даёт."},{"id":"s5","subject":"soc","topic":"Экономика","type":"choice","max":2,"text":"Какие из перечисленных факторов могут вызвать увеличение спроса на велосипеды (сдвиг кривой спроса вправо)? Запишите цифры, под которыми они указаны.","options":["рост доходов населения","снижение цены на велосипеды","строительство в городе сети велодорожек","рост цен на сталь и алюминий","удешевление проката велосипедов","мода на здоровый образ жизни"],"answer":"136","hint":"Изменение цены самого товара не сдвигает кривую спроса — оно меняет величину спроса. А цены на сырьё влияют на предложение.","explain":"Верны 1, 3 и 6: рост доходов, удобная инфраструктура и мода повышают спрос при любой цене. Снижение цены велосипедов меняет лишь величину спроса (движение по кривой). Подорожание металла сокращает предложение. Дешёвый прокат — товар-заменитель, он уменьшает спрос на покупку велосипедов."},{"id":"s6","subject":"soc","topic":"Социальные отношения","type":"choice","max":2,"text":"Выберите примеры вертикальной социальной мобильности и запишите цифры, под которыми они указаны.","options":["рабочий получил высшее образование и стал инженером","семья переехала из Твери в Рязань","учитель перешёл в другую школу на ту же должность","спортсмен сменил вид спорта","менеджер получил должность начальника отдела","директор предприятия обанкротился и стал безработным"],"answer":"156","hint":"Вертикальная мобильность — изменение статуса вверх или вниз. Если статус остался прежним, мобильность горизонтальная.","explain":"Вертикальная мобильность — 1 и 5 (восходящая) и 6 (нисходящая). Переезд, переход в другую школу на ту же должность и смена вида спорта не меняют статус — это горизонтальная мобильность."},{"id":"s7","subject":"soc","topic":"Политика","type":"match","max":2,"text":"Установите соответствие между понятиями и элементами формы государства: к каждой позиции первого столбца подберите соответствующую позицию из второго столбца.","left":["республика","федерация","демократический режим","монархия","унитарное государство"],"right":["форма правления","форма государственного (территориального) устройства","политический режим"],"answer":"12312","hint":"Форма правления отвечает на вопрос, кто и как получает высшую власть; устройство — как организована территория; режим — какими методами осуществляется власть.","explain":"Республика и монархия — формы правления; федерация и унитарное государство — формы государственного устройства; демократия — политический режим."},{"id":"s8","subject":"soc","topic":"Право","type":"choice","max":2,"text":"Какие из перечисленных полномочий принадлежат Президенту Российской Федерации согласно Конституции РФ? Запишите цифры, под которыми они указаны.","options":["принимает федеральный бюджет","является Верховным Главнокомандующим Вооружёнными Силами РФ","объявляет амнистию","осуществляет помилование","утверждает изменение границ между субъектами РФ","назначает Председателя Правительства РФ после утверждения его кандидатуры Государственной Думой"],"answer":"246","hint":"Помилование и амнистию часто путают: одно касается конкретного человека, другое — широкого круга лиц, и его объявляет парламент.","explain":"Президенту принадлежат полномочия 2, 4 и 6. Федеральный бюджет принимает Государственная Дума, она же объявляет амнистию. Изменение границ между субъектами РФ утверждает Совет Федерации."},{"id":"s9","subject":"soc","topic":"Право","type":"match","max":2,"text":"Установите соответствие между примерами и отраслями права, которые регулируют эти отношения.","left":["гражданин заключил договор купли-продажи квартиры","работодатель предоставил сотруднику ежегодный оплачиваемый отпуск","водителя оштрафовали за превышение скорости","супруги заключили брачный договор","гражданин совершил кражу"],"right":["административное право","семейное право","гражданское право","уголовное право","трудовое право"],"answer":"35124","hint":"Штраф за нарушение правил дорожного движения — административная ответственность. Кража — преступление.","explain":"Купля-продажа — гражданское право, отпуск — трудовое, штраф за превышение скорости — административное, брачный договор — семейное, кража — уголовное."},{"id":"s10","subject":"soc","topic":"Политика","type":"open","max":3,"text":"Используя обществоведческие знания, составьте сложный план, позволяющий раскрыть по существу тему «Политические партии в демократическом обществе». План должен содержать не менее трёх пунктов, непосредственно раскрывающих тему, из которых два или более детализированы в подпунктах.","criteria":[{"id":"K1","max":2,"text":"Раскрытие темы по существу. Ключевые пункты: понятие и признаки партии; функции партий; виды партий или партийные системы. Все три ключевых пункта, два из них раскрыты в трёх и более подпунктах — 2 балла; два ключевых пункта с такой детализацией — 1 балл."},{"id":"K2","max":1,"text":"Корректность формулировок: пункты и подпункты сформулированы без ошибок, конкретно, не абстрактно."}],"model":"1. Понятие политической партии.\n2. Признаки партии:\nа) организационная структура и членство;\nб) программа и идеология;\nв) стремление к завоеванию и осуществлению власти;\nг) социальная база — опора на определённые группы общества.\n3. Функции партий:\nа) выражение и представление интересов социальных групп;\nб) участие в выборах и формирование органов власти;\nв) политическая социализация граждан;\nг) подготовка и выдвижение политических лидеров.\n4. Виды партий:\nа) по идеологии — либеральные, консервативные, социал-демократические;\nб) по отношению к власти — правящие и оппозиционные;\nв) по организации — кадровые и массовые.\n5. Партийные системы: однопартийная, двухпартийная, многопартийная.\n6. Правовое регулирование деятельности партий в РФ.","hint":"Ответьте себе на вопросы: что такое партия? чем она отличается от других объединений? зачем она нужна обществу? какими бывают партии и партийные системы? Каждый вопрос — пункт плана."},{"id":"s11","subject":"soc","topic":"Экономика","type":"open","max":3,"text":"Приведите три примера, иллюстрирующих разные функции денег. В каждом примере укажите, какую функцию он иллюстрирует.","criteria":[{"id":"K1","max":3,"text":"Каждый пример, который сформулирован развёрнуто, иллюстрирует названную функцию и не повторяет другие примеры, — 1 балл, не больше трёх."}],"model":"Мера стоимости: в магазине на зимней куртке указана цена — 8 000 рублей.\nСредство обращения: Ольга купила в булочной хлеб и сразу расплатилась наличными.\nСредство платежа: предприятие перечислило работникам зарплату за месяц; гражданин уплатил налог на имущество.\nСредство накопления: семья каждый месяц откладывает часть дохода на вклад, чтобы купить квартиру.\nМировые деньги: российская компания оплатила поставку оборудования из Китая в юанях.","hint":"Функций денег пять: мера стоимости, средство обращения, средство платежа, средство накопления, мировые деньги. Пример — это конкретная ситуация с участником и действием, а не определение."},{"id":"s12","subject":"soc","topic":"Право","type":"open","max":3,"text":"Шестнадцатилетний Антон устроился курьером по трудовому договору. Работодатель установил ему испытательный срок три месяца и 40-часовую рабочую неделю, а также предложил выходить в ночные смены с повышенной оплатой.\n\n1) Какие условия, предложенные работодателем, противоречат Трудовому кодексу РФ? Поясните каждое.\n2) Какую особенность ежегодного отпуска Трудовой кодекс устанавливает для работников младше 18 лет?","criteria":[{"id":"K1","max":2,"text":"Названы нарушения с пояснением: работникам младше 18 лет не устанавливается испытательный срок; для работников 16–18 лет рабочее время — не более 35 часов в неделю; работников младше 18 лет нельзя привлекать к работе в ночное время. Три нарушения — 2 балла, два — 1 балл."},{"id":"K2","max":1,"text":"Указано, что работникам младше 18 лет ежегодный отпуск предоставляется продолжительностью 31 календарный день в удобное для них время."}],"model":"1) Испытательный срок лицам младше 18 лет не устанавливается (ст. 70 ТК РФ). Для работников от 16 до 18 лет рабочее время сокращено — не более 35 часов в неделю (ст. 92). Работники младше 18 лет не допускаются к работе в ночное время (ст. 96); исключение сделано только для творческих работников, а Антон — курьер.\n2) Работникам младше 18 лет ежегодный оплачиваемый отпуск предоставляется продолжительностью 31 календарный день в удобное для них время (ст. 267).","hint":"Найдите в условии три детали: «три месяца», «40 часов», «ночные смены». Для несовершеннолетних по каждой есть особое правило."}]}</script>
<script id="app-js">
(function () {

const SUBJ = { hist: 'История', soc: 'Обществознание' };
const TYPE = { order: 'Хронология', match: 'Соответствие', choice: 'Выбор ответов', text: 'Термин', open: 'Развёрнутый ответ' };
const DEFMAX = { order: 1, match: 2, choice: 2, text: 1 };
const LET = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Ж'];
const KEY = 'ege-trainer-v1', DKEY = 'ege-trainer-draft-v1';

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const paras = s => String(s || '').split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('');
const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[«»"'.,!?()]/g, '').replace(/\s+/g, ' ').trim();
const plural = (n, a, b, c) => { const m = Math.abs(n) % 100, k = m % 10; if (m > 10 && m < 20) return c; if (k > 1 && k < 5) return b; if (k === 1) return a; return c; };
const pts = n => n + ' ' + plural(n, 'балл', 'балла', 'баллов');
const snip = s => { const x = String(s || '').split('\n')[0]; return x.length > 120 ? x.slice(0, 117) + '…' : x; };
const words = s => { const n = (String(s || '').match(/[A-Za-zА-Яа-яЁё0-9]+/g) || []).length; return n + ' ' + plural(n, 'слово', 'слова', 'слов'); };
const clone = o => JSON.parse(JSON.stringify(o));

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } }

let bank;
try { bank = JSON.parse($('#bank').textContent); } catch (e) { bank = { version: 1, tasks: [] }; }
if (!bank || !Array.isArray(bank.tasks)) bank = { version: 1, tasks: [] };
const PUBLISHED = JSON.stringify(bank);

const store = Object.assign({ rec: {}, drafts: {}, name: '', subject: 'hist' }, lsGet(KEY) || {});
if (!SUBJ[store.subject]) store.subject = 'hist';
let saveTimer = null;
const save = () => lsSet(KEY, store);
const saveSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); };

const ui = {
  tab: 'tasks', topic: 'all', current: { hist: null, soc: null }, st: {}, scroll: false,
  confirmReset: false, report: '', copyMsg: '',
  teacher: { work: null, form: null, err: '', msg: '', delId: null, restored: false, busy: false, confirmDiscard: false }
};

let canEdit = false;
const TKEY = 'ege-trainer-teacher';
if (location.hash === '#teacher') { canEdit = true; lsSet(TKEY, true); ui.tab = 'teacher'; }
else if (lsGet(TKEY) === true) canEdit = true;
window.addEventListener('hashchange', () => { if (location.hash === '#teacher') { canEdit = true; lsSet(TKEY, true); ui.tab = 'teacher'; render(); } });
const canShare = typeof navigator.share === 'function';

/* ---------- bank helpers ---------- */
const tasksOf = (subj, src) => (src || bank).tasks.filter(t => t.subject === subj);
const topicsOf = (subj, src) => { const out = []; tasksOf(subj, src).forEach(t => { if (!out.includes(t.topic)) out.push(t.topic); }); return out; };
const numOf = t => tasksOf(t.subject).indexOf(t) + 1;
const visibleTasks = () => { const all = tasksOf(store.subject); return ui.topic === 'all' ? all : all.filter(t => t.topic === ui.topic); };
function recState(t) { const r = store.rec[t.id]; if (!r) return 'none'; if (r.last >= t.max) return 'ok'; if (r.last > 0) return 'part'; return 'bad'; }
const errorTasks = subj => tasksOf(subj).filter(t => { const r = store.rec[t.id]; return r && r.last < t.max; });
function currentTask() {
  const list = visibleTasks();
  let t = list.find(x => x.id === ui.current[store.subject]);
  if (!t) { t = list.find(x => !store.rec[x.id]) || list.find(x => recState(x) !== 'ok') || list[0]; if (t) ui.current[store.subject] = t.id; }
  return t || null;
}

/* ---------- per-task working state ---------- */
function fresh(t) {
  let ans = '';
  if (t.type === 'match') ans = t.left.map(() => '');
  else if (t.type === 'choice' || t.type === 'order') ans = [];
  else if (t.type === 'open') ans = store.drafts[t.id] || '';
  return { ans, phase: 'idle', score: null, tries: 0, hint: false, expl: '', explBusy: false, explErr: '', ctl: null,
    aiBusy: false, aiErr: '', review: null, selfOpen: false, self: {}, selfSaved: false, modelShown: false };
}
const st = t => ui.st[t.id] || (ui.st[t.id] = fresh(t));

function ready(t, s) {
  if (t.type === 'order') return s.ans.length === t.options.length;
  if (t.type === 'match') return s.ans.every(Boolean);
  if (t.type === 'choice') return s.ans.length > 0;
  if (t.type === 'text') return norm(s.ans).length > 0;
  return false;
}
function hasInput(t, s) {
  if (t.type === 'match') return s.ans.some(Boolean);
  if (t.type === 'text') return String(s.ans).length > 0;
  return s.ans.length > 0;
}
const ansString = (t, a) => t.type === 'choice' ? a.slice().sort().join('') : t.type === 'match' ? a.map(x => x || '·').join('') : t.type === 'order' ? a.join('') : String(a);

function scoreTask(t, ans) {
  if (t.type === 'order') return ans.join('') === t.answer ? t.max : 0;
  if (t.type === 'match') {
    let err = 0; for (let i = 0; i < t.answer.length; i++) if ((ans[i] || '') !== t.answer[i]) err++;
    return err === 0 ? t.max : (err === 1 && t.max > 1 ? t.max - 1 : 0);
  }
  if (t.type === 'choice') {
    const a = new Set(ans), k = new Set(t.answer.split('')); let diff = 0;
    a.forEach(x => { if (!k.has(x)) diff++; }); k.forEach(x => { if (!a.has(x)) diff++; });
    return diff === 0 ? t.max : (diff === 1 && t.max > 1 ? t.max - 1 : 0);
  }
  if (t.type === 'text') { const n = norm(ans); return t.answer.some(v => norm(v) === n) ? t.max : 0; }
  return 0;
}

function record(t, score, flags) {
  const r = store.rec[t.id] || { tries: 0 };
  if (r.first == null) { r.first = score; r.at = Date.now(); }
  r.last = score; r.tries = (r.tries || 0) + 1;
  if (flags && flags.self) r.self = true;
  if (flags && flags.ai) r.ai = true;
  store.rec[t.id] = r; save();
}

/* ---------- views ---------- */
function header() {
  return '<header class="top"><div class="brand"><span class="brand-mark" aria-hidden="true">ЕГЭ</span><div><h1>Тренажёр</h1><p>история и обществознание · 10–11 класс</p></div></div>' +
    '<div class="seg" role="group" aria-label="Предмет">' + ['hist', 'soc'].map(s =>
      '<button class="seg-b' + (store.subject === s ? ' on' : '') + '" data-act="subj" data-v="' + s + '" aria-pressed="' + (store.subject === s) + '">' + SUBJ[s] + '</button>').join('') + '</div></header>';
}
function tabs() {
  const errs = errorTasks(store.subject).length;
  const items = [['tasks', 'Задания'], ['errors', 'Работа над ошибками', errs], ['progress', 'Прогресс']];
  if (canEdit) items.push(['teacher', 'Учителю']);
  return '<div class="tabs-wrap"><nav class="tabs" aria-label="Разделы">' + items.map(([k, l, c]) =>
    '<button class="tab' + (ui.tab === k ? ' on' : '') + '" data-act="tab" data-v="' + k + '"' + (ui.tab === k ? ' aria-current="page"' : '') + '>' + l + (c ? '<span class="count">' + c + '</span>' : '') + '</button>').join('') + '</nav></div>';
}

function viewTasks() {
  const all = tasksOf(store.subject);
  if (!all.length) return '<section class="empty"><h2>Заданий пока нет</h2><p>Учитель ещё не добавил задания по этому предмету.</p></section>';
  const topics = topicsOf(store.subject);
  const list = visibleTasks();
  const t = currentTask();
  const chip = (v, l) => '<button class="chip' + (ui.topic === v ? ' on' : '') + '" data-act="topic" data-v="' + esc(v) + '" aria-pressed="' + (ui.topic === v) + '">' + esc(l) + '</button>';
  return '<div class="navbox"><div class="chips" role="group" aria-label="Темы">' + chip('all', 'Все темы') + topics.map(tp => chip(tp, tp)).join('') + '</div>' +
    '<div class="grid" role="group" aria-label="Номера заданий">' + list.map(x => {
      const n = numOf(x), s = recState(x);
      const lab = { none: 'не решено', ok: 'верно', part: 'частично', bad: 'неверно' }[s];
      return '<button class="nav s-' + s + (t && x.id === t.id ? ' cur' : '') + '" data-act="go" data-v="' + esc(x.id) + '" aria-label="Задание ' + n + ', ' + lab + '">' + n + '</button>';
    }).join('') + '</div>' +
    '<div class="legend"><span><i></i>не решено</span><span><i class="ok"></i>верно</span><span><i class="part"></i>частично</span><span><i class="bad"></i>неверно</span></div></div>' +
    (t ? (t.type === 'open' ? openCard(t) : testCard(t)) : '');
}

function cardHead(t) {
  return '<div class="task-head"><span class="task-no">№ ' + numOf(t) + '</span><span class="tag">' + TYPE[t.type] + '</span><span class="tag tag-topic">' + esc(t.topic) + '</span><span class="task-pts">' + pts(t.max) + '</span></div>';
}
function cellsRow(arr, n, cls, letters) {
  let top = '', cells = '';
  for (let i = 0; i < n; i++) {
    if (letters) top += '<span class="lh">' + LET[i] + '</span>';
    const v = arr[i] || '';
    cells += '<span class="c' + (v ? ' f' : '') + '">' + esc(v) + '</span>';
  }
  return '<div class="sheet-wrap"><div class="sheet ' + (cls || '') + '">' + (letters ? '<div class="sheet-r">' + top + '</div>' : '') + '<div class="sheet-r">' + cells + '</div></div></div>';
}
function sheetFor(t, a, cls) {
  if (t.type === 'match') return cellsRow(a, t.left.length, cls, true);
  if (t.type === 'choice') return cellsRow(a.slice().sort(), t.options.length, cls);
  if (t.type === 'order') return cellsRow(a, t.options.length, cls);
  return '';
}
function hintBlock(t) { return t.hint ? '<div class="hint"><span class="label">Подсказка</span>' + paras(t.hint) + '</div>' : ''; }

function testCard(t) {
  const s = st(t), locked = s.phase !== 'idle';
  let inp = '';
  if (t.type === 'choice' || t.type === 'order') {
    inp = '<p class="how">' + (t.type === 'order' ? 'Нажимайте варианты по порядку, от самого раннего к самому позднему. Повторное нажатие убирает вариант.' : 'Отметьте все верные варианты.') + '</p>' +
      '<ol class="opts">' + t.options.map((o, i) => {
        const d = String(i + 1), pos = t.type === 'order' ? s.ans.indexOf(d) : -1, on = t.type === 'order' ? pos >= 0 : s.ans.includes(d);
        return '<li><button class="opt' + (on ? ' on' : '') + '" data-act="opt" data-v="' + d + '" aria-pressed="' + on + '"' + (locked ? ' disabled' : '') + '><span class="opt-d">' + d + '</span><span class="opt-t">' + esc(o) + '</span>' + (pos >= 0 ? '<span class="pos">' + (pos + 1) + '-е</span>' : '') + '</button></li>';
      }).join('') + '</ol>';
  } else if (t.type === 'match') {
    inp = '<div class="match"><div><div class="col-h">Второй столбец</div><ol class="right">' + t.right.map((r, i) => '<li><span class="opt-d">' + (i + 1) + '</span><span>' + esc(r) + '</span></li>').join('') + '</ol></div>' +
      '<div><div class="col-h">Первый столбец: выберите цифру для каждой буквы</div>' + t.left.map((l, ri) =>
        '<div class="mrow"><div class="mleft"><span class="mlet">' + LET[ri] + '</span><span>' + esc(l) + '</span></div><div class="mpick" role="group" aria-label="Позиция ' + LET[ri] + '">' +
        t.right.map((_, di) => { const d = String(di + 1), on = s.ans[ri] === d; return '<button class="pick' + (on ? ' on' : '') + '" data-act="m" data-r="' + ri + '" data-v="' + d + '" aria-pressed="' + on + '"' + (locked ? ' disabled' : '') + '>' + d + '</button>'; }).join('') +
        '</div></div>').join('') + '</div></div>';
  } else if (t.type === 'text') {
    inp = '<label class="lbl" for="term-' + esc(t.id) + '">Ответ</label><input id="term-' + esc(t.id) + '" class="term" data-in="term" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(s.ans) + '"' + (locked ? ' disabled' : '') + '>';
  }
  const sheet = t.type !== 'text' ? '<div class="answer"><span class="answer-l">Ответ</span>' + sheetFor(t, s.ans) + '</div>' : '';
  let actions = '';
  if (s.phase === 'idle') {
    actions = '<div class="row"><button class="btn primary" data-act="check"' + (ready(t, s) ? '' : ' disabled') + '>Проверить</button>' +
      (!s.hint && t.hint ? '<button class="btn" data-act="hint">Подсказка</button>' : '') +

  const showHint = s.hint && (s.phase === 'idle' || s.phase === 'wrong');
  return '<article class="task" id="task-card">' + cardHead(t) + '<div class="prompt">' + paras(t.text) + '</div>' + inp + sheet + (showHint ? hintBlock(t) : '') + actions + feedbackTest(t, s) + '</article>';
}

function keyString(t) { return t.type === 'text' ? t.answer[0] : t.answer; }
function feedbackTest(t, s) {
  if (s.phase === 'idle') return '';

    const partial = s.score > 0;
    return '<div class="fb ' + (partial ? 'part' : 'bad') + '" role="status"><div class="fb-h">' + (partial ? 'Частично верно: ' + s.score + ' из ' + t.max : 'Неверно') + '</div>' +

function statsFor(subj) {
  const tasks = tasksOf(subj);
  const topics = topicsOf(subj).map(tp => {
    const ts = tasks.filter(t => t.topic === tp), done = ts.filter(t => store.rec[t.id]);
    const earned = done.reduce((a, t) => a + Math.min(store.rec[t.id].first, t.max), 0), maxAtt = done.reduce((a, t) => a + t.max, 0);
    return { tp, total: ts.length, done: done.length, earned, maxAtt, pct: maxAtt ? earned / maxAtt : null };
  });
  const sum = k => topics.reduce((a, x) => a + x[k], 0);
  return { topics, total: tasks.length, done: sum('done'), earned: sum('earned'), maxAtt: sum('maxAtt'), errors: errorTasks(subj).length };
}
function advice(subj) {
  const S = statsFor(subj), out = [];
  if (!S.done) return [{ text: 'Начни с любого задания. После первых ответов здесь появятся советы, что повторить.', act: 'tab', v: 'tasks', btn: 'К заданиям' }];
  const weak = S.topics.filter(x => x.pct !== null && x.pct < 0.7).sort((a, b) => a.pct - b.pct);
  if (weak.length) out.push({ text: 'Слабее всего тема «' + weak[0].tp + '»: ' + Math.round(weak[0].pct * 100) + '% баллов с первой попытки. Повтори материал и реши задания этой темы ещё раз.', act: 'topic', v: weak[0].tp, btn: 'Задания по теме' });
  if (S.errors) out.push({ text: S.errors + ' ' + plural(S.errors, 'задание ждёт', 'задания ждут', 'заданий ждут') + ' в работе над ошибками.', act: 'tab', v: 'errors', btn: 'Открыть' });
  const untouched = S.topics.filter(x => x.done === 0);
  if (untouched.length) out.push({ text: 'Ещё не начаты: ' + untouched.map(x => '«' + x.tp + '»').join(', ') + '.', act: 'topic', v: untouched[0].tp, btn: 'Начать' });
  const unsolved = S.topics.filter(x => x.done > 0 && x.done < x.total);
  if (!out.length && unsolved.length) out.push({ text: 'В теме «' + unsolved[0].tp + '» остались нерешённые задания.', act: 'topic', v: unsolved[0].tp, btn: 'Продолжить' });
  if (!out.length) out.push({ text: 'Все задания решены уверенно. Попроси учителя добавить новые.' });
  return out;
}

      : '<button class="btn ghost small" data-act="reset">Сбросить прогресс</button>') + '</div></section>';

function reportText() {
  const lines = [(store.name.trim() || 'Ученик') + ' · отчёт от ' + new Date().toLocaleDateString('ru-RU')];
  ['hist', 'soc'].forEach(subj => {
    const S = statsFor(subj);
    lines.push('', SUBJ[subj].toUpperCase());
    if (!S.done) { lines.push('Пока не решал(а).'); return; }
    lines.push('Баллы с первой попытки: ' + S.earned + ' из ' + S.maxAtt + '. Решено заданий: ' + S.done + ' из ' + S.total + '.');
    S.topics.forEach(x => lines.push('— ' + x.tp + ': ' + (x.done ? x.earned + ' из ' + x.maxAtt + ' (' + x.done + ' из ' + x.total + ' заданий)' : 'не начато')));
    const errs = errorTasks(subj);
    if (errs.length) lines.push('Не решены на полный балл: ' + errs.map(t => '№ ' + numOf(t) + ' (' + TYPE[t.type].toLowerCase() + ', ' + t.topic + ')').join('; ') + '.');
    const selfN = tasksOf(subj).filter(t => store.rec[t.id] && store.rec[t.id].self && !store.rec[t.id].ai).length;
    if (selfN) lines.push('Развёрнутых ответов с самопроверкой: ' + selfN + '.');
  });
  return lines.join('\n');
}

function buildTask(f) {
  const lines = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
  const t = { id: f.editId || ('t' + Date.now().toString(36)), subject: f.subject, topic: f.topic.trim(), type: f.type, text: f.text.trim() };
  if (!t.topic) return { err: 'Укажите тему задания.' };
  if (!t.text) return { err: 'Введите текст задания.' };
  if (f.source.trim()) t.source = f.source.trim();
  const digits = String(f.answer || '').replace(/\D/g, '');
  if (f.type === 'choice' || f.type === 'order') {
    t.options = lines(f.options);
    const n = t.options.length;
    if (n < 2 || n > 9) return { err: 'Нужно от 2 до 9 вариантов, по одному в строке.' };
    if (!digits) return { err: 'Запишите правильный ответ цифрами, например 135.' };
    if (digits.split('').some(d => +d < 1 || +d > n)) return { err: 'В ответе есть цифра, для которой нет варианта.' };
    if (new Set(digits).size !== digits.length) return { err: 'Цифры в ответе не должны повторяться.' };
    if (f.type === 'order' && digits.length !== n) return { err: 'В задании на хронологию ответ должен включать все ' + n + ' варианта.' };
    t.answer = f.type === 'choice' ? digits.split('').sort().join('') : digits;
    t.max = DEFMAX[f.type];
  } else if (f.type === 'match') {
    t.left = lines(f.left); t.right = lines(f.right);
    if (t.left.length < 2 || t.left.length > LET.length) return { err: 'В первом столбце нужно от 2 до ' + LET.length + ' позиций.' };
    if (t.right.length < 2 || t.right.length > 9) return { err: 'Во втором столбце нужно от 2 до 9 позиций.' };
    if (digits.length !== t.left.length) return { err: 'В ответе должно быть ' + t.left.length + ' цифр, по одной на каждую букву.' };
    if (digits.split('').some(d => +d < 1 || +d > t.right.length)) return { err: 'В ответе есть цифра, которой нет во втором столбце.' };
    t.answer = digits; t.max = DEFMAX.match;
  } else if (f.type === 'text') {
    const v = String(f.answer || '').split(/[;\n]/).map(x => x.trim()).filter(Boolean);
    if (!v.length) return { err: 'Запишите правильный термин. Несколько допустимых вариантов разделите точкой с запятой.' };
    t.answer = v; t.max = DEFMAX.text;
  } else if (f.type === 'open') {
    const ls = lines(f.criteria), crit = [];
    for (let i = 0; i < ls.length; i++) {
      const m = ls[i].match(/^(\d+)\s*[|;:]\s*(.+)$/);
      if (!m || +m[1] < 1 || +m[1] > 9) return { err: 'Критерий в строке ' + (i + 1) + ' записан не по образцу «2 | что требуется».' };
      crit.push({ id: 'K' + (i + 1), max: +m[1], text: m[2].trim() });
    }
    if (!crit.length) return { err: 'Добавьте хотя бы один критерий.' };
    if (!f.model.trim()) return { err: 'Добавьте эталонный ответ: по нему работают самопроверка и проверка ИИ.' };
    t.criteria = crit; t.model = f.model.trim(); t.max = crit.reduce((a, c) => a + c.max, 0);
  } else return { err: 'Выберите тип задания.' };
  if (f.hint.trim()) t.hint = f.hint.trim();
  if (f.type !== 'open') t.explain = f.explain.trim() || 'Правильный ответ: ' + (f.type === 'text' ? t.answer[0] : t.answer) + '.';
  return { task: t };
}

    : '<p class="note">По этому предмету заданий нет.</p>';
  const bar = dirty() ? '<div class="dirty"><p>' + (T.restored ? 'Восстановлен неопубликованный черновик. ' : '') + 'Изменения сохранены только в этом браузере. Ученики увидят их, когда вы загрузите новый файл на хостинг.</p>' +
    (T.confirmDiscard ? '<button class="btn small danger" data-act="t-discard-yes">Отменить все изменения</button><button class="btn small ghost" data-act="t-discard-no">Назад</button>'
      : '<button class="btn primary" data-act="t-publish">Скачать index.html</button><button class="btn ghost small" data-act="t-discard">Отменить изменения</button>') + '</div>' : '';
  return '<section class="sec"><h2 class="sec-h">Банк заданий: ' + SUBJ[store.subject].toLowerCase() + '</h2>' +
    '<p class="lead">Измените задания и скачайте обновлённый файл index.html. Загрузите его на хостинг вместо старого — ученики увидят новые задания по той же ссылке. Режим учителя открывается по адресу сайта с #teacher в конце.</p>' +
    bar + (T.err ? '<p class="err" role="alert">' + esc(T.err) + '</p>' : '') + (T.msg ? '<p class="ok-msg" role="status">' + esc(T.msg) + '</p>' : '') + rows + '</section>' +
    '<section class="sec box"><h3 class="sub-h">' + (f.editId ? 'Изменить задание' : 'Новое задание') + '</h3><form class="tform" id="tform" novalidate>' +
    '<div class="fields2"><div class="field"><label for="f-subject">Предмет</label><select id="f-subject" data-f="subject">' + Object.keys(SUBJ).map(k => '<option value="' + k + '"' + (f.subject === k ? ' selected' : '') + '>' + SUBJ[k] + '</option>').join('') + '</select></div>' +
    '<div class="field"><label for="f-type">Тип задания</label><select id="f-type" data-f="type">' + Object.keys(TYPE).map(k => '<option value="' + k + '"' + (f.type === k ? ' selected' : '') + '>' + TYPE[k] + '</option>').join('') + '</select></div></div>' +
    field('topic', 'Тема', 'input', 'Выберите из списка или впишите новую — по темам строится прогресс ученика.') +
    '<datalist id="topic-list">' + topics.map(tp => '<option value="' + esc(tp) + '"></option>').join('') + '</datalist>' +
    field('text', 'Текст задания', 'area', '', 4) + field('source', 'Текст источника (необязательно)', 'area', 'Отрывок документа для заданий на работу с источником.', 3) + typeFields +
    field('hint', 'Подсказка', 'area', 'Наводящая мысль без готового ответа. Ученик видит её по кнопке и после ошибки.', 2) +
    (f.type !== 'open' ? field('explain', 'Пояснение к ответу', 'area', 'Ученик видит его после верного ответа или когда открывает решение.', 3) : '') +
    (T.formErr ? '<p class="err" role="alert">' + esc(T.formErr) + '</p>' : '') +
    '<div class="row"><button type="submit" class="btn primary">' + (f.editId ? 'Сохранить задание' : 'Добавить в банк') + '</button>' + (f.editId ? '<button type="button" class="btn ghost" data-act="t-cancel">Отмена</button>' : '') + '</div></form></section>' +
    '<section class="sec"><div class="row"><button class="btn ghost small" data-act="t-full">Скачать сайт целиком</button><button class="btn ghost small" data-act="t-exit">Выйти из режима учителя</button></div></section>';
}
function saveForm() {
  const T = ui.teacher, res = buildTask(T.form);
  if (res.err) { T.formErr = res.err; render(); return; }
  const i = T.work.tasks.findIndex(x => x.id === res.task.id);
  if (i >= 0) T.work.tasks[i] = res.task; else T.work.tasks.push(res.task);
  T.formErr = ''; T.err = ''; T.msg = (i >= 0 ? 'Задание изменено.' : 'Задание добавлено.') + ' Не забудьте скачать обновлённый файл.';
  T.form = blankForm(); T.form.subject = res.task.subject; T.form.type = res.task.type;
  saveDraft(); render();
}
function buildDoc(b) {
  return '<!doctype html>\n<html lang="ru">\n<head>\n' + HEAD_META + '\n<style id="app-css">' + $('#app-css').textContent + '</style>\n</head>\n<body>\n<main id="app" class="app"></main>\n' +
    '<script type="application/json" id="bank">' + JSON.stringify(b).replace(/</g, '\\u003c') + '<\/script>\n' +
    '<script id="app-js">' + $('#app-js').textContent + '<\/script>\n</body>\n</html>\n';
}
function downloadSite(b) {
  const T = ui.teacher;
  T.err = ''; T.msg = '';
  try {
    const url = URL.createObjectURL(new Blob([buildDoc(b)], { type: 'text/html;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'index.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    T.msg = 'Файл index.html скачан. Загрузите его на хостинг вместо старого.';
  } catch (e) { T.err = 'Не удалось скачать файл. Откройте сайт в Chrome или Яндекс Браузере и попробуйте снова.'; }
  render();
}
function shareText() {
  const site = /^https?:/.test(location.protocol) ? location.origin + location.pathname : '';
  return { site, text: reportText() };
}

/* ---------- actions ---------- */
function goNext(t) {
  const list = visibleTasks(), i = list.indexOf(t);
  const after = list.slice(i + 1).concat(list.slice(0, Math.max(i, 0)));
  const nxt = after.find(x => !store.rec[x.id]) || after.find(x => recState(x) !== 'ok') || after[0] || t;
  ui.current[store.subject] = nxt.id; ui.scroll = true;
}
function act(a, d) {
  const t = ui.tab === 'tasks' ? currentTask() : null, s = t ? st(t) : null;
  const T = ui.teacher;
  switch (a) {
    case 'subj': store.subject = d.v; ui.topic = 'all'; save(); if (ui.teacher.form && !ui.teacher.form.editId) ui.teacher.form.subject = d.v; break;
    case 'tab': ui.tab = d.v; ui.copyMsg = ''; break;
    case 'topic': ui.topic = d.v; ui.tab = 'tasks'; ui.current[store.subject] = null; break;
    case 'go': ui.current[store.subject] = d.v; ui.scroll = true; break;
    case 'opt':
      if (!t) break;
      s.ans = s.ans.includes(d.v) ? s.ans.filter(x => x !== d.v) : s.ans.concat(d.v);
      break;
    case 'm': if (t) { const r = +d.r; s.ans[r] = s.ans[r] === d.v ? '' : d.v; } break;
    case 'clear': if (t) s.ans = fresh(t).ans; break;
    case 'hint': if (s) s.hint = true; break;
    case 'check':
      if (!t || !ready(t, s)) break;
      s.tries++; s.score = scoreTask(t, s.ans); record(t, s.score);
      if (s.score >= t.max) s.phase = 'done'; else { s.phase = 'wrong'; s.hint = true; }
      break;
    case 'retry': if (s) s.phase = 'idle'; break;
    case 'reveal': if (s) s.phase = 'revealed'; break;
    case 'next': if (t) goNext(t); break;
    case 'redo-here': if (t) { ui.st[t.id] = fresh(t); } break;
    case 'self-open': if (s) s.selfOpen = true; break;
    case 'self': if (s) { s.self[+d.c] = +d.v; s.selfSaved = false; } break;
    case 'self-save':
      if (t && t.criteria.every((c, i) => s.self[i] != null)) { record(t, t.criteria.reduce((x, c, i) => x + s.self[i], 0), { self: true }); s.selfSaved = true; }
      break;
    case 'model': if (s) s.modelShown = true; break;
    case 'redo': {
      const x = bank.tasks.find(y => y.id === d.v);
      if (x) { ui.st[x.id] = fresh(x); ui.tab = 'tasks'; ui.topic = 'all'; ui.current[store.subject] = x.id; ui.scroll = true; }
      break;
    }
    case 'copy': {
      ui.report = reportText();
      const done = ok => { ui.copyMsg = ok ? 'Отчёт скопирован. Отправь его учителю.' : 'Скопировать автоматически не вышло. Выдели текст ниже и скопируй вручную.'; render(); };
      try { navigator.clipboard.writeText(ui.report).then(() => done(true), () => done(false)); } catch (e) { done(false); }
      break;
    }
    case 'reset': ui.confirmReset = true; break;
    case 'reset-no': ui.confirmReset = false; break;
    case 'reset-yes': store.rec = {}; store.drafts = {}; ui.st = {}; ui.report = ''; ui.copyMsg = ''; ui.confirmReset = false; save(); break;
    case 't-edit': { const x = T.work.tasks.find(y => y.id === d.v); if (x) { T.form = formFrom(x); T.formErr = ''; T.msg = ''; ui.scrollForm = true; } break; }
    case 't-cancel': T.form = blankForm(); T.formErr = ''; break;
    case 't-del': T.delId = d.v; break;
    case 't-del-no': T.delId = null; break;
    case 't-del-yes': T.work.tasks = T.work.tasks.filter(y => y.id !== d.v); T.delId = null; T.msg = 'Задание удалено. Не забудьте скачать обновлённый файл.'; if (T.form.editId === d.v) T.form = blankForm(); saveDraft(); break;
    case 't-publish': downloadSite(T.work); return;
    case 't-full': downloadSite(dirty() ? T.work : bank); return;
    case 't-exit': lsDel(TKEY); canEdit = false; ui.tab = 'tasks'; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ } break;
    case 'share': {
      const r = shareText(); ui.report = r.text;
      navigator.share({ title: 'Отчёт: тренажёр ЕГЭ', text: r.text }).then(() => { ui.copyMsg = 'Отчёт отправлен.'; render(); }, err => { if (!err || err.name !== 'AbortError') { ui.copyMsg = 'Не получилось открыть отправку. Скопируй отчёт вручную.'; render(); } });
      break;
    }
    case 'tg': {
      const r = shareText(); ui.report = r.text;
      const link = 'https://t.me/share/url?url=' + encodeURIComponent(r.site || 'Тренажёр ЕГЭ') + '&text=' + encodeURIComponent('\n' + r.text);
      const w = window.open(link, '_blank', 'noopener');
      if (!w) location.href = link;
      ui.copyMsg = 'Выбери в Telegram чат с учителем и отправь.';
      break;
    }
    case 't-discard': T.confirmDiscard = true; break;
    case 't-discard-no': T.confirmDiscard = false; break;
    case 't-discard-yes': T.work = clone(bank); T.confirmDiscard = false; T.restored = false; T.msg = ''; T.err = ''; T.form = blankForm(); lsDel(DKEY); break;
    default: return;
  }
  render();
}

/* ---------- render ---------- */
function render() {
  const app = $('#app');
  if (ui.tab === 'teacher' && !canEdit) ui.tab = 'tasks';
  app.dataset.subj = store.subject;
  let body = '';
  if (ui.tab === 'errors') body = viewErrors();
  else if (ui.tab === 'progress') body = viewProgress();
  else if (ui.tab === 'teacher') body = viewTeacher();
  else body = viewTasks();
  app.innerHTML = header() + tabs() + body;
  if (ui.scroll) {
    ui.scroll = false;
    const card = $('#task-card');
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (card) card.scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' });
  }
  if (ui.scrollForm) { ui.scrollForm = false; const f = $('#tform'); if (f) f.scrollIntoView({ block: 'start' }); }
}

const app = $('#app');
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || !app.contains(b)) return;
  act(b.dataset.act, b.dataset);
});
app.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.in === 'term' || el.dataset.in === 'open') {
    const t = currentTask(); if (!t) return;
    const s = st(t); s.ans = el.value;
    if (el.dataset.in === 'term') { const b = $('[data-act="check"]'); if (b) b.disabled = !ready(t, s); }
    else {
      store.drafts[t.id] = el.value; saveSoon();
      const c = document.getElementById('cnt-' + t.id); if (c) c.textContent = words(el.value);
      const short = el.value.trim().length < 15, b = $('[data-act="self-open"]'), n = $('#self-note');
      if (b && !s.selfOpen) b.disabled = short;
      if (n) n.hidden = !short;
    }
  } else if (el.dataset.in === 'name') { store.name = el.value; saveSoon(); }
  else if (el.dataset.f && ui.teacher.form) { ui.teacher.form[el.dataset.f] = el.value; }
});
app.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.f === 'type' || el.dataset.f === 'subject') { ui.teacher.form[el.dataset.f] = el.value; ui.teacher.formErr = ''; render(); }
});
app.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'tform') saveForm(); });
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.in === 'term') { e.preventDefault(); const b = $('[data-act="check"]'); if (b && !b.disabled) b.click(); }
});

render();

})();
</script>
</body>
</html>
